# Deploy automático no servidor .254 (Econômico Relatórios) a cada push na main.
# Chama o mesmo endpoint /deploy que era aberto à mão no navegador: no .254 ele faz
# git fetch + reset --hard origin/main + npm install e reinicia o serviço (NSSM sobe de novo).
# Se o endpoint responder erro (npm install falhou etc.), o job falha e o servidor
# continua na versão anterior — igual ao comportamento manual.
#
# Precisa do secret DEPLOY_TOKEN no repositório (Settings > Secrets and variables > Actions),
# com o mesmo valor que o server.js aceita em /deploy?token=...
name: Deploy .254
on:
  push:
    branches: [main]
concurrency:
  group: deploy-254
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BASE: https://hhk0a8gt2cn.sn.mynetname.net
    steps:
      - name: Chamar endpoint de deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then echo "secret DEPLOY_TOKEN não cadastrado no repositório"; exit 1; fi
          code=$(curl -sS -m 600 -o /tmp/deploy.txt -w '%{http_code}' "$BASE/deploy?token=$DEPLOY_TOKEN")
          cat /tmp/deploy.txt
          echo "HTTP $code"
          test "$code" = "200"
      - name: Esperar o servidor voltar
        run: |
          for i in $(seq 1 30); do
            sleep 5
            if curl -sS -m 10 -o /dev/null -w '%{http_code}' "$BASE/api/versao" | grep -q '^200$'; then
              echo "servidor no ar"; curl -sS -m 10 "$BASE/api/versao"; echo; exit 0
            fi
          done
          echo "servidor não voltou em 150s"; exit 1
