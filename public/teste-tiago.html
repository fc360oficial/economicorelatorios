<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/design-system.css">
<script src="/nav.js" defer></script>
<script src="/gente-ui.js"></script>
<title>TESTE TIAGO — DP / RH · Econômico Supermercados</title>
<!-- DP / RH › TESTE TIAGO (21/10/2026): versão moderna da central de gestão de pessoas, a partir da imagem de referência
     e do "Projeto: modernização do DP / RH" que o Tiago colou. Navegação lateral agrupada (Gestão diária · Controle de
     jornada · Gestão administrativa). Dados: /api/gp/* (lib/gestao-pessoas-rotas.js) — jornada, ficha e banco vêm do
     PontoCerto só pra leitura; as telas administrativas reaproveitam gestao-pessoas.html?embed=1 (sem duplicar código).
     Regra: nada aqui calcula banco em paralelo à apuração oficial; dado que não vem da API aparece como indisponível. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--font);background:var(--pap);color:var(--ink);min-height:100vh;font-size:13px}
/* ── navegação lateral do módulo (azul-marinho, à direita do rail do sistema) ── */
.mnav{position:fixed;top:0;bottom:0;left:64px;width:224px;background:#101B33;color:#C7D0E3;display:flex;flex-direction:column;z-index:60;overflow:hidden}
.mnav .brand{padding:18px 18px 12px;border-bottom:1px solid rgba(255,255,255,.07)}
.mnav .brand b{display:block;color:#fff;font-size:14px;letter-spacing:-.2px}.mnav .brand span{display:block;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#8A97B5;margin-top:3px;font-weight:700}
.mnav .rows{flex:1;overflow:auto;padding:8px 10px 10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.mnav .sect{font-size:9.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#6F7D9C;padding:14px 10px 5px}
.mnav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#C7D0E3;text-decoration:none;font-size:12.5px;font-weight:600;cursor:pointer}
.mnav a .ds-ic{width:16px;height:16px;color:#8A97B5}.mnav a:hover{background:rgba(255,255,255,.06);color:#fff}
.mnav a.on{background:var(--am);color:#2B2000}.mnav a.on .ds-ic{color:#2B2000}
.mnav a small{margin-left:auto;background:rgba(255,255,255,.12);color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:999px}.mnav a.on small{background:rgba(0,0,0,.18);color:#2B2000}
.mnav .foot{padding:10px 16px 14px;border-top:1px solid rgba(255,255,255,.07);font-size:10.5px;color:#8A97B5;line-height:1.5}.mnav .foot b{color:#C7D0E3;font-weight:600}.mnav .foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pos);margin-right:5px}.mnav .foot .dot.neg{background:var(--neg)}
/* ── conteúdo ── */
.content{margin-left:224px;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:58px;background:var(--crd);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:40}
.topbar h1{font-size:16px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}.topbar h1 .crumb{color:var(--ink3);font-weight:600}.topbar h1 .ds-ic{color:var(--ink3)}
.topbar p{font-size:11.5px;color:var(--ink3);margin-top:1px}
.topbar .end{margin-left:auto;display:flex;align-items:center;gap:12px}
.bell{position:relative;width:36px;height:36px;border-radius:9px;border:1px solid var(--ln);background:var(--crd);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2)}.bell:hover{background:var(--wsh)}.bell b{position:absolute;top:-5px;right:-5px;background:var(--neg);color:#fff;font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:999px}
.who{display:flex;align-items:center;gap:9px;font-size:12px}.who .ds-avatar{background:#101B33;color:#FFC933}.who b{display:block;font-size:12.5px}.who span{color:var(--ink3);font-size:11px}
.page{padding:20px 24px 40px;max-width:1640px;width:100%}
/* ── componentes locais ── */
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:9px 10px;margin-bottom:16px}
.tb .ds-input,.tb .ds-select{height:34px;font-size:12.5px}.tb .ds-search{flex:1;min-width:200px;max-width:340px}.tb .end{margin-left:auto;display:flex;gap:8px;align-items:center}
.tb .ds-select{max-width:220px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}.kpis.k4{grid-template-columns:repeat(4,1fr)}.kpis.k5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1599px){.kpis{grid-template-columns:repeat(3,1fr)}.kpis.k4{grid-template-columns:repeat(4,1fr)}.kpis.k5{grid-template-columns:repeat(3,1fr)}}

.kpi .ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}.kpi .ico .ds-ic{width:18px;height:18px}
.kpi .ico.inf{background:var(--infw);color:var(--inf)}.kpi .ico.neg{background:var(--negw);color:var(--neg)}.kpi .ico.am{background:var(--amw);color:var(--amk)}.kpi .ico.pos{background:var(--posw);color:var(--pos)}.kpi .ico.gr{background:var(--wsh);color:var(--ink2)}
.kpi .l{font-size:11px;font-weight:700;color:var(--ink2);line-height:1.3}.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.6px;margin-top:3px;font-variant-numeric:tabular-nums;line-height:1.1}.kpi .v.pos{color:var(--pos)}.kpi .v.neg{color:var(--neg)}
.kpi .s{font-size:11px;color:var(--ink3);margin-top:3px}.kpi .s.pos{color:var(--pos)}.kpi .s.neg{color:var(--neg)}
.grid2{display:grid;grid-template-columns:1.25fr .85fr;gap:16px}.grid2 .ds-card{min-width:0}
.ds-panel-hd{padding:12px 16px}.ds-panel-hd .ds-h2{font-size:13.5px}.ds-panel-hd a.lnk{font-size:11.5px;font-weight:700;color:var(--inf);cursor:pointer;text-decoration:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}.chip{border:1px solid var(--ln2);background:var(--crd);border-radius:999px;padding:4px 11px;font-size:11px;font-weight:700;color:var(--ink2);cursor:pointer}.chip.on{background:#101B33;color:#FFC933;border-color:#101B33}.chip small{opacity:.7;margin-left:3px}
.tw{overflow:auto;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3);padding:9px 12px;background:var(--wsh);font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:1}
table.t th.sort{cursor:pointer;user-select:none}table.t th.sort:hover{color:var(--ink)}table.t th.sort.asc::after{content:' ▲';font-size:8px}table.t th.sort.desc::after{content:' ▼';font-size:8px}
table.t td{padding:8px 12px;border-top:1px solid var(--ln);color:var(--ink2);white-space:nowrap;vertical-align:middle;font-variant-numeric:tabular-nums}
table.t th.r,table.t td.r{text-align:right}table.t th.c,table.t td.c{text-align:center}table.t td.w{white-space:normal;min-width:160px}
table.t tbody tr:hover td{background:var(--wsh)}table.t tbody tr.row{cursor:pointer}
table.t td.ac{position:sticky;right:0;background:var(--crd);text-align:right;box-shadow:-8px 0 8px -8px rgba(14,22,38,.25)}table.t tbody tr:hover td.ac{background:var(--wsh)}table.t th.ac{position:sticky;right:0;z-index:2}
.who-cell{display:flex;align-items:center;gap:10px}.av{width:30px;height:30px;border-radius:50%;background:var(--wsh);color:var(--ink2);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.who-cell b{display:block;color:var(--ink);font-weight:700;line-height:1.2}.who-cell span{display:block;font-size:10.5px;color:var(--ink3);margin-top:1px}
.etq{display:inline-block;background:#101B33;color:#FFC933;font-weight:800;font-size:10px;padding:2px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}.etq.cd{background:var(--inf);color:#fff}
.hora{font-weight:700;color:var(--ink)}.hora.neg{color:var(--neg)}.hora.pos{color:var(--pos)}.hora.mut{color:var(--ink3);font-weight:500}
.prev{font-size:10.5px;color:var(--ink3);display:block;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--posw);color:var(--pos)}.pill.bad{background:var(--negw);color:var(--neg)}.pill.warn{background:var(--amw);color:var(--amk)}.pill.info{background:var(--infw);color:var(--inf)}.pill.gr{background:var(--wsh);color:var(--ink2)}
.saldo{font-weight:800;font-variant-numeric:tabular-nums}.saldo.pos{color:var(--pos)}.saldo.neg{color:var(--neg)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--ln);flex-wrap:wrap}
.pag{display:flex;gap:4px;align-items:center}.pag button{border:1px solid var(--ln2);background:var(--crd);border-radius:6px;padding:4px 9px;font:inherit;font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}.pag button:disabled{opacity:.4;cursor:default}
.note{font-size:11.5px;color:var(--ink3);line-height:1.5;margin:10px 2px 0}.note b{color:var(--ink2)}
.aviso{background:var(--amw);border:1px solid var(--am-ln);color:var(--amk);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.5}.aviso.neg{background:var(--negw);border-color:#F1B9C3;color:var(--neg)}.aviso.inf{background:var(--infw);border-color:var(--inf);color:var(--inf)}
.empty{padding:36px 20px;text-align:center;color:var(--ink3);font-size:12.5px}.empty b{display:block;color:var(--ink2);font-size:13.5px;margin-bottom:3px}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--wsh) 25%,var(--ln) 50%,var(--wsh) 75%);background-size:200% 100%;animation:sk 1.3s ease infinite;margin:10px 14px}@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pend{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--ln);font-size:12.5px;cursor:pointer}.pend:hover{background:var(--wsh)}.pend .ds-pill{margin-left:auto}
.iframe-wrap{background:transparent;min-height:70vh}.iframe-wrap iframe{width:100%;height:calc(100vh - 110px);border:none;background:transparent}
/* ficha */
.ficha-hd{display:flex;gap:16px;align-items:center;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:16px;flex-wrap:wrap}
.ficha-hd .av{width:52px;height:52px;font-size:16px;background:#101B33;color:#FFC933}.ficha-hd h2{font-size:18px;font-weight:800;letter-spacing:-.3px}.ficha-hd .meta{font-size:12px;color:var(--ink3);margin-top:3px}.ficha-hd .end{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs2{display:flex;gap:2px;border-bottom:2px solid var(--ln);margin-bottom:16px;flex-wrap:wrap}.tabs2 div{padding:8px 13px;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}.tabs2 div.on{color:var(--ink);border-bottom-color:var(--am)}
.tl{list-style:none;position:relative;padding-left:22px}.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--ln)}
.tl li{position:relative;padding:5px 0 9px;font-size:12.5px}.tl li::before{content:'';position:absolute;left:-20px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--crd);border:2px solid var(--ink3)}
.tl li.ok::before{border-color:var(--pos);background:var(--pos)}.tl li.bad::before{border-color:var(--neg);background:var(--neg)}.tl li.wait::before{border-color:var(--ink3)}
.tl li b{font-size:14px;font-variant-numeric:tabular-nums;margin-right:8px}.tl li span{color:var(--ink3);font-size:11.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}.kv dt{color:var(--ink3)}.kv dd{font-weight:600}
.big{font-size:30px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums}.big.pos{color:var(--pos)}.big.neg{color:var(--neg)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.relcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.relc{background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:6px}.relc b{font-size:13px}.relc p{font-size:11.5px;color:var(--ink3);line-height:1.45;flex:1}.relc .ds-btn{height:32px;font-size:12px;align-self:flex-start;margin-top:4px}
.f-ov{position:fixed;inset:0;background:rgba(10,17,32,.55);z-index:9000;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.f-md{background:var(--crd);color:var(--ink);border-radius:14px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.f-md .hd{background:#101B33;color:#fff;padding:11px 16px;display:flex;justify-content:space-between;align-items:center}.f-md .hd b{font-size:14px}.f-md .x{background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer}
.f-md .bd{padding:14px 16px;display:grid;gap:10px}.f-md label{font-size:11px;font-weight:700;color:var(--ink2);display:grid;gap:4px}.f-md textarea,.f-md select{padding:8px 9px;border:1px solid var(--ln2);border-radius:8px;font:inherit;font-size:12.5px;width:100%}.f-md .acoes{display:flex;gap:8px;justify-content:flex-end}
td.st{max-width:130px;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1599px){.page{padding:18px 20px 36px}table.t{font-size:12px}table.t th{padding:8px 7px;font-size:9.5px;letter-spacing:.5px}table.t td{padding:6px 7px}.who-cell .av{display:none}.who-cell b{white-space:normal;max-width:190px;line-height:1.15}.who-cell span{font-size:10px;white-space:normal;max-width:190px}.etq{margin-right:0}.prev{font-size:10px}td.st{max-width:105px}.pill{padding:2px 7px;font-size:10px}.hora{font-size:12px}}
@media(max-width:1399px){table.t{font-size:11.5px}table.t td{padding:5px 6px}.who-cell b{max-width:160px}td.st{max-width:90px}}
#o-body td:nth-child(3){min-width:170px}#o-body td:first-child .hora{font-size:11px}
@media(max-width:1599px){#o-body td:nth-child(3){min-width:150px}#o-body .pill{font-size:9.5px;padding:2px 6px}#o-body td:nth-child(6),#o-body td:nth-child(7){max-width:100px}#o-body td:nth-child(2) .prev{display:none}}
@media(max-width:1399px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:1199px){.mnav{width:200px}.content{margin-left:200px}.topbar{padding:0 16px}.page{padding:16px}}
@media(max-width:820px){.mnav{position:sticky;top:56px;left:0;width:auto;height:auto;flex-direction:row;overflow-x:auto;z-index:30}.mnav .brand,.mnav .foot{display:none}.mnav .rows{display:flex;gap:2px;padding:6px 8px}.mnav .sect{display:none}.mnav a{white-space:nowrap;padding:7px 10px}.mnav a small{display:none}.content{margin-left:0}.topbar{height:auto;padding:10px 14px;flex-wrap:wrap}.topbar .end{margin-left:0}.page{padding:12px}.grid3{grid-template-columns:1fr}.tb .ds-search{max-width:none}}
</style>

<body class="dsnav-pad">
<aside class="mnav" id="mnav">
  <div class="brand"><b>DP / RH</b><span>Central de Gestão de Pessoas</span></div>
  <div class="rows" id="mnav-rows"></div>
  <div class="foot" id="mnav-foot"></div>
</aside>
<div class="content">
  <header class="topbar"><div><h1 id="tb-h1">Visão geral</h1><p id="tb-sub"></p></div>
    <div class="end"><div class="bell" id="bell" title="Avisos"><svg class="ds-ic"><use href="/icons.svg#alert"/></svg></div><div class="who" id="who"></div></div></header>
  <div class="page" id="page"><div class="sk"></div><div class="sk" style="width:60%"></div></div>
</div>
<svg style="display:none"><symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="ic-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h8"/></symbol><symbol id="ic-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></symbol><symbol id="ic-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol></svg>
<script>
const { $, $$, esc, api, toast, dBR, dSem } = G;
let ME = null, CFG = null, PAG = 'visao', SUB = {}, FUNCS = null;
const hoje = () => G.hoje();
const RH = ['rh_ponto', 'rh_doc', 'rh_adm'];
const papel = (...p) => ME && p.some(x => ME.papeis.includes(x));
const lojaTxt = n => (ME && ME.catalogos.lojas.find(l => l.n === +n) || {}).txt || '—';
const lojaCod = n => lojaTxt(n).split(' · ')[0];
const lojaNome = n => lojaTxt(n).split(' · ')[1] || '';
const lojasVis = () => ME.catalogos.lojas.filter(l => ME.escopo === null || ME.escopo.includes(l.n));
const etq = n => '<span class="etq' + (+n === 10 ? ' cd' : '') + '">' + esc(lojaCod(n)) + '</span>';
const ini = n => String(n || '').split(' ').filter(Boolean).slice(0, 2).map(s => s[0]).join('').toUpperCase();
const hm = min => { if (min == null) return '—'; const s = min < 0 ? '−' : '+', a = Math.abs(Math.round(min)); return s + Math.floor(a / 60) + 'h' + String(a % 60).padStart(2, '0'); };
const hmCls = min => min == null ? '<span class="hora mut">—</span>' : '<span class="saldo ' + (min > 0 ? 'pos' : min < 0 ? 'neg' : '') + '">' + hm(min) + '</span>';
const dt = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') + ' ' + new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';
const hora = (v, cls) => v ? '<span class="hora ' + (cls || '') + '">' + esc(v) + '</span>' : '<span class="hora mut">—</span>';
const SIT_CLS = { ok: 'ok', atraso: 'bad', sem_marcacao: 'warn', incompleta: 'warn', pendente: 'gr', em_andamento: 'info', intervalo: 'info', aguardando: 'gr', folga: 'gr', folga_trabalhada: 'warn', ferias: 'gr', afastado: 'gr', sem_escala: 'gr' };
const sitPill = (s, t) => '<span class="pill ' + (SIT_CLS[s] || 'gr') + '">' + esc(t || s) + '</span>';
const ic = n => '<svg class="ds-ic"><use href="' + (n.startsWith('ic-') ? '#' + n : '/icons.svg#' + n) + '"/></svg>';
const selLojas = (v, vazio) => '<option value="">' + esc(vazio || 'Todas as lojas') + '</option>' + lojasVis().map(l => '<option value="' + l.n + '"' + (String(l.n) === String(v) ? ' selected' : '') + '>' + esc(l.txt) + '</option>').join('');
const selSetores = (lista, v) => '<option value="">Todos os setores</option>' + [...new Set(lista.map(x => x.setor).filter(Boolean))].sort().map(s => '<option' + (s === v ? ' selected' : '') + '>' + esc(s) + '</option>').join('');
const quem = r => '<div class="who-cell"><div class="av">' + esc(ini(r.nome)) + '</div><div><b>' + esc(r.nome) + '</b><span>' + (r.matricula ? 'Matr. ' + esc(r.matricula) + ' · ' : '') + esc(r.cargo || r.setor || '') + '</span></div></div>';
// setor que só repete o nome da unidade (CENTRO DE DISTRIBUICAO, MURIBECA…) não acrescenta nada na linha
const semAc = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, '');
const setorTxt = (setor, loja) => { const s = semAc(setor); return !s || s === '—' || semAc(lojaTxt(loja)).includes(s) || /CENTRODEDISTRIBUI/.test(s) ? '<span class="hora mut">' + esc(lojaNome(loja)) + '</span>' : esc(setor); };

  $$('#b-seg button').forEach(b => b.onclick = () => { grupo = b.dataset.k; $$('#b-seg button').forEach(x => x.classList.toggle('on', x === b)); desenha(); });
}

// ── 6 · Relatórios por loja e setor ──
async function relatorios() {
  const el = $('#page'); const f = SUB; const ate = f.ate || hoje(); const de = f.de || ate.slice(0, 7) + '-01';
  el.innerHTML = '<div class="tb"><span style="font-size:12px;color:var(--ink2)">Período</span><input type="date" class="ds-input" id="r-de" value="' + de + '"><input type="date" class="ds-input" id="r-ate" value="' + ate + '" max="' + hoje() + '"><select class="ds-select" id="r-loja">' + selLojas(f.loja) + '</select><button class="ds-btn ds-btn-primary" id="r-ir">Gerar</button><span class="note" style="margin:0">máx. 92 dias · relatórios oficiais do PontoCerto</span></div><div id="r-body">' + skel() + '</div>';
  $('#r-ir').onclick = () => ir('relatorios', { de: $('#r-de').value, ate: $('#r-ate').value, loja: $('#r-loja').value });
  let R; try { R = await api('/api/gp/resumo?de=' + de + '&ate=' + ate); } catch (e) { $('#r-body').innerHTML = erroBox(e); return; }
  const lojas = f.loja ? R.lojas.filter(l => +l.loja === +f.loja) : R.lojas;
  const setores = {}; const add = (lista, k, fn) => { for (const x of lista) { if (f.loja && +x.loja !== +f.loja) continue; const key = x.loja + '|' + x.setor; const r = setores[key] || (setores[key] = { loja: x.loja, setor: x.setor, faltas: 0, atrasos: 0, extras_min: 0, pessoas: new Set() }); fn(r, x); r.pessoas.add(x.nome); } };
  add(R.listas.faltas, 'faltas', (r, x) => { if (!x.abonada) r.faltas++; }); add(R.listas.atrasos, 'atrasos', r => r.atrasos++); add(R.listas.extras, 'extras', (r, x) => { r.extras_min += (m => { const k = String(x.extras).match(/(\d+):(\d{2})/); return k ? +k[1] * 60 + +k[2] : 0; })(); });
  const colabSetor = {}; for (const c of R.listas.colaboradores) { if (f.loja && +c.loja !== +f.loja) continue; const key = c.loja + '|' + c.setor; colabSetor[key] = (colabSetor[key] || 0) + 1; if (!setores[key]) setores[key] = { loja: c.loja, setor: c.setor, faltas: 0, atrasos: 0, extras_min: 0, pessoas: new Set() }; }
  const hmm = m => Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0');
  $('#r-body').innerHTML = '<div class="grid2" style="grid-template-columns:1fr"><div class="ds-card"><div class="ds-panel-hd"><span class="ds-h2">Comparativo por loja · ' + dBR(R.de) + ' a ' + dBR(R.ate) + '</span><a class="lnk" id="r-csv1">Exportar CSV</a></div><div class="tw" style="border:none;border-radius:0"><table class="t"><thead><tr><th>Loja</th><th class="r">Colaboradores</th><th class="r">Admissões</th><th class="r">Faltas</th><th class="r">Abonadas</th><th class="r">Pessoas c/ falta</th><th class="r">Atrasos</th><th class="r">Tempo em atraso</th><th class="r">Horas extras</th><th class="r">Horas faltantes</th><th class="r">% faltante</th><th class="r">Afastados</th><th class="r">Férias</th></tr></thead><tbody>' +
    lojas.map(l => '<tr class="row" data-loja="' + l.loja + '"><td>' + etq(l.loja) + esc(lojaNome(l.loja)) + '</td><td class="r">' + l.colaboradores + '</td><td class="r">' + l.admissoes_periodo + '</td><td class="r">' + (l.faltas ? '<b style="color:var(--neg)">' + l.faltas + '</b>' : 0) + '</td><td class="r">' + l.faltas_abonadas + '</td><td class="r">' + l.faltas_pessoas + '</td><td class="r">' + l.atrasos + '</td><td class="r">' + esc(l.atraso) + '</td><td class="r"><span class="saldo pos">' + esc(l.extras) + '</span></td><td class="r"><span class="saldo neg">' + esc(l.faltantes) + '</span></td><td class="r">' + (l.faltantes_pct == null ? '—' : l.faltantes_pct + '%') + '</td><td class="r">' + l.afastados + '</td><td class="r">' + l.ferias + '</td></tr>').join('') +
    '<tr style="font-weight:800"><td>Total</td><td class="r">' + R.total.colaboradores + '</td><td class="r">' + R.total.admissoes_periodo + '</td><td class="r">' + R.total.faltas + '</td><td class="r">' + R.total.faltas_abonadas + '</td><td class="r">' + R.total.faltas_pessoas + '</td><td class="r">' + R.total.atrasos + '</td><td class="r">' + esc(R.total.atraso) + '</td><td class="r">' + esc(R.total.extras) + '</td><td class="r">' + esc(R.total.faltantes) + '</td><td class="r">' + (R.total.faltantes_pct == null ? '—' : R.total.faltantes_pct + '%') + '</td><td class="r">' + R.total.afastados + '</td><td class="r">' + R.total.ferias + '</td></tr></tbody></table></div></div>' +
    '<div class="ds-card"><div class="ds-panel-hd"><span class="ds-h2">Comparativo por setor</span><a class="lnk" id="r-csv2">Exportar CSV</a></div><div class="tw" style="border:none;border-radius:0"><table class="t"><thead><tr><th>Loja</th><th>Setor</th><th class="r">Colaboradores</th><th class="r">Faltas não abonadas</th><th class="r">Atrasos</th><th class="r">Horas extras</th><th class="r">Pessoas envolvidas</th></tr></thead><tbody>' +
    Object.values(setores).sort((a, b) => a.loja - b.loja || a.setor.localeCompare(b.setor)).map(s => '<tr><td>' + etq(s.loja) + '</td><td><b style="color:var(--ink)">' + esc(s.setor) + '</b></td><td class="r">' + (colabSetor[s.loja + '|' + s.setor] || 0) + '</td><td class="r">' + (s.faltas ? '<b style="color:var(--neg)">' + s.faltas + '</b>' : 0) + '</td><td class="r">' + s.atrasos + '</td><td class="r"><span class="saldo pos">' + hmm(s.extras_min) + '</span></td><td class="r">' + s.pessoas.size + '</td></tr>').join('') + '</tbody></table></div></div></div>' +
    '<div class="note">Fonte: relatórios oficiais do PontoCerto (dias sem marcação, atrasos, horas extras, afastamentos, apuração do período) lidos ' + dt(R.gerado_em) + '. "Faltas" = dias sem marcação não abonados no PontoCerto; a origem deve ser analisada antes de qualquer medida.</div>';
  const csv = (nome, cab, rows) => { const s = '﻿' + [cab, ...rows].map(r => r.map(v => { const x = String(v == null ? '' : v); return /[;"\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(';')).join('\r\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([s], { type: 'text/csv;charset=utf-8' })); a.download = nome + '-' + R.de + '-' + R.ate + '.csv'; a.click(); };
  $('#r-csv1').onclick = () => csv('comparativo-lojas', ['Loja', 'Colaboradores', 'Admissões', 'Faltas', 'Abonadas', 'Pessoas c/ falta', 'Atrasos', 'Tempo em atraso', 'Horas extras', 'Horas faltantes', '% faltante', 'Afastados', 'Férias'], lojas.map(l => [lojaTxt(l.loja), l.colaboradores, l.admissoes_periodo, l.faltas, l.faltas_abonadas, l.faltas_pessoas, l.atrasos, l.atraso, l.extras, l.faltantes, l.faltantes_pct, l.afastados, l.ferias]));
  $('#r-csv2').onclick = () => csv('comparativo-setores', ['Loja', 'Setor', 'Colaboradores', 'Faltas não abonadas', 'Atrasos', 'Horas extras', 'Pessoas'], Object.values(setores).map(s => [lojaTxt(s.loja), s.setor, colabSetor[s.loja + '|' + s.setor] || 0, s.faltas, s.atrasos, hmm(s.extras_min), s.pessoas.size]));
  $$('#r-body tr[data-loja]').forEach(tr => tr.onclick = () => ir('relatorios', { ...f, loja: tr.dataset.loja }));
}

// ── 7 · Fechamentos e exportações ──
async function fechamentos() {
  const el = $('#page'); const f = SUB;
  let salvos = []; try { salvos = await api('/api/gp/relatorios'); } catch (e) { /* sem foto ainda */ }
  const d = hoje();
  el.innerHTML = '<div class="relcards">' + [
    ['Jornada diária', 'Previsto × realizado de todos os funcionários numa data, com apuração e banco oficial.', '/api/gp/exportar/jornada.csv?data=' + d, 'calendar', 'data'],
    ['Banco de horas', 'Saldo oficial por funcionário, semana anterior, variação, situação e plano.', '/api/gp/exportar/banco-horas.csv', 'chart'],
    ['Ocorrências de ponto', 'Ocorrências abertas com responsável, prazo e situação.', '/api/gp/exportar/ponto.csv?situacao=abertas', 'alert'],
    ['Solicitações e planos', 'Todas as solicitações com status, prazo e resultado.', '/api/gp/exportar/solicitacoes.csv', 'check'],
    ['Central de alertas', 'Os 12 eventos monitorados com prioridade e responsável.', '/api/gp/exportar/alertas.csv', 'alert'],
    ['Fechamento semanal (sexta)', 'Top 5 positivos/negativos, fora do limite e planos por loja. Congelado toda sexta às 8h.', '/api/gp/exportar/semanal.csv', 'download'],
  ].map(([t, p, href, icn, tipo]) => '<div class="relc"><div style="display:flex;align-items:center;gap:8px;color:var(--amk)">' + ic(icn) + '<b style="color:var(--ink)">' + t + '</b></div><p>' + p + '</p>' + (tipo === 'data' ? '<div style="display:flex;gap:6px;align-items:center"><input type="date" class="ds-input" style="height:32px" value="' + d + '" max="' + d + '" data-jd><a class="ds-btn ds-btn-primary" href="' + href + '" data-jcsv>' + ic('download') + 'Gerar CSV</a></div>' : '<a class="ds-btn ds-btn-primary" href="' + href + '">' + ic('download') + 'Gerar CSV</a>') + '</div>').join('') + '</div>' +
    '<div class="ds-card" style="margin-top:18px"><div class="ds-panel-hd"><span class="ds-h2">Relatório executivo semanal</span><select class="ds-select" id="fe-data" style="height:32px"><option value="">agora (dados atuais)</option>' + salvos.map(x => '<option value="' + x + '"' + (f.data === x ? ' selected' : '') + '>sexta ' + dBR(x) + ' (congelado)</option>').join('') + '</select><button class="ds-btn ds-btn-secondary" style="height:32px" onclick="window.print()">' + ic('printer') + 'Imprimir</button></div><div id="fe-body" class="ds-panel-bd">' + skel() + '</div></div>';
  const inp = $('[data-jd]'); if (inp) inp.onchange = () => { $('[data-jcsv]').href = '/api/gp/exportar/jornada.csv?data=' + inp.value; };
  $('#fe-data').onchange = e => ir('fechamentos', { data: e.target.value });
  let r; try { r = await api('/api/gp/relatorios/semanal' + (f.data ? '?data=' + f.data : '')); } catch (e) { $('#fe-body').innerHTML = '<div class="empty"><b>Sem relatório ainda</b>' + esc(e.message) + '</div>'; return; }
  const li = x => '<li><b style="color:var(--ink)">' + esc(x.nome) + '</b> <span style="color:var(--ink3)">' + esc(x.setor) + '</span> · ' + hmCls(x.min) + (x.variacao != null ? ' <span style="color:var(--ink3);font-size:11px">(' + hm(x.variacao) + ' na semana)</span>' : '') + '</li>';
  $('#fe-body').innerHTML = '<p class="note" style="margin:0 0 12px">Foto de ' + dBR(r.data) + (r.anteriorData ? ' comparada com ' + dBR(r.anteriorData) : ' (sem semana anterior ainda)') + ' · limites ' + hm(r.limites.positivoMin) + ' / ' + hm(-r.limites.negativoMin) + (r.congelado ? ' · relatório congelado' : '') + '</p>' +
    r.lojas.map(l => '<div class="ds-card ds-card-pad" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px"><b style="font-size:13.5px">' + etq(l.loja) + esc(lojaNome(l.loja)) + '</b><span class="note" style="margin:0">' + l.colaboradores + ' colaboradores · positivas ' + hm(l.pos_min) + ' · negativas ' + hm(l.neg_min) + ' · planos: ' + l.planos.pendentes + ' pendentes, ' + l.planos.emExecucao + ' em execução, ' + l.planos.concluidos + ' concluídos, ' + l.planos.descumpridos + ' descumpridos</span></div>' +
      '<div class="grid3"><div><div class="ds-label">5 maiores positivos</div><ol style="padding-left:18px;font-size:12px;line-height:1.7">' + (l.top_pos.map(li).join('') || '<li style="color:var(--ink3)">nenhum</li>') + '</ol></div><div><div class="ds-label">5 maiores negativos</div><ol style="padding-left:18px;font-size:12px;line-height:1.7">' + (l.top_neg.map(li).join('') || '<li style="color:var(--ink3)">nenhum</li>') + '</ol></div><div><div class="ds-label">Fora dos limites (' + l.fora.length + ')</div><ol style="padding-left:18px;font-size:12px;line-height:1.7">' + (l.fora.slice(0, 12).map(li).join('') || '<li style="color:var(--ink3)">ninguém</li>') + (l.fora.length > 12 ? '<li style="color:var(--ink3)">+ ' + (l.fora.length - 12) + ' no CSV</li>' : '') + '</ol></div></div></div>').join('');
}
iniciar();
</script>
</body>
</html>
