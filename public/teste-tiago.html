<style>

.main{padding:24px;max-width:1640px}
.page-hdr h1{font-size:21px;font-weight:800;letter-spacing:-.3px}.page-hdr h1 span{display:inline-block;background:#101B33;color:#FFC933;font-size:11px;padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle;letter-spacing:.4px}
.page-hdr p{font-size:12.5px;color:var(--ink2);margin-top:4px;max-width:96ch;line-height:1.5}
.vazio{margin-top:24px;background:var(--crd);border:1px dashed var(--ln2);border-radius:12px;padding:48px 20px;text-align:center;color:var(--ink3);font-size:13px}
@media(max-width:820px){.main{padding:12px}}
</style>
</head>
<body>
<div class="main">
  <div class="page-hdr"><h1>TESTE TIAGO<span>DP / RH</span></h1><p>Aba de testes do Tiago.</p></div>
