<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = (v, d = 0) => (v == null ? '–' : (+v).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }));
async function api(url, opt) { const r = await fetch(url, opt); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; }
// ── Lotes no CD: o que entrou por lote (Recebimento da loja 10) × o que saiu (expedições fechadas) ──
let LOTES = [], LOTESBUSCA = '', LOTESDIAS = 60;
async function carregarLotes() { LOTES = await api('/api/expedicao/lotes?dias=' + LOTESDIAS); renderLotes(); }
function renderLotes() {
  const b = LOTESBUSCA.trim().toLowerCase(); const vis = LOTES.filter(l => !b || l.descricao.toLowerCase().includes(b) || l.cod.includes(b) || String(l.lote).toLowerCase().includes(b));
  const foco = document.activeElement && document.activeElement.id === 'lbusca'; const pos = foco ? document.activeElement.selectionStart : 0;
  const opts = [30, 60, 90, 180].map(d => `<option value="${d}" ${d === LOTESDIAS ? 'selected' : ''}>${d} dias</option>`).join('');
  const linhas = vis.length ? vis.map(l => `<tr><td class="lc">${esc(l.descricao)}<div class="s2">${esc(l.cod)}</div></td><td><b>${esc(l.lote)}</b></td><td>${l.validade ? esc(l.validade.split('-').reverse().join('/')) : '<span class="mut">–</span>'}</td><td class="r">${fmtN(l.entrou, 0)}</td><td class="r">${fmtN(l.saiu, 0)}</td><td class="r ${l.saldo < 0 ? 'neg' : l.saldo > 0 ? 'pos' : 'mut'}">${fmtN(l.saldo, 0)}</td><td class="comp">${l.entradas.map(e => 'NF ' + esc(e.nfe) + ' ' + esc((e.fornecedor || '').slice(0, 18)) + ' · ' + fmtN(e.un, 0)).join('<br>') || '–'}</td><td class="comp">${l.saidas.map(s => '#' + esc(s.nPedido) + ' ' + esc((s.cliente || '').slice(0, 18)) + ' · ' + fmtN(s.un, 0)).join('<br>') || '–'}</td></tr>`).join('') : '<tr><td colspan="8" class="mut">Nenhum lote bipado no período. As entradas vêm do Recebimento da loja 10 no coletor (lote obrigatório desde 29/09).</td></tr>';
  $('#lotes').innerHTML = `<div class="busca-row"><input id="lbusca" placeholder="Produto, código ou lote" value="${esc(LOTESBUSCA)}" oninput="LOTESBUSCA=this.value;renderLotes()"><span class="contagem">${vis.length} lote(s) · entradas e saídas dos últimos <select onchange="LOTESDIAS=+this.value;carregarLotes()">${opts}</select> · saldo = o que foi bipado de verdade (sem FEFO)</span><button class="btn btn-sec" onclick="carregarLotes()">↻ Atualizar</button></div>
    <div class="table-wrap"><table class="main-t"><thead><tr><th>Produto</th><th>Lote</th><th>Validade</th><th class="r">Entrou</th><th class="r">Saiu</th><th class="r">Saldo</th><th>Entradas</th><th>Saídas</th></tr></thead><tbody>${linhas}</tbody></table></div>`;
  if (foco) { const el = $('#lbusca'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
}
carregarLotes().catch(e => alert(e.message));
</script>
</body>
</html>
