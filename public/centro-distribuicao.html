<body>
<div class="main">
  <div class="page-hdr">
    <div><h1>Centro de Distribuição</h1><p>Pedido semanal das lojas ao CD em caixas, com as regras do Radar. Vínculo caixa↔unidade, acompanhamento até chegar na loja. Nada é gravado no ERP.</p></div>
    <div class="estado" id="estado"></div>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="pedido">Pedido da semana <span class="n" id="n-pedido">–</span></button>
    <button class="tab" data-tab="vinculos">Vínculos caixa → unidade <span class="n" id="n-vinc">–</span></button>
    <button class="tab" data-tab="pedidos">Pedidos <span class="n" id="n-peds">–</span></button>
    <button class="tab" data-tab="regras">Regras</button>
  </div>
  <section id="tab-pedido"></section>
  <section id="tab-vinculos" hidden></section>
  <section id="tab-pedidos" hidden></section>
  <section id="tab-regras" hidden></section>
</div>
<div class="overlay" id="ov"><div class="modal" id="ov-body"></div></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = (v, d = 0) => (v == null ? '–' : (+v).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }));
const fmtR = v => 'R$ ' + fmtN(v, 2);
const LOJAS = [1, 2, 3, 4, 5, 6];
const LOJAS_NOMES = { 1: 'CAHU', 2: 'MURIBECA', 3: 'PONTE', 4: 'ATACAREJO', 5: 'PORTA LARGA', 6: 'JARDIM JORDÃO' };
let ESTOPEN = new Set(), DADOS = null, EDITS = {}, SEL = new Set(), FILTRO = '', FLOJA = 0, VIS = {}, PEDIDOS = [], VINC = {}, VF = 'pendentes', SOQTD = true, ORDEM = 'az', SELINIT = false;

document.querySelectorAll('.tab').forEach(b => b.onclick = () => { document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b)); ['pedido', 'vinculos', 'pedidos', 'regras'].forEach(t => $('#tab-' + t).hidden = t !== b.dataset.tab); });

async function api(url, opt) { const r = await fetch(url, opt); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; }

async function carregar(refresh) {
  $('#estado').innerHTML = refresh ? '<span class="calc">recalculando…</span>' : 'carregando…';
  try { DADOS = await api('/api/pedidos-cd' + (refresh ? '?refresh=1' : '')); } catch (e) { $('#estado').innerHTML = '<span class="neg">' + e.message + '</span>'; return; }
  const es = DADOS.estado;
  const avisos = es.avisos && es.avisos.length ? ` · <span class="neg">${es.avisos.length} aviso(s): ${esc(es.avisos.join('; '))}</span>` : '';
  $('#estado').innerHTML = es.status === 'calculando' || !es.atualizadoEm ? '<span class="calc">calculando… (até 1 min)</span>' : `dados de <b>${new Date(es.atualizadoEm).toLocaleString('pt-BR')}</b>${es.erro ? ' · <span class="neg">ERP indisponível: ' + esc(es.erro) + '</span>' : ''} · <b>${es.produtosCD}</b> produtos no CD${avisos}`;
  if (!es.atualizadoEm) setTimeout(() => carregar(false), 15000);
  renderPedido(); renderRegras();
  // não redesenha a aba Vínculos se alguém está digitando numa busca (o recarregamento automático de 15 s apagava a caixa e o resultado)
  const digitando = document.activeElement && document.activeElement.closest && document.activeElement.closest('.busca-un');
  if (!digitando) renderVinculos();
}
function cxDe(item, ln) { const k = item.codigoCD + '|' + ln; return k in EDITS ? EDITS[k] : item.lojas[ln].cx; }
function todosItens() { return DADOS ? DADOS.repor.concat(DADOS.novos) : []; }
function totCx(item) { return LOJAS.reduce((a, ln) => a + cxDe(item, ln), 0); }
function cobClass(item) {
  if (item.cdInsuficiente) return ['m-bad', 'CD insuficiente'];
  if (item.origem === 'novo') return ['m-warn', 'novo'];
  const c = item.coberturaTotal; if (c == null) return ['', '–'];
  if (c < 7) return ['m-bad', 'crítico'];
  const zeram = LOJAS.filter(ln => item.lojas[ln].zeraAntes);
  if (c < 14 || zeram.length) return ['m-warn', 'atenção' + (zeram.length ? ' · zera L' + zeram.join(' L') : '')];
  return ['m-good', 'normal'];
}
function metaCx(item) {
  const v = VINC[item.codigoCD] || {};
  if (!(item.unPorCaixa >= 1)) return `<span class="m-bad">sem un/cx · <a onclick="event.stopPropagation();irVinculo('${item.codigoCD}')">definir</a></span>`;
  const manual = v.confirmadoPor && v.confirmadoPor !== 'sistema' && v.unPorCaixaCadastro != null && v.unPorCaixa !== v.unPorCaixaCadastro;
  return `<span>Cx ${item.unPorCaixa} (${manual ? 'corrigida à mão' : 'embalagem ERP'})</span>`;
}
function linha(item, lojasCols) {
  lojasCols = lojasCols || LOJAS;
  const tot = totCx(item); const upc = item.unPorCaixa || 0;
  const [cc, ct] = cobClass(item);
  const transito = LOJAS.reduce((a, ln) => a + (item.lojas[ln].transito || 0), 0);
  const estLojas = LOJAS.reduce((a, ln) => a + (item.lojas[ln].est || 0), 0);
  const sel = SEL.has(item.codigoCD);
  return `<tr class="lst${item.cdInsuficiente ? ' insuf' : ''}" data-cod="${item.codigoCD}" onclick="toggleSel('${item.codigoCD}',!SEL.has('${item.codigoCD}'))">
    <td class="c" onclick="event.stopPropagation()"><input type="checkbox" ${sel ? 'checked' : ''} onchange="toggleSel('${item.codigoCD}',this.checked)"></td>
    <td class="cod">${item.codigoCD}</td>
    <td><div class="prod-cell"><div class="nm">${item.descricaoCD}</div>
      <div class="prod-meta">${metaCx(item)}${item.origem === 'repor' ? `<span>Venda/dia ${fmtN(item.vqTotal, 2)}</span><span class="${cc}">Cobertura ${item.coberturaTotal == null ? '–' : '~' + fmtN(item.coberturaTotal, 0) + ' d'} · ${ct}</span>${item.vendaNova ? `<span class="m-warn" title="começou a vender há pouco (L${item.vendaNova.lojas.join(', L')}): venda/dia calculada pelos dias desde a primeira venda (mín. 7), não pelos 40 dias; volta ao normal sozinha">em venda desde ${item.vendaNova.desde.split('-').reverse().slice(0, 2).join('/')} · venda/dia por ${item.vendaNova.dias} d</span>` : ''}${item.vendaAntiga ? `<span class="m-warn" title="nenhuma loja vendeu nos últimos 40 dias (ficou em falta); venda/dia = média dos meses com venda nos últimos 24 meses">sem venda há 40+ d · média de ${item.vendaAntiga.meses} meses (últ. ${item.vendaAntiga.ultimo.split('-').reverse().join('/')})</span>` : ''}` : `<span class="pill p-flag" title="sem venda nas lojas: 1 caixa por loja, entra como produto novo">produto novo</span>`}${item.cdInsuficiente ? `<span class="m-bad">faltam ${item.faltaCx} cx no CD</span>` : ''}</div>
      <div class="prod-meta">${item.unidade ? `<span>${item.unidade} · ${item.descricaoUn || ''}</span>` : `<span class="m-bad">sem vínculo · <a onclick="event.stopPropagation();irVinculo('${item.codigoCD}')">vincular</a></span>`}</div></div></td>
    <td class="r" title="${item.estoqueCDem === 'un' ? 'o CD conta em unidades: ' + fmtN(item.estoqueCDun) + ' un ÷ ' + (item.unPorCaixa || 1) + ' = caixas' : 'o CD já conta em caixas/fardos'}">${fmtN(item.estoqueCDcx)}${item.estoqueCDem === 'un' ? `<div class="s2">${fmtN(item.estoqueCDun)} un</div>` : ''}</td>

// Impressão no mesmo padrão do pedido do Radar (pv-top / pv-resumo / pv-loja / pv-t), em documento isolado
const PV_CSS = `body{font-family:'InterVar','Segoe UI',sans-serif;color:#0E1626;margin:0;padding:22px 26px 30px;font-size:12px;font-variant-numeric:tabular-nums}
.pv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;border-bottom:3px solid #F5B800;padding-bottom:12px;margin-bottom:14px}
.pv-top h2{font-size:19px;font-weight:800;letter-spacing:-.3px;margin:2px 0 0}
.eyebrow-pv{font-size:10px;font-weight:800;letter-spacing:.1em;color:#6B4E00}.eyebrow-pv.ok{color:#137A48}.eyebrow-pv.neg{color:#C22F49}
.pv-sub{font-size:12px;color:#4E5A72;margin-top:3px}
.pv-acts{display:flex;gap:8px}.btn{border:none;border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;background:#F5B800;color:#6B4E00}
.pv-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.pv-resumo>div{border:1px solid #DADAD6;border-radius:10px;padding:10px 12px}
.pv-resumo>div.tot{background:#101B33;color:#fff;border-color:#101B33}.pv-resumo>div.tot .lb,.pv-resumo>div.tot .s2{color:#AEB8CE}.pv-resumo>div.tot .v{color:#FFC933}
.pv-resumo .lb{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#4E5A72}
.pv-resumo .v{font-size:17px;font-weight:800;letter-spacing:-.3px}.pv-resumo .s2{font-size:10.5px;color:#98A0B3;margin-top:1px}
.pv-loja{border:1px solid #DADAD6;border-radius:10px;overflow:hidden;margin-bottom:12px}
.pv-loja-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;background:#EBEBE9;font-size:12.5px;break-after:avoid}
.pv-loja-hd span{color:#4E5A72;font-size:12px}
.pv-t{width:100%;border-collapse:collapse;font-size:12px}.pv-t thead{display:table-header-group}.pv-t tr{break-inside:avoid}
.pv-t th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:#4E5A72;padding:7px 12px;border-bottom:1px solid #DADAD6}
.pv-t td{padding:6px 12px;border-top:1px solid #EEEEEA;vertical-align:top}
.pv-t th.r,.pv-t td.r{text-align:right}.pv-t td.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#4E5A72;white-space:nowrap}
.pv-t .sub{font-size:10.5px;color:#98A0B3}.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:9.5px;font-weight:800;background:#E9EEF6;color:#2E5E8C;margin-left:4px}
.pv-foot{margin-top:14px;font-size:10.5px;color:#98A0B3;display:flex;justify-content:space-between}
@media print{.pv-acts{display:none}body{padding:0}.pv-top,.pv-resumo{break-inside:avoid;break-after:avoid}.pv-loja{border:none;border-radius:0}.pv-t th{background:#EBEBE9;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@page{size:A4 portrait;margin:12mm 10mm}`;
function htmlImpressao(p) {
  const st = { aberto: ['ABERTO · AGUARDANDO SEPARAÇÃO NO CD', ''], separado: ['LIBERADO NO CD', 'ok'], recebido: ['RECEBIDO NA LOJA', 'ok'], recebido_parcial: ['RECEBIDO PARCIAL', ''], cancelado: ['CANCELADO', 'neg'], expirado: ['EXPIRADO', 'neg'] }[p.status] || [String(p.status || '').toUpperCase(), ''];
  const itens = p.itens.slice().sort((a, b) => a.descricao.localeCompare(b.descricao, 'pt-BR'));
  const novos = itens.filter(i => i.semVinculo || i.origem === 'novo').length;
  const custo = itens.reduce((a, i) => a + i.unidades * (i.custoUn || 0), 0);
  const linhas = itens.map(i => `<tr><td class="mono">${esc(i.codigoCD)}</td><td>${esc(i.descricao)}${i.semVinculo ? '<span class="pill">produto novo</span>' : (i.origem === 'novo' ? '<span class="pill">novo na loja</span>' : '')}${i.unidade ? `<div class="sub">unidade ${esc(i.unidade)}</div>` : ''}</td><td class="r"><b>${fmtN(i.caixas)}</b></td><td class="r">${i.unPorCaixa}</td><td class="r">${fmtN(i.unidades)}</td><td class="r">${i.custoUn ? fmtR(i.custoUn * i.unPorCaixa) : '—'}</td><td class="r">${i.custoUn ? fmtR(i.unidades * i.custoUn) : '—'}</td></tr>`).join('');
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Pedido ao CD #${p.id} · L${p.loja}</title><style>${PV_CSS}</style></head><body>
  <div class="pv-top"><div><div class="eyebrow-pv">PEDIDO AO CD #${p.id} · LOJAS → CENTRO DE DISTRIBUIÇÃO</div><h2>Pedido ao CD · Loja ${p.loja} ${esc(p.lojaNome || '')}</h2>
    <div class="pv-sub">gerado em ${new Date(p.criadoEm).toLocaleString('pt-BR')}${p.criadoPor ? ' · ' + esc(p.criadoPor) : ''}</div></div>
    <div class="pv-acts"><button class="btn" onclick="window.print()">Imprimir</button></div></div>
  <div class="pv-resumo"><div><div class="lb">Itens</div><div class="v">${itens.length}</div><div class="s2">${novos ? novos + ' novo(s) na loja' : 'todos com venda'}</div></div><div><div class="lb">Caixas</div><div class="v">${fmtN(p.totais.caixas)}</div><div class="s2">${fmtN(p.totais.unidades)} unidades</div></div><div class="tot"><div class="lb">Custo do pedido</div><div class="v">${fmtR(custo)}</div><div class="s2">custo do CD por caixa</div></div></div>
  <div class="pv-loja"><div class="pv-loja-hd"><b>Loja ${p.loja} · ${esc(p.lojaNome || '')}</b><span>${itens.length} itens · ${fmtN(p.totais.caixas)} caixas · <b>${fmtR(custo)}</b></span></div>
  <table class="pv-t"><thead><tr><th>Código CD</th><th>Produto</th><th class="r">Caixas</th><th class="r">Un/cx</th><th class="r">Unidades</th><th class="r">Custo cx</th><th class="r">Total</th></tr></thead><tbody>${linhas}</tbody></table></div>
  <div class="pv-foot"><span>Econômico Relatórios · Centro de Distribuição</span><span>Pedido ao CD #${p.id} · L${p.loja} · nada é gravado no ERP</span></div></body></html>`;
}
function imprimir(id) {
  const p = PEDIDOS.find(x => x.id === id); if (!p) return;
  const w = window.open('', '_blank'); if (!w) return alert('O navegador bloqueou a janela de impressão. Libere pop-ups pra este site.');
  w.document.write(htmlImpressao(p)); w.document.close();
  w.onload = () => w.print(); setTimeout(() => { try { w.print(); } catch (e) {} }, 400);
}
function renderRegras() {
  if (!DADOS?.regras) return; const r = DADOS.regras; const cfg = DADOS.regras;
  $('#tab-regras').innerHTML = `<div class="filtros"><div class="fg"><label>Teto (dias)</label><input type="number" id="cfg-teto" value="${r.teto}" min="3" max="90"></div><div class="fg"><label>Ciclo</label><input value="${r.ciclo} dias (segunda)" disabled></div><div class="fg"><label>Validade</label><input value="60% do cadastro" disabled></div><div class="fg"><label>WhatsApp do CD</label><input id="cfg-whats" placeholder="DDD + número" title="pra quem vai o link dos pedidos"></div><button class="btn btn-amber" onclick="salvarCfg()">Salvar</button></div>
  <div class="table-wrap"><table class="main-t"><thead><tr><th>Loja</th><th class="r">Lead médio (d)</th><th class="r">Lead máx</th><th class="r">Amostras</th><th class="r">Segurança</th><th class="r">Ponto</th><th class="r">Alvo</th><th class="c" title="Código de cliente da loja no cadastro de fornecedores do ERP. O CNPJ desse cadastro é usado junto, porque desde 03/09/2026 o Televendas grava o CNPJ no painel">Cliente no painel do CD (código; CNPJ do cadastro entra junto)</th></tr></thead><tbody>
  ${LOJAS.map(ln => { const L = r.lojas[ln]; return `<tr><td><b>L${ln}</b> ${L.nome}</td><td class="r">${L.lead ? L.lead.lead_medio : '<span class="mut">padrão</span>'}</td><td class="r">${L.lead ? L.lead.lead_max : '–'}</td><td class="r">${L.lead ? L.lead.n : 0}</td><td class="r">${L.seg}</td><td class="r">${L.ponto}</td><td class="r">${L.alvoLista}</td><td class="c"><input class="cx" style="width:80px" id="cli-${ln}" data-ln="${ln}"></td></tr>`; }).join('')}
  </tbody></table></div><p class="mut" style="font-size:11px">Lead = dias entre o pedido da loja no painel de expedição do CD e a nota de entrada do fornecedor do CD na loja (6 meses). Alvo = lead + segurança + 7, limitado ao teto. Fornecedor do CD nas notas: <span id="cfg-forn"></span>.</p>`;
  api('/api/pedidos-cd/config').then(c => { CFGCD = c; for (const ln of LOJAS) $('#cli-' + ln).value = c.clientesLoja[ln] || ''; $('#cfg-forn').textContent = c.fornecedorCD; $('#cfg-whats').value = c.whatsCD || ''; });
}
async function salvarCfg() {
  const clientesLoja = {}; for (const ln of LOJAS) { const v = $('#cli-' + ln).value.trim(); if (v) clientesLoja[ln] = +v; }
  try { await api('/api/pedidos-cd/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ teto: +$('#cfg-teto').value, clientesLoja, whatsCD: $('#cfg-whats').value }) }); carregar(true); } catch (e) { alert(e.message); }
}
carregar(false);
carregarVinculos().catch(e => alert(e.message));
{ const t = new URLSearchParams(location.search).get('tab'); if (t) { const b = document.querySelector('[data-tab=' + t + ']'); if (b) b.click(); } }
carregarPedidos().catch(e => alert(e.message));
</script>
</body>
</html>
