<body>
<div class="main">
  <div class="page-hdr">
    <div><h1>Centro de Distribuição</h1><p>Pedido semanal das lojas ao CD em caixas, com as regras do Radar. Vínculo caixa↔unidade, acompanhamento até chegar na loja. Nada é gravado no ERP.</p></div>
    <div class="estado" id="estado"></div>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="pedido">Pedido da semana <span class="n" id="n-pedido">–</span></button>
    <button class="tab" data-tab="vinculos">Vínculos caixa → unidade <span class="n" id="n-vinc">–</span></button>
    <button class="tab" data-tab="pedidos">Pedidos <span class="n" id="n-peds">–</span></button>
    <button class="tab" data-tab="expedicao">Expedição <span class="n" id="n-exp">–</span></button>
    <button class="tab" data-tab="regras">Regras</button>
  </div>
  <section id="tab-pedido"></section>
  <section id="tab-vinculos" hidden></section>
  <section id="tab-pedidos" hidden></section>
  <section id="tab-expedicao" hidden></section>
  <section id="tab-regras" hidden></section>
</div>
<div class="overlay" id="ov"><div class="modal" id="ov-body"></div></div>
<div class="overlay" id="ov2" style="z-index:60"><div class="modal" id="ov2-body"></div></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = (v, d = 0) => (v == null ? '–' : (+v).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }));
const fmtR = v => 'R$ ' + fmtN(v, 2);
const LOJAS = [1, 2, 3, 4, 5, 6];
const LOJAS_NOMES = { 1: 'CAHU', 2: 'MURIBECA', 3: 'PONTE', 4: 'ATACAREJO', 5: 'PORTA LARGA', 6: 'JARDIM JORDÃO' };
let ESTOPEN = new Set(), DADOS = null, EDITS = {}, SEL = new Set(), FILTRO = '', FLOJA = 0, VIS = {}, PEDIDOS = [], VINC = {}, VF = 'pendentes', SOQTD = 'qtd', ORDEM = 'az', SELINIT = false;

document.querySelectorAll('.tab').forEach(b => b.onclick = () => { document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b)); ['pedido', 'vinculos', 'pedidos', 'expedicao', 'regras'].forEach(t => $('#tab-' + t).hidden = t !== b.dataset.tab); if (b.dataset.tab === 'pedido' && DADOS) carregar(false); if (b.dataset.tab === 'expedicao') carregarExpedicao().catch(e => alert(e.message)); });
carregarExpedicao().catch(() => {});
// aba deixada aberta (vínculo feito em outra janela, por exemplo): ao voltar pra ela, busca o estado atual do servidor
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && DADOS) { carregar(false); carregarVinculos().catch(() => {}); } });

async function api(url, opt) { const r = await fetch(url, opt); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; }

let RECALC = false;   // recálculo (~30 s no ERP) em curso: uma leitura simples não pode sobrescrever o aviso
async function carregar(refresh) {
  if (!refresh && RECALC) return;
  if (refresh) RECALC = true;
  $('#estado').innerHTML = refresh ? '<span class="calc">recalculando…</span>' : 'carregando…';
  try { DADOS = await api('/api/pedidos-cd' + (refresh ? '?refresh=1' : '')); }
  catch (e) {
    if (refresh) RECALC = false;
    $('#estado').innerHTML = '<span class="neg">' + e.message + '</span>';
    // o recálculo falhou (ERP fora, serviço reiniciado no meio): mostra pelo menos o estado atual do servidor em vez de ficar com a tela velha
    if (refresh) setTimeout(() => carregar(false), 3000);
    return;
  }
  if (refresh) RECALC = false;
  aplicarVinculos();
  const es = DADOS.estado;
  const avisos = es.avisos && es.avisos.length ? ` · <span class="neg">${es.avisos.length} aviso(s): ${esc(es.avisos.join('; '))}</span>` : '';
  $('#estado').innerHTML = es.status === 'calculando' || !es.atualizadoEm ? '<span class="calc">calculando… (até 1 min)</span>' : `dados de <b>${new Date(es.atualizadoEm).toLocaleString('pt-BR')}</b>${es.erro ? ' · <span class="neg">ERP indisponível: ' + esc(es.erro) + '</span>' : ''} · <b>${es.produtosCD}</b> produtos no CD${avisos}`;
  if (!es.atualizadoEm) setTimeout(() => carregar(false), 15000);
  renderPedido(); renderRegras();
  // não redesenha a aba Vínculos se alguém está digitando numa busca (o recarregamento automático de 15 s apagava a caixa e o resultado)
  const digitando = document.activeElement && document.activeElement.closest && document.activeElement.closest('.busca-un');
  if (!digitando) renderVinculos();
}
function cxDe(item, ln) { const k = item.codigoCD + '|' + ln; return k in EDITS ? EDITS[k] : item.lojas[ln].cx; }
function todosItens() { return DADOS ? DADOS.repor.concat(DADOS.novos) : []; }
function totCx(item) { return LOJAS.reduce((a, ln) => a + cxDe(item, ln), 0); }
function cobClass(item) {
  if (item.cdInsuficiente) return ['m-bad', 'CD insuficiente'];
  if (item.origem === 'novo') return ['m-warn', 'novo'];
  const c = item.coberturaTotal; if (c == null) return ['', '–'];
  if (c < 7) return ['m-bad', 'crítico'];
  const zeram = LOJAS.filter(ln => item.lojas[ln].zeraAntes);
  if (c < 14 || zeram.length) return ['m-warn', 'atenção' + (zeram.length ? ' · zera L' + zeram.join(' L') : '')];
  return ['m-good', 'normal'];
}
// Caixa padrão no mesmo modelo da Nova Cotação (Tiago, 29/09): sem caixa (ou "Cx 1") → campo "un/cx" na linha,
// Enter grava e pula pro próximo; com caixa → "Cx 27 ✎" pra corrigir. Grava no vínculo do CD (cd-vinculos.json).
// Tiago, 02/10: "vendemos nas lojas como unidade… no CD tou com elas em unidades" (pilhas) — caixa 1 DIGITADA À MÃO
// conta como definida (vende por unidade), igual à Cotação/Radar; só o "1" do cadastro ERP (ninguém confirmou) continua
// sendo tratado como caixa não informada.
function metaCx(item) {
  const v = VINC[item.codigoCD] || {};
  const upc = item.unPorCaixa;
  const unidadeConfirmada = v.status === 'confirmado' && v.confirmadoPor && v.confirmadoPor !== 'sistema' && v.unPorCaixa === 1;
  if (!(upc > 1) && !unidadeConfirmada) return `<span class="m-bad">sem caixa padrão · digite: <input type="text" inputmode="numeric" class="qtyinput cxin" data-cod="${item.codigoCD}" placeholder="un/cx" onchange="definirCaixaCD('${item.codigoCD}',this.value)" onkeydown="cxKeyCD(event,this)" onclick="event.stopPropagation()" title="Unidades por caixa do CD. Enter grava e vai pro próximo item sem caixa. Produto que vende por unidade (CD conta em unidade): digite 1."></span>${upc === 1 ? '<span class="mut" title="o cadastro do ERP diz 1 un/cx, o que costuma ser caixa não informada; se o produto vende por unidade mesmo, digite 1 pra confirmar">(ERP: 1)</span>' : ''}`;
  if (!(upc > 1)) return `<span>Cx 1 <a class="cxl" title="Vende por unidade (confirmado à mão). Clique pra corrigir se vier em caixa." onclick="event.stopPropagation();ajustarCaixaCD('${item.codigoCD}',1)">✎</a> <span class="mut">(vende por unidade · confirmada à mão)</span></span>`;
  const manual = v.confirmadoPor && v.confirmadoPor !== 'sistema' && v.unPorCaixaCadastro != null && v.unPorCaixa !== v.unPorCaixaCadastro;
  return `<span>Cx ${upc} <a class="cxl" title="Clique pra corrigir a caixa padrão (un/cx) deste produto" onclick="event.stopPropagation();ajustarCaixaCD('${item.codigoCD}',${upc})">✎</a> <span class="mut">(${manual ? 'corrigida à mão' : 'embalagem ERP'})</span></span>`;
}
var CX_PROX_CD = null;
function cdToast(t){ let e = document.getElementById('cd-toast'); if (!e) { e = document.createElement('div'); e.id = 'cd-toast'; e.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0E1626;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .2s'; document.body.appendChild(e); } e.textContent = t; e.style.opacity = '1'; clearTimeout(e._t); e._t = setTimeout(() => { e.style.opacity = '0'; }, 2500); }
function cxIrCD(alvo){ if (!alvo) return; alvo.focus(); alvo.select(); try { alvo.scrollIntoView({ block: 'center' }); } catch (e) {} }
function cxVizinhoCD(el, dir){ const L = Array.prototype.slice.call(document.querySelectorAll('.cxin')), k = L.indexOf(el); return k < 0 ? null : L[k + dir] || null; }
function cxKeyCD(ev, el){
  if (ev.key === 'ArrowDown') { ev.preventDefault(); cxIrCD(cxVizinhoCD(el, 1)); return; }
  if (ev.key === 'ArrowUp') { ev.preventDefault(); cxIrCD(cxVizinhoCD(el, -1)); return; }
  if (ev.key === 'Enter') { ev.preventDefault(); const v = String(el.value || '').trim(); if (!v) { cxIrCD(cxVizinhoCD(el, 1)); return; } const px = cxVizinhoCD(el, 1); CX_PROX_CD = px ? px.getAttribute('data-cod') : null; el.blur(); }
}
async function definirCaixaCD(cod, v){
  const upc = Math.round(parseFloat(String(v).replace(',', '.'))); if (!(upc >= 1)) return;
  let prox = CX_PROX_CD; CX_PROX_CD = null;
  if (!prox) { const el = document.querySelector('.cxin[data-cod="' + cod + '"]'), px = el ? cxVizinhoCD(el, 1) : null; prox = px ? px.getAttribute('data-cod') : null; }
  const item = todosItens().find(i => i.codigoCD === cod) || {};
  const unidade = item.unidade || (VINC[cod] && VINC[cod].unidade) || cod;   // sem vínculo: o próprio código é a unidade (caso "igual")
  try {
    const r = await fetch('/api/pedidos-cd/vinculos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ codigoCD: cod, unidade, unPorCaixa: upc }) });
    const j = await r.json().catch(() => ({})); if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
    cdToast('Caixa de ' + upc + ' gravada pro produto ' + cod);
    await carregarVinculos();
  } catch (e) { alert('Erro ao gravar a caixa: ' + e.message); return; }
  const n = prox ? document.querySelector('.cxin[data-cod="' + prox + '"]') : null;
  cxIrCD(n || document.querySelector('.cxin'));
}
function ajustarCaixaCD(cod, atual){
  const item = todosItens().find(i => i.codigoCD === cod) || {};
  const v = prompt('Caixa padrão (unidades por caixa) de\n' + (item.descricaoCD || cod) + '\n\nHoje: ' + atual, atual); if (v === null) return;
  definirCaixaCD(cod, v);
}
// por que a loja não recebe nada deste item (Tiago, 08/10/26: "tem uma aba dos produtos que não foi sugerido") — mesma ideia
// do "⚠ não precisa" da Cotação: o motivo fica embaixo da caixinha zerada, e o filtro "não sugeridos" lista só esses itens
function motivoZero(item, L, ln) {
  if (L.transito > 0) { const partes = []; if (L.transitoCD > 0) partes.push(fmtN(L.transitoCD) + ' un do CD'); if (L.transitoForn > 0) partes.push(fmtN(L.transitoForn) + ' un de fornecedor (pedido de compra aberto no ERP)'); return { s: 'a caminho', c: 'i', t: 'já vem ' + partes.join(' + ') + ': não manda de novo até chegar' }; }
  if (item.origem === 'repor') {
    if (!(L.vq > 0)) return { s: 'sem venda', c: 'w', t: 'esta loja não vendeu o produto nos últimos 40 dias nem no histórico de 24 meses' };
    const alvo = DADOS && DADOS.regras && DADOS.regras.lojas[ln] ? DADOS.regras.lojas[ln].alvoLista : null;
    return null;   // cobertura acima do alvo: a linha "v/dia · cob" já mostra
  }
  if (item.semVinculo || item.origem === 'novo') return { s: 'já foi', c: 'w', t: 'produto novo: esta loja já recebeu a caixa de experiência (pedido recebido/finalizado) ou o CD não tem caixa sobrando pra ela' };
  return null;
}
function linha(item, lojasCols, idx) {
  lojasCols = lojasCols || LOJAS;
  const tot = totCx(item); const upc = item.unPorCaixa || 0; const cod = item.codigoCD;
  const [cc, ct] = cobClass(item);
  const pendLojas = LOJAS.filter(ln => item.lojas[ln].pendenciaAnterior);
  const transito = LOJAS.reduce((a, ln) => a + (item.lojas[ln].transito || 0), 0);
  const transCD = LOJAS.reduce((a, ln) => a + (item.lojas[ln].transitoCD || 0), 0), transForn = LOJAS.reduce((a, ln) => a + (item.lojas[ln].transitoForn || 0), 0);
  const estLojas = LOJAS.reduce((a, ln) => a + (item.lojas[ln].est || 0), 0);
  const sel = SEL.has(cod);
  const br = d => String(d || '').split('-').reverse().slice(0, 2).join('/');
  // 1ª linha embaixo do nome: código do CD · vínculo (código e descrição da unidade que a loja vende)
  // CD numa linha (código + descrição do cadastro do CD) e LOJA na outra (código + descrição da unidade vinculada) — Tiago, 08/10/26
  const linhaCD = `<div class="pp-l"><span class="tag" title="código e descrição no cadastro do CD (caixa)">CD</span><div><b>${esc(item.descricaoCD)}</b><span class="cod">${cod}</span></div></div>`;
  const linhaLoja = `<div class="pp-l loja"><span class="tag" title="código e descrição da unidade que a loja vende (vínculo caixa → unidade)">LOJA</span><div>${item.unidade ? (item.unidade === cod ? `<span class="mut">mesmo código do CD</span>` : `<span class="nm">${esc(item.descricaoUn || '')}</span><span class="cod">${item.unidade}</span>`) : `<span class="m-bad">sem vínculo · <a onclick="event.stopPropagation();irVinculo('${cod}')">vincular</a></span>`}</div></div>`;
  // 2ª linha: selos e avisos
  const flags = [];
  if (item.origem === 'repor') {
    // "em venda desde … · venda/dia por N d" saiu da tela (Tiago, 08/10/26: "essa informação não precisa"); a conta continua a mesma
    if (item.vendaAntiga) flags.push(`<span class="m-warn" title="nenhuma loja vendeu nos últimos 40 dias (ficou em falta); venda/dia = média dos meses com venda nos últimos 24 meses">sem venda há 40+ d · média de ${item.vendaAntiga.meses} meses (últ. ${br(item.vendaAntiga.ultimo)})</span>`);
  } else {
    flags.push(item.aguardaRecalculo ? `<span class="pill p-breve" title="vínculo confirmado agora; venda/dia e cobertura aparecem quando o recálculo terminar (≈ 30 s) ou no ↻ Recalcular">vinculado · calculando venda…</span>` : item.jaChegouLoja ? `<span class="pill p-flag" title="já chegou em alguma loja; venda/cobertura só aparecem depois de vincular o produto">sem venda ainda</span>` : `<span class="pill p-flag" title="sem venda nas lojas: 1 caixa por loja, entra como produto novo">produto novo</span>`);
    if (item.estoqueParado) flags.push(`<span class="m-bad" title="a loja tem esse estoque no ERP mas não registrou venda (últimos 40 dias nem histórico de 24 meses): confira no ERP ou pergunte na loja se o produto existe mesmo; se não existir, zere no ERP. A caixa continua sugerida.">estoque parado: ${item.estoqueParado.map(x => 'L' + x.ln + ' ' + fmtN(x.est) + ' un').join(' · ')} · conferir no ERP/loja</span>`);
  }
  if (item.cdInsuficiente) flags.push(`<span class="m-bad">faltam ${item.faltaCx} cx no CD</span>`);
  if (pendLojas.length) flags.push(`<span class="m-warn" title="${pendLojas.map(ln => 'L' + ln + ': faltaram ' + item.lojas[ln].pendenciaAnterior.faltaCx + ' cx no pedido #' + item.lojas[ln].pendenciaAnterior.pedidoId + ' (nota já fechada, não vai chegar)').join(' · ')}">pendência CD: L${pendLojas.join(' L')}</span>`);
  const meta2 = flags.length ? `<div class="pp-meta">${flags.join('')}</div>` : '';
  // 3ª linha: estoque nas lojas · cobertura · venda/dia (igual à Cotação)

async function verificarPallet(id, idx) { await api('/api/expedicao/verificar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, idx }) }); await carregarExpedicao(); }
function renderExpedicao() {
  const pend = EXP.pendencias.filter(p => !p.verificado); $('#n-exp').textContent = pend.length;
  const abertas = EXP.fechadas.filter(c => c.status !== 'fechada'), fechadas = EXP.fechadas.filter(c => c.status === 'fechada');
  const linhasP = EXP.pendencias.length ? EXP.pendencias.map(p => `<tr class="${p.verificado ? '' : 'open'}"><td>${dh(p.em)}</td><td>#${esc(p.nPedido)}</td><td class="lc">${esc(p.cliente)}</td><td class="lc">${esc(p.descricao)}<div class="s2">${esc(p.cod)}${p.fora ? ' · fora do pedido' : ' · a mais'}</div></td><td class="r neg">${fmtN(p.un, 0)} un</td><td class="r">${fmtN(p.antes, 0)} → ${fmtN(p.depois, 0)}</td><td>${esc(p.lote || '–')}</td><td class="lc">${esc(p.motivo || '–')}</td><td>${esc(p.nome)}</td><td>${p.verificado ? `<span class="pill p-ok">verificado</span><div class="s2">${esc(p.verificado.nome)} · ${dh(p.verificado.em)}</div>` : `<button class="btn" onclick="verificarPallet('${esc(p.id)}',${p.idx})">Verifiquei o pallet</button>`}</td></tr>`).join('') : '<tr><td colspan="10" class="mut">Nenhuma retirada registrada no período.</td></tr>';
  const todas = [...abertas, ...fechadas];
  const linhasC = todas.length ? todas.map(c => `<tr><td>${dh(c.abertoEm)}</td><td>#${esc(c.nPedido)}</td><td class="lc">${esc(c.cliente)}</td><td>${esc(c.nome)}</td><td class="r">${c.produtos}/${c.produtos_pedido}</td><td class="r">${c.tentativas}</td><td class="r ${c.pendentesVerificar ? 'neg' : ''}">${c.tirados}${c.pendentesVerificar ? ' (' + c.pendentesVerificar + ' a verificar)' : ''}</td><td>${c.status === 'fechada' ? `<span class="pill p-ok">fechado 100 %</span><div class="s2">${esc(c.fechadoPor || '')} · ${dh(c.fechadoEm)}</div>` : '<span class="pill p-breve">em conferência</span>'}</td><td>${c.status !== 'fechada' ? '–' : c.erpErro ? `<span class="neg" title="${esc(c.erpErro)}">erro</span>` : '<span class="pos">espelhado</span>'}</td></tr>`).join('') : '<tr><td colspan="9" class="mut">Nenhuma conferência de saída no período.</td></tr>';
  const opts = [1, 3, 7, 15, 30].map(d => `<option value="${d}" ${d === EXPDIAS ? 'selected' : ''}>${d} dia${d > 1 ? 's' : ''}</option>`).join('');
  $('#tab-expedicao').innerHTML = `<div class="busca-row"><span class="contagem">Conferência cega de saída no coletor do CD · últimos <select onchange="EXPDIAS=+this.value;carregarExpedicao()">${opts}</select></span><button class="btn btn-sec" onclick="carregarExpedicao()">↻ Atualizar</button></div>
    <h3 style="font-size:13px;margin:6px 0 8px">Verificar pallet <span class="s2" style="display:inline">produto tirado da coletagem no coletor — conferir se saiu mesmo do pallet</span></h3>
    <div class="table-wrap"><table class="main-t"><thead><tr><th>Quando</th><th>Pedido</th><th>Cliente</th><th>Produto</th><th class="r">Tirou</th><th class="r">Antes → depois</th><th>Lote</th><th>Motivo</th><th>Quem</th><th>Situação</th></tr></thead><tbody>${linhasP}</tbody></table></div>
    <h3 style="font-size:13px;margin:6px 0 8px">Pedidos conferidos na saída</h3>
    <div class="table-wrap"><table class="main-t"><thead><tr><th>Aberto</th><th>Pedido</th><th>Cliente</th><th>Conferente</th><th class="r">Produtos</th><th class="r">Tentativas</th><th class="r">Retiradas</th><th>Situação</th><th>ERP teste</th></tr></thead><tbody>${linhasC}</tbody></table></div>`;
}

const DIAS_SEM = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
function renderRegras() {
  if (!DADOS?.regras) return; const r = DADOS.regras; const cfg = DADOS.regras;
  const dias = r.diasPedido || [1];
  $('#tab-regras').innerHTML = `<div class="filtros"><div class="fg"><label title="quantos dias de venda a loja deve ter depois do pedido; lead e segurança já estão dentro. Limitado ao teto">Cobertura alvo (dias)</label><input type="number" id="cfg-cobertura" value="${r.cobertura || ''}" min="2" max="90" placeholder="lead+seg+ciclo"></div><div class="fg"><label>Teto (dias)</label><input type="number" id="cfg-teto" value="${r.teto}" min="3" max="90"></div><div class="fg"><label title="dias da semana em que as lojas fecham pedido pro CD; o ciclo da sugestão vira o intervalo até o próximo pedido">Dias de pedido</label><div id="cfg-dias" style="display:flex;gap:8px;flex-wrap:wrap;padding-top:4px">${DIAS_SEM.map((n, i) => `<label class="chk-pend"><input type="checkbox" value="${i}" ${dias.includes(i) ? 'checked' : ''}> ${n.slice(0, 3)}</label>`).join('')}</div></div><div class="fg"><label>Ciclo</label><input value="${r.ciclo} dias (${DIAS_SEM[new Date(r.proximoPedido + 'T12:00:00').getDay()]} → próximo pedido)" disabled title="intervalo entre o próximo pedido e o seguinte"></div><div class="fg"><label>Validade</label><input value="60% do cadastro" disabled></div><div class="fg"><label>WhatsApp do CD</label><input id="cfg-whats" placeholder="DDD + número" title="pra quem vai o link dos pedidos"></div><div class="fg"><label title="dias úteis que o CD tem pra digitar o pedido antes de avisar">Aviso: CD não digitou (d. úteis)</label><input type="number" id="cfg-prazoCD" min="0" max="60" style="width:70px"></div><div class="fg"><label title="dias depois da NF do CD sem entrada na loja">Aviso: loja sem entrada (dias)</label><input type="number" id="cfg-prazoEntrada" min="0" max="60" style="width:70px"></div><div class="fg"><label title="dias liberado no CD sem nota antes de avisar (expira aos 30)">Aviso: liberado sem nota (dias)</label><input type="number" id="cfg-prazoAvisoNota" min="0" max="60" style="width:70px"></div><button class="btn btn-amber" onclick="salvarCfg()">Salvar</button></div>
  <div class="table-wrap"><table class="main-t"><thead><tr><th>Loja</th><th class="r">Lead médio (d)</th><th class="r">Lead máx</th><th class="r">Amostras</th><th class="r">Segurança</th><th class="r">Ponto</th><th class="r">Alvo</th><th class="c" title="Código de cliente da loja no cadastro de fornecedores do ERP. O CNPJ desse cadastro é usado junto, porque desde 03/09/2026 o Televendas grava o CNPJ no painel">Cliente no painel do CD (código; CNPJ do cadastro entra junto)</th></tr></thead><tbody>
  ${LOJAS.map(ln => { const L = r.lojas[ln]; return `<tr><td><b>L${ln}</b> ${L.nome}</td><td class="r">${L.lead ? L.lead.lead_medio : '<span class="mut">padrão</span>'}</td><td class="r">${L.lead ? L.lead.lead_max : '–'}</td><td class="r">${L.lead ? L.lead.n : 0}</td><td class="r">${L.seg}</td><td class="r">${L.ponto}</td><td class="r">${L.alvoLista}</td><td class="c"><input class="cx" style="width:80px" id="cli-${ln}" data-ln="${ln}"></td></tr>`; }).join('')}
  </tbody></table></div><p class="mut" style="font-size:11px">Lead = dias entre o pedido da loja no painel de expedição do CD e a nota de entrada do fornecedor do CD na loja (6 meses). Alvo = ${r.cobertura ? `cobertura alvo de ${r.cobertura} dias (lead e segurança já dentro; nunca abaixo de ponto + 1)` : `lead + segurança + ciclo (${r.ciclo} agora: dias até o próximo dia de pedido)`}, limitado ao teto. Fornecedor do CD nas notas: <span id="cfg-forn"></span>.</p>`;
  api('/api/pedidos-cd/config').then(c => { CFGCD = c; for (const ln of LOJAS) $('#cli-' + ln).value = c.clientesLoja[ln] || ''; $('#cfg-forn').textContent = c.fornecedorCD; $('#cfg-whats').value = c.whatsCD || ''; for (const k of ['prazoCD', 'prazoEntrada', 'prazoAvisoNota']) { const el = $('#cfg-' + k); if (el) el.value = c[k] ?? ''; } });
}
async function salvarCfg() {
  const clientesLoja = {}; for (const ln of LOJAS) { const v = $('#cli-' + ln).value.trim(); if (v) clientesLoja[ln] = +v; }
  try { await api('/api/pedidos-cd/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ teto: +$('#cfg-teto').value, cobertura: +$('#cfg-cobertura').value || null, diasPedido: [...document.querySelectorAll('#cfg-dias input:checked')].map(x => +x.value), clientesLoja, whatsCD: $('#cfg-whats').value, prazoCD: +$('#cfg-prazoCD').value, prazoEntrada: +$('#cfg-prazoEntrada').value, prazoAvisoNota: +$('#cfg-prazoAvisoNota').value }) }); carregar(true); } catch (e) { alert(e.message); }
}
carregar(false);
carregarVinculos().catch(e => alert(e.message));
{ const t = new URLSearchParams(location.search).get('tab'); if (t) { const b = document.querySelector('[data-tab=' + t + ']'); if (b) b.click(); } }
carregarPedidos().catch(e => alert(e.message));
