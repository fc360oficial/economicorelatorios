<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/design-system.css">
<script src="/nav.js" defer></script>
<script src="/gente-ui.js"></script>
<title>Contratos e Histórico Funcional — DP / RH · Econômico Supermercados</title>
<!-- DP / RH › Contratos e Histórico Funcional (12/11/2026). Painel de alertas, contratos de experiência (30 + 60, até 90 dias),
     ficha individual (contrato, atestados, advertências, suspensões, faltas, documentos, auditoria). Serviço em
     lib/historico-funcional.js, rotas /api/historico-funcional/*. Mesma casca e mesmo CSS-base do Gerador de Escalas. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--font);background:var(--pap);color:var(--ink);min-height:100vh;font-size:13px}
.content{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:58px;background:var(--crd);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:40}
.topbar h1{font-size:16px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}.topbar h1 .crumb{color:var(--ink3);font-weight:600}.topbar h1 .ds-ic{color:var(--ink3)}
.topbar p{font-size:11.5px;color:var(--ink3);margin-top:1px}.topbar .end{margin-left:auto;display:flex;align-items:center;gap:12px}
.who{display:flex;align-items:center;gap:9px;font-size:12px}.who .ds-avatar{background:#101B33;color:#FFC933}.who b{display:block;font-size:12.5px}.who span{color:var(--ink3);font-size:11px}
.modnav{background:var(--crd);border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;align-items:stretch;padding:0 14px;position:sticky;top:58px;z-index:39}
.modnav a{display:flex;align-items:center;gap:6px;padding:0 12px;height:42px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;user-select:none;text-decoration:none}
.modnav a .ds-ic{width:15px;height:15px;color:var(--ink3)}.modnav a:hover{color:var(--ink)}.modnav a.on{color:var(--ink);border-bottom-color:var(--am)}.modnav a.on .ds-ic{color:var(--amk)}.modnav a.ext{margin-left:auto;color:var(--ink3)}
.modnav a small{background:var(--neg);color:#fff;border-radius:9px;font-size:10px;padding:1px 6px;font-weight:800}
.page{padding:20px 24px 40px;max-width:1700px;width:100%}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:9px 10px;margin-bottom:16px}
.tb .ds-input,.tb .ds-select{height:34px;font-size:12.5px}.tb .end{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tb .lbl{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px}
.aviso{background:var(--amw);border:1px solid var(--am-ln);color:var(--amk);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.5}.aviso.neg{background:var(--negw);border-color:#F1B9C3;color:var(--neg)}.aviso.inf{background:var(--infw);border-color:var(--inf);color:var(--inf)}.aviso.pos{background:var(--posw);border-color:#9AD9B5;color:var(--pos)}
.note{font-size:11.5px;color:var(--ink3);line-height:1.5;margin:10px 2px 0}
.empty{padding:36px 20px;text-align:center;color:var(--ink3);font-size:12.5px;background:var(--crd);border:1px dashed var(--ln2);border-radius:var(--r-lg)}.empty b{display:block;color:var(--ink2);font-size:13.5px;margin-bottom:3px}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--wsh) 25%,var(--ln) 50%,var(--wsh) 75%);background-size:200% 100%;animation:sk 1.3s ease infinite;margin:10px 14px}@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--posw);color:var(--pos)}.pill.bad{background:var(--negw);color:var(--neg)}.pill.warn{background:var(--amw);color:var(--amk)}.pill.info{background:var(--infw);color:var(--inf)}.pill.gr{background:var(--wsh);color:var(--ink2)}
.etq{display:inline-block;background:#101B33;color:#FFC933;font-weight:800;font-size:10px;padding:2px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}.etq.cd{background:var(--inf);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--ln2);background:var(--crd);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer;user-select:none;white-space:nowrap}.chip.on{background:#101B33;color:#FFC933;border-color:#101B33}.chip small{opacity:.75;margin-left:3px}.chip.neg small{color:var(--neg);opacity:1}.chip.on.neg small{color:#FFB4C0}
/* unidades simuladas */
.uns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
.un{background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:10px}.un.on{border-color:#101B33;box-shadow:0 0 0 2px #101B33}
.un .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.un .hd b{font-size:14px}
.un .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px}.un .nums div{text-align:center;background:var(--wsh);border-radius:8px;padding:7px 4px}.un .nums b{display:block;font-size:18px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}.un .nums span{font-size:9.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.3px;font-weight:700;line-height:1.2;display:block}
.un .nums b.neg{color:var(--neg)}.un .nums b.pos{color:var(--pos)}.un .nums b.am{color:var(--amk)}
.un ul{list-style:none;display:grid;gap:5px}.un li{font-size:12px;line-height:1.4;padding-left:14px;position:relative;color:var(--ink2)}.un li::before{content:'';position:absolute;left:2px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--neg)}.un li.inf::before{background:var(--ink3)}
.un .bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.un .gs{font-size:11.5px;color:var(--ink2);border-top:1px solid var(--ln);padding-top:8px;display:grid;gap:5px}.un .gs div{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.un .gs a{color:var(--inf);font-weight:700;cursor:pointer}
/* grade (mesma da Escala coletiva) */
.cal{overflow:auto;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg)}
table.cal{border-collapse:separate;border-spacing:2px;font-size:11px;background:var(--crd)}table.cal th{position:sticky;top:0;background:#101B33;font-size:9.5px;color:#fff;font-weight:800;padding:6px 3px;text-align:center;white-space:nowrap;z-index:1;line-height:1.25;border-radius:4px}
table.cal th small{display:block;font-weight:600;color:rgba(255,255,255,.75);font-size:9px}
table.cal th.fds{background:#FFC933;color:#14213D}table.cal th.fds small{color:#14213D}table.cal th.dom{background:#F7A325}table.cal th.fer{background:var(--neg);color:#fff}table.cal th.fer small{color:rgba(255,255,255,.8)}
table.cal th.n,table.cal td.n{text-align:left;position:sticky;left:0;background:var(--crd);z-index:2;min-width:200px;padding:5px 10px;border-radius:4px}table.cal th.n{background:#101B33;font-size:11.5px}
table.cal td.n b{display:block;color:var(--ink);font-weight:700;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;font-size:10.5px}table.cal td.n span{display:block;font-size:10px;color:var(--ink3);white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}
table.cal td{text-align:center;padding:3px 1px;min-width:40px;height:38px;vertical-align:middle;font-variant-numeric:tabular-nums;line-height:1.15;font-size:10.5px;border-radius:4px;background:var(--wsh)}
table.cal td.d{color:#14213D;font-weight:700}table.cal td.alt{box-shadow:inset 0 0 0 2px var(--inf)}table.cal td.fer{border-top:3px solid var(--neg)}table.cal td.vz{color:var(--ink3);background:transparent;font-weight:500}
table.cal td .a{display:block;font-size:9px;font-weight:500;color:#4A5370}table.cal td.folga{color:#6B7280;font-weight:800}table.cal td.ferias,table.cal td.afastado{color:#4C3D8F;font-weight:800}table.cal td.rot{color:#14213D;background:#D9D9D4}
table.cal td.tot{font-weight:800;text-align:center;padding:0 10px;background:#101B33;color:#fff;font-size:11.5px}
.cal-leg{display:flex;flex-wrap:wrap;gap:8px 22px;padding:10px 12px;font-size:11px;color:var(--ink2);border-top:1px solid var(--ln);background:var(--crd)}.cal-leg>span{display:flex;align-items:center;gap:7px}.cal-leg i{width:22px;height:14px;border-radius:4px;flex:none;display:inline-block}
.cal-leg b{display:block;color:var(--ink);font-size:11px}.cal-leg small{display:block;color:var(--ink3);font-size:10px}.cal-leg i.altx{background:var(--crd);box-shadow:inset 0 0 0 2px var(--inf)}.cal-leg i.ferx{background:var(--wsh);border-top:3px solid var(--neg)}
/* Etapa 4: legenda fixa embaixo da grade (acompanha a rolagem), início da semana marcado no cabeçalho, faixa de validação da semana em cada célula e bolinha por pessoa */
.cal-w{border:1px solid var(--ln);border-radius:var(--r-lg);background:var(--crd)}.cal-w>.cal{border:0;border-radius:var(--r-lg) var(--r-lg) 0 0}.cal-w>.cal-leg{position:sticky;bottom:0;z-index:4;border-radius:0 0 var(--r-lg) var(--r-lg);box-shadow:0 -4px 12px rgba(16,27,51,.10)}
table.cal th.seg{box-shadow:inset 3px 0 0 #FFC933}table.cal th.fds.seg{box-shadow:inset 3px 0 0 #101B33}
table.cal td.sx{box-shadow:inset 0 -4px 0 var(--neg)}table.cal td.sr{box-shadow:inset 0 -4px 0 #E0A100}table.cal td.alt.sx{box-shadow:inset 0 0 0 2px var(--inf),inset 0 -6px 0 var(--neg)}table.cal td.alt.sr{box-shadow:inset 0 0 0 2px var(--inf),inset 0 -6px 0 #E0A100}
table.cal td.n span i.vd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--pos)}table.cal td.n span i.vd.bad{background:var(--neg)}table.cal td.n span i.vd.warn{background:#E0A100}
.cal-leg i.sxx{background:var(--wsh);box-shadow:inset 0 -4px 0 var(--neg)}.cal-leg i.srx{background:var(--wsh);box-shadow:inset 0 -4px 0 #E0A100}
.val52{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2);padding:9px 12px;border:1px solid var(--ln);border-radius:var(--r-lg);background:var(--crd);margin-bottom:10px}.val52 b{color:var(--ink)}.val52 .pill{margin-right:5px}
td.sem{cursor:pointer}td.sem.cz{background:#E4E4E1;color:#4B5563}
/* Etapa 7 · Configurações avançadas: interruptor + ícone ⓘ discreto com a fundamentação legal (passar o mouse, foco do teclado ou toque) */
.adv{display:flex;gap:14px;align-items:flex-start;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:16px}
.adv .tx{position:relative;flex:1;min-width:0}.adv .tx b{font-size:13.5px;color:var(--ink)}.adv .tx>small{display:block;color:var(--ink3);font-size:11.5px;line-height:1.5;margin-top:4px}
.sw{position:relative;display:inline-block;width:40px;height:22px;flex:none;margin-top:1px}.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}.sw input:disabled{cursor:not-allowed}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--ln2);transition:background .15s}.sw i::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+i{background:#101B33}.sw input:checked+i::after{transform:translateX(18px);background:#FFC933}.sw input:focus-visible+i{box-shadow:0 0 0 3px var(--infw)}.sw input:disabled+i{opacity:.55}
.tipw{display:inline-block}.tipw .ico{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;margin-left:6px;border-radius:50%;border:1.5px solid var(--ink3);background:transparent;color:var(--ink3);font:italic 700 11px/1 Georgia,'Times New Roman',serif;cursor:pointer;padding:0;vertical-align:1px}
.tipw .ico:hover,.tipw .ico:focus-visible,.tipw.open .ico{border-color:var(--inf);color:var(--inf);outline:none;box-shadow:0 0 0 3px var(--infw)}
.tipw .tip{display:none;position:absolute;left:0;top:24px;z-index:30;width:min(430px,calc(100vw - 56px));background:#101B33;color:#fff;border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.5;font-weight:400;box-shadow:0 14px 40px rgba(0,0,0,.35);text-align:left}
.tipw .tip::before{content:'';position:absolute;left:0;right:0;top:-10px;height:10px}.tipw:focus-within .tip,.tipw.open .tip{display:block}@media (hover:hover){.tipw:hover .tip{display:block}}   /* em tela de toque o :hover "gruda" depois do toque: lá quem abre e fecha é o toque (classe .open) */
.tipw .tip strong{display:block;color:#FFC933;font-size:12.5px;margin-bottom:6px}.tipw .tip q{display:block;font-style:italic;border-left:3px solid #FFC933;padding-left:9px;margin:0 0 8px;quotes:'“' '”'}.tipw .tip p{margin:0 0 7px;color:#D9DEEA}.tipw .tip p b{color:#fff;font-size:12px}
.tipw .tip a{color:#9CC8FF;font-weight:700;word-break:break-all}.tipw .tip .lk{margin:0;padding-top:7px;border-top:1px solid rgba(255,255,255,.18)}
@media(max-width:820px){.adv{padding:12px}.tipw .tip{width:calc(100vw - 110px);min-width:230px}}
/* Etapa 6: uma bolinha por semana (segunda → domingo) embaixo das horas — válida, pendente, bloqueada ou excepcional */
table.cal td.tot .wk{display:flex;gap:2px;justify-content:center;margin-top:3px}table.cal td.tot .wk i{width:7px;height:7px;border-radius:50%;cursor:pointer;background:#2FBF71}table.cal td.tot .wk i.amarelo{background:#FFC933}table.cal td.tot .wk i.vermelho{background:#FF5C6C}table.cal td.tot .wk i.cinza{background:#9CA3AF}
@media (max-width:1399px){table.cal td.tot .wk i{width:6px;height:6px}table.cal td.tot .wk{gap:1px}}
/* Etapa 5 · motor de validação semanal: indicador por funcionário e semana (verde / amarelo / vermelho / cinza) e o detalhe da semana */
.niv{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}.niv.verde{background:var(--pos)}.niv.amarelo{background:#E0A100}.niv.vermelho{background:var(--neg)}.niv.cinza{background:#9CA3AF}
table.cal td.sg{box-shadow:inset 0 -4px 0 #9CA3AF}table.cal td.alt.sg{box-shadow:inset 0 0 0 2px var(--inf),inset 0 -6px 0 #9CA3AF}.cal-leg i.sgx{background:var(--wsh);box-shadow:inset 0 -4px 0 #9CA3AF}table.cal td.n span i.vd.cz{background:#9CA3AF}table.cal td[data-pw]{cursor:pointer}
.sd7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.sd7>div{border:1px solid var(--ln);border-radius:8px;padding:6px 3px;text-align:center;background:var(--wsh);line-height:1.3}.sd7 b{display:block;font-size:10px;color:var(--ink3);text-transform:uppercase;font-weight:700}.sd7 strong{display:block;font-size:12px;color:#14213D;font-variant-numeric:tabular-nums;margin:2px 0}.sd7 small{display:block;font-size:9.5px;color:#4A5370;min-height:12px}
.sd7>div.env{box-shadow:0 0 0 2px var(--neg)}.sd7>div.fora{border-style:dashed}.sd7>div.prot small{font-weight:700}
.vit{border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;display:grid;gap:3px;color:var(--ink2)}.vit b{color:var(--ink)}.vit small{color:var(--ink3);font-size:11px}.vit.bloqueio{border-left:4px solid var(--neg)}.vit.alerta{border-left:4px solid #E0A100}.vit.info{border-left:4px solid var(--ln2)}
.f-md .bd h4.st{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin:4px 0 -4px}.f-md .bd .tw{margin-bottom:0}.tur{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin:0 2px 10px}.tur i{display:inline-block;width:22px;height:14px;border-radius:4px;vertical-align:-3px;margin-right:6px}.tur b{color:var(--ink)}
table.t input.esp{width:100%;min-width:170px}
/* mesma régua da Escala coletiva: os 31 dias cabem sem rolagem em 1600/1366/1280 (as faixas apertam fonte e largura; nada some) */
table.cal{width:100%}table.hm{width:100%}
@media (max-width:1699px){table.cal td{min-width:34px;font-size:10px;padding:3px 0}table.cal td .a{font-size:8.5px}table.cal th.n,table.cal td.n{min-width:170px}table.cal td.n b{max-width:180px}table.cal td.n span{max-width:180px}table.cal th{font-size:9px;padding:5px 2px}table.cal td.tot{padding:0 6px;font-size:11px}.cal-leg{gap:6px 16px;padding:8px 10px}table.hm td{min-width:30px;font-size:10.5px}table.hm th.s,table.hm td.s{min-width:170px}}
@media (max-width:1399px){table.cal td{min-width:29px;font-size:9px}table.cal td .a{font-size:8px;line-height:1.1}table.cal th.n,table.cal td.n{min-width:150px;padding:4px 8px}table.cal td.n b{max-width:160px;font-size:10px}table.cal td.n span{max-width:160px;font-size:9.5px}table.cal th{font-size:8.5px;padding:4px 1px}table.cal th.n{font-size:10.5px}table.cal td.tot{padding:0 4px;font-size:10px}.cal-leg{font-size:10px}.cal-leg i{width:18px;height:12px}.tb .lbl{font-size:10px}table.hm td{min-width:26px;font-size:9.5px;height:30px}table.hm th{font-size:8.5px;padding:4px 1px}table.hm th.s,table.hm td.s{min-width:150px;padding:4px 8px}}
@media (max-width:1299px){table.cal td{min-width:26px;font-size:8.5px}table.cal td .a{font-size:7.5px}table.cal th.n,table.cal td.n{min-width:140px;padding:3px 6px}table.cal td.n b{max-width:150px}table.cal td.n span{max-width:150px}table.cal td.tot{padding:0 3px;font-size:9.5px}table.cal th{font-size:8px;padding:4px 0}.tb{gap:6px}.tb .ds-btn{padding-left:9px;padding-right:9px}table.hm td{min-width:24px;font-size:9px}table.hm th.s,table.hm td.s{min-width:135px}}
@media (max-width:1199px){table.cal td{min-width:26px;font-size:8.5px;height:34px}table.cal td .a{font-size:7.5px}table.cal th.n,table.cal td.n{min-width:130px;padding:3px 6px}table.cal td.n b{max-width:140px;font-size:9.5px}table.cal td.n span{max-width:140px;font-size:9px}table.cal th{font-size:8px}table.cal td.tot{font-size:9.5px}}
/* tabelas e blocos */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.kpi{background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:12px 14px;cursor:default}.kpi .l{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:3px;font-variant-numeric:tabular-nums}.kpi .s{font-size:11px;color:var(--ink3);margin-top:2px}.kpi.neg .v{color:var(--neg)}.kpi.pos .v{color:var(--pos)}.kpi.am .v{color:var(--amk)}
.tw{overflow:auto;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);margin-bottom:16px}
table.t{width:100%;border-collapse:collapse;font-size:12px}table.t th{text-align:left;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);padding:8px 10px;background:var(--wsh);font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:1}table.t td{padding:7px 10px;border-top:1px solid var(--ln);color:var(--ink2);vertical-align:middle;white-space:normal;line-height:1.4}table.t th.r,table.t td.r{text-align:right}table.t th.c,table.t td.c{text-align:center}

const resumoVal = v => v == null ? '—' : typeof v === 'object' ? Object.entries(v).filter(([, x]) => x != null && typeof x !== 'object').map(([k, x]) => k + ': ' + x).join(' · ') + (v.prorrogacao ? ' · prorrogação: ' + v.prorrogacao.situacao : '') + (v.desfecho ? ' · desfecho: ' + v.desfecho.tipo : '') : String(v);

  const ov = document.createElement('div'); ov.className = 'f-ov';
  ov.innerHTML = '<div class="f-md" style="max-width:' + (largura || 640) + 'px"><div class="hd"><div><b>' + esc(titulo) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div><button class="x" type="button">×</button></div><div class="bd">' + corpo + '<div id="d-msg"></div><div class="acoes"><button class="ds-btn ds-btn-ghost" id="d-c" type="button">' + (ok ? 'Cancelar' : 'Fechar') + '</button>' + (ok ? '<button class="ds-btn ' + (perigo ? 'ds-btn-danger' : 'ds-btn-primary') + '" id="d-ok" type="button">' + esc(okTxt || 'Confirmar') + '</button>' : '') + '</div></div></div>';
  document.body.appendChild(ov); const fechar = () => ov.remove(); ov.querySelector('.x').onclick = fechar; ov.querySelector('#d-c').onclick = fechar;
  if (ok) ov.querySelector('#d-ok').onclick = async () => { const b = ov.querySelector('#d-ok'); b.disabled = true; try { await ok(ov); fechar(); } catch (e) { ov.querySelector('#d-msg').innerHTML = '<div class="aviso neg" style="margin:0">' + esc(e.message) + '</div>'; b.disabled = false; } };

const justCampo = (rot, min) => '<label>' + esc(rot || 'Justificativa') + ' <small>(obrigatória' + (min ? ', mínimo de ' + min + ' caracteres' : '') + ' — fica na auditoria com seu nome, data e hora)</small><textarea id="d-just" rows="3"></textarea></label>';

  const sec = (id, t, sub, corpo) => '<div class="sec" id="sec-' + id + '"><h2>' + t + '<small>' + sub + '</small></h2></div>' + corpo;

    '<p class="note">Alertas em ' + P.alertaDias.join(', ') + ' dia(s) antes de cada marco (término do período inicial e término final). O alerta fica aberto até a providência ser registrada na ficha; prorrogação nunca é presumida. Clique numa linha para abrir a ficha.</p>' +

    sec('proximos', 'Contratos próximos do vencimento', 'marco nos próximos ' + P.alertaDias[0] + ' dias', tabCt(P.proximos, 'Nenhum marco contratual nos próximos ' + P.alertaDias[0] + ' dias.')) +

    documentos: () => F.documentosErro ? '<div class="aviso">' + esc(F.documentosErro) + ' — os documentos ficam na Gestão Documental, com as permissões de lá.</div>' : F.documentos.pastas.map(x => '<div class="sec"><h2>' + esc(x.categoria + ' · ' + x.nome) + '<small>' + x.docs.length + ' documento(s)' + (x.abertos ? ' · ' + x.abertos + ' em conferência' : '') + (x.sensivel ? ' · pasta sensível' : '') + '</small></h2></div>' + (x.restrita ? '<div class="aviso inf" style="margin:0 0 8px">Pasta restrita ao RH e à Coordenação.</div>' : x.docs.length ? '<div class="tw"><table class="t"><thead><tr><th>Protocolo</th><th>Tipo</th><th>Data do documento</th><th>Situação</th><th>Arquivo</th></tr></thead><tbody>' + x.docs.map(d => '<tr><td class="nw"><b>' + esc(d.protocolo) + '</b></td><td>' + esc(d.tipo) + '</td><td class="nw">' + d1(d.dataDocumento) + '</td><td>' + esc(d.statusTxt) + '</td><td>' + esc(d.arquivo || '') + '</td></tr>').join('') + '</tbody></table></div>' : '')).join('') + '<p class="note">Os documentos são os do prontuário da <a href="/gestao-documental.html">Gestão Documental</a> (é lá que se envia, confere e abre o arquivo, com as permissões e a trilha de lá). O contrato de experiência e o termo de prorrogação ficam na pasta 02.</p>',
    auditoria: () => F.auditoria.length ? '<div class="tw" style="max-height:640px"><table class="t"><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Justificativa</th><th>Antes → depois</th></tr></thead><tbody>' + F.auditoria.map(r => '<tr><td class="nw">' + dt(r.em) + '</td><td><b>' + esc(r.nome) + '</b><small>' + esc(r.usuario) + '</small></td><td>' + esc(r.acaoTxt) + '<small>' + esc(r.ref || '') + ' · #' + r.seq + ' ' + esc(r.hash) + '</small>' + (r.nota ? '<small style="color:var(--neg)">' + esc(r.nota) + '</small>' : '') + '</td><td>' + esc(r.justificativa || '—') + '</td><td><small>' + esc(resumoVal(r.antes)) + '</small><small><b>→</b> ' + esc(resumoVal(r.depois)) + '</small></td></tr>').join('') + '</tbody></table></div>' : '<div class="empty" style="padding:16px">Nenhum registro de auditoria desta pessoa.</div>' };
  $('#page').innerHTML = '<div class="cab"><div><h2>' + esc(p.nome) + '</h2><p>' + esc(p.lojaTxt) + ' · ' + esc(p.cargo || '—') + (p.setor ? ' · ' + esc(p.setor) : '') + ' · matrícula ' + esc(p.matricula || '—') + ' · admissão ' + d1(p.admissao) + (p.ativo ? '' : ' · <b>desligado em ' + d1(p.desligamento) + '</b>') + '</p></div><div>' + nivelPill(K.situacao) + ' <a class="ds-btn ds-btn-ghost" id="f-volta">← voltar</a></div></div>' +
    '<div class="chips" style="margin-bottom:12px">' + ABAS.map(([i, t, n]) => '<span class="chip' + (ab === i ? ' on' : '') + '" data-ab="' + i + '">' + t + (n ? ' <small>' + n + '</small>' : '') + '</span>').join('') + '</div><div id="f-aba">' + corpo[ab]() + '</div>';
  $('#f-volta').onclick = () => ir('contratos'); $$('#page [data-ab]').forEach(ch => ch.onclick = () => { SUB.aba = ch.dataset.ab; ficha(id); });
  // contrato: ações do RH
  const A = { confirmar: () => acaoCt('confirmar', K.presumido ? 'Confirmar o contrato' : 'Alterar tipo e prazos', '<div class="row"><label>Tipo de contrato<select id="k-tipo">' + Object.entries(ME.tipos).map(([k, t]) => '<option value="' + k + '"' + (K.tipo === k ? ' selected' : '') + '>' + esc(t) + '</option>').join('') + '</select></label><label>Admissão<input type="date" id="k-adm" value="' + (K.admissao || '') + '"></label><label>Período inicial (dias)<input type="number" id="k-ini" value="' + K.diasIniciais + '"></label><label>Prorrogação (dias)<input type="number" id="k-pro" value="' + K.diasProrrogacao + '"></label></div><div class="aviso inf" style="margin:0">Padrão da empresa: ' + ME.config.diasIniciais + ' + ' + ME.config.diasProrrogacao + ' dias. O total nunca passa de ' + ME.maxLegal + ' dias. A admissão vem do ponto; mude só se o contrato trouxer outra data.</div>', ov => ({ tipo: ov.querySelector('#k-tipo').value, admissao: ov.querySelector('#k-adm').value, diasIniciais: +ov.querySelector('#k-ini').value, diasProrrogacao: +ov.querySelector('#k-pro').value })),
    prorrogacao: () => acaoCt('prorrogacao', 'Prorrogação do contrato de experiência', '<div class="row c2"><label>Situação<select id="k-sit">' + Object.entries(ME.prorrogacao).map(([k, t]) => '<option value="' + k + '"' + (K.prorrogacao.situacao === k ? ' selected' : '') + '>' + esc(t) + '</option>').join('') + '</select></label><label>Data da formalização <small>(se formalizada)</small><input type="date" id="k-form" value="' + (K.prorrogacao.formalizadaEm || '') + '"></label></div>' + docCampo('Documento da prorrogação') + '<div class="aviso" style="margin:0">Término inicial em ' + d1(K.terminoInicial) + '. A prorrogação precisa estar formalizada até essa data; formalizada, o contrato vai até ' + d1(K.finalComProrrogacao) + '. Só existe uma prorrogação por contrato.</div>', ov => ({ situacao: ov.querySelector('#k-sit').value, formalizadaEm: ov.querySelector('#k-form').value, documento: docDe(ov) })),
    ajustar: () => acaoCt('ajustar', 'Ajustar o término do contrato', '<div class="row c2"><label>Marco<select id="k-marco"><option value="inicial">término do período inicial (' + d1(K.terminoInicial) + ')</option><option value="final">término final (' + d1(K.finalComProrrogacao) + ')</option></select></label><label>Nova data <small>(vazio = voltar ao cálculo)</small><input type="date" id="k-nova"></label></div><label class="chk"><input type="checkbox" id="k-jur"><span>Declaro que a situação que altera o término (afastamento ou outra) foi validada juridicamente.</span></label>', ov => ({ marco: ov.querySelector('#k-marco').value, novaData: ov.querySelector('#k-nova').value || null, validacaoJuridica: ov.querySelector('#k-jur').checked })),
    desfecho: () => K.desfecho ? acaoCt('desfecho', 'Desfazer o desfecho', '<div class="aviso" style="margin:0">O contrato volta a ser acompanhado (alertas reabrem).</div>', () => ({ desfazer: true }), { perigo: true }) : acaoCt('desfecho', 'Desfecho do contrato de experiência', '<div class="row c2"><label>Desfecho<select id="k-des">' + Object.entries(ME.desfechos).map(([k, t]) => '<option value="' + k + '">' + esc(t) + '</option>').join('') + '</select></label><label>Data<input type="date" id="k-dd" value="' + ME.hoje + '"></label></div>' + docCampo('Documento (opcional)'), ov => ({ tipo: ov.querySelector('#k-des').value, data: ov.querySelector('#k-dd').value, documento: docDe(ov) })),
    esocial: () => acaoCt('esocial', 'Confirmar envio ao eSocial', '<div class="row c3"><label>Evento<select id="k-ev"><option value="admissao">admissão</option><option value="prorrogacao" selected>prorrogação (alteração contratual)</option><option value="desfecho">desfecho</option></select></label><label>Informado em <small>(vazio = retirar)</small><input type="date" id="k-inf"></label><label>Recibo<input id="k-rec"></label></div><div class="aviso inf" style="margin:0">Não há integração com o eSocial: este registro é a confirmação de quem transmitiu.</div>', ov => ({ evento: ov.querySelector('#k-ev').value, informadoEm: ov.querySelector('#k-inf').value || null, recibo: ov.querySelector('#k-rec').value })),
    responsaveis: () => acaoCt('responsaveis', 'Responsáveis pelo contrato', '<div class="row c2"><label>Responsável pela decisão<input id="k-rd" value="' + esc((K.responsaveis && K.responsaveis.decisao) || '') + '"></label><label>Responsável pela documentação<input id="k-rdoc" value="' + esc((K.responsaveis && K.responsaveis.documentacao) || '') + '"></label></div>', ov => ({ decisao: ov.querySelector('#k-rd').value, documentacao: ov.querySelector('#k-rdoc').value })) };
  $$('#f-aba [data-a]').forEach(b => b.onclick = () => A[b.dataset.a]());
  // ocorrências: lançar e decidir
  const novo = $('#o-novo'); const lancar = (t, dia, cl) => { dlg({ titulo: t === 'falta' ? 'Lançar falta' : 'Lançar atestado / afastamento', sub: p.nome, okTxt: 'Lançar', largura: 700,
    corpo: '<div class="row c3"><label>' + (t === 'falta' ? 'Dia da falta' : 'Início') + '<input type="date" id="o-de" value="' + (dia || '') + '"></label>' + (t === 'falta' ? '' : '<label>Fim<input type="date" id="o-ate"></label>') + '<label>Classificação<select id="o-cl">' + Object.entries(ME.classes[t]).map(([k, x]) => '<option value="' + k + '"' + (cl === k ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select></label></div>' + (t === 'atestado' ? '<label>Observação <small>(dado sensível: só RH e Jurídico veem)</small><input id="o-obs"></label>' : '') + docCampo() + (t === 'falta' ? '<label class="chk"><input type="checkbox" id="o-ci"><span>Se houver atestado apresentado no dia, declaro que ele foi analisado (necessário só para lançar como injustificada).</span></label>' : '') + justCampo(),
    ok: async ov => { await api('/api/historico-funcional/ocorrencias', { body: { funcId: p.id, tipo: t, data: ov.querySelector('#o-de').value, fim: ov.querySelector('#o-ate') ? ov.querySelector('#o-ate').value || ov.querySelector('#o-de').value : undefined, classificacao: ov.querySelector('#o-cl').value, obs: ov.querySelector('#o-obs') ? ov.querySelector('#o-obs').value : '', documento: docDe(ov), cienteAtestado: !!(ov.querySelector('#o-ci') && ov.querySelector('#o-ci').checked), justificativa: ov.querySelector('#d-just').value } }); toast('Ocorrência lançada'); recarregar(); } }); };
  if (novo) novo.onclick = () => lancar(novo.dataset.t);
  $$('#f-aba [data-ind]').forEach(a => a.onclick = () => lancar('falta', a.dataset.ind, a.dataset.ab === '1' ? 'justificada' : 'pendente'));
  $$('#f-aba [data-o]').forEach(a => a.onclick = () => { const x = a.dataset.x, oid = a.dataset.o; const T = { validar: 'Validar atestado', recusar: 'Recusar atestado', classificar: 'Classificar a falta', documento: 'Associar documento', cancelar: 'Cancelar ocorrência' };
    dlg({ titulo: T[x] + ' · ' + oid, sub: p.nome, okTxt: T[x].split(' ')[0], perigo: x === 'cancelar' || x === 'recusar', largura: 700,
      corpo: (x === 'classificar' ? '<label>Classificação<select id="o-cl"><option value="justificada">Justificada</option><option value="injustificada">Injustificada</option><option value="pendente">Pendente de análise</option></select></label><label class="chk"><input type="checkbox" id="o-ci"><span>Há atestado apresentado no dia? Para classificar como injustificada, declaro que o atestado foi analisado.</span></label>' : '') + (x === 'validar' || x === 'documento' || x === 'classificar' ? docCampo() : '') + (x === 'cancelar' ? '<div class="aviso" style="margin:0">A ocorrência não é apagada: fica cancelada, com a trilha.</div>' : '') + justCampo(),
      ok: async ov => { await api('/api/historico-funcional/ocorrencias/' + encodeURIComponent(oid), { body: { acao: x, classificacao: ov.querySelector('#o-cl') ? ov.querySelector('#o-cl').value : undefined, documento: ov.querySelector('#d-prot') ? docDe(ov) : undefined, cienteAtestado: !!(ov.querySelector('#o-ci') && ov.querySelector('#o-ci').checked), justificativa: ov.querySelector('#d-just').value } }); toast('Registrado'); recarregar(); } }); });
}

// ══ Auditoria e configuração ════════════════════════════════════════════════════════════════════════
async function auditoria() {
  let T; try { T = await api('/api/historico-funcional/auditoria'); } catch (e) { $('#page').innerHTML = erroBox(e); return; }
  $('#page').innerHTML = '<div class="aviso ' + (T.cadeia.ok ? 'pos' : 'neg') + '">' + (T.cadeia.ok ? '<b>Trilha íntegra.</b> ' + T.cadeia.registros + ' registro(s) encadeados por hash: apagar ou editar uma linha quebra a cadeia. Não existe comando de exclusão.' : '<b>ATENÇÃO: a cadeia de auditoria foi quebrada no registro ' + T.cadeia.quebradaEm + '.</b> Avise a Coordenação e a TI.') + '</div>' +
    (T.registros.length ? '<div class="tw" style="max-height:700px"><table class="t"><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Funcionário</th><th>Justificativa</th><th>Antes → depois</th></tr></thead><tbody>' + T.registros.map(r => '<tr><td class="nw">' + dt(r.em) + '</td><td><b>' + esc(r.nome) + '</b><small>' + esc(r.usuario) + '</small></td><td>' + esc(r.acaoTxt) + '<small>' + esc(r.ref || '') + ' · #' + r.seq + ' ' + esc(r.hash) + '</small>' + (r.nota ? '<small style="color:var(--neg)">' + esc(r.nota) + '</small>' : '') + '</td><td>' + esc(r.funcionario || '—') + '</td><td>' + esc(r.justificativa || '—') + '</td><td><small>' + esc(resumoVal(r.antes)) + '</small><small><b>→</b> ' + esc(resumoVal(r.depois)) + '</small></td></tr>').join('') + '</tbody></table></div>' + (T.total > T.registros.length ? '<p class="note">mostrando os ' + T.registros.length + ' mais recentes de ' + T.total + '</p>' : '') : '<div class="empty"><b>Nenhum registro ainda</b>Aqui aparecem as alterações de contrato, as decisões sobre ocorrências, os avisos de prazo e as leituras do ponto.</div>');
}
async function config() {
  const C = ME.config; const ed = ME.podeConfig;
  $('#page').innerHTML = '<div class="sec"><h2>Contrato de experiência — prazos padrão<small>valem para os contratos ainda não confirmados pelo RH</small></h2></div><div class="tb" style="margin-top:0"><span class="lbl">Período inicial (dias)</span><input class="ds-input" type="number" id="g-ini" style="width:90px" value="' + C.diasIniciais + '"' + (ed ? '' : ' disabled') + '><span class="lbl">Prorrogação (dias)</span><input class="ds-input" type="number" id="g-pro" style="width:90px" value="' + C.diasProrrogacao + '"' + (ed ? '' : ' disabled') + '><span class="lbl">Alertas (dias antes)</span><input class="ds-input" id="g-al" style="width:170px" value="' + C.alertaDias.join(', ') + '"' + (ed ? '' : ' disabled') + '>' + (ed ? '<div class="end"><button class="ds-btn ds-btn-primary" id="g-salvar">Salvar</button></div>' : '') + '</div>' +
    '<p class="note">Total máximo de ' + ME.maxLegal + ' dias e uma única prorrogação (CLT, art. 445, parágrafo único, e art. 451) — o sistema não aceita prazo acima disso. Os alertas valem para os dois marcos: término do período inicial e término final. O RH que atende a loja recebe todos; a Coordenação entra a partir de 5 dias e quando o prazo vence sem providência.</p>' +
    '<div class="sec"><h2>Leitura do ponto<small>afastamentos e faltas dos últimos ' + C.sincronizarDias + ' dias — só leitura</small></h2><div class="acoes">' + (ME.ehRH ? '<button class="ds-btn ds-btn-secondary" id="g-sync">Sincronizar agora</button>' : '') + '</div></div><div id="g-sync-r"><p class="note">O módulo lê o ponto uma vez por dia. Nada é gravado no ponto. Advertências e suspensões vêm da Gestão Disciplinar e os documentos, da Gestão Documental — sem cópia.</p></div>';
  if ($('#g-salvar')) $('#g-salvar').onclick = () => dlg({ titulo: 'Alterar os prazos padrão', okTxt: 'Salvar', corpo: justCampo(), ok: async ov => { ME.config = await api('/api/historico-funcional/config', { body: { diasIniciais: +$('#g-ini').value, diasProrrogacao: +$('#g-pro').value, alertaDias: $('#g-al').value.split(/[,;\s]+/).filter(Boolean).map(Number), justificativa: ov.querySelector('#d-just').value } }); toast('Prazos salvos'); config(); } });
  if ($('#g-sync')) $('#g-sync').onclick = async () => { const b = $('#g-sync'); b.disabled = true; b.textContent = 'Lendo o ponto…'; try { const r = await api('/api/historico-funcional/sincronizar', { body: {} }); $('#g-sync-r').innerHTML = '<div class="aviso ' + (r.erros.length ? '' : 'pos') + '">' + r.atestadosNovos + ' afastamento(s) novo(s), ' + r.atestadosAtualizados + ' atualizado(s) e ' + (r.indiciosDias || 0) + ' dia(s) sem marcação lidos como indício (não viram falta sozinhos)' + (r.naoIdentificados.length ? ' · ' + r.naoIdentificados.length + ' registro(s) do ponto sem funcionário identificado pelo nome: ' + esc(r.naoIdentificados.slice(0, 8).map(x => x.nome).join(', ')) : '') + (r.erros.length ? ' · erro: ' + esc(r.erros.join('; ')) : '') + '</div>'; } catch (e) { $('#g-sync-r').innerHTML = erroBox(e); } b.disabled = false; b.textContent = 'Sincronizar agora'; };
}
iniciar();
</script>
