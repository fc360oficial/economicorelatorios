<title>Auditoria da Folha — DP / RH · Econômico Supermercados</title>
<!-- DP / RH › Auditoria da Folha de Pagamento (27/10/2026). Auditoria pós-pagamento: a Coordenação importa o PDF do
     adiantamento e o da folha mensal, o módulo identifica cada funcionário no PontoCerto e cruza com os pagamentos nas
     contas Itaú das lojas; toda diferença vira divergência com protocolo, setor responsável e prazo. Regras em
     lib/auditoria-folha.js, rotas em lib/auditoria-folha-rotas.js. Mesma casca das telas do DP / RH; permissões da central

<style>

<body class="dsnav-pad">
<div class="content">
  <header class="topbar"><div><h1 id="tb-h1"><span class="crumb">DP / RH</span><svg class="ds-ic"><use href="/icons.svg#chevron-right"/></svg>Auditoria da Folha</h1><p id="tb-sub">Conciliação do adiantamento e da folha mensal com os pagamentos bancários (Itaú)</p></div><div class="end"><div class="who" id="who"></div></div></header>
  <div class="page" id="page"><div class="sk"></div><div class="sk" style="width:60%"></div></div>
</div>

<script>
const { $, $$, esc, api, toast } = G;
let ME = null, R = null, COMP = null, TAB = 'div';
const F = { loja: '', sit: '', busca: '', tipo: '', setor: '', dsit: '' };
const ic = n => '<svg class="ds-ic"><use href="/icons.svg#' + n + '"/></svg>';
const brl = n => (+n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num2 = n => n == null ? '—' : (+n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dBR = s => s ? String(s).slice(8, 10) + '/' + String(s).slice(5, 7) + '/' + String(s).slice(0, 4) : '—';
const dt = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') + ' ' + new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';
const lojaTxt = n => n ? ((ME.lojas.find(l => l.n === +n) || {}).txt || '—') : '—'; const lojaNome = n => n ? lojaTxt(n).split(' · ')[1] || lojaTxt(n) : '—';
const etq = n => n ? '<span class="etq' + (+n === 10 ? ' cd' : '') + '">' + esc(lojaTxt(n).split(' · ')[0]) + '</span>' : '<span class="etq" style="background:var(--wsh);color:var(--ink3)">—</span>';
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const erroBox = e => '<div class="aviso neg">' + esc(e.message || e) + '</div>';
const SIT_CLS = { aberta: 'bad', em_analise: 'info', aguardando_retorno: 'warn', resposta_recebida: 'info', resolvida: 'ok', improcedente: 'gr' };
const SITF_TXT = { pago: 'Pago', lote: 'Pago em lote', inferior: 'Valor inferior', superior: 'Valor superior', nao_pago: 'Não pago', nao_verificado: 'Não verificado (CD)' }; const SITF_CLS = { pago: 'ok', lote: 'info', inferior: 'bad', superior: 'bad', nao_pago: 'bad', nao_verificado: 'gr' };
// paleta categórica validada (dataviz) — ordem fixa por tipo
const CORES = ['#D99A00', '#3B6FB6', '#1E8E5A', '#8A4FD1', '#C9405A', '#7A8294'];
const compTxt = c => ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'][+c.slice(5, 7) - 1] + '/' + c.slice(0, 4);
function listaComp() { const s = new Set(ME.competencias.map(c => c.competencia)); const d = new Date(); for (let i = 0; i < 14; i++) { s.add(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')); d.setMonth(d.getMonth() - 1); } return [...s].sort().reverse(); }
function modal(html, cls) { fecharModal(); const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'ov'; ov.innerHTML = '<div class="bx ' + (cls || '') + '">' + html + '</div>'; ov.addEventListener('click', e => { if (e.target === ov) fecharModal(); }); document.body.appendChild(ov); $$('#ov .x').forEach(b => b.onclick = fecharModal); return ov; }
function fecharModal() { const o = $('#ov'); if (o) o.remove(); }
async function post(url, body) { return api(url, { body: body || {} }); }

async function iniciar() {

  const p = IMP.previa; const semCad = p.linhas.filter(l => !l.identificadoPor);
  $('#imp-bd').innerHTML = '<div class="resumo"><div><div class="l">Documento</div><div class="v">' + esc(p.tipoTxt) + '</div></div><div><div class="l">Linhas reconhecidas</div><div class="v">' + p.funcionarios + '</div></div><div><div class="l">Identificados no ponto</div><div class="v">' + p.identificados + '</div></div><div><div class="l">Sem cadastro</div><div class="v' + (p.semCadastro ? ' neg' : '') + '">' + p.semCadastro + '</div></div><div><div class="l">Total</div><div class="v">' + brl(p.total) + '</div></div></div>' +
    (p.avisos.length ? '<div class="aviso">' + p.avisos.map(esc).join('<br>') + '</div>' : '') + (semCad.length ? '<div class="aviso neg"><b>' + semCad.length + ' linha(s) não encontrada(s) no cadastro do PontoCerto</b> (nome, matrícula e CPF não bateram). Elas entram na auditoria com divergência "Funcionário sem cadastro no ponto" para o RH/DP conferir. Se o leitor pegou um nome errado, cancele e envie a planilha .xlsx.</div>' : '') +
    '<div class="tw" style="max-height:48vh"><table class="t"><thead><tr><th>#</th><th>Nome (documento)</th><th>Matrícula</th><th>CPF</th><th>Unidade</th><th>Setor</th><th class="r">Valores na linha</th><th class="r">Líquido</th><th>Identificado por</th></tr></thead><tbody>' +
    p.linhas.map(l => '<tr' + (l.identificadoPor ? '' : ' style="background:var(--negw)"') + '><td>' + l.n + '</td><td class="nm">' + esc(l.nome) + '<small title="' + esc(l.texto) + '">' + esc(l.texto.slice(0, 70)) + '</small></td><td>' + esc(l.matricula || '—') + '</td><td>' + esc(l.cpfFim || '—') + '</td><td>' + etq(l.loja) + esc(lojaNome(l.loja)) + '</td><td>' + esc(l.setor || '—') + '</td><td class="r" style="color:var(--ink3)">' + l.valores.map(num2).join(' · ') + '</td><td class="r"><b>' + num2(l.valor) + '</b></td><td>' + (l.identificadoPor ? '<span class="pill ok">' + ({ cpf: 'CPF', matricula: 'matrícula', nome: 'nome', nome_aproximado: 'nome aproximado' })[l.identificadoPor] + '</span>' : '<span class="pill bad">não encontrado</span>') + '</td></tr>').join('') + '</tbody></table></div>';
  $('#imp-ft').innerHTML = '<span style="font-size:11.5px;color:var(--ink3)">Passo 2 de 2 · conferir e confirmar' + (p.substitui ? ' · <b>substitui o documento atual</b>' : '') + '</span><div class="end"><button class="ds-btn" onclick="impPasso1()">Voltar</button><button class="ds-btn am" id="imp-ok">Confirmar importação</button></div>';
  $('#imp-ok').onclick = async () => { const b = $('#imp-ok'); b.disabled = true; b.textContent = 'Gravando...'; try { R = await post('/api/auditoria-folha/competencias/' + COMP + '/importar/confirmar', { token: p.token }); fecharModal(); toast(p.tipoTxt + ' importado', 'ok'); ME.competencias = await api('/api/auditoria-folha/competencias'); render(); } catch (e) { toast(e.message, 'erro'); b.disabled = false; b.textContent = 'Confirmar importação'; } };
}
async function conciliar() {
  const b = $('#b-conc'); if (b) { b.disabled = true; b.innerHTML = ic('refresh') + ' Consultando o Itaú...'; }
  try { R = await post('/api/auditoria-folha/competencias/' + COMP + '/conciliar'); toast('Conciliação executada: ' + R.totais.pct + '% conciliado', 'ok'); ME.competencias = await api('/api/auditoria-folha/competencias'); TAB = 'div'; render(); }
  catch (e) { toast(e.message, 'erro'); if (b) { b.disabled = false; b.innerHTML = ic('refresh') + ' Executar conciliação'; } }
}
function verConciliacao() { const c = R.conciliacao; modal('<div class="hd"><div><b>Detalhes da conciliação</b><small>Executada ' + dt(c.em) + ' por ' + esc(c.nome) + ' · extrato de ' + dBR(c.periodo.de) + ' a ' + dBR(c.periodo.ate) + '</small></div><button class="x">×</button></div><div class="bd">' +
  '<div class="det"><div><div class="l">Adiantamento</div><div class="v">' + c.totais.adiantamento.conciliados + ' de ' + c.totais.adiantamento.funcionarios + ' pagos (' + c.totais.adiantamento.pct + '%)' + (c.totais.adiantamento.lote ? '<br><small style="color:var(--ink3)">' + c.totais.adiantamento.lote + ' em lote</small>' : '') + '</div></div><div><div class="l">Folha mensal</div><div class="v">' + c.totais.folha.conciliados + ' de ' + c.totais.folha.funcionarios + ' pagos (' + c.totais.folha.pct + '%)' + (c.totais.folha.lote ? '<br><small style="color:var(--ink3)">' + c.totais.folha.lote + ' em lote</small>' : '') + '</div></div><div><div class="l">Diferença</div><div class="v" style="color:var(--neg)">' + brl(c.totais.diferenca) + '</div></div><div><div class="l">Não identificados</div><div class="v">' + c.totais.naoIdentificados + ' pagamento(s)</div></div></div>' +
  '<div class="tw" style="max-height:none"><table class="t"><thead><tr><th>Unidade</th><th>Conta</th><th class="r">Saídas</th><th class="r">Pessoa física</th><th class="r">Lotes</th><th>Resultado</th></tr></thead><tbody>' + c.lojas.map(l => '<tr><td>' + etq(l.loja) + esc(lojaNome(l.loja)) + '</td><td>' + esc(l.conta) + '</td><td class="r">' + (l.saidas == null ? '—' : l.saidas) + '</td><td class="r">' + (l.pessoaFisica == null ? '—' : l.pessoaFisica) + '</td><td class="r">' + (l.lotes == null ? '—' : l.lotes) + '</td><td>' + (l.erro ? '<span class="pill bad">' + esc(l.erro) + '</span>' : '<span class="pill ok">OK</span>') + '</td></tr>').join('') + c.semConta.map(s => '<tr><td>' + etq(s.loja) + esc(lojaNome(s.loja)) + '</td><td colspan="4">—</td><td><span class="pill gr">' + esc(s.motivo) + '</span></td></tr>').join('') + '</tbody></table></div>' +
  '<div style="font-size:11.5px;color:var(--ink3);margin-top:10px;line-height:1.5">Regra: CPF do favorecido + valor exato = pago; CPF com valor diferente = divergência de valor; sem CPF, nome parecido + valor exato = pago; lote de salário com o subtotal da loja = pagos em lote (sem conferência individual); nada encontrado = não pago. Janelas: adiantamento ' + dBR(c.janelas.adiantamento.de) + '–' + dBR(c.janelas.adiantamento.ate) + ', folha ' + dBR(c.janelas.folha.de) + '–' + dBR(c.janelas.folha.ate) + '.</div></div><div class="ft"><div class="end"><button class="ds-btn" onclick="fecharModal()">Fechar</button></div></div>'); }
function encerrar() { const ab = R.divergencias.filter(d => !ME.finais.includes(d.situacao)).length; modal('<div class="hd"><div><b>Encerrar a competência ' + esc(compTxt(COMP)) + '</b><small>Depois de encerrada nada mais é importado, conciliado ou tratado até reabrir.</small></div><button class="x">×</button></div><div class="bd">' + (ab ? '<div class="aviso neg">Há <b>' + ab + ' divergência(s) aberta(s)</b>. Para encerrar assim, justifique (mín. 10 caracteres).</div>' : '<div class="aviso ok">Todas as divergências estão encerradas.</div>') + '<div class="campos"><label class="w">Justificativa / observação<textarea id="enc-txt"></textarea></label></div></div><div class="ft"><div class="end"><button class="ds-btn" onclick="fecharModal()">Cancelar</button><button class="ds-btn am" id="enc-ok">Encerrar</button></div></div>', 'sm'); $('#enc-ok').onclick = async () => { try { R = await post('/api/auditoria-folha/competencias/' + COMP + '/encerrar', { justificativa: $('#enc-txt').value }); fecharModal(); toast('Competência encerrada', 'ok'); ME.competencias = await api('/api/auditoria-folha/competencias'); render(); } catch (e) { toast(e.message, 'erro'); } }; }
function reabrir() { modal('<div class="hd"><div><b>Reabrir a competência</b></div><button class="x">×</button></div><div class="bd"><div class="campos"><label class="w">Justificativa<textarea id="rea-txt"></textarea></label></div></div><div class="ft"><div class="end"><button class="ds-btn" onclick="fecharModal()">Cancelar</button><button class="ds-btn am" id="rea-ok">Reabrir</button></div></div>', 'sm'); $('#rea-ok').onclick = async () => { try { R = await post('/api/auditoria-folha/competencias/' + COMP + '/reabrir', { justificativa: $('#rea-txt').value }); fecharModal(); toast('Competência reaberta', 'ok'); ME.competencias = await api('/api/auditoria-folha/competencias'); render(); } catch (e) { toast(e.message, 'erro'); } }; }

// ── divergência ──
function abrirDiv(prot) {
  const d = R.divergencias.find(x => x.protocolo === prot); if (!d) return; const f = d.funcKey ? R.funcionarios.find(x => x.key === d.funcKey) : null; const fim = ME.finais.includes(d.situacao);
  const ACOES = [['comentar', 'Registrar tratativa'], ['analisar', 'Assumir análise'], ['solicitar_retorno', 'Solicitar retorno (ao setor / funcionário)'], ['resposta', 'Registrar resposta recebida'], ['encaminhar', 'Encaminhar a outro setor'], ['resolver', 'Resolver (regularizada)'], ['improcedente', 'Classificar como improcedente'], ['prazo', 'Alterar prazo']].filter(([a]) => !fim || false).concat(fim ? [['reabrir', 'Reabrir']] : []);
  modal('<div class="hd"><div><b>' + esc(d.protocolo) + ' · ' + esc(d.tipoTxt) + '</b><small>' + esc(d.nome) + (d.matricula ? ' · matrícula ' + esc(d.matricula) : '') + ' · ' + esc(lojaTxt(d.loja)) + ' · aberta ' + dt(d.abertaEm) + '</small></div><span class="pill ' + (d.vencida ? 'bad' : SIT_CLS[d.situacao]) + '" style="margin-left:10px">' + esc(d.vencida ? 'Prazo vencido' : d.situacaoTxt) + '</span><button class="x">×</button></div><div class="bd">' +
    '<div class="det"><div><div class="l">Setor responsável</div><div class="v">' + esc(d.setorTxt) + '</div></div><div><div class="l">Prazo</div><div class="v' + (d.vencida ? ' neg' : '') + '">' + dBR(d.prazo) + '</div></div><div><div class="l">Previsto (documento)</div><div class="v">' + (d.previsto == null ? '—' : brl(d.previsto)) + '</div></div><div><div class="l">Pago (Itaú)</div><div class="v">' + (d.pago == null ? '—' : brl(d.pago)) + '</div></div><div><div class="l">Diferença</div><div class="v" style="color:var(--neg)">' + (d.diferenca == null ? '—' : brl(d.diferenca)) + '</div></div>' + (f ? '<div><div class="l">Adiantamento / Folha</div><div class="v">' + (f.adiantamento ? SITF_TXT[f.adiantamento.situacao] || '—' : 'não consta') + ' / ' + (f.folha ? SITF_TXT[f.folha.situacao] || '—' : 'não consta') + '</div></div>' : '') + '</div>' +
    '<div class="aviso inf" style="margin-bottom:12px">' + esc(d.descricao) + '</div>' +
    (d.lancamento ? '<div class="lanc"><b>Lançamento no extrato:</b> ' + dBR(d.lancamento.data) + ' · ' + brl(d.lancamento.valor) + ' · ' + esc(d.lancamento.favorecido || '') + ' · ' + esc(d.lancamento.historico) + (d.lancamento.documento ? ' · doc ' + esc(d.lancamento.documento) : '') + '</div>' : '') +
    (f && f[d.documento] && f[d.documento].lancamentos && f[d.documento].lancamentos.length ? '<div class="lanc"><b>Lançamento(s) casado(s):</b> ' + f[d.documento].lancamentos.map(l => dBR(l.data) + ' · ' + brl(l.valor) + ' · ' + esc(l.historico.slice(0, 70))).join('<br>') + '</div>' : '') +
    (d.encerramento ? '<div class="aviso ok"><b>Encerrada</b> em ' + dt(d.encerramento.em) + ' por ' + esc(d.encerramento.nome) + ' · ' + esc(d.encerramento.conclusao) + ': ' + esc(d.encerramento.justificativa) + '</div>' : '') +
    '<b style="font-size:12.5px">Tratativas</b><div class="tl">' + d.tratativas.slice().reverse().map(t => '<div><div><b>' + esc(t.nome || t.usuario || 'sistema') + '</b><small>' + dt(t.em) + '</small></div><div><small>' + esc(t.acao) + '</small>' + esc(t.texto) + '</div></div>').join('') + '</div>' +
    (d.podeTratar && !R.encerramento ? '<b style="font-size:12.5px">Nova tratativa</b><div class="campos" style="margin-top:8px"><label>Ação<select class="ds-select" id="dv-acao">' + ACOES.map(([a, t]) => '<option value="' + a + '">' + t + '</option>').join('') + '</select></label><label id="dv-extra"></label><label class="w">Texto<textarea id="dv-txt" placeholder="O que foi feito, pedido ou respondido"></textarea></label></div>' : '<div class="aviso">' + (R.encerramento ? 'Competência encerrada.' : 'Só a Coordenação ou o setor responsável (' + esc(d.setorTxt) + ') registra tratativas nesta divergência.') + '</div>') +
    '</div><div class="ft"><span style="font-size:11.5px;color:var(--ink3)">Última atualização ' + dt(d.atualizadaEm) + '</span><div class="end"><button class="ds-btn" onclick="fecharModal()">Fechar</button>' + (d.podeTratar && !R.encerramento ? '<button class="ds-btn am" id="dv-ok">Registrar</button>' : '') + '</div></div>');
  if (!(d.podeTratar && !R.encerramento)) return;
  const extra = () => { const a = $('#dv-acao').value; const e = $('#dv-extra'); e.innerHTML = a === 'encaminhar' ? 'Setor<select class="ds-select" id="dv-setor">' + Object.entries(ME.setores).filter(([k]) => k !== d.setor).map(([k, t]) => '<option value="' + k + '">' + t + '</option>').join('') + '</select>' : a === 'prazo' || a === 'solicitar_retorno' ? 'Novo prazo<input type="date" class="ds-input" id="dv-prazo" value="' + d.prazo + '">' : a === 'resolver' ? 'Conclusão<select class="ds-select" id="dv-conc"><option value="regularizada">Regularizada (pagamento ajustado)</option><option value="pago_posteriormente">Pago posteriormente</option><option value="documento_corrigido">Documento corrigido</option><option value="cadastro_corrigido">Cadastro corrigido</option><option value="outro">Outro (descrever)</option></select>' : ''; };
  $('#dv-acao').onchange = extra; extra();
  $('#dv-ok').onclick = async () => { const a = $('#dv-acao').value; const body = { acao: a, texto: $('#dv-txt').value }; if ($('#dv-setor')) body.setor = $('#dv-setor').value; if ($('#dv-prazo')) body.prazo = $('#dv-prazo').value; if ($('#dv-conc')) body.conclusao = $('#dv-conc').value; try { const nd = await post('/api/auditoria-folha/competencias/' + COMP + '/divergencias/' + prot, body); const i = R.divergencias.findIndex(x => x.protocolo === prot); R.divergencias[i] = nd; toast('Tratativa registrada', 'ok'); render(); abrirDiv(prot); } catch (e) { toast(e.message, 'erro'); } };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });
iniciar();
</script>
</body>
</html>
