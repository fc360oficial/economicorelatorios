<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/design-system.css">
<script src="/nav.js" defer></script>
<script src="/gente-ui.js"></script>
<title>Termos de Escala — DP / RH · Econômico Supermercados</title>
<!-- DP / RH › Termos de Escala (23/10/2026). Termo de Ciência de Escala de Trabalho aos Domingos e Feriados: o DP escolhe
     loja + data + tipo, marca os funcionários ativos da loja (PontoCerto) e gera UM PDF com um termo por página (A4), com
     prévia, histórico, reimpressão e modelo de texto configurável. Regras/PDF em lib/termos-escala.js, rotas em
     lib/termos-escala-rotas.js. Mesma casca da tela Escalas (rail nativo + abas); permissões da central de pessoas. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--font);background:var(--pap);color:var(--ink);min-height:100vh;font-size:13px}
.content{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:58px;background:var(--crd);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:40}
.topbar h1{font-size:16px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}.topbar h1 .crumb{color:var(--ink3);font-weight:600}.topbar h1 .ds-ic{color:var(--ink3)}
.topbar p{font-size:11.5px;color:var(--ink3);margin-top:1px}.topbar .end{margin-left:auto;display:flex;align-items:center;gap:12px}
.who{display:flex;align-items:center;gap:9px;font-size:12px}.who .ds-avatar{background:#101B33;color:#FFC933}.who b{display:block;font-size:12.5px}.who span{color:var(--ink3);font-size:11px}
.modnav{background:var(--crd);border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;align-items:stretch;padding:0 14px;position:sticky;top:58px;z-index:39}
.modnav a{display:flex;align-items:center;gap:6px;padding:0 12px;height:42px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;user-select:none}
.modnav a .ds-ic{width:15px;height:15px;color:var(--ink3)}.modnav a:hover{color:var(--ink)}.modnav a.on{color:var(--ink);border-bottom-color:var(--am)}.modnav a.on .ds-ic{color:var(--amk)}
.page{padding:20px 24px 40px;max-width:1700px;width:100%}
.aviso{background:var(--amw);border:1px solid var(--am-ln);color:var(--amk);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.5}.aviso.neg{background:var(--negw);border-color:#F1B9C3;color:var(--neg)}.aviso.inf{background:var(--infw);border-color:var(--inf);color:var(--inf)}.aviso.ok{background:var(--posw);border-color:#B9E2C8;color:var(--pos)}
.note{font-size:11.5px;color:var(--ink3);line-height:1.5;margin:10px 2px 0}
.empty{padding:36px 20px;text-align:center;color:var(--ink3);font-size:12.5px}.empty b{display:block;color:var(--ink2);font-size:13.5px;margin-bottom:3px}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--wsh) 25%,var(--ln) 50%,var(--wsh) 75%);background-size:200% 100%;animation:sk 1.3s ease infinite;margin:10px 14px}@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--posw);color:var(--pos)}.pill.bad{background:var(--negw);color:var(--neg)}.pill.warn{background:var(--amw);color:var(--amk)}.pill.info{background:var(--infw);color:var(--inf)}.pill.gr{background:var(--wsh);color:var(--ink2)}
.etq{display:inline-block;background:#101B33;color:#FFC933;font-weight:800;font-size:10px;padding:2px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}.etq.cd{background:var(--inf);color:#fff}
/* nova emissão: passos à esquerda, prévia à direita */
.emit{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;align-items:start}
.step{background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);box-shadow:var(--sh-sm);margin-bottom:14px}
.step .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln)}.step .hd b{font-size:13.5px}.step .hd small{color:var(--ink3);font-size:11.5px;margin-left:auto}
.step .n{width:24px;height:24px;border-radius:50%;background:#101B33;color:#FFC933;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}.step.done .n{background:var(--pos);color:#fff}
.step .bd{padding:14px 16px}
.campos{display:grid;grid-template-columns:minmax(220px,1.3fr) minmax(160px,1fr) minmax(220px,1.2fr);gap:12px}.campos label{display:grid;gap:5px;font-size:11px;font-weight:700;color:var(--ink2)}.campos label span.req{color:var(--neg)}
.campos .ds-input,.campos .ds-select{height:36px;font-size:12.5px;width:100%}
.radios{display:flex;gap:8px;align-items:center;height:36px}.radios label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;padding:0 12px;height:36px;border:1px solid var(--ln2);border-radius:8px;flex:1;justify-content:center}.radios label.on{background:#101B33;color:#FFC933;border-color:#101B33}.radios input{accent-color:#101B33}
.hint{font-size:11.5px;color:var(--ink2);margin-top:8px;line-height:1.5}.hint b{color:var(--ink)}
.ftb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.ftb .ds-input,.ftb .ds-select{height:34px;font-size:12.5px}.ftb .ds-input{flex:1;min-width:180px}.ftb .end{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tw{overflow:auto;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r)}table.t{width:100%;border-collapse:collapse;font-size:12px}table.t th{text-align:left;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);padding:8px 10px;background:var(--wsh);font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:1}table.t td{padding:7px 10px;border-top:1px solid var(--ln);color:var(--ink2);vertical-align:middle}table.t th.r,table.t td.r{text-align:right}
table.t td.nm{color:var(--ink);font-weight:700;white-space:normal}table.t tr.sel td{background:var(--amw)}table.t tr.off td{color:var(--ink3)}table.t input[type=checkbox]{width:15px;height:15px;accent-color:#101B33;cursor:pointer}table.t tr.cl{cursor:pointer}table.t tr.cl:hover td{background:var(--wsh)}table.t tr.sel.cl:hover td{background:#FFEFB8}
.tw.func{max-height:460px}.cnt{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2);margin-top:10px;flex-wrap:wrap}.cnt b{color:var(--ink)}
.resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.resumo div{background:var(--wsh);border-radius:9px;padding:9px 12px}.resumo .l{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}.resumo .v{font-size:14px;font-weight:800;margin-top:2px;white-space:normal}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chips span{font-size:11px;font-weight:600;background:var(--crd);border:1px solid var(--ln);border-radius:20px;padding:3px 9px;color:var(--ink2)}.chips span i{font-style:normal;color:var(--ink3);margin-left:4px;cursor:pointer}.chips span i:hover{color:var(--neg)}
.acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.acoes .end{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ds-btn.big{height:44px;padding:0 20px;font-size:13.5px}.ds-btn.big small{display:block;font-weight:500;font-size:10.5px;opacity:.8}
.prev{position:sticky;top:116px}.prev .bd{padding:10px}.prev .nav{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);padding:0 6px 0 0}.prev .nav b{color:var(--ink)}.prev .nav .end{margin-left:auto;display:flex;gap:6px}
.prev iframe{width:100%;aspect-ratio:1/1.3;border:1px solid var(--ln);border-radius:8px;background:#fff;display:block}.prev .ph{aspect-ratio:1/1.3;border:1px dashed var(--ln2);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink3);font-size:12px;padding:20px;line-height:1.5}
.sucesso{background:var(--posw);border:1px solid #B9E2C8;border-radius:var(--r-lg);padding:14px 16px;margin-bottom:14px}.sucesso b{display:block;font-size:14px;color:var(--pos);margin-bottom:4px}.sucesso .acoes{margin-top:10px}
/* histórico */
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:9px 10px;margin-bottom:16px}
.tb .ds-input,.tb .ds-select{height:34px;font-size:12.5px}.tb .end{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tb .lbl{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px}
table.t a.lk{color:var(--inf);font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}table.t a.lk:hover{text-decoration:underline}table.t td.ac{white-space:nowrap}table.t td.ac a{margin-right:10px}table.t td.ac a.neg{color:var(--neg)}
table.t td.nomes{white-space:normal;max-width:360px;color:var(--ink2);font-size:11.5px;line-height:1.4}
/* modelo */
.mod{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;align-items:start}.mod label{display:grid;gap:5px;font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:12px}.mod textarea,.mod input{padding:8px 10px;border:1px solid var(--ln2);border-radius:8px;font:inherit;font-size:12.5px;font-weight:500;width:100%;line-height:1.5;background:var(--crd);color:var(--ink)}.mod textarea{resize:vertical}
/* modal */
.f-ov{position:fixed;inset:0;background:rgba(10,17,32,.55);z-index:9000;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.f-md{background:var(--crd);color:var(--ink);border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.f-md .hd{background:#101B33;color:#fff;padding:11px 16px;display:flex;justify-content:space-between;align-items:center}.f-md .hd b{font-size:14px}.f-md .hd small{display:block;color:#B7C0D6;font-size:11.5px}.f-md .x{background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer}
.f-md .bd{padding:14px 16px;display:grid;gap:10px}.f-md .acoes{justify-content:flex-end}.f-md textarea{padding:8px 10px;border:1px solid var(--ln2);border-radius:8px;font:inherit;font-size:12.5px;width:100%}
/* 23/10/26 — regra do CLAUDE.md: a base é o monitor grande; as faixas apertam até caber em 1600/1366/1280 sem rolagem lateral */
@media(max-width:1599px){.page{padding:18px 20px 36px}.emit{grid-template-columns:minmax(0,1fr) 400px}.mod{grid-template-columns:minmax(0,1fr) 400px}.resumo .v{font-size:13px}table.t td.nomes{max-width:300px}}
@media(max-width:1399px){.emit{grid-template-columns:minmax(0,1fr) 360px}.mod{grid-template-columns:minmax(0,1fr) 360px}.campos{grid-template-columns:1fr 1fr}.campos label:last-child{grid-column:1/-1}.resumo{grid-template-columns:repeat(2,1fr)}table.t{font-size:11.5px}table.t th,table.t td{padding:6px 8px}.tb .lbl{font-size:10px}table.t td.nomes{max-width:240px}}
@media(max-width:1299px){.emit{grid-template-columns:1fr}.prev{position:static}.mod{grid-template-columns:1fr}.tb{gap:6px}.tb .ds-btn{padding-left:9px;padding-right:9px}}
@media(max-width:1199px){.topbar{padding:0 16px}.page{padding:16px}.modnav a .ds-ic{display:none}.tb .end{margin-left:0}}
@media(max-width:820px){.modnav{position:static;overflow-x:auto}.topbar{height:auto;padding:10px 14px;flex-wrap:wrap}.topbar .end{margin-left:0}.page{padding:12px}.campos{grid-template-columns:1fr}.resumo{grid-template-columns:1fr 1fr}.acoes .end{margin-left:0}}
</style>
</head>
<body class="dsnav-pad">
<div class="content">
  <header class="topbar"><div><h1 id="tb-h1"><span class="crumb">DP / RH</span></h1><p id="tb-sub"></p></div><div class="end"><div class="who" id="who"></div></div></header>
  <nav class="modnav" id="modnav"></nav>
  <div class="page" id="page"><div class="sk"></div><div class="sk" style="width:60%"></div></div>
</div>
<script>
const { $, $$, esc, api, toast, dBR } = G;
let ME = null, PAG = 'nova';
const ST = { loja: null, data: null, tipo: null, info: null, funcs: [], fonte: null, sel: new Set(), busca: '', funcao: '', previaIdx: 0, previaUrl: null, sucesso: null, carregando: false };
const H = { loja: '', func: '', de: '', ate: '', dataTrabalho: '', tipo: '', status: '' };
const ic = n => '<svg class="ds-ic"><use href="/icons.svg#' + n + '"/></svg>';
const lojaTxt = n => (ME.lojas.find(l => l.n === +n) || {}).txt || '—'; const lojaCod = n => lojaTxt(n).split(' · ')[0];
const etq = n => '<span class="etq' + (+n === 10 ? ' cd' : '') + '">' + esc(lojaCod(n)) + '</span>';
const dt = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') + ' ' + new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';
const skel = () => '<div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div>';
const erroBox = e => '<div class="aviso neg">' + esc(e.message || e) + '</div>';
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const selLoja = (v, vazio) => (vazio ? '<option value="">' + esc(vazio) + '</option>' : '') + ME.lojas.map(l => '<option value="' + l.n + '"' + (String(l.n) === String(v) ? ' selected' : '') + '>' + esc(l.txt) + '</option>').join('');
const NAV = [{ id: 'nova', txt: 'Nova emissão', ic: 'printer', sub: 'Unidade, data e tipo → funcionários → conferência → PDF com um termo por página', so: 'emitir' }, { id: 'hist', txt: 'Histórico de emissões', ic: 'list', sub: 'Tudo que já foi emitido: visualizar, baixar e reimprimir o PDF original' }, { id: 'modelo', txt: 'Modelo do termo', ic: 'settings', sub: 'Texto do documento (sujeito à validação do jurídico)' }];
const navVisivel = () => NAV.filter(n => !n.so || ME[n.so]);
function ir(p) { const n = NAV.find(x => x.id === p); if (!n || (n.so && !ME[n.so])) return; PAG = p; $$('#modnav a').forEach(a => a.classList.toggle('on', a.dataset.p === p)); $('#tb-h1').innerHTML = '<span class="crumb">DP / RH · Termos de Escala</span>' + ic('chevron-right') + esc(n.txt); $('#tb-sub').textContent = n.sub; history.replaceState(null, '', '#' + p); $('#page').innerHTML = skel(); ({ nova, hist, modelo })[p](); }
async function iniciar() {
  try { ME = await api('/api/termos-escala/me'); } catch (e) { $('#page').innerHTML = e.status === 403 ? '<div class="aviso neg"><b>Sem acesso aos Termos de Escala.</b> ' + esc(e.message) + '</div>' : erroBox(e); return; }
  $('#modnav').innerHTML = navVisivel().map(n => '<a data-p="' + n.id + '">' + ic(n.ic) + '<span>' + esc(n.txt) + '</span></a>').join(''); $$('#modnav a').forEach(a => a.onclick = () => ir(a.dataset.p));
  const PAP = { gerente: 'Gerente', rh_ponto: 'RH Ponto', rh_doc: 'RH Documentação', rh_adm: 'RH Admissões', coordenacao: 'Coordenação', diretoria: 'Diretoria', juridico: 'Jurídico', ti: 'TI' };
  $('#who').innerHTML = '<div class="ds-avatar">' + esc(ME.nome.split(' ').slice(0, 2).map(s => s[0]).join('')) + '</div><div><b>' + esc(ME.nome) + '</b><span>' + esc(ME.papeis.map(p => PAP[p] || p).join(' · ') || 'sem papel') + '</span></div>';
  if (!ME.lojas.length) { $('#page').innerHTML = '<div class="aviso neg">Seu papel não tem unidade associada. Peça à Coordenação para designar a(s) loja(s).</div>'; return; }
  ST.loja = ME.lojas[0].n; ST.data = ME.proximoDomingo;
  const h = location.hash.replace('#', ''); ir(navVisivel().some(n => n.id === h) ? h : (ME.emitir ? 'nova' : 'hist'));
  window.addEventListener('hashchange', () => { const p = location.hash.replace('#', ''); if (p !== PAG && navVisivel().some(n => n.id === p)) ir(p); });
}

// ── Nova emissão ──
const selValidos = () => ST.funcs.filter(f => ST.sel.has(String(f.id)));
function nova() {
  const el = $('#page');
  el.innerHTML = (ME.modelo.validadoJuridico ? '' : '<div class="aviso">O texto do modelo ainda <b>não foi validado pelo setor jurídico</b> (aba Modelo do termo). Os termos saem com o texto padrão; a validação não bloqueia a emissão.</div>') +
    '<div id="n-sucesso"></div><div class="emit"><div>' +
    '<div class="step" id="s1"><div class="hd"><span class="n">1</span><b>Dados da emissão</b><small>uma data por emissão</small></div><div class="bd"><div class="campos">' +
      '<label>Unidade <span class="req">*</span><select class="ds-select" id="n-loja">' + selLoja(ST.loja) + '</select></label>' +
      '<label>Data do trabalho <span class="req">*</span><input type="date" class="ds-input" id="n-data" value="' + ST.data + '"></label>' +
      '<label>Tipo de escala <span class="req">*</span><div class="radios" id="n-tipo"><label data-t="domingo"><input type="radio" name="tipo" value="domingo"> Domingo</label><label data-t="feriado"><input type="radio" name="tipo" value="feriado"> Feriado</label></div></label>' +
    '</div><div class="hint" id="n-hint"></div></div></div>' +
    '<div class="step" id="s2"><div class="hd"><span class="n">2</span><b>Selecionar funcionários</b><small id="n-fonte"></small></div><div class="bd">' +
      '<div class="ftb"><input class="ds-input" id="n-busca" placeholder="Pesquisar por nome ou CPF (4 últimos dígitos)…" value="' + esc(ST.busca) + '"><select class="ds-select" id="n-funcao"><option value="">Todas as funções</option></select><div class="end"><button class="ds-btn ds-btn-secondary" id="n-todos" type="button">Selecionar todos</button><button class="ds-btn ds-btn-ghost" id="n-nenhum" type="button">Desmarcar todos</button></div></div>' +
      '<div class="tw func" id="n-tab">' + skel() + '</div><div class="cnt" id="n-cnt"></div></div></div>' +
    '<div class="step" id="s3"><div class="hd"><span class="n">3</span><b>Conferência</b><small>revise antes de gerar</small></div><div class="bd" id="n-resumo"></div></div>' +
    '<div class="step" id="s4"><div class="hd"><span class="n">4</span><b>Emissão</b><small>um PDF, um termo por página A4</small></div><div class="bd"><div class="acoes"><span class="note" style="margin:0">A emissão fica registrada no histórico com responsável, data e hora. Nada muda na escala, no banco de horas ou no ponto.</span><div class="end"><button class="ds-btn ds-btn-secondary" id="n-previa-btn" type="button">' + ic('search') + 'Visualizar prévia</button><button class="ds-btn ds-btn-primary big" id="n-emitir" type="button" disabled>' + ic('printer') + '<span>Gerar termos em PDF<small id="n-emitir-sub">nenhum funcionário selecionado</small></span></button></div></div></div></div>' +
    '</div><div class="step prev"><div class="hd">' + ic('search') + '<b>Prévia do documento</b><small>como vai sair no papel</small></div><div class="bd"><div class="nav" id="p-nav"></div><div id="p-box"></div></div></div></div>';
  $('#n-loja').onchange = () => { ST.loja = +$('#n-loja').value; ST.sel.clear(); carregarFuncs(); };
  $('#n-data').onchange = () => { ST.data = $('#n-data').value; ST.tipo = null; carregarInfo(); };
  $$('#n-tipo input').forEach(r => r.onchange = () => { ST.tipo = r.value; pintarTipo(); atualizar(); });
  $('#n-busca').oninput = () => { ST.busca = $('#n-busca').value; tabela(); };
  $('#n-funcao').onchange = () => { ST.funcao = $('#n-funcao').value; tabela(); };
  $('#n-todos').onclick = () => { listados().filter(f => f.ok).forEach(f => ST.sel.add(String(f.id))); tabela(); atualizar(); };
  $('#n-nenhum').onclick = () => { ST.sel.clear(); tabela(); atualizar(); };
  $('#n-previa-btn').onclick = () => { if (!selValidos().length) { toast('Selecione pelo menos um funcionário', 'neg'); return; } previa(true); $('.prev').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  $('#n-emitir').onclick = emitir;
  if (ST.sucesso) mostrarSucesso();
  carregarInfo(); carregarFuncs();
}
function pintarTipo() { $$('#n-tipo label').forEach(l => { l.classList.toggle('on', l.dataset.t === ST.tipo); l.querySelector('input').checked = l.dataset.t === ST.tipo; }); }
async function carregarInfo() {
  ST.info = null; $('#n-hint').innerHTML = '<span style="color:var(--ink3)">conferindo a data…</span>';
  if (!ST.data) { $('#n-hint').innerHTML = '<span style="color:var(--neg)">Informe a data do trabalho.</span>'; atualizar(); return; }
  try { ST.info = await api('/api/termos-escala/data/' + ST.data); } catch (e) { $('#n-hint').innerHTML = '<span style="color:var(--neg)">' + esc(e.message) + '</span>'; atualizar(); return; }

    '<div class="mod"><div class="step"><div class="hd"><b>Texto do termo</b><small>' + (ed ? 'Coordenação e Jurídico editam' : 'somente leitura (só Coordenação e Jurídico editam)') + '</small></div><div class="bd">' +
    '<label>Nome da empresa no documento<input data-k="empresa" value="' + esc(m.empresa) + '"' + (ed ? '' : ' disabled') + '></label>' + ta('titulo', 'Título', 2, 'uma linha por quebra') + ta('declaracao', 'Declaração de ciência', 7, 'parágrafos separados por linha em branco; {empresa} vira o nome da empresa em destaque') + ta('fundamentacao', 'Fundamentação legal', 4) + ta('nota', 'Observação final (itálico)', 3) +
    (ed ? '<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="m-val" style="width:16px;height:16px;accent-color:#101B33"' + (m.validadoJuridico ? ' checked' : '') + '> Texto validado pelo setor jurídico</label><div class="acoes"><div class="end"><button class="ds-btn ds-btn-secondary" id="m-previa" type="button">' + ic('search') + 'Ver prévia com este texto</button><button class="ds-btn ds-btn-primary" id="m-salvar" type="button">Salvar modelo</button></div></div>' : '<div class="acoes"><div class="end"><button class="ds-btn ds-btn-secondary" id="m-previa" type="button">' + ic('search') + 'Ver prévia</button></div></div>') +
    '<p class="note">O documento não traz matrícula, unidade, função nem horários: só colaborador, CPF, data e tipo de escala, declaração, espaço de assinatura e fundamentação legal.' + (m.alteradoEm ? ' Última alteração: ' + dt(m.alteradoEm) + ' por ' + esc(m.alteradoPor) + '.' : '') + '</p></div></div>' +
    '<div class="step prev"><div class="hd"><b>Prévia do modelo</b><small>dados fictícios</small></div><div class="bd"><div id="m-box"><div class="ph">Clique em "Ver prévia" para renderizar o modelo com um colaborador de exemplo.</div></div></div></div></div>';
  const corpo = () => { const b = {}; $$('#page [data-k]').forEach(i => b[i.dataset.k] = i.value); return b; };
  $('#m-previa').onclick = async () => {
    $('#m-box').innerHTML = '<div class="ph">gerando…</div>';
    try { const r = await fetch('/api/termos-escala/previa-modelo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ modelo: ed ? corpo() : null, data: ME.proximoDomingo }) }); if (!r.ok) { let j = null; try { j = await r.json(); } catch (e) {} throw new Error((j && j.error) || 'HTTP ' + r.status); } const u = URL.createObjectURL(await r.blob()); $('#m-box').innerHTML = '<iframe src="' + u + '#toolbar=0&navpanes=0&view=FitH" title="Prévia do modelo"></iframe><div class="acoes" style="margin-top:8px"><div class="end"><a class="ds-btn ds-btn-ghost" href="' + u + '" target="_blank">Abrir em nova aba</a></div></div>'; }
    catch (e) { $('#m-box').innerHTML = '<div class="ph" style="color:var(--neg)">' + esc(e.message) + '</div>'; }
  };
  if (ed) $('#m-salvar').onclick = async () => { try { ME.modelo = await api('/api/termos-escala/config', { method: 'PUT', body: { ...corpo(), validadoJuridico: $('#m-val').checked } }); toast('Modelo salvo'); modelo(); } catch (e) { toast(e.message, 'neg'); } };
}
iniciar();
</script>
</body>
</html>
