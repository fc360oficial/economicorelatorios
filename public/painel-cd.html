<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel CD — CAHU Distribuidora</title>
<!-- Painel CD (04/11/2026) — TV do CD no padrão visual do Painel Compras/Fiscal, mas FIXA (Tiago: "é um painel de expedição, tem que
     tá parado e mudar pouco"): as 5 colunas sempre na tela, cada coluna rola sozinha, alterna Expedição 180 s × Conferência 30 s.
     Reconferir = faixa vermelha em cima das colunas, nas duas telas, até o pedido sair da coluna Reconferir. Limites de tempo na fila: LIM_AM/LIM_VM.
     Mockup aprovado: claude.ai/artifact/XEpMbuzZgb1gyUQGM8Hm6C. Versão anterior em painel-cd-antigo.html. Dados: /api/painel-cd a cada 10 s, sem login. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#0c0c0c;--paper:#f6f4ec;--amarelo:#FFD500;--vermelho:#C8102E;--verde:#22C55E;--linha:#2a2a2a;--mudo:#8f8a7c;--fd:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--fb:"Barlow","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:var(--paper);font-family:var(--fb);overflow:hidden}
#tv{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ink);font-size:calc(var(--u) * 1px)}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
@keyframes pulsaNum{0%,100%{text-shadow:0 0 0 rgba(200,16,46,0)}50%{text-shadow:0 0 .35em rgba(200,16,46,.9)}}
/* topo */
.top{display:flex;align-items:center;gap:1.6em;padding:0 2.4em;height:7em;flex:none;border-bottom:.14em solid var(--amarelo)}
.logo{height:5.4em;background:var(--amarelo);border-radius:.6em;padding:.45em .8em;flex:none}
.logo i{display:block;height:4.5em;width:14.5em;overflow:hidden;position:relative}
.logo img{position:absolute;width:18em;max-width:none;left:-1.65em;top:-8.8em;mix-blend-mode:multiply}   /* logo com margem branca grande: recorte + multiply no amarelo */
.tit{font:800 2.5em/1 var(--fd);text-transform:uppercase;letter-spacing:.04em;color:#fff;padding-left:.55em;border-left:.08em solid #3a3a3a;white-space:nowrap}
.sp{flex:1 1 0;min-width:.5em}
.kps{display:flex;align-items:center;flex:none}
.kp{display:flex;flex-direction:column;align-items:center;padding:0 .8em;border-left:.08em solid #3a3a3a;min-width:5em}
.kp b{font:800 1.95em/1 var(--fd);color:#fff;font-variant-numeric:tabular-nums}
.kp span{font:700 .85em var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mudo);margin-top:.2em;white-space:nowrap}
.kp.am b{color:var(--amarelo)}.kp.vm b{animation:pulsaNum 2.4s ease-in-out infinite}.kp.vm span{color:#ff8a9a}.kp.ok b{color:var(--verde)}
.dt{font:600 1.05em var(--fb);letter-spacing:.14em;text-transform:uppercase;color:#cfcabb;padding-left:1em;border-left:.08em solid #3a3a3a;white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
/* corpo */
.main{flex:1;display:flex;flex-direction:column;padding:1.2em 2.4em 1em;min-height:0}
.hd{display:flex;align-items:baseline;gap:1.2em;margin-bottom:.7em;flex:none;height:3.6em}
.hd h2{font:800 2.8em/1 var(--fd);text-transform:uppercase;color:#fff;margin:0;letter-spacing:.03em;display:flex;align-items:center;gap:.35em;white-space:nowrap}
.hd h2 .ic{color:var(--amarelo);font-size:.85em;stroke-width:2.2}
.hd .sub{margin-left:auto;font:600 1.15em var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mudo);white-space:nowrap}
/* alerta de reconferir: mesma altura do título, as colunas não perdem espaço; o fundo pisca e o texto fica sempre legível */
@keyframes piscaFaixa{0%,49%{background:var(--vermelho)}50%,100%{background:#4a0410}}
.al-faixa{flex:none;height:3.6em;margin-bottom:.7em;padding:0 1.1em;display:flex;align-items:center;gap:1em;border:.14em solid #fff;border-radius:.35em;background:var(--vermelho);animation:piscaFaixa 1s steps(1) infinite;color:#fff;overflow:hidden}
.al-t{font:800 2.5em/1 var(--fd);letter-spacing:.06em;text-transform:uppercase;color:var(--amarelo);white-space:nowrap}
.al-p{font:800 2.5em/1 var(--fd);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;font-variant-numeric:tabular-nums}
.al-i{flex:1;min-width:0;font:700 2.2em/1 var(--fd);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al-n{font:700 1.4em/1 var(--fd);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;font-variant-numeric:tabular-nums}
/* quadro: as 5 etapas lado a lado */
.quadro{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.9em;min-height:0}
.et{display:flex;flex-direction:column;min-height:0;min-width:0;border-top:.3em solid #3a3a3a;background:#141414}
.et.am{border-top-color:var(--amarelo)}.et.vm{border-top-color:var(--vermelho)}.et.ok{border-top-color:var(--verde)}
.et-hd{padding:.45em .8em .4em;display:flex;align-items:baseline;gap:.5em;flex:none;border-bottom:.07em solid var(--linha)}
.et-hd b{font:800 5.4em/.95 var(--fd);color:#fff;font-variant-numeric:tabular-nums}
.et.z .et-hd b{color:#3a3a3a}.et.am .et-hd b{color:var(--amarelo)}.et.ok .et-hd b{color:var(--verde)}.et.vm .et-hd b{animation:pulsaNum 2.4s ease-in-out infinite}
.et-hd span{font:800 1.4em/1.02 var(--fd);letter-spacing:.06em;text-transform:uppercase;color:#e8e5da}
.et-bd{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 .8em;overflow:hidden}
.ped{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:.6em;align-items:baseline;padding:.42em 0;border-bottom:.07em solid var(--linha)}
.ped b{font:800 2em/1 var(--fd);color:#fff;font-variant-numeric:tabular-nums}
.ped em{font:700 1.3em/1 var(--fd);font-style:normal;color:#bdb8aa;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ped em.am{color:var(--amarelo)}.ped em.vm{color:#fff;background:var(--vermelho);padding:.08em .3em;border-radius:.15em;justify-self:end}
.ped small{grid-column:1/-1;font:500 1em/1.3 var(--fb);color:var(--mudo);text-transform:uppercase;overflow-wrap:anywhere}
/* selo de quem levou o pedido até a coluna (ECO = nosso coletor, DLINKS = painel do Dlinks) */
.ped .id{display:flex;align-items:center;gap:.5em;min-width:0}
.org{font:800 .95em/1 var(--fd);letter-spacing:.08em;padding:.18em .45em;border-radius:.22em;background:#2e2e2e;color:#bdb8aa}
.org.eco{background:var(--amarelo);color:var(--ink)}
/* passo do Coletor Econômico: aparece em todo pedido que passou pelo nosso coletor; cor = etapa, como no painel antigo */
.ped .sit{grid-column:1/-1;justify-self:start;margin-top:.25em;font:700 1em/1.2 var(--fd);letter-spacing:.06em;text-transform:uppercase;background:#2e2e2e;color:#e8e5da;padding:.1em .45em;border-radius:.2em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ped .sit.sep{background:#1D4F9166;color:#9CC4FF}.ped .sit.car{background:#F5B80033;color:#FFD866}.ped .sit.fis{background:#FF8FA333;color:#FF8FA3}.ped .sit.ok{background:#7BE0A633;color:#7BE0A6}
.et-vz{margin:auto;font:600 1.15em var(--fb);color:#5b574d;text-align:center;letter-spacing:.06em;text-transform:uppercase}
.barra{flex:none;margin-top:.9em;display:flex;align-items:center;gap:1.2em}
.barra span{font:700 1.15em var(--fd);letter-spacing:.14em;text-transform:uppercase;color:#cfcabb;white-space:nowrap}
.barra i{flex:1;height:1em;background:#242424;border-radius:.5em;overflow:hidden;display:block}
.barra i u{display:block;height:100%;background:var(--verde);transition:width .5s}
.barra b{font:800 2.2em/1 var(--fd);color:#fff;font-variant-numeric:tabular-nums}
/* rodapé */
.foot{display:flex;align-items:center;gap:1.8em;padding:0 2.4em;height:4.2em;border-top:.08em solid var(--linha);flex:none}
.foot .sl{display:flex;align-items:center;gap:.5em;font:700 1.05em var(--fb);letter-spacing:.1em;text-transform:uppercase;color:#e8e5da;white-space:nowrap}
.foot .sl .ic{color:var(--amarelo);font-size:1.4em}
.foot .sl.erro{color:#ff8a9a}
.foot .val{font:600 1.15em var(--fb);letter-spacing:.04em;color:#bdb8aa;white-space:nowrap}
.foot .val b{color:var(--amarelo);font-weight:700}
.foot .cnt{font:700 1.4em var(--fd);color:var(--mudo);letter-spacing:.06em;font-variant-numeric:tabular-nums;flex:none}
#btn-fs{background:none;border:.08em solid #3a3a3a;border-radius:.3em;color:#bdb8aa;font-size:1.3em;width:1.9em;height:1.9em;cursor:pointer}
@media (prefers-reduced-motion:reduce){.al-faixa,.kp.vm b,.et.vm .et-hd b{animation:none}}
</style>
</head>
<body>
<div id="tv">
  <div class="top">
    <div class="logo"><i><img src="/logo-cahu.png" alt="Cahu Distribuidora"></i></div>
    <span class="tit" id="tit"></span><span class="sp"></span><div class="kps" id="kps"></div><span class="dt" id="relogio"></span>
  </div>
  <div class="main">
    <div id="cabeca"></div>
    <div class="quadro" id="quadro"></div>
    <div class="barra"><span id="barra-lb"></span><i><u id="barra" style="width:0"></u></i><b id="pct">0%</b><span id="concl"></span></div>
  </div>
  <div class="foot">
    <span class="sl" id="stamp"></span><span class="sp"></span>
    <span class="val"><b>ECO</b> = coletor Econômico · <b>DLINKS</b> = painel do Dlinks</span>
    <span class="cnt" id="troca"></span>
    <button type="button" id="btn-fs" title="Tela cheia">⛶</button>
  </div>
</div>
<script>
const EMBED = new URLSearchParams(location.search).get('embed') === '1';   // prévia em Processos › Painéis: sem som e sem contar como TV ligada
const LIM_AM = 90, LIM_VM = 120;   // minutos na fila (Tiago, 04/11): amarelo a partir de 1h30, vermelho a partir de 2h
const TEMPO_TELA = { exp: 180, conf: 30 }, MAX_TELA_SEG = 240;
const SEG_ALERTA = 4000;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const IC_GRADE = '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>';
const IC_RELOGIO = '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const horaDe = iso => iso ? iso.slice(11, 16) : '';
const minDesde = iso => Math.max(0, Math.round((Date.now() - new Date(iso + ':00').getTime()) / 60000));
const tempo = m => m < 60 ? m + ' min' : m < 1440 ? Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') : Math.floor(m / 1440) + ' d';
const cor = m => m >= LIM_VM ? 'vm' : m >= LIM_AM ? 'am' : '';

function linha(p, em, cls) {
  const eco = p.origem === 'eco';
  const selo = `<span class="org${eco ? ' eco' : ''}" title="${eco ? 'posição vem do Coletor Econômico' : 'posição vem do painel do Dlinks'}">${eco ? 'ECO' : 'DLINKS'}</span>`;
  const col = p.coletor ? `<span class="sit ${esc(p.coletor.cor || '')}">${esc(p.coletor.rotulo)}${p.coletor.quem ? ' · ' + esc(p.coletor.quem) : ''}</span>` : '';
  return `<div class="ped"><span class="id"><b>${esc(p.pedido)}</b>${selo}</span>${em ?`<em class="${cls || ''}">${em}</em>` : ''}<small>${esc(p.nome)}</small>${col}</div>`;
}
const naFila = p => { if (!p.entrada) return linha(p); const m = minDesde(p.entrada); return linha(p, tempo(m), cor(m)); };
const emReconferir = p => { const q = p.conferido || p.entrada; return linha(p, q ? tempo(minDesde(q)) : '', 'vm'); };
const liberado = p => linha(p, horaDe(p.liberacao));
const simples = p => linha(p);
const maisAntigo = (a, b) => String(a.entrada || '').localeCompare(String(b.entrada || ''));
const ultimoLiberado = (a, b) => String(b.liberacao || '').localeCompare(String(a.liberacao || ''));
const COLS = {
  exp: [
    { id: 'separacao', tit: 'P/ separar', cor: 'am', f: naFila, ord: maisAntigo, vz: 'sem fila' },
    { id: 'em_separacao', tit: 'Em separação', cor: 'am', f: naFila, ord: maisAntigo, vz: 'sem pedido' },
    { id: 'aguardando_liberacao', tit: 'Fila do fiscal', cor: 'am', f: naFila, ord: maisAntigo, vz: 'em dia' },
    { id: 'reconferir', tit: 'Reconferir', cor: 'vm', f: emReconferir, ord: maisAntigo },
    { id: 'liberado', tit: 'Liberados hoje', cor: 'ok', f: liberado, ord: ultimoLiberado },
  ],
  conf: [
    { id: 'conf_pedido', tit: 'Conf. pedido', cor: 'am', f: simples, vz: 'sem fila' },
    { id: 'conf_coletor', tit: 'Conf. coletor', cor: 'am', f: simples, vz: 'sem fila' },
    { id: 'conferido', tit: 'Fila do fiscal', cor: 'am', f: simples, vz: 'em dia' },
    { id: 'reconferir', tit: 'Reconferir', cor: 'vm', f: simples },
    { id: 'liberado', tit: 'Liberadas hoje', cor: 'ok', f: simples },
  ],
};

let D = null, lado = 'exp', resta = TEMPO_TELA.exp, ALERTA = [], iAlerta = 0, ultimoOk = null, erro = '', emTelaDesde = Date.now(), rolou = [], pausaAte = [];

// Alerta (Tiago, 04/11: "só vai sumir depois que for reconferido"): vale enquanto o pedido estiver na coluna Reconferir, dos dois lados.
// Cicla os itens de UM pedido antes de passar pro próximo. Pedido sem item achado no ERP entra do mesmo jeito.
function montarAlerta(d) {
  const lista = [];
  for (const [x, rot] of [[d.expedicao, 'Pedido'], [d.conferencia, 'Conf.']]) {
    for (const p of x.colunas.reconferir || []) {
      const g = (x.itensReconferir || []).find(i => String(i.pedido) === String(p.pedido));
      const itens = g && g.itens.length ? g.itens : [p.nome];
      itens.forEach((item, i) => lista.push({ rot, pedido: p.pedido, item, n: i + 1, de: itens.length }));
    }
  }
  return lista;
}
function alertaHtml() {
  const a = ALERTA[iAlerta % ALERTA.length];
  return `<span class="al-t">Reconferir</span><span class="al-p">${a.rot} ${esc(a.pedido)}</span><span class="al-i">${esc(a.item)}</span>${a.de > 1 ? `<span class="al-n">${a.n} de ${a.de}</span>` : ''}`;
}
function desenharCabeca() {
  const exp = lado === 'exp', r = D ? (exp ? D.expedicao : D.conferencia).resumo : null;
  const tem = ALERTA.length > 0, el = $('alerta');
  if (tem && el) { el.innerHTML = alertaHtml(); return; }
  $('cabeca').innerHTML = tem ? `<div class="al-faixa" id="alerta">${alertaHtml()}</div>`
    : `<div class="hd"><h2>${IC_GRADE}${exp ? 'Quadro da expedição' : 'Quadro da conferência'}</h2><span class="sub">${exp ? 'mais antigos primeiro' : (r ? r.total + ' hoje' : '')}</span></div>`;
}
const kp = (v, l, c) => `<div class="kp${c ? ' ' + c : ''}"><b>${v || 0}</b><span>${l}</span></div>`;
function desenhar() {
  const exp = lado === 'exp';
  $('tit').textContent = exp ? 'Expedição CD' : 'Conferência CD';
  $('barra-lb').textContent = exp ? 'Liberados do dia' : 'Liberadas do dia';
  $('cabeca').innerHTML = ''; desenharCabeca();
  if (!D) return;
  const x = exp ? D.expedicao : D.conferencia, r = x.resumo;
  $('kps').innerHTML = exp
    ? kp(r.separacao, 'P/ separar') + kp(r.em_separacao, 'Separando', r.em_separacao ? 'am' : '') + kp(r.aguardando_liberacao, 'Fila fiscal', r.aguardando_liberacao ? 'am' : '') + kp(r.reconferir, 'Reconferir', r.reconferir ? 'vm' : '') + kp(r.liberado, 'Liberados', 'ok')
    : kp(r.conf_pedido, 'Conf. pedido', r.conf_pedido ? 'am' : '') + kp(r.conf_coletor, 'Conf. coletor', r.conf_coletor ? 'am' : '') + kp(r.conferido, 'Fila fiscal', r.conferido ? 'am' : '') + kp(r.reconferir, 'Reconferir', r.reconferir ? 'vm' : '') + kp(r.liberado, 'Liberadas', 'ok');
  // a TV atualiza a cada 10 s: guarda a rolagem de cada coluna pra lista não pular pro topo
  const rolagem = [...document.querySelectorAll('.et-bd')].map(e => e.scrollTop);
  $('quadro').innerHTML = COLS[lado].map(c => {
    const L = [...(x.colunas[c.id] || [])]; if (c.ord) L.sort(c.ord);
    return `<div class="et ${L.length ? c.cor : 'z'}"><div class="et-hd"><b>${L.length}</b><span>${c.tit}</span></div><div class="et-bd">${L.length ? L.map(c.f).join('') : `<div class="et-vz">${c.vz || ''}</div>`}</div></div>`;
  }).join('');
  document.querySelectorAll('.et-bd').forEach((e, i) => { e.scrollTop = rolagem[i] || 0; });
  const pct = r.total > 0 ? Math.round(r.liberado / r.total * 100) : 0;
  $('barra').style.width = pct + '%'; $('pct').textContent = pct + '%'; $('concl').textContent = `${r.liberado} de ${r.total}`;
  desenharRodape();
}
function desenharRodape() {
  const el = $('stamp'); el.classList.toggle('erro', !!erro);
  el.innerHTML = IC_RELOGIO + (erro ? `Sem atualizar desde ${ultimoOk || '--:--'}` : `ERP ${ultimoOk || '--:--'}`);
  if (resta > 1) $('troca').textContent = `troca em ${resta} s`;
}

// Beep de sempre: dois toques quando algum pedido muda de coluna (não na primeira carga).
let audioCtx = null;
function tocarTom(quando, duracao) {
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.frequency.value = 1046;
  gain.gain.setValueAtTime(0.9, quando);
  gain.gain.exponentialRampToValueAtTime(0.001, quando + duracao);
  osc.start(quando); osc.stop(quando + duracao);
}
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    const agora = audioCtx.currentTime;
    tocarTom(agora, 0.28); tocarTom(agora + 0.35, 0.28);
  } catch (e) {}
}
document.addEventListener('click', () => {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {}); } catch (e) {}
});
let estadoAnterior = { exp: null, conf: null };
function mudou(chave, dados) {
  const novo = {};
  for (const c in dados.colunas) for (const it of dados.colunas[c]) novo[it.pedido] = c;
  const ant = estadoAnterior[chave]; estadoAnterior[chave] = novo;
  return !!ant && Object.keys(novo).some(p => ant[p] !== novo[p]);
}

function carregar() {
  // sem ?refresh=1: o servidor renova a cada 20 s e não deixa duas montagens correrem juntas no ERP
  fetch('/api/painel-cd?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(d => {
    if (d.error) throw new Error(d.error);
    D = d; erro = ''; ultimoOk = new Date(d.geradoEm).toTimeString().slice(0, 5);
    const a = mudou('exp', d.expedicao), b = mudou('conf', d.conferencia);
    if ((a || b) && !EMBED) beep();
    ALERTA = montarAlerta(d);
    desenhar();
  }).catch(e => { erro = e.message; desenharRodape(); });
}

function trocarTela() { lado = lado === 'exp' ? 'conf' : 'exp'; resta = TEMPO_TELA[lado]; emTelaDesde = Date.now(); rolou = []; pausaAte = []; document.querySelectorAll('.et-bd').forEach(e => { e.scrollTop = 0; }); desenhar(); }
// A tela só troca depois que toda coluna comprida mostrou até o último pedido (Tiago, 04/11: "aparecendo todas da coluna"), até MAX_TELA_SEG.
const faltaRolar = () => [...document.querySelectorAll('.et-bd')].some((el, i) => el.scrollHeight > el.clientHeight + 4 && !rolou[i]);
setInterval(() => {
  if (resta > 1) { resta--; $('troca').textContent = `troca em ${resta} s`; return; }
  if (faltaRolar() && Date.now() - emTelaDesde < MAX_TELA_SEG * 1000) { $('troca').textContent = 'mostrando todos'; return; }
  trocarTela();
}, 1000);
setInterval(() => { if (ALERTA.length > 1) { iAlerta = (iAlerta + 1) % ALERTA.length; desenharCabeca(); } }, SEG_ALERTA);

// Coluna que não cabe na tela rola sozinha devagar, para no fim e volta ao topo.
// A coluna é refeita a cada 10 s: o estado fica por posição, não no elemento.
setInterval(() => {
  document.querySelectorAll('.et-bd').forEach((el, i) => {
    if (el.scrollHeight <= el.clientHeight + 4) { el.scrollTop = 0; return; }
    const agora = Date.now();
    if (agora < (pausaAte[i] || 0)) return;
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 1) { rolou[i] = true; el.scrollTop = 0; pausaAte[i] = agora + 2500; } else el.scrollTop += 1;
  });
}, 60);

function relogio() {
  const d = new Date(), dias = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  $('relogio').textContent = `${dias[d.getDay()]} ${d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })} ${d.toTimeString().slice(0, 5)}`;
}
function fit() { $('tv').style.setProperty('--u', Math.min(innerWidth / 100, innerHeight / 56.25).toFixed(3)); }
addEventListener('resize', fit); fit();
$('btn-fs').addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); });
desenhar(); relogio(); setInterval(relogio, 1000);
carregar(); setInterval(carregar, 10000);
window.tvSlideAtual = () => lado === 'exp' ? 'Expedição' : 'Conferência';
if (!EMBED) { const hb = document.createElement('script'); hb.src = '/tv-heartbeat.js'; hb.dataset.painel = 'expedicao'; document.body.appendChild(hb); }
// Recarrega a página de tempos em tempos pra pegar a versão nova do HTML/JS, igual às outras TVs.
setTimeout(() => location.reload(), 20 * 60 * 1000);
</script>
