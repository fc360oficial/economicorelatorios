<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel CD — CAHU Distribuidora</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0E1626;--card:#101B33;--border:#1D2A46;--text:#FFFFFF;--text2:#AEB8CE;--text3:#6E7B98}
html,body{height:100%;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.wrap{display:flex;flex-direction:column;height:100vh;padding:14px 18px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-shrink:0}
.hdr .brand{display:flex;align-items:center;gap:12px}
.hdr .brand img{height:34px}
.hdr .brand b{font-size:22px;font-weight:900;letter-spacing:-.5px}
.hdr .brand span{font-size:12px;color:#F5B800;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.hdr .clock{font-size:18px;font-weight:700;color:var(--text2);font-variant-numeric:tabular-nums}

.secoes{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.sec{flex:1;display:flex;flex-direction:column;min-height:0}
.sec-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-shrink:0}
.sec-hdr .ic{font-size:18px}
.sec-hdr h2{font-size:14px;font-weight:800;letter-spacing:.3px}
.sec-hdr .sub{font-size:10px;color:var(--text3);margin-left:auto}

.colunas{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.col-hd{padding:6px 8px;text-align:center;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:#0E1626}
.col-hd.separacao{background:#F5D400}
.col-hd.em_separacao{background:#E24C63;color:#fff}
.col-hd.aguardando_liberacao{background:#3B82F6;color:#fff}
.col-hd.reconferir{background:#F5A623;color:#fff}
.col-hd.liberado{background:#22C55E;color:#0E1626}
.col-body{flex:1;overflow-y:auto;background:var(--card);padding:4px}
.item{padding:6px 4px;text-align:center;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:none}
.item .num{font-size:15px;font-weight:900;color:#5EEAD4}
.item .nome{font-size:9px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.empty-col{padding:14px 6px;text-align:center;color:var(--text3);font-size:10px}

.stamp{text-align:center;font-size:10px;color:var(--text3);margin-top:6px;flex-shrink:0}
</style>
</head>
<body>

<div class="wrap">
  <div class="hdr">
    <div class="brand"><img src="/logo-cahu.png" onerror="this.style.display='none'"><b>CAHU</b><span>Distribuidora · Centro de Distribuição</span></div>
    <div class="clock" id="relogio">--:--:--</div>
  </div>

  <div class="secoes">
    <div class="sec">
      <div class="sec-hdr"><span class="ic">🚚</span><h2>Expedição — Saídas</h2><span class="sub" id="sub-exp"></span></div>
      <div class="colunas" id="colunas-exp"></div>
    </div>
    <div class="sec">
      <div class="sec-hdr"><span class="ic">📥</span><h2>Conferência — Entradas</h2><span class="sub" id="sub-conf"></span></div>
      <div class="colunas" id="colunas-conf"></div>
    </div>
  </div>

  <div class="stamp" id="stamp"></div>
</div>

<script>
const COLS = [
  { id: 'separacao', titulo: 'Pedido p/ Separação' },
  { id: 'em_separacao', titulo: 'Pedido em Separação' },
  { id: 'aguardando_liberacao', titulo: 'Aguardando Liberação' },
  { id: 'reconferir', titulo: 'Reconferir' },
  { id: 'liberado', titulo: 'Pedido Liberado' }
];

function renderSecao(elId, lado) {
  document.getElementById(elId).innerHTML = COLS.map(c => `
    <div class="col">
      <div class="col-hd ${c.id}">${c.titulo}</div>
      <div class="col-body" id="cb-${elId}-${c.id}"><div class="empty-col">—</div></div>
    </div>`).join('');
}

function preencherColuna(elId, colId, itens) {
  const el = document.getElementById(`cb-${elId}-${colId}`);
  if (!itens || !itens.length) { el.innerHTML = '<div class="empty-col">—</div>'; return; }
  el.innerHTML = itens.map(it => `
    <div class="item">
      <div class="num">${it.pedido}</div>
      <div class="nome">${it.nome}</div>
    </div>`).join('');
}

renderSecao('colunas-exp');
renderSecao('colunas-conf');

function carregar() {
  fetch('/api/painel-cd?refresh=1').then(r => r.json()).then(d => {
    if (d.error) throw new Error(d.error);
    for (const c of COLS) preencherColuna('colunas-exp', c.id, d.expedicao.colunas[c.id]);
    for (const c of COLS) preencherColuna('colunas-conf', c.id, d.conferencia.colunas[c.id]);
    document.getElementById('sub-exp').textContent = d.expedicao.resumo.total + ' hoje';
    document.getElementById('sub-conf').textContent = d.conferencia.resumo.total + ' hoje';
    document.getElementById('stamp').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR');
  }).catch(e => {
    document.getElementById('stamp').textContent = 'Erro ao atualizar: ' + e.message;
  });
}

function relogio() {
  document.getElementById('relogio').textContent = new Date().toLocaleTimeString('pt-BR');
}

relogio();
setInterval(relogio, 1000);
carregar();
setInterval(carregar, 20000);
// Recarrega a página inteira de tempos em tempos pra sempre pegar a versão
// mais nova do HTML/JS publicada, igual os outros painéis de TV do sistema.
setTimeout(() => location.reload(), 20 * 60 * 1000);
</script>
</body>
</html>
