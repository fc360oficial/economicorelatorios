<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel CD — CAHU Distribuidora</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0E1626;--card:#101B33;--border:#1D2A46;--text:#FFFFFF;--text2:#AEB8CE;--text3:#6E7B98}
html,body{height:100%;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;display:flex;flex-direction:column}

/* BARRA AMARELA — mesmo padrão dos outros painéis de TV do sistema */
.brand-bar{height:36px;flex-shrink:0;background:#FACC15;display:flex;align-items:center;justify-content:center;position:relative;z-index:200}
.b-left{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;align-items:center;z-index:201}
.b-left img{height:86px}
.b-name{font-size:15px;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:#0E1626}
.b-right{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:14px}
.b-live{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(14,22,38,.65)}
.b-live-dot{width:6px;height:6px;border-radius:50%;background:#137A48;animation:bpulse 2s infinite}
@keyframes bpulse{0%,100%{opacity:1}50%{opacity:.3}}
.b-clock{font-size:14px;font-weight:900;color:#0E1626;font-variant-numeric:tabular-nums}
.b-troca{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(14,22,38,.65)}
.b-btn-fs{background:rgba(14,22,38,.15);border:1px solid rgba(14,22,38,.25);border-radius:6px;color:#0E1626;font-size:14px;width:26px;height:26px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.b-btn-fs:hover{background:rgba(14,22,38,.3)}

.wrap{flex:1;display:flex;flex-direction:column;padding:14px 18px;min-height:0}

.secoes{flex:1;display:flex;flex-direction:column;min-height:0}
.sec{flex:1;display:flex;flex-direction:column;min-height:0}
.sec.hidden{display:none}
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-shrink:0}
.sec-hdr .ic{font-size:24px}
.sec-hdr h2{font-size:20px;font-weight:800;letter-spacing:.5px;flex:1;text-align:center;text-transform:uppercase}
.sec-hdr .sub{font-size:13px;color:var(--text3);margin-left:auto}

.aviso-reconferir{flex-shrink:0;margin-bottom:12px;padding:22px 16px;border-radius:12px;background:#FF1E3C;color:#fff;
  border:3px solid #fff;font-size:34px;font-weight:900;text-align:center;letter-spacing:.5px;
  text-transform:uppercase;animation:piscar 1s step-start infinite}
.aviso-reconferir .aviso-ic{margin-right:10px}
@keyframes piscar{50%{opacity:.2}}

.colunas{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.col-hd{padding:8px 8px 10px;text-align:center;color:#0E1626}
.col-hd .titulo{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.col-hd .contagem{font-size:30px;font-weight:900;line-height:1.15}
.col-hd.c1{background:#FACC15}
.col-hd.c2{background:#E24C63;color:#fff}
.col-hd.c3{background:#3B82F6;color:#fff}
.col-hd.c4{background:#F5A623;color:#fff}
.col-hd.c5{background:#22C55E;color:#0E1626}
.col-body{flex:1;overflow-y:hidden;background:var(--card);padding:6px}
.item{padding:10px 6px;text-align:center;border-bottom:1px solid var(--border);transition:background .4s}
.item:last-child{border-bottom:none}
.item.novo{background:#F5B80033}
.item .num{font-size:24px;font-weight:900;color:#5EEAD4}
.item .nome{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.empty-col{padding:20px 6px;text-align:center;color:var(--text3);font-size:13px}

.progresso{flex-shrink:0;margin-top:12px;display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px}
.progresso .lbl{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);white-space:nowrap}
.progresso .barra{flex:1;height:12px;background:var(--border);border-radius:6px;overflow:hidden}
.progresso .barra-fill{height:100%;background:linear-gradient(90deg,#22C55E,#5EEAD4);border-radius:6px;transition:width .5s}
.progresso .pct{font-size:16px;font-weight:900;width:52px;text-align:right;flex-shrink:0}
.progresso .concl{font-size:12px;color:var(--text3);white-space:nowrap;flex-shrink:0}
.progresso .concl b{color:var(--text)}

.stamp{text-align:center;font-size:10px;color:var(--text3);margin-top:6px;flex-shrink:0}
</style>
</head>
<body>

<div class="brand-bar">
  <div class="b-left"><img id="logo-cahu" src="/logo-cahu.png" onload="removerFundoBranco(this)" onerror="this.style.display='none'"></div>
  <div class="b-name">Centro de Distribuição</div>
  <div class="b-right">
    <span class="b-troca" id="contador-tela"></span>
    <span class="b-clock" id="relogio">--:--:--</span>
    <button class="b-btn-fs" id="btn-fs" title="Tela cheia">⛶</button>
  </div>
</div>

<div class="wrap">
  <div class="secoes">
    <div class="sec" id="sec-exp">
      <div class="sec-hdr"><span class="ic">🚚</span><h2>Expedição — Saídas</h2><span class="sub" id="sub-exp"></span></div>
      <div class="aviso-reconferir" id="aviso-reconferir-exp" style="display:none">
        <span class="aviso-ic">⚠️</span> RECONFERIR: <span id="aviso-reconferir-texto-exp"></span>
      </div>
      <div class="colunas" id="colunas-exp"></div>
      <div class="progresso">
        <span class="lbl">Progresso geral do dia</span>
        <div class="barra"><div class="barra-fill" id="barra-exp" style="width:0%"></div></div>
        <span class="pct" id="pct-exp">0%</span>
        <span class="concl">Concluídas <b id="concl-exp">0 / 0</b></span>
      </div>
    </div>
    <div class="sec hidden" id="sec-conf">
      <div class="sec-hdr"><span class="ic">📥</span><h2>Conferência — Entradas</h2><span class="sub" id="sub-conf"></span></div>
      <div class="aviso-reconferir" id="aviso-reconferir-conf" style="display:none">
        <span class="aviso-ic">⚠️</span> RECONFERIR: <span id="aviso-reconferir-texto-conf"></span>
      </div>
      <div class="colunas" id="colunas-conf"></div>
      <div class="progresso">
        <span class="lbl">Progresso geral do dia</span>
        <div class="barra"><div class="barra-fill" id="barra-conf" style="width:0%"></div></div>
        <span class="pct" id="pct-conf">0%</span>
        <span class="concl">Concluídas <b id="concl-conf">0 / 0</b></span>
      </div>
    </div>
  </div>

  <div class="stamp" id="stamp"></div>
</div>

<script>
// A logo salva tem fundo branco opaco (não é PNG transparente de verdade) —
// desenha num canvas e apaga (alpha=0) todo pixel quase-branco, deixando só
// o desenho preto flutuando no fundo amarelo da barra.
function removerFundoBranco(img) {
  if (img.dataset.processado) return; // troca de src abaixo dispara onload de novo — evita loop
  try {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const dados = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const px = dados.data;
    for (let i = 0; i < px.length; i += 4) {
      if (px[i] > 235 && px[i + 1] > 235 && px[i + 2] > 235) px[i + 3] = 0;
    }
    ctx.putImageData(dados, 0, 0);
    img.dataset.processado = '1';
    img.src = canvas.toDataURL('image/png');
  } catch (e) {} // se der erro (ex: sem canvas), mantém a logo original com fundo branco mesmo
}

// Cada lado tem seu próprio conjunto de colunas — Expedição e Conferência
// usam nomes de status diferentes no painel legado do sistema.
const COLS_EXP = [
  { id: 'separacao', cor: 'c1', titulo: 'Pedido p/ Separação' },
  { id: 'em_separacao', cor: 'c2', titulo: 'Pedido em Separação' },
  { id: 'aguardando_liberacao', cor: 'c3', titulo: 'Aguardando Liberação' },
  { id: 'reconferir', cor: 'c4', titulo: 'Reconferir' },
  { id: 'liberado', cor: 'c5', titulo: 'Pedido Liberado' }
];
const COLS_CONF = [
  { id: 'conf_pedido', cor: 'c1', titulo: 'Conf. Pedido' },
  { id: 'conf_coletor', cor: 'c2', titulo: 'Conf. Coletor' },
  { id: 'conferido', cor: 'c3', titulo: 'Conferido' },
  { id: 'reconferir', cor: 'c4', titulo: 'Reconferir' },
  { id: 'liberado', cor: 'c5', titulo: 'Liberado' }
];

function renderSecao(elId, cols) {
  document.getElementById(elId).innerHTML = cols.map(c => `
    <div class="col">
      <div class="col-hd ${c.cor}">
        <div class="contagem" id="ct-${elId}-${c.id}">0</div>
        <div class="titulo">${c.titulo}</div>
      </div>
      <div class="col-body" id="cb-${elId}-${c.id}"><div class="empty-col">—</div></div>
    </div>`).join('');
}

// Toca um beep curto (Web Audio, sem precisar de arquivo de áudio) quando
// algum pedido muda de coluna/status — chama atenção pra quem tá de olho
// na TV mas não fixado nela o tempo todo.
let audioCtx = null;
function tocarTom(quando, duracao) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.frequency.value = 1046; // mais agudo, mais fácil de notar de longe
  gain.gain.setValueAtTime(0.9, quando); // bem mais alto que antes (era 0.25)
  gain.gain.exponentialRampToValueAtTime(0.001, quando + duracao);
  osc.start(quando); osc.stop(quando + duracao);
}

function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    // Navegador começa o áudio "suspenso" até ter algum clique na página —
    // tenta destravar sozinho toda vez (não garante funcionar sem clique
    // nenhum, mas cobre o caso de já ter tido qualquer interação).
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    const agora = audioCtx.currentTime;
    // dois toques em sequência em vez de um só — chama mais atenção numa
    // sala com barulho de fundo (motor de empilhadeira, conversa etc.)
    tocarTom(agora, 0.28);
    tocarTom(agora + 0.35, 0.28);
  } catch (e) {}
}

// Qualquer clique/toque na tela já destrava o áudio pro resto da sessão —
// cobre o caso do botão de tela cheia (ou qualquer outro toque acidental).
document.addEventListener('click', () => {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}, { once: false });

// Estado anterior (pedido -> status) de cada lado, pra detectar o que mudou
// entre uma atualização e outra e destacar/apitar só o que de fato mexeu.
let estadoAnterior = { exp: {}, conf: {} };

function preencherSecao(elId, ladoKey, cols, dados) {
  let mudou = false;
  const novoEstado = {};
  for (const c of cols) {
    const itens = dados.colunas[c.id] || [];
    for (const it of itens) novoEstado[it.pedido] = c.id;
  }
  // primeira carga não conta como "mudança" (senão apita tudo de uma vez ao abrir a página)
  const primeiraCarga = Object.keys(estadoAnterior[ladoKey]).length === 0;
  if (!primeiraCarga) {
    for (const pedido in novoEstado) {
      if (estadoAnterior[ladoKey][pedido] !== novoEstado[pedido]) { mudou = true; break; }
    }
  }
  estadoAnterior[ladoKey] = novoEstado;

  for (const c of cols) {
    const el = document.getElementById(`cb-${elId}-${c.id}`);
    const itens = dados.colunas[c.id] || [];
    document.getElementById(`ct-${elId}-${c.id}`).textContent = itens.length;
    if (!itens.length) { el.innerHTML = '<div class="empty-col">—</div>'; continue; }
    el.innerHTML = itens.map(it => `
      <div class="item">
        <div class="num">${it.pedido}</div>
        <div class="nome">${it.nome}</div>
      </div>`).join('');
  }

  // Progresso do dia = % que já chegou na última coluna (liberado)
  const total = dados.resumo.total || 0;
  const liberado = dados.resumo.liberado || 0;
  const pct = total > 0 ? Math.round((liberado / total) * 100) : 0;
  const ladoSufixo = ladoKey; // 'exp' ou 'conf'
  document.getElementById(`barra-${ladoSufixo}`).style.width = pct + '%';
  document.getElementById(`pct-${ladoSufixo}`).textContent = pct + '%';
  document.getElementById(`concl-${ladoSufixo}`).textContent = `${liberado} / ${total}`;

  return mudou;
}

renderSecao('colunas-exp', COLS_EXP);
renderSecao('colunas-conf', COLS_CONF);

// Lista de descrições em reconferência agora — só nome do item, sem
// quantidade nem código de barra (pedido explícito do Tiago). Pode ter mais
// de uma conferência em reconferir ao mesmo tempo (2 conferentes, 2 notas)
// -- cicla todos os itens de UM pedido primeiro, só depois passa pro
// próximo pedido, nunca mistura os dois. Expedição e Conferência têm cada
// uma seu próprio banner e estado, independentes um do outro.
const avisoReconferir = {
  exp: { itens: [], idx: 0 },
  conf: { itens: [], idx: 0 }
};

function atualizarAvisoReconferir(secao) {
  const st = avisoReconferir[secao];
  const el = document.getElementById('aviso-reconferir-' + secao);
  if (!st.itens.length) { el.style.display = 'none'; return; }
  el.style.display = '';
  st.idx = st.idx % st.itens.length;
  const atual = st.itens[st.idx];
  document.getElementById('aviso-reconferir-texto-' + secao).textContent = `PEDIDO ${atual.pedido} — ${atual.descricao}`;
  st.idx++;
}
setInterval(() => { atualizarAvisoReconferir('exp'); atualizarAvisoReconferir('conf'); }, 4000);

function achatarItensReconferir(itensReconferir) {
  const lista = [];
  for (const grupo of (itensReconferir || [])) {
    for (const desc of grupo.itens) lista.push({ pedido: grupo.pedido, descricao: desc });
  }
  return lista;
}

function carregar() {
  fetch('/api/painel-cd?refresh=1').then(r => r.json()).then(d => {
    if (d.error) throw new Error(d.error);
    const mudouExp = preencherSecao('colunas-exp', 'exp', COLS_EXP, d.expedicao);
    const mudouConf = preencherSecao('colunas-conf', 'conf', COLS_CONF, d.conferencia);
    if (mudouExp || mudouConf) beep();

    avisoReconferir.exp.itens = achatarItensReconferir(d.expedicao.itensReconferir);
    avisoReconferir.exp.idx = 0;
    atualizarAvisoReconferir('exp');
    avisoReconferir.conf.itens = achatarItensReconferir(d.conferencia.itensReconferir);
    avisoReconferir.conf.idx = 0;
    atualizarAvisoReconferir('conf');

    document.getElementById('sub-exp').textContent = d.expedicao.resumo.total + ' hoje';
    document.getElementById('sub-conf').textContent = d.conferencia.resumo.total + ' hoje';
    document.getElementById('stamp').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR');
  }).catch(e => {
    document.getElementById('stamp').textContent = 'Erro ao atualizar: ' + e.message;
  });
}

function relogio() {
  document.getElementById('relogio').textContent = new Date().toLocaleTimeString('pt-BR');
}

// Alterna tela cheia entre Expedição e Conferência — mais legível que dividir
// a tela, principalmente com 5 colunas cada. Tempos diferentes por tela
// (Expedição fica mais tempo, tem mais volume de pedido) com contador
// regressivo visível no canto.
const TELAS = [
  { id: 'sec-exp', duracao: 180 },
  { id: 'sec-conf', duracao: 30 }
];
let telaAtual = 0;
let contagemTela = TELAS[0].duracao;

function tickTela() {
  contagemTela--;
  if (contagemTela <= 0) {
    document.getElementById(TELAS[telaAtual].id).classList.add('hidden');
    telaAtual = (telaAtual + 1) % TELAS.length;
    document.getElementById(TELAS[telaAtual].id).classList.remove('hidden');
    contagemTela = TELAS[telaAtual].duracao;
  }
  document.getElementById('contador-tela').textContent = 'troca em ' + contagemTela + 's';
}
setInterval(tickTela, 1000);
tickTela();

// Carrossel automático — qualquer coluna que não caiba todos os itens na
// tela rola sozinha devagar (em vez de depender de alguém arrastar a barra
// de rolagem, que não faz sentido numa TV sem ninguém mexendo nela). Roda
// pra todas as colunas de ambos os lados, genérico, não é fixo numa coluna
// específica.
const carrosselPausadoAte = new WeakMap();
function tickCarrosseis() {
  document.querySelectorAll('.col-body').forEach(el => {
    if (el.scrollHeight <= el.clientHeight + 4) { el.scrollTop = 0; return; }
    const agora = Date.now();
    const pausadoAte = carrosselPausadoAte.get(el) || 0;
    if (agora < pausadoAte) return;
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 1) {
      el.scrollTop = 0;
      carrosselPausadoAte.set(el, agora + 2500);
    } else {
      el.scrollTop += 1;
    }
  });
}
setInterval(tickCarrosseis, 60);

// Mesmo padrão dos outros painéis de TV do sistema.
document.getElementById('btn-fs').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
});

relogio();
setInterval(relogio, 1000);
carregar();
setInterval(carregar, 5000);
// Recarrega a página inteira de tempos em tempos pra sempre pegar a versão
// mais nova do HTML/JS publicada, igual os outros painéis de TV do sistema.
setTimeout(() => location.reload(), 20 * 60 * 1000);
</script>
</body>
</html>
