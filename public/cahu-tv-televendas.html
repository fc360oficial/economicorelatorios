<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/design-system.css">
<script src="/nav.js" defer></script>
<title>TV Televendas — CAHU Distribuidora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#EBEBE9;--surface:#FFFFFF;--surface-2:#E4E4E1;--border:#DADAD6;--border-strong:#C9C9C4;--ink:#0E1626;--ink-2:#4E5A72;--ink-3:#98A0B3;--brand:#F5B800;--brand-ink:#6B4E00;--green:#137A48;--red:#C22F49;--font:'InterVar','Inter','Segoe UI',system-ui,-apple-system,sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh}
.main{padding:24px;max-width:1100px}
.page-hdr{margin-bottom:18px}.page-hdr h1{font-size:21px;font-weight:800}.page-hdr p{font-size:12px;color:var(--ink-3);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 22px;box-shadow:0 1px 2px rgba(22,35,63,.04);margin-bottom:14px}
.card h2{font-size:14px;font-weight:800;margin-bottom:10px}
.acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.btn{border:none;border-radius:9px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-amber{background:var(--brand);color:var(--brand-ink)}.btn-amber:hover{background:#E5AC00}
.btn-sec{background:var(--surface);color:var(--ink);border:1px solid var(--border-strong)}.btn-sec:hover{background:var(--surface-2)}
.btn-sm{padding:5px 11px;font-size:11.5px}
.status{font-size:12.5px;color:var(--ink-2)}.status b{color:var(--ink)}.pos{color:var(--green);font-weight:700}.neg{color:var(--red);font-weight:700}.mut{color:var(--ink-3)}
.linha{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:10px;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.fg select,.fg input[type=text],.fg input[type=number]{background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--ink);padding:8px 11px;font-size:12.5px;outline:none;min-width:150px;font-family:inherit}
.fg input[type=text]{min-width:320px}.fg input[type=number]{min-width:80px;width:90px;text-align:center;font-weight:700}
.fg select:focus,.fg input:focus{border-color:var(--brand)}
.chk{display:flex;gap:6px;align-items:center;font-size:12.5px;padding-bottom:9px}
.links{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:12.5px}
.links .lb{font-size:10px;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.links code{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-size:14px;font-family:ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links code.g{font-size:16px;font-weight:700;border-color:var(--brand);background:#FFF8DE}
.como{font-size:12px;color:var(--ink-2);line-height:1.55;margin-top:12px}.como code{background:var(--bg);padding:1px 5px;border-radius:4px}
.dest{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.dest .d{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:5px 8px;font-size:12px;background:#FAFAF8}.dest .d img{width:32px;height:32px;object-fit:contain;background:#fff;border-radius:5px}.dest .d b{font-variant-numeric:tabular-nums}.dest .d button{border:none;background:none;color:var(--red);font-weight:700;cursor:pointer;font-family:inherit;font-size:16px}
.res{max-height:280px;overflow:auto;margin-top:8px}.res .r{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--bg);font-size:12px}.res .r img{width:28px;height:28px;object-fit:contain;background:#fff;border:1px solid var(--bg);border-radius:4px}.res .r span{flex:1}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:700;background:var(--bg)}
</style>
</head>
<body>
<div class="main">
  <div class="page-hdr">
    <h1>TV Televendas — CAHU Distribuidora</h1>
    <p>Painel que roda na TV do televendas: produtos da Tabela Retirada com estoque no CD, foto do app e a tela do lançamento do app. Salvou aqui, a TV atualiza em até 1 minuto.</p>
  </div>
  <div id="conteudo"><p class="mut">Carregando…</p></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtR = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
async function api(url, opt) { const r = await fetch(url, opt); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; }
const API = '/api/cahu-distribuidora/tv-config';

let TV = null;          // { config, linkTV, linkCurto, linkLan, totais }
let DEST_INFO = {};     // ean → { nome, preco, imagem }
async function carregarTV() {
  try { TV = await api(API); renderTV(); } catch (e) { $('#conteudo').innerHTML = `<p class="neg">${esc(e.message)}</p>`; }
}
function renderTV() {
  const c = TV.config, t = TV.totais, a = c.app || {};
  const sel = (id, ops, v) => `<select id="${id}">${ops.map(([k, l]) => `<option value="${k}"${k === v ? ' selected' : ''}>${l}</option>`).join('')}</select>`;
  $('#conteudo').innerHTML = `
  <div class="acoes"><button class="btn btn-amber" onclick="salvarTV()">Salvar</button><button class="btn btn-sec" onclick="window.open(TV.linkTV, '_blank')">Abrir a TV</button><span class="status" id="tv-status">${t ? `${t.erp} produtos na Retirada com estoque · ${t.comFoto} com foto · <b>${t.exibidos} na TV</b>` : 'sem dados do ERP ainda'}</span></div>
  <div class="card"><h2>Link da TV</h2>
    <div class="links">
      <span class="lb">Digitar na TV</span><code class="g">${esc(TV.linkCurto)}</code><button class="btn btn-sec btn-sm" onclick="copiar(TV.linkCurto)">Copiar</button>
      <span class="lb">Na rede da loja</span><code>${esc(TV.linkLan)}</code><button class="btn btn-sec btn-sm" onclick="copiar(TV.linkLan)">Copiar</button>
      <span class="lb">Completo</span><code title="Com o código de segurança">${esc(TV.linkTV)}</code><button class="btn btn-sec btn-sm" onclick="novoTokenTV()" title="O link completo antigo para de funcionar; os atalhos curtos continuam">Gerar novo código</button>
    </div>
    <p class="como"><b>Tela cheia:</b> abra o link na TV (ou no PC ligado nela) e toque no botão <b>Tela cheia</b> que aparece, ou tecla F. Pra já ligar em tela cheia, crie um atalho do Chrome com <code>chrome.exe --kiosk "${esc(TV.linkCurto)}/kiosk"</code>. Também dá pra entrar pela tela de login escolhendo <b>Painel TV — Televendas CAHU</b>.</p></div>
  <div class="card"><h2>Como passa</h2><div class="linha">
    <div class="fg"><label>Modo</label>${sel('tv-modo', [['individual', 'Individual (um produto por vez)'], ['grade', 'Grade (8 por tela)'], ['misto', 'Misto (grade + destaques em tela cheia)']], c.modo)}</div>
    <div class="fg"><label>Cor</label>${sel('tv-tema', [['escuro', 'Escuro (preto + amarelo)'], ['amarelo', 'Amarelo CAHU']], c.tema)}</div>
    <div class="fg"><label>Segundos por slide</label><input type="number" id="tv-seg" min="3" max="30" value="${c.segundos}"></div>
    <div class="fg"><label>Tela do app a cada</label><input type="number" id="tv-cada" min="2" max="20" value="${c.appCada}"></div>
    <label class="chk"><input type="checkbox" id="tv-foto"${c.soComFoto ? ' checked' : ''}> só produtos com foto no app</label>
  </div></div>
  <div class="card"><h2>Tela do app (entra a cada N slides)</h2><div class="linha">
    <div class="fg"><label>Título</label><input type="text" id="tv-titulo" maxlength="120" value="${esc(a.titulo || '')}"></div>
    <div class="fg"><label>Frase</label><input type="text" id="tv-frase" maxlength="120" style="min-width:520px" value="${esc(a.frase || '')}"></div>
    ${[0, 1, 2].map(i => `<div class="fg"><label>Chamada ${i + 1}</label><input type="text" id="tv-ch${i}" maxlength="40" style="min-width:190px" value="${esc((a.chamadas || [])[i] || '')}"></div>`).join('')}
    <div class="fg"><label>Link do QR code (vazio = "Em breve")</label><input type="text" id="tv-qr" placeholder="https://…" value="${esc(a.qrUrl || '')}"></div>
  </div></div>
  <div class="card"><h2>Destaques (aparecem sozinhos em tela cheia no modo Misto)</h2>
    <div class="dest" id="tv-dest"></div>
    <div class="linha"><div class="fg"><label>Buscar produto</label><input type="text" id="tv-busca" placeholder="nome ou código de barras" oninput="buscarTV()"></div></div>
    <div class="res" id="tv-res"></div></div>`;
  renderDestaquesTV();
}
function renderDestaquesTV() {
  const d = TV.config.destaques || [];
  $('#tv-dest').innerHTML = d.length ? d.map(e => { const i = DEST_INFO[e] || {}; return `<div class="d">${i.imagem ? `<img src="${esc(i.imagem)}" alt="">` : ''}<span>${esc(i.nome || e)}</span>${i.preco != null ? `<b>${fmtR(i.preco)}</b>` : ''}<button type="button" onclick="tirarDestaqueTV('${e}')" title="Tirar dos destaques">×</button></div>`; }).join('') : '<span class="mut" style="font-size:12px">nenhum destaque marcado — no modo Misto a TV roda só a grade</span>';
}
let BUSCA_T = null;
function buscarTV() {
  clearTimeout(BUSCA_T);
  BUSCA_T = setTimeout(async () => {
    const q = $('#tv-busca').value.trim(); if (q.length < 2) { $('#tv-res').innerHTML = ''; return; }
    try {
      const r = await api(API + '/produtos?q=' + encodeURIComponent(q));
      r.forEach(p => DEST_INFO[p.ean] = p);
      const marcados = new Set(TV.config.destaques || []);
      $('#tv-res').innerHTML = r.length ? r.map(p => `<div class="r">${p.imagem ? `<img src="${esc(p.imagem)}" alt="">` : '<span class="pill">sem foto</span>'}<span>${esc(p.nome)} <span class="mut">${p.ean}</span></span><b>${fmtR(p.preco)}</b>${marcados.has(p.ean) ? '<span class="pos">marcado</span>' : `<button class="btn btn-sec btn-sm" onclick="marcarDestaqueTV('${p.ean}')">Marcar</button>`}</div>`).join('') : '<p class="mut" style="font-size:12px">nada encontrado na Tabela Retirada com estoque</p>';
    } catch (e) { $('#tv-res').innerHTML = `<p class="neg">${esc(e.message)}</p>`; }
  }, 250);
}
function marcarDestaqueTV(ean) { const d = TV.config.destaques || []; if (!d.includes(ean)) d.push(ean); TV.config.destaques = d; renderDestaquesTV(); buscarTV(); }
function tirarDestaqueTV(ean) { TV.config.destaques = (TV.config.destaques || []).filter(x => x !== ean); renderDestaquesTV(); buscarTV(); }
async function salvarTV() {
  const body = { modo: $('#tv-modo').value, tema: $('#tv-tema').value, segundos: +$('#tv-seg').value, appCada: +$('#tv-cada').value, soComFoto: $('#tv-foto').checked, destaques: TV.config.destaques || [],
    app: { titulo: $('#tv-titulo').value, frase: $('#tv-frase').value, chamadas: [0, 1, 2].map(i => $('#tv-ch' + i).value).filter(Boolean), qrUrl: $('#tv-qr').value } };
  try { const r = await api(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); TV.config = r.config; $('#tv-status').innerHTML = '<span class="pos">Salvo · a TV atualiza em até 1 minuto</span>'; }
  catch (e) { alert(e.message); }
}
async function novoTokenTV() {
  if (!confirm('Gerar um novo código? O link completo atual para de funcionar. Os atalhos /tvcahu continuam valendo.')) return;
  try { const r = await api(API + '/novo-token', { method: 'POST' }); TV.linkTV = r.linkTV; TV.config.token = r.config.token; renderTV(); } catch (e) { alert(e.message); }
}
function copiar(txt) { navigator.clipboard.writeText(txt).then(() => { $('#tv-status').innerHTML = '<span class="pos">Copiado</span>'; }, () => alert(txt)); }
carregarTV();
</script>
</body>
</html>
