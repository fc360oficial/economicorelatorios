<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/design-system.css">
<script src="/nav.js" defer></script>
<script src="/gente-ui.js"></script>
<title>Gestão Disciplinar — DP / RH · Econômico Supermercados</title>
<!-- DP / RH › Gestão Disciplinar (27/10/2026). O gerente solicita (4 etapas) → o RH analisa, define a medida, fundamenta e emite o PDF
     (advertência escrita ou termo de suspensão) → a Coordenação avalia os indeferimentos → o RH encaminha ao jurídico quando determinado
     → o gerente comunica, colhe assinatura (ou registra recusa) e devolve digitalizado → o RH confere e encerra → suspensão vira pendência
     de folha pro DP → a Diretoria só acompanha. Regras/PDF em lib/disciplinar.js, rotas em lib/disciplinar-rotas.js. Mesma casca das
     telas Termos de Escala / Escalas (rail nativo + abas); permissões = designação da central de pessoas. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--font);background:var(--pap);color:var(--ink);min-height:100vh;font-size:13px}
.content{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:58px;background:var(--crd);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:40}.topbar>a.ds-btn{flex:none}
.topbar h1{font-size:16px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}.topbar h1 .crumb{color:var(--ink3);font-weight:600}.topbar h1 .ds-ic{color:var(--ink3)}
.topbar p{font-size:11.5px;color:var(--ink3);margin-top:1px}.topbar .end{margin-left:auto;display:flex;align-items:center;gap:12px}
.who{display:flex;align-items:center;gap:9px;font-size:12px}.who .ds-avatar{background:#101B33;color:#FFC933}.who b{display:block;font-size:12.5px}.who span{color:var(--ink3);font-size:11px}
.modnav{background:var(--crd);border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;align-items:stretch;padding:0 14px;position:sticky;top:58px;z-index:39}
.modnav a{display:flex;align-items:center;gap:6px;padding:0 12px;height:42px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;user-select:none}
.modnav a .ds-ic{width:15px;height:15px;color:var(--ink3)}.modnav a:hover{color:var(--ink)}.modnav a.on{color:var(--ink);border-bottom-color:var(--am)}.modnav a.on .ds-ic{color:var(--amk)}
.modnav a .b{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--neg);color:#fff;font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.page{padding:20px 24px 40px;max-width:1700px;width:100%}
.aviso{background:var(--amw);border:1px solid var(--am-ln);color:var(--amk);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.5}.aviso.neg{background:var(--negw);border-color:#F1B9C3;color:var(--neg)}.aviso.inf{background:var(--infw);border-color:var(--inf);color:var(--inf)}.aviso.ok{background:var(--posw);border-color:#B9E2C8;color:var(--pos)}
.hint{font-size:11.5px;color:var(--ink2);margin-top:8px;line-height:1.5}.hint b{color:var(--ink)}
.empty{padding:36px 20px;text-align:center;color:var(--ink3);font-size:12.5px}.empty b{display:block;color:var(--ink2);font-size:13.5px;margin-bottom:3px}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--wsh) 25%,var(--ln) 50%,var(--wsh) 75%);background-size:200% 100%;animation:sk 1.3s ease infinite;margin:10px 14px}@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--posw);color:var(--pos)}.pill.bad{background:var(--negw);color:var(--neg)}.pill.warn{background:var(--amw);color:var(--amk)}.pill.info{background:var(--infw);color:var(--inf)}.pill.gr{background:var(--wsh);color:var(--ink2)}.pill.pur{background:#EFE7FB;color:#5B32A8}
.etq{display:inline-block;background:#101B33;color:#FFC933;font-weight:800;font-size:10px;padding:2px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}.etq.cd{background:var(--inf);color:#fff}
.prot{font-family:var(--mono,ui-monospace,monospace);font-weight:700;font-size:12px;color:var(--ink)}
/* painel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--crd);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;gap:3px;border-left:4px solid var(--ln2)}.kpi:hover{box-shadow:var(--sh-sm)}.kpi.on{outline:2px solid var(--am)}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1}.kpi .l{font-size:11px;color:var(--ink2);font-weight:600;line-height:1.3}.kpi.warn{border-left-color:var(--am)}.kpi.bad{border-left-color:var(--neg)}.kpi.ok{border-left-color:var(--pos)}.kpi.info{border-left-color:var(--inf)}.kpi.pur{border-left-color:#5B32A8}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:9px 10px;margin-bottom:12px}
.tb .ds-input,.tb .ds-select{height:34px;font-size:12.5px}.tb .ds-input{min-width:150px}.tb .end{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tb .lbl{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px}
.tw{overflow:auto;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r)}table.t{width:100%;border-collapse:collapse;font-size:12px}table.t th{text-align:left;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);padding:8px 10px;background:var(--wsh);font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:1}table.t td{padding:7px 10px;border-top:1px solid var(--ln);color:var(--ink2);vertical-align:middle}
table.t td.nm{color:var(--ink);font-weight:700;white-space:normal}table.t td .sub{display:block;font-size:11px;color:var(--ink3);font-weight:500}table.t tr.cl{cursor:pointer}table.t tr.cl:hover td{background:var(--wsh)}table.t td.w{white-space:normal}table.t td.nw{white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chips a{font-size:12px;font-weight:600;border:1px solid var(--ln2);border-radius:20px;padding:5px 12px;color:var(--ink2);cursor:pointer;background:var(--crd);display:inline-flex;gap:6px;align-items:center}.chips a.on{background:#101B33;color:#FFC933;border-color:#101B33}.chips a i{font-style:normal;font-weight:800;font-size:10.5px;background:var(--wsh);color:var(--ink);border-radius:10px;padding:1px 6px}.chips a.on i{background:#FFC933;color:#101B33}
.card{background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);box-shadow:var(--sh-sm);margin-bottom:14px}
.card .hd{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--ln)}.card .hd b{font-size:13.5px}.card .hd small{color:var(--ink3);font-size:11.5px;margin-left:auto}.card .hd .n{width:24px;height:24px;border-radius:50%;background:#101B33;color:#FFC933;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}.card.done .hd .n{background:var(--pos);color:#fff}
.card .bd{padding:14px 16px}
/* formulário */
.campos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.campos label{display:block;font-size:11px;font-weight:700;color:var(--ink2);line-height:1.4}.campos label>.ds-input,.campos label>.ds-select,.campos label>textarea,.campos label>.radios,.campos label>.checks,.campos label>.busca,.campos label>.cnt{margin-top:5px}.campos label span.req{color:var(--neg)}.campos .c2{grid-column:span 2}.campos .c3{grid-column:1/-1}.campos .cnt{display:block}
.campos .ds-input,.campos .ds-select,.campos textarea{height:36px;font-size:12.5px;width:100%}.campos textarea,textarea.ta{height:auto;min-height:90px;padding:8px 10px;border:1px solid var(--ln2);border-radius:8px;font:inherit;font-size:12.5px;line-height:1.5;background:var(--crd);color:var(--ink);resize:vertical;width:100%}
.radios{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.radios label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;padding:0 12px;height:36px;border:1px solid var(--ln2);border-radius:8px;flex:1;justify-content:center;min-width:150px}.radios label.on{background:#101B33;color:#FFC933;border-color:#101B33}.radios input{accent-color:#101B33}
.checks{display:grid;gap:6px}.checks label{display:flex;gap:8px;align-items:flex-start;font-size:12px;font-weight:500;color:var(--ink);cursor:pointer;line-height:1.4}.checks input{margin-top:2px;accent-color:#101B33}
.cnt{font-size:11px;color:var(--ink3);text-align:right}
.acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.acoes .end{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ds-btn.big{height:44px;padding:0 20px;font-size:13.5px}.ds-btn.pur{background:#5B32A8;color:#fff;border-color:#5B32A8}.ds-btn.pur:hover{background:#4A2890}
/* stepper */
.steps{display:flex;align-items:center;gap:0;margin-bottom:16px;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:12px 16px}.steps div{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink3);flex:1}.steps div i{width:26px;height:26px;border-radius:50%;border:2px solid var(--ln2);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:12px;flex:none}.steps div.on{color:var(--ink)}.steps div.on i{background:#101B33;color:#FFC933;border-color:#101B33}.steps div.ok i{background:var(--pos);color:#fff;border-color:var(--pos)}.steps div+div::before{content:'';flex:1;height:2px;background:var(--ln);margin:0 10px}
.colab{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;background:var(--wsh);border-radius:10px;padding:12px 14px}.colab .av{width:48px;height:48px;border-radius:50%;background:#101B33;color:#FFC933;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}.colab b{font-size:14px}.colab .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:3px}.colab .meta span b{font-size:11.5px}
.busca{position:relative}.busca .lista{position:absolute;left:0;right:0;top:100%;background:var(--crd);border:1px solid var(--ln);border-radius:10px;box-shadow:var(--sh-md,0 10px 30px rgba(0,0,0,.15));z-index:20;max-height:300px;overflow:auto}.busca .lista div{padding:8px 12px;cursor:pointer;font-size:12.5px;border-top:1px solid var(--ln)}.busca .lista div:first-child{border-top:none}.busca .lista div:hover{background:var(--wsh)}.busca .lista small{display:block;color:var(--ink3);font-size:11px}
.resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.resumo div{background:var(--wsh);border-radius:9px;padding:9px 12px}.resumo .l{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}.resumo .v{font-size:13.5px;font-weight:800;margin-top:2px;white-space:normal}
.files{display:grid;gap:6px;margin-top:8px}.files div{display:flex;gap:8px;align-items:center;font-size:12px;background:var(--wsh);border-radius:8px;padding:6px 10px}.files div i{font-style:normal;color:var(--ink3);margin-left:auto;cursor:pointer}.files div i:hover{color:var(--neg)}
/* detalhe do protocolo */
.det{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}.det .side{position:sticky;top:116px}
.dhd{background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}.dhd .prot{font-size:18px}.dhd .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}.dhd .meta b{color:var(--ink)}.dhd .end{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:160px minmax(0,1fr);gap:6px 12px;font-size:12.5px}.kv dt{color:var(--ink3);font-weight:600}.kv dd{color:var(--ink);white-space:pre-wrap;line-height:1.5}
.bloco{background:var(--wsh);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;margin-top:8px}.bloco small{display:block;color:var(--ink3);font-size:11px;margin-bottom:4px;white-space:normal}
.tl{display:grid;gap:0}.tl .t{display:grid;grid-template-columns:118px 14px minmax(0,1fr);gap:0 10px;padding:6px 0;font-size:12px}.tl .t time{color:var(--ink3);font-size:11px;padding-top:2px}.tl .t i{width:10px;height:10px;border-radius:50%;background:var(--ln2);margin-top:4px;position:relative}.tl .t i::after{content:'';position:absolute;left:4px;top:12px;width:2px;height:22px;background:var(--ln)}.tl .t:last-child i::after{display:none}.tl .t i.ok{background:var(--pos)}.tl .t i.bad{background:var(--neg)}.tl .t i.warn{background:var(--am)}.tl .t i.info{background:var(--inf)}.tl .t b{display:block;color:var(--ink)}.tl .t span{color:var(--ink2);white-space:pre-wrap;line-height:1.45}.tl .t small{color:var(--ink3);font-size:11px}
.side .ds-btn{width:100%;justify-content:center;margin-bottom:8px}.side .grp{font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin:8px 0 6px}
.anx{display:grid;gap:6px}.anx a{display:flex;gap:8px;align-items:center;font-size:12px;background:var(--wsh);border-radius:8px;padding:7px 10px;color:var(--ink);text-decoration:none}.anx a:hover{background:#FFEFB8}.anx a .pill{margin-left:auto}.anx a small{color:var(--ink3)}
.hist2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hist2 h4{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);margin-bottom:6px}.hist2 .it{font-size:12px;padding:6px 0;border-top:1px solid var(--ln)}.hist2 .it b{display:block}.hist2 .it span{color:var(--ink3);font-size:11px}
.doc{display:flex;gap:12px;align-items:center;background:var(--wsh);border-radius:10px;padding:12px 14px;flex-wrap:wrap}.doc .ico{width:42px;height:50px;border-radius:6px;background:#101B33;color:#FFC933;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}.doc b{display:block;font-size:13px}.doc small{color:var(--ink3)}.doc .end{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
/* modal */
.f-ov{position:fixed;inset:0;background:rgba(10,17,32,.55);z-index:9000;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.f-md{background:var(--crd);color:var(--ink);border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}.f-md.xl{max-width:1000px}
.f-md .hd{background:#101B33;color:#fff;padding:11px 16px;display:flex;justify-content:space-between;align-items:center}.f-md .hd b{font-size:14px}.f-md .hd small{display:block;color:#B7C0D6;font-size:11.5px}.f-md .x{background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer}
.f-md .bd{padding:14px 16px;display:grid;gap:10px}.f-md .acoes{justify-content:flex-end}.f-md label{display:block;font-size:11px;font-weight:700;color:var(--ink2);line-height:1.4}.f-md label>.ds-input,.f-md label>.ds-select,.f-md label>textarea{margin-top:5px}.f-md iframe{width:100%;height:70vh;border:1px solid var(--ln);border-radius:8px;background:#fff}
.rel{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
/* 27/10/26 — regra do CLAUDE.md: base = monitor grande; as faixas apertam até caber em 1600/1366/1280 sem rolagem lateral */
@media(max-width:1599px){.page{padding:18px 20px 36px}.det{grid-template-columns:minmax(0,1fr) 330px}.kpi .v{font-size:21px}}
@media(max-width:1399px){.modnav a{padding:0 9px;font-size:12px}.det{grid-template-columns:minmax(0,1fr) 300px}.campos{grid-template-columns:1fr 1fr}.campos .c2{grid-column:span 2}.resumo{grid-template-columns:repeat(2,1fr)}table.t{font-size:11.5px}table.t th,table.t td{padding:6px 8px}.kv{grid-template-columns:130px minmax(0,1fr)}.steps div{font-size:11px}}
@media(max-width:1199px){.topbar{padding:0 16px}.page{padding:16px}.modnav a .ds-ic{display:none}.det{grid-template-columns:1fr}.det .side{position:static}.tb .end{margin-left:0}.hist2{grid-template-columns:1fr}}
@media(max-width:820px){.det .side{order:-1}.side .ds-btn{margin-bottom:6px}.modnav{position:static;overflow-x:auto;flex-wrap:nowrap}.topbar{height:auto;padding:10px 14px;flex-wrap:wrap}.topbar .end{margin-left:0}.page{padding:12px}.campos{grid-template-columns:1fr}.campos .c2{grid-column:span 1}.resumo{grid-template-columns:1fr 1fr}.acoes .end{margin-left:0}.steps{padding:10px}.steps div span{display:none}.kv{grid-template-columns:1fr}.dhd .end{margin-left:0}.f-ov{padding:10px 6px}}
</style>
</head>
<body class="dsnav-pad">
<div class="content">
  <header class="topbar"><div><h1 id="tb-h1"><span class="crumb">DP / RH</span></h1><p id="tb-sub"></p></div><div class="end"><div class="who" id="who"></div></div></header>
  <nav class="modnav" id="modnav"></nav>
  <div class="page" id="page"><div class="sk"></div><div class="sk" style="width:60%"></div></div>
</div>
<script>
const { $, $$, esc, api, toast, dBR } = G;
let ME = null, PAG = null, PROT = null;
const ic = n => '<svg class="ds-ic"><use href="/icons.svg#' + n + '"/></svg>';
const C = () => ME.catalogos;
const lojaTxt = n => (ME.lojas.find(l => l.n === +n) || {}).txt || ('Loja ' + n); const lojaCod = n => lojaTxt(n).split(' · ')[0];
const etq = n => '<span class="etq' + (+n === 10 ? ' cd' : '') + '">' + esc(lojaCod(n)) + '</span>';
const dt = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') + ' ' + new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';
const skel = () => '<div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div>';
const erroBox = e => '<div class="aviso neg">' + esc(e.message || e) + '</div>';
const ini = n => String(n || '').trim().split(/\s+/).slice(0, 2).map(s => s[0]).join('').toUpperCase();
const selOpts = (obj, v, vazio) => (vazio != null ? '<option value="">' + esc(vazio) + '</option>' : '') + Object.entries(obj).map(([k, t]) => '<option value="' + k + '"' + (k === v ? ' selected' : '') + '>' + esc(t) + '</option>').join('');
const selLoja = (v, vazio) => (vazio ? '<option value="">' + esc(vazio) + '</option>' : '') + ME.lojas.map(l => '<option value="' + l.n + '"' + (String(l.n) === String(v) ? ' selected' : '') + '>' + esc(l.txt) + '</option>').join('');
const ST_CLS = { rascunho: 'gr', enviado_rh: 'warn', em_analise_rh: 'warn', aguardando_esclarecimentos: 'warn', aguardando_coordenacao: 'info', devolvido_rh: 'warn', juridico_solicitado: 'pur', aguardando_parecer_juridico: 'pur', deferido_rh: 'info', indeferido_encerrado: 'bad', documento_gerado: 'info', documento_encaminhado: 'info', aguardando_devolucao_assinada: 'warn', aguardando_conferencia_rh: 'warn', correcao_documental: 'bad', concluido: 'ok', cancelado: 'gr' };
const stPill = st => '<span class="pill ' + (ST_CLS[st] || 'gr') + '">' + esc(C().status[st] || st) + '</span>';
const prazoTxt = p => !p ? '' : p.vencido ? '<span class="pill bad">vencido ' + dBR(p.limite) + '</span>' : p.proximo ? '<span class="pill warn">vence ' + dBR(p.limite) + '</span>' : '<span class="pill gr">até ' + dBR(p.limite) + '</span>';
const fmtBytes = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB';
const NAV = [
  { id: 'painel', txt: 'Painel', ic: 'dashboard', sub: 'Indicadores, filtros e todas as solicitações que você pode ver' },
  { id: 'nova', txt: 'Solicitar medida', ic: 'alert', sub: 'Gerente: identificação → histórico → ocorrência → revisão e envio ao RH', so: 'solicitar' },
  { id: 'rh', txt: 'Análise do RH', ic: 'shield', sub: 'Fila do RH: análise técnica, esclarecimentos, jurídico, emissão e conferência', so: 'analisar', cnt: 'rh' },

  const comArquivo = async (cat, titulo, sub, campos, ok) => { const r = await modalForm({ titulo, sub, campos: [...campos, { k: 'files', label: 'Arquivo(s) · câmera, scanner ou PDF', tipo: 'file', obrig: cat !== 'evidencia' && cat !== 'juridico' }], ok }); if (!r) return; try { botao.disabled = true; await enviarArquivos(p, cat, r.files || [], Object.fromEntries(Object.entries(r).filter(([k]) => k !== 'files'))); toast('Enviado', 'pos'); contadores(); protocolo(p); } catch (e) { toast(e.message, 'neg'); botao.disabled = false; } };
  if (a === 'enviar') { if (await confirmar('Enviar ' + p + ' ao RH?', 'Depois do envio a solicitação original não pode ser editada.')) executar(p, 'enviar', {}, botao); }
  else if (a === 'editar') { ir('nova'); W.colab = s.colaborador; W.oc = { ...W.oc, ...s.ocorrencia }; W.passo = 3; W.editando = p; desenharNova(); $('#n-av').textContent = 'Salvar rascunho'; $('#n-av').onclick = async () => { lerPasso(); try { await api('/api/disciplinar/solicitacoes/' + p, { method: 'PUT', body: W.oc }); toast('Rascunho atualizado', 'pos'); location.hash = 'p=' + p; } catch (e) { toast(e.message, 'neg'); } }; }
  else if (a === 'responder') { const t = await modalTexto({ titulo: 'Responder ao RH', sub: (s.esclarecimentos.slice(-1)[0] || {}).pergunta, label: 'Resposta', ok: 'Enviar resposta' }); if (t) executar(p, 'responder', { texto: t }, botao); }
  else if (a === 'complementar') { const t = await modalTexto({ titulo: 'Complementar o relato', sub: 'A complementação fica identificada e auditada; a solicitação original não muda.', label: 'Complementação', ok: 'Registrar' }); if (t) executar(p, 'complementar', { texto: t }, botao); }
  else if (a === 'anexar') comArquivo('evidencia', 'Anexar evidência', nome, [{ k: 'descricao', label: 'Descrição (opcional)', tipo: 'text' }], 'Anexar');
  else if (a === 'cancelar') { const t = await modalTexto({ titulo: 'Cancelar protocolo ' + p, sub: 'Só com justificativa. O registro permanece no histórico administrativo.', label: 'Justificativa', ok: 'Cancelar protocolo', cls: 'ds-btn-danger' }); if (t) executar(p, 'cancelar', { motivo: t }, botao); }
  else if (a === 'analisar') executar(p, 'analisar', {}, botao);
  else if (a === 'esclarecer') { const t = await modalTexto({ titulo: 'Solicitar esclarecimentos ao gerente', sub: 'O protocolo fica "Aguardando esclarecimentos" até a resposta.', label: 'O que precisa ser esclarecido', ok: 'Solicitar' }); if (t) executar(p, 'esclarecer', { texto: t }, botao); }
  else if (a === 'previa') previaPdf(p, {});
  else if (a === 'emitir') { const r = await modalForm({ titulo: 'Confirmar emissão · ' + C().medidas[s.analise.medida], sub: 'Gera o PDF definitivo (v' + (((s.documento || {}).versao || 0) + 1) + ') e encaminha ao gerente ' + s.gerente.nome + '.' + (s.modeloValidado ? '' : ' Atenção: modelo ainda sem validação jurídica.'), campos: [{ k: 'orientacoes', label: 'Orientações ao gerente (opcional)', tipo: 'textarea', valor: (s.analise.orientacoesGerente || '') }], ok: 'Emitir e encaminhar' }); if (r) executar(p, 'emitir', r, botao); }
  else if (a === 'reemitir') { const r = await modalForm({ titulo: 'Reemitir documento', sub: 'Gera nova versão; a anterior fica guardada. O gerente precisa aplicar a versão nova.', campos: [{ k: 'motivo', label: 'Motivo da reemissão', tipo: 'textarea', obrig: true }, { k: 'orientacoes', label: 'Orientações ao gerente (opcional)', tipo: 'textarea' }], ok: 'Reemitir' }); if (r) executar(p, 'reemitir', r, botao); }
  else if (a === 'comunicar') { const r = await modalForm({ titulo: 'Registrar comunicação ao colaborador', sub: nome, campos: [{ k: 'data', label: 'Data da comunicação', tipo: 'date', valor: ME.hoje, max: ME.hoje, obrig: true }, { k: 'observacao', label: 'Observação (opcional)', tipo: 'textarea' }], ok: 'Registrar' }); if (r) executar(p, 'comunicar', r, botao); }
  else if (a === 'anexar_assinado') comArquivo('assinado', 'Anexar documento assinado', 'Foto pela câmera, scanner ou PDF do documento v' + s.documento.versao + ' assinado por ' + nome, [{ k: 'data', label: 'Data da aplicação (comunicação/assinatura)', tipo: 'date', valor: (s.aplicacao && s.aplicacao.dataAplicacao) || ME.hoje, max: ME.hoje, obrig: true }, { k: 'observacao', label: 'Observação (opcional)', tipo: 'text' }], 'Enviar ao RH');
  else if (a === 'recusa') comArquivo('recusa', 'Registrar recusa de assinatura', 'Anexe o documento com o campo de recusa preenchido e assinado pelas testemunhas', [{ k: 'testemunhas', label: 'Nome das testemunhas (duas)', tipo: 'text', obrig: true }, { k: 'data', label: 'Data da comunicação', tipo: 'date', valor: (s.aplicacao && s.aplicacao.dataAplicacao) || ME.hoje, max: ME.hoje, obrig: true }, { k: 'observacao', label: 'Observação (opcional)', tipo: 'text' }], 'Registrar recusa');
  else if (a === 'conferir_aprovar') { const t = await modalTexto({ titulo: 'Aprovar documento e concluir', sub: 'Marca a medida como documentalmente concluída' + (s.analise.medida === 'suspensao' ? ' e gera a pendência de conferência na folha pro DP.' : '.'), label: 'Observação (opcional)', ok: 'Aprovar e concluir', opcional: true }); if (t !== null) executar(p, 'conferir_aprovar', { texto: t }, botao); }
  else if (a === 'conferir_devolver') { const r = await modalForm({ titulo: 'Devolver ao gerente', sub: 'Justificativa obrigatória; o gerente reenvia a digitalização.', campos: [{ k: 'motivo', label: 'Motivo', tipo: 'select', opcoes: { nova_digitalizacao: 'Solicitar nova digitalização', complementacao: 'Solicitar complementação', inconsistencia: 'Registrar inconsistência' } }, { k: 'texto', label: 'Justificativa', tipo: 'textarea', obrig: true }], ok: 'Devolver', cls: 'ds-btn-danger' }); if (r) executar(p, 'conferir_devolver', r, botao); }
  else if (a === 'confirmar_indeferimento' || a === 'devolver_rh' || a === 'solicitar_juridico') { const T = { confirmar_indeferimento: ['Confirmar indeferimento e encerrar', 'Encerra o processo; gerente e RH são notificados; o parecer fica no histórico administrativo.', 'Confirmar e encerrar', 'ds-btn-danger'], devolver_rh: ['Devolver ao RH para reavaliação', 'A solicitação continua aberta; todas as manifestações anteriores são preservadas.', 'Devolver ao RH', 'ds-btn-secondary'], solicitar_juridico: ['Solicitar análise jurídica', 'O RH prepara e encaminha a documentação ao jurídico; após o parecer, o RH faz nova análise.', 'Determinar encaminhamento', 'pur'] }[a]; const t = await modalTexto({ titulo: T[0], sub: T[1], label: 'Manifestação da Coordenação', ok: T[2], cls: T[3] }); if (t) executar(p, a, { texto: t }, botao); }
  else if (a === 'encaminhar_juridico') { const r = await modalForm({ titulo: 'Encaminhar ao jurídico', sub: 'Registre o que foi enviado e a data; anexe o que for encaminhado (opcional).', campos: [{ k: 'texto', label: 'Resumo do encaminhamento', tipo: 'textarea', obrig: true }, { k: 'files', label: 'Documentação encaminhada (opcional)', tipo: 'file' }], ok: 'Registrar encaminhamento', cls: 'pur' }); if (!r) return; try { botao.disabled = true; if (r.files && r.files.length) await enviarArquivos(p, 'juridico', r.files, { descricao: 'Encaminhamento ao jurídico' }); await executar(p, 'encaminhar_juridico', { texto: r.texto }); } catch (e) { toast(e.message, 'neg'); botao.disabled = false; } }
  else if (a === 'parecer_juridico') { const r = await modalForm({ titulo: 'Registrar parecer jurídico', sub: 'Depois do registro o RH faz nova análise.', campos: [{ k: 'data', label: 'Data do parecer', tipo: 'date', valor: ME.hoje, max: ME.hoje, obrig: true }, { k: 'texto', label: 'Parecer', tipo: 'textarea', obrig: true }, { k: 'files', label: 'Arquivo do parecer (opcional)', tipo: 'file' }], ok: 'Registrar parecer', cls: 'pur' }); if (!r) return; try { botao.disabled = true; if (r.files && r.files.length) await enviarArquivos(p, 'juridico', r.files, { descricao: 'Parecer jurídico' }); await executar(p, 'parecer_juridico', { texto: r.texto, data: r.data }); } catch (e) { toast(e.message, 'neg'); botao.disabled = false; } }
}

// ── modais ──
function modalBase(titulo, sub, bodyHtml, xl) { const ov = document.createElement('div'); ov.className = 'f-ov'; ov.innerHTML = '<div class="f-md' + (xl ? ' xl' : '') + '"><div class="hd"><div><b>' + esc(titulo) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div><button class="x" type="button">×</button></div><div class="bd">' + bodyHtml + '</div></div>'; document.body.appendChild(ov); return ov; }
function modalHtml({ titulo, sub, html, xl }) { const ov = modalBase(titulo, sub, html + '<div class="acoes"><button class="ds-btn ds-btn-ghost" id="m-fechar">Fechar</button></div>', xl); const fechar = () => ov.remove(); ov.querySelector('.x').onclick = fechar; ov.querySelector('#m-fechar').onclick = fechar; }
function modalTexto({ titulo, sub, label, ok, cls, opcional }) { return modalForm({ titulo, sub, campos: [{ k: 't', label, tipo: 'textarea', obrig: !opcional }], ok, cls }).then(r => r ? r.t : (opcional && r !== null ? '' : null)); }
function modalForm({ titulo, sub, campos, ok, cls }) {
  return new Promise(resolve => {
    const ov = modalBase(titulo, sub, campos.map(f => '<label>' + esc(f.label) + (f.obrig ? ' <span style="color:var(--neg)">*</span>' : '') + (f.tipo === 'textarea' ? '<textarea class="ta" id="m-' + f.k + '" maxlength="4000">' + esc(f.valor || '') + '</textarea>' : f.tipo === 'select' ? '<select class="ds-select" id="m-' + f.k + '">' + selOpts(f.opcoes, f.valor || '') + '</select>' : f.tipo === 'file' ? '<input class="ds-input" type="file" id="m-' + f.k + '" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,.doc,.docx,.xlsx,.txt">' : '<input class="ds-input" type="' + (f.tipo || 'text') + '" id="m-' + f.k + '" value="' + esc(f.valor || '') + '"' + (f.max ? ' max="' + f.max + '"' : '') + '>') + '</label>').join('') +
      '<div class="acoes"><button class="ds-btn ds-btn-ghost" id="m-cancel" type="button">Cancelar</button><button class="ds-btn ' + (cls || 'ds-btn-primary') + '" id="m-ok" type="button">' + esc(ok || 'Confirmar') + '</button></div>');
    const fechar = v => { ov.remove(); resolve(v); }; ov.querySelector('.x').onclick = () => fechar(null); ov.querySelector('#m-cancel').onclick = () => fechar(null);
    const first = ov.querySelector('textarea,input,select'); if (first) first.focus();
    ov.querySelector('#m-ok').onclick = () => { const r = {}; for (const f of campos) { const el = ov.querySelector('#m-' + f.k); const v = f.tipo === 'file' ? [...el.files] : el.value.trim(); if (f.obrig && (f.tipo === 'file' ? !v.length : !v)) return toast('Preencha: ' + f.label, 'neg'); if (f.tipo === 'file' && v.length > 5) return toast('No máximo 5 arquivos', 'neg'); r[f.k] = v; } fechar(r); };
  });
}
function confirmar(titulo, sub) { return new Promise(resolve => { const ov = modalBase(titulo, sub, '<div class="acoes"><button class="ds-btn ds-btn-ghost" id="m-cancel">Cancelar</button><button class="ds-btn ds-btn-primary" id="m-ok">Confirmar</button></div>'); ov.querySelector('.x').onclick = () => { ov.remove(); resolve(false); }; ov.querySelector('#m-cancel').onclick = () => { ov.remove(); resolve(false); }; ov.querySelector('#m-ok').onclick = () => { ov.remove(); resolve(true); }; }); }

iniciar();
</script>
