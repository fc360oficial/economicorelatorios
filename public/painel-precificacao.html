<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Precificação · Econômico Supermercados</title>
<!-- Painel Precificação (Tiago, 11/11/2026) — TV da sala do setor de precificação. Sem login, só leitura.
     Dados: /api/paineis-publico/precificacao-dados (lib/alertas-preco.js), relido a cada 60 s.
     Tela desenhada em 1920×1080 e encaixada no aparelho por transform (sem vh/vw, sem grid e sem animação CSS: o
     navegador das TVs é fraco — ver Painel Compras). Troca de página a cada 20 s, por JS.
     Uma loja por vez: E1 (3 páginas) depois E2 (3 páginas). ?loja=N trava numa loja (uma TV por loja).
     Ensaio do robô (11/11/26): enquanto houver ensaio em andamento (lib/robo-ensaio.js), entra uma página "ROBÔ" antes de
     cada loja com as 7 etapas, e o rodapé vira faixa amarela quando alguma etapa espera aprovação.
     ?kiosk=1 esconde o cursor · ?tela=N abre na N-ésima página. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0c0c0c;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:#f6f4ec}
#palco{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#0c0c0c;transform-origin:0 0}
.topo{position:absolute;left:0;top:0;width:1920px;height:112px;background:#151515;border-bottom:4px solid #FFD500}
.topo h1{position:absolute;left:40px;top:22px;font-size:50px;font-weight:800;letter-spacing:.5px}
.topo h1 b{color:#FFD500}
.topo .loja{position:absolute;left:760px;top:16px;height:80px;line-height:80px;padding:0 34px;background:#FFD500;color:#0c0c0c;font-size:60px;font-weight:800;border-radius:14px}
.topo .dir{position:absolute;right:40px;top:20px;text-align:right}
.topo .hr{font-size:44px;font-weight:800;line-height:1}
.topo .sub{font-size:20px;color:#b9b6ab;margin-top:6px}
.cards{position:absolute;left:40px;top:254px;width:1840px;height:150px}
/* meta da loja: margem do mês × partida × meta do mês × objetivo (11/11/26) */
.meta{position:absolute;left:40px;top:128px;width:1840px;height:112px;background:#1a1a1a;border-radius:14px}
.meta .m1{position:absolute;left:24px;top:10px;font-size:20px;font-weight:700;color:#b9b6ab;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.meta .m2{position:absolute;left:24px;top:36px;font-size:62px;font-weight:800;line-height:1.1;white-space:nowrap}
.meta .m3{position:absolute;left:300px;top:44px;font-size:24px;line-height:1.3;color:#d9d6ca;white-space:nowrap}
.meta .m3 b{color:#fff}.meta .sobe{color:#22C55E}.meta .desce{color:#ff5a72}
.meta .trilho{position:absolute;left:800px;top:52px;width:1000px;height:22px;background:#2a2a2a;border-radius:11px}
.meta .cheio{position:absolute;left:0;top:0;height:22px;border-radius:11px;background:#FFD500}
.meta .mk{position:absolute;top:-8px;width:4px;height:38px;background:#fff}
.meta .mk.obj{background:#22C55E}.meta .mk.par{background:#8f8c82}
.meta .rt{position:absolute;top:-34px;font-size:19px;font-weight:700;white-space:nowrap;color:#d9d6ca}
.meta .rt.b{top:36px}.meta .rt.obj{color:#22C55E}
.cd{float:left;width:445px;height:150px;margin-right:20px;background:#1a1a1a;border-radius:14px;border-left:10px solid #555;padding:12px 22px}
.cd.ult{margin-right:0}
.cd .nm{font-size:22px;font-weight:700;color:#d9d6ca;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden}
.cd .v{font-size:64px;font-weight:800;line-height:1.05}
.cd .lj{font-size:21px;color:#b9b6ab;white-space:nowrap;overflow:hidden}
.cd.g3{border-left-color:#C8102E}.cd.g3 .v{color:#ff5a72}
.cd.g2{border-left-color:#FF9F1C}.cd.g2 .v{color:#FFB648}
.cd.g1{border-left-color:#3B82F6}.cd.g1 .v{color:#7FB2FF}
.cd.zero{border-left-color:#22C55E}.cd.zero .v{color:#22C55E}
.pag{position:absolute;left:40px;top:424px;width:1840px;height:600px;display:none}
.pag.on{display:block}
.pag h2{font-size:34px;font-weight:800;margin-bottom:12px;white-space:nowrap}
.pag h2 small{font-size:22px;font-weight:600;color:#b9b6ab;margin-left:14px}
table{width:1840px;border-collapse:collapse;table-layout:fixed}
th{font-size:19px;text-transform:uppercase;letter-spacing:.6px;color:#b9b6ab;text-align:left;padding:8px 12px;border-bottom:2px solid #2a2a2a;font-weight:700}
td{font-size:27px;padding:9px 12px;border-bottom:1px solid #2a2a2a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th.n,td.n{text-align:right}
td.lj b{display:inline-block;background:#FFD500;color:#0c0c0c;border-radius:6px;padding:0 10px;font-weight:800}
td.neg{color:#ff5a72;font-weight:800}td.sug{color:#22C55E;font-weight:800}td.obs{color:#b9b6ab;font-size:22px}
.tg{display:inline-block;font-size:17px;font-weight:800;border-radius:6px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.tg.pr{background:#5B3FA8;color:#fff}.tg.rb{background:#A44A00;color:#fff}
.vazio{font-size:40px;color:#22C55E;font-weight:800;padding:120px 0;text-align:center}
.rod{position:absolute;left:40px;top:1034px;width:1840px;font-size:20px;color:#8f8c82;white-space:nowrap;overflow:hidden}
.rod b{color:#d9d6ca}
.erro{color:#ff5a72}
/* página do ensaio do robô (ocupa o lugar da meta + cartões + tabela) */
.ens{position:absolute;left:40px;top:128px;width:1840px;height:896px;display:none}
.ens h2{font-size:44px;font-weight:800;white-space:nowrap;overflow:hidden}
.ens h2 b{color:#FFD500}
.ens .sb{font-size:25px;color:#b9b6ab;margin:4px 0 14px;white-space:nowrap;overflow:hidden}
.ens td{font-size:30px;padding:0 14px;height:106px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.ens td.nu div{width:64px;height:64px;line-height:64px;border-radius:32px;background:#2a2a2a;color:#8f8c82;font-size:32px;font-weight:800;text-align:center}
.ens td.tt b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis}
.ens td.tt span{display:block;font-size:22px;color:#b9b6ab;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ens td.st{text-align:right;font-size:24px;font-weight:800;color:#8f8c82}
.ens tr.feito td.nu div{background:#22C55E;color:#0c0c0c}.ens tr.feito td.st{color:#22C55E}
.ens tr.agora td{background:#3a3000}.ens tr.agora td.nu div{background:#FFD500;color:#0c0c0c}.ens tr.agora td.st{color:#FFD500}.ens tr.agora td.tt span{color:#f6f4ec}
.ens tr.espera td.tt b{color:#8f8c82}.ens tr.espera td.tt span{color:#6f6c63}
.rod.alerta{left:0;top:1026px;width:1920px;height:54px;line-height:54px;padding:0 40px;background:#FFD500;color:#0c0c0c;font-size:27px;font-weight:800}
.rod.alerta b{color:#0c0c0c}
body.kiosk{cursor:none}
</style>
</head>
<body>
<div id="palco">
  <div class="topo">
    <h1>PAINEL <b>PRECIFICAÇÃO</b></h1>
    <div class="loja" id="loja">—</div>
    <div class="dir"><div class="hr" id="hr">--:--</div><div class="sub" id="sub">carregando…</div></div>
  </div>
  <div class="meta" id="meta"></div>
  <div class="cards" id="cards"></div>
  <div class="pag on" id="pag"></div>
  <div class="ens" id="ens"></div>
  <div class="rod" id="rod"></div>
</div>
<script>
var QS = new URLSearchParams(location.search);
if (QS.get('kiosk') === '1') document.body.className = 'kiosk';
// Uma loja por vez (Tiago, 11/11: "quebrar por lojas E1 e E2"): pra cada loja passam os 3 tipos, 20 s cada. ?loja=N trava numa loja.
var TIPOS_PAG = ['abaixo_custo', 'custo_subiu', 'abaixo_margem'], SO_LOJA = parseInt(QS.get('loja')) || 0, atual = Math.max(0, (parseInt(QS.get('tela')) || 1) - 1), D = null, LINHAS = 9, PAGS = [];
function LJ(n) { return +n === 10 ? 'CD' : 'E' + n; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function money(v) { return v == null ? '—' : 'R$ ' + (+v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function pct(v) { return v == null || !isFinite(v) ? '—' : (+v).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%'; }
function encaixar() {
  var p = document.getElementById('palco'), s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  p.style.transform = 'scale(' + s + ')';
  p.style.left = Math.max(0, (window.innerWidth - 1920 * s) / 2) + 'px';
  p.style.top = Math.max(0, (window.innerHeight - 1080 * s) / 2) + 'px';
}
function relogio() { var d = new Date(); document.getElementById('hr').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function conta(l, t) { return (D.resumo[l] && D.resumo[l].porTipo[t]) || 0; }
function outras(l, t) { return D.lojas.filter(function (x) { return x !== l; }).map(function (x) { return LJ(x) + ': ' + conta(x, t); }).join('  ·  '); }
function tag(a) { return a.condicao === 'promocao' ? '<span class="tg pr">PROMOÇÃO</span>' : a.condicao === 'rebaixa' ? '<span class="tg rb">REBAIXA</span>' : ''; }
function tabela(t, arr) {
  if (!arr.length) return '<div class="vazio">Nada em aberto aqui.</div>';
  var cols = '<col style="width:90px"><col style="width:760px"><col style="width:190px"><col style="width:190px"><col style="width:150px"><col style="width:200px"><col style="width:260px">';
  var h = '<tr><th>Loja</th><th>Produto</th><th class="n">Custo</th><th class="n">Preço</th><th class="n">Margem</th><th class="n">Sugerido</th><th class="n">' + (t === 'abaixo_custo' ? 'Perde por mês' : t === 'custo_subiu' ? 'Vende por mês' : 'Vale por mês') + '</th></tr>';
  var b = arr.slice(0, LINHAS).map(function (a) {
    return '<tr><td class="lj"><b>' + LJ(a.loja) + '</b></td><td>' + esc(a.desc) + tag(a) + '</td><td class="n">' + money(a.custo) + '</td><td class="n">' + money(a.preco) + '</td>' +
      '<td class="n' + (a.margem < 0 ? ' neg' : '') + '">' + pct(a.margem) + '</td><td class="n sug">' + (a.sugerido ? money(a.sugerido) : '—') + '</td>' +
      '<td class="n' + (t === 'abaixo_custo' ? ' neg' : '') + '">' + (t === 'custo_subiu' ? (+a.qtd30 || 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' un' : money(t === 'abaixo_custo' ? a.perdaMes : a.ganhoMes)) + '</td></tr>';
  }).join('');
  return '<table><colgroup>' + cols + '</colgroup>' + h + b + '</table>';
}
// Faixa da meta: escala de 22% a 32% de margem; barra amarela = margem do mês; riscos = partida, meta do mês e objetivo.
function faixaMeta(l) {
  var m = D.metas && D.metas[l]; if (!m || m.margem == null) return '<div class="m1">Meta da loja ' + LJ(l) + '</div><div class="m3" style="left:24px">sem dados de venda do mês</div>';
  var MIN = 22, MAX = 32, pos = function (v) { return Math.max(0, Math.min(1000, (v - MIN) / (MAX - MIN) * 1000)); };
  var ev = m.evolucao, sinal = ev == null ? '' : (ev >= 0 ? '<span class="sobe">▲ ' : '<span class="desce">▼ ') + Math.abs(ev).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' pt</span> desde a partida';
  var falta = m.faltaMetaPts == null ? '' : m.faltaMetaPts <= 0 ? '<b class="sobe">meta do mês batida</b>' : 'faltam <b>' + pct(m.faltaMetaPts).replace('%', ' pt') + '</b> (' + money(m.faltaMetaReais).replace(',00', '') + ') pra meta do mês';
  var h = '<div class="m1">Margem sobre venda da ' + LJ(l) + ' em ' + esc(m.mes) + ' · até dia ' + m.dia + '</div>' +
    '<div class="m2">' + pct(m.margem) + '</div>' +
    '<div class="m3">' + sinal + '<br>' + falta + '</div>' +
    '<div class="trilho"><div class="cheio" style="width:' + pos(m.margem) + 'px"></div>';
  if (m.partida != null) h += '<div class="mk par" style="left:' + pos(m.partida) + 'px"></div><div class="rt b" style="left:' + (pos(m.partida) - 150) + 'px">partida ' + pct(m.partida) + '</div>';
  if (m.metaMes != null) h += '<div class="mk" style="left:' + pos(m.metaMes) + 'px"></div><div class="rt" style="left:' + (pos(m.metaMes) - 60) + 'px">meta do mês ' + pct(m.metaMes) + '</div>';
  h += '<div class="mk obj" style="left:' + pos(m.objetivo) + 'px"></div><div class="rt obj b" style="left:' + (pos(m.objetivo) - 60) + 'px">objetivo ' + pct(m.objetivo) + '</div></div>';
  return h;
}
function desenhar() {
  if (!D) return;
  var lojas = SO_LOJA && D.lojas.indexOf(SO_LOJA) >= 0 ? [SO_LOJA] : D.lojas;
  PAGS = [];
  var ens = D.ensaios || [];
  for (var i = 0; i < lojas.length; i++) {
    for (var e = 0; e < ens.length; e++) PAGS.push({ ensaio: e });   // o ensaio do robô aparece antes de cada loja
    for (var k = 0; k < TIPOS_PAG.length; k++) PAGS.push({ loja: lojas[i], tipo: TIPOS_PAG[k] });
  }
  if (atual >= PAGS.length) atual = 0;
  var a = D.assertividade || {};
  var esperando = ens.filter(function (x) { return x.agora && x.agora.quem === 'você'; });
  document.getElementById('rod').className = esperando.length ? 'rod alerta' : 'rod';
  if (esperando.length) document.getElementById('rod').innerHTML = 'ROBÔ ESPERANDO APROVAÇÃO · ' + esperando.map(function (x) { return 'pedido #' + x.id + ' ' + esc(x.lista_nome) + ': falta ' + esc(x.agora.pede || x.agora.titulo); }).join(' · ');
  else document.getElementById('rod').innerHTML = 'Carnes, charque e hortifrúti fora · final <b>7</b> = rebaixa · final <b>8</b> = promoção · alto giro não sobe · responda os alertas em <b>Precificação › Alertas de Preço</b>' + (a.total ? ' · ' + a.total + ' respostas, ' + a.pct + '% eram pra corrigir' : '');
  mostrar(atual);
}
function mostrar(i) {
  atual = i; var pg = PAGS[i]; if (!pg) return;
  var ehEns = pg.ensaio != null, mostra = function (id, v) { document.getElementById(id).style.display = v ? 'block' : 'none'; };
  mostra('meta', !ehEns); mostra('cards', !ehEns); mostra('pag', !ehEns); mostra('ens', ehEns);
  if (ehEns) return mostrarEnsaio(D.ensaios[pg.ensaio]);
  var l = pg.loja, t = pg.tipo, tipos = ['abaixo_custo', 'custo_subiu', 'sem_custo', 'abaixo_margem'];
  document.getElementById('loja').textContent = 'LOJA ' + LJ(l);
  document.getElementById('cards').innerHTML = tipos.map(function (x, j) {
    var n = conta(l, x);
    return '<div class="cd ' + (n ? 'g' + D.tipos[x].grav : 'zero') + (j === 3 ? ' ult' : '') + '"><div class="nm">' + esc(D.tipos[x].curto || D.tipos[x].nome) + '</div><div class="v">' + n + '</div><div class="lj">' + esc(outras(l, x) || 'na ' + LJ(l)) + '</div></div>';
  }).join('');
  var arr = (D.porLoja && D.porLoja[l] && D.porLoja[l][t]) || [], n = conta(l, t);
  document.getElementById('meta').innerHTML = faixaMeta(l);
  document.getElementById('pag').innerHTML = '<h2>' + LJ(l) + ' · ' + esc(D.tipos[t].nome) + '<small>' + (n > LINHAS ? 'os ' + LINHAS + ' mais urgentes de ' + n : n + ' em aberto') + '</small></h2>' + tabela(t, arr);
  var c = D.calculadoEm ? new Date(D.calculadoEm) : null;
  document.getElementById('sub').textContent = 'Lojas ' + D.lojas.map(LJ).join(' e ') + (c ? ' · atualizado às ' + ('0' + c.getHours()).slice(-2) + ':' + ('0' + c.getMinutes()).slice(-2) : '');
}
function horaCurta(iso) { if (!iso) return ''; var d = new Date(iso); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function mostrarEnsaio(x) {
  if (!x) return;
  document.getElementById('loja').textContent = 'ROBÔ';
  var linhas = x.etapas.map(function (e) {
    var st = e.status === 'feito' ? 'FEITO' + (e.em ? ' ' + horaCurta(e.em) : '') : e.status === 'agora' ? (e.quem === 'você' ? 'ESPERANDO APROVAÇÃO' : 'ROBÔ TRABALHANDO') : 'depois';
    return '<tr class="' + e.status + '"><td class="nu"><div>' + (e.status === 'feito' ? '✓' : e.n) + '</div></td><td class="tt"><b>' + esc(e.titulo) + '</b><span>' + esc(e.detalhe) + '</span></td><td class="st">' + st + '</td></tr>';
  }).join('');
  document.getElementById('ens').innerHTML = '<h2>ROBÔ DE COMPRAS · <b>ENSAIO</b> · pedido #' + x.id + ' · ' + esc(x.lista_nome) + '</h2>' +
    '<div class="sb">' + esc(x.fornecedor || '') + ' · lojas ' + x.lojas.map(LJ).join(' e ') + ' · ' + x.itens + ' itens · ' + money(x.total) + ' · nada vai pro fornecedor, tudo no ERP de teste' + (x.concluido ? ' · CICLO COMPLETO' : '') + '</div>' +
    '<table><colgroup><col style="width:100px"><col style="width:1360px"><col style="width:380px"></colgroup>' + linhas + '</table>';
  document.getElementById('sub').textContent = 'Ensaio do robô · lojas ' + D.lojas.map(LJ).join(' e ');
}
function proxima() {
  if (!D || !PAGS.length) return;
  for (var k = 1; k <= PAGS.length; k++) { var i = (atual + k) % PAGS.length; if (PAGS[i].ensaio != null || conta(PAGS[i].loja, PAGS[i].tipo) > 0) return mostrar(i); }   // pula página vazia
}
function ler() {
  fetch('/api/paineis-publico/precificacao-dados?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'erro'); return j; }); })
    .then(function (j) { D = j; desenhar(); })
    .catch(function (e) { if (!D) document.getElementById('sub').innerHTML = '<span class="erro">sem dados: ' + esc(e.message) + '</span>'; });
}
window.tvSlideAtual = function () { var p = PAGS[atual]; return !D || !p ? '' : p.ensaio != null ? 'Ensaio do robô' : LJ(p.loja) + ' · ' + D.tipos[p.tipo].nome; };
window.addEventListener('resize', encaixar);
encaixar(); relogio(); ler();
setInterval(relogio, 20000); setInterval(ler, 60000); setInterval(proxima, 20000);
setInterval(function () { if (D && D.ensaios && D.ensaios.length) ler(); }, 15000);   // com ensaio em andamento, relê mais rápido
</script>
<script src="/tv-heartbeat.js" data-painel="precificacao" defer></script>
</body>
</html>
