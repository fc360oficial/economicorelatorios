<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Precificação · Econômico Supermercados</title>
<!-- Painel Precificação (Tiago, 11/11/2026) — TV da sala do setor de precificação. Sem login, só leitura.
     Dados: /api/paineis-publico/precificacao-dados (lib/alertas-preco.js), relido a cada 60 s.
     Tela desenhada em 1920×1080 e encaixada no aparelho por transform (sem vh/vw, sem grid e sem animação CSS: o
     navegador das TVs é fraco — ver Painel Compras). Troca de página a cada 20 s, por JS.
     ?kiosk=1 esconde o cursor · ?tela=N abre na N-ésima página. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0c0c0c;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:#f6f4ec}
#palco{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#0c0c0c;transform-origin:0 0}
.topo{position:absolute;left:0;top:0;width:1920px;height:112px;background:#151515;border-bottom:4px solid #FFD500}
.topo h1{position:absolute;left:40px;top:22px;font-size:50px;font-weight:800;letter-spacing:.5px}
.topo h1 b{color:#FFD500}
.topo .dir{position:absolute;right:40px;top:20px;text-align:right}
.topo .hr{font-size:44px;font-weight:800;line-height:1}
.topo .sub{font-size:20px;color:#b9b6ab;margin-top:6px}
.cards{position:absolute;left:40px;top:136px;width:1840px;height:170px}
.cd{float:left;width:445px;height:170px;margin-right:20px;background:#1a1a1a;border-radius:14px;border-left:10px solid #555;padding:16px 22px}
.cd.ult{margin-right:0}
.cd .nm{font-size:22px;font-weight:700;color:#d9d6ca;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden}
.cd .v{font-size:78px;font-weight:800;line-height:1.05}
.cd .lj{font-size:21px;color:#b9b6ab;white-space:nowrap;overflow:hidden}
.cd.g3{border-left-color:#C8102E}.cd.g3 .v{color:#ff5a72}
.cd.g2{border-left-color:#FF9F1C}.cd.g2 .v{color:#FFB648}
.cd.g1{border-left-color:#3B82F6}.cd.g1 .v{color:#7FB2FF}
.cd.zero{border-left-color:#22C55E}.cd.zero .v{color:#22C55E}
.pag{position:absolute;left:40px;top:330px;width:1840px;height:690px;display:none}
.pag.on{display:block}
.pag h2{font-size:34px;font-weight:800;margin-bottom:12px;white-space:nowrap}
.pag h2 small{font-size:22px;font-weight:600;color:#b9b6ab;margin-left:14px}
table{width:1840px;border-collapse:collapse;table-layout:fixed}
th{font-size:19px;text-transform:uppercase;letter-spacing:.6px;color:#b9b6ab;text-align:left;padding:8px 12px;border-bottom:2px solid #2a2a2a;font-weight:700}
td{font-size:27px;padding:9px 12px;border-bottom:1px solid #2a2a2a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th.n,td.n{text-align:right}
td.lj b{display:inline-block;background:#FFD500;color:#0c0c0c;border-radius:6px;padding:0 10px;font-weight:800}
td.neg{color:#ff5a72;font-weight:800}td.sug{color:#22C55E;font-weight:800}td.obs{color:#b9b6ab;font-size:22px}
.tg{display:inline-block;font-size:17px;font-weight:800;border-radius:6px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.tg.pr{background:#5B3FA8;color:#fff}.tg.rb{background:#A44A00;color:#fff}
.vazio{font-size:40px;color:#22C55E;font-weight:800;padding:120px 0;text-align:center}
.rod{position:absolute;left:40px;top:1034px;width:1840px;font-size:20px;color:#8f8c82;white-space:nowrap;overflow:hidden}
.rod b{color:#d9d6ca}
.erro{color:#ff5a72}
body.kiosk{cursor:none}
</style>
</head>
<body>
<div id="palco">
  <div class="topo">
    <h1>PAINEL <b>PRECIFICAÇÃO</b></h1>
    <div class="dir"><div class="hr" id="hr">--:--</div><div class="sub" id="sub">carregando…</div></div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="pag" id="p0"></div>
  <div class="pag" id="p1"></div>
  <div class="pag" id="p2"></div>
  <div class="rod" id="rod"></div>
</div>
<script>
var QS = new URLSearchParams(location.search);
if (QS.get('kiosk') === '1') document.body.className = 'kiosk';
var PAGINAS = ['abaixo_custo', 'custo_subiu', 'abaixo_margem'], atual = Math.max(0, Math.min(2, (parseInt(QS.get('tela')) || 1) - 1)), D = null, LINHAS = 11;
function LJ(n) { return +n === 10 ? 'CD' : 'E' + n; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function money(v) { return v == null ? '—' : 'R$ ' + (+v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function pct(v) { return v == null || !isFinite(v) ? '—' : (+v).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%'; }
function encaixar() {
  var p = document.getElementById('palco'), s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  p.style.transform = 'scale(' + s + ')';
  p.style.left = Math.max(0, (window.innerWidth - 1920 * s) / 2) + 'px';
  p.style.top = Math.max(0, (window.innerHeight - 1080 * s) / 2) + 'px';
}
function relogio() { var d = new Date(); document.getElementById('hr').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function total(t) { var n = 0; for (var i = 0; i < D.lojas.length; i++) n += (D.resumo[D.lojas[i]].porTipo[t] || 0); return n; }
function porLoja(t) { return D.lojas.map(function (l) { return LJ(l) + ': ' + (D.resumo[l].porTipo[t] || 0); }).join('  ·  '); }
function tag(a) { return a.condicao === 'promocao' ? '<span class="tg pr">PROMOÇÃO</span>' : a.condicao === 'rebaixa' ? '<span class="tg rb">REBAIXA</span>' : ''; }
function tabela(t, arr) {
  if (!arr.length) return '<div class="vazio">Nada em aberto aqui.</div>';
  var cols = '<col style="width:90px"><col style="width:760px"><col style="width:190px"><col style="width:190px"><col style="width:150px"><col style="width:200px"><col style="width:260px">';
  var h = '<tr><th>Loja</th><th>Produto</th><th class="n">Custo</th><th class="n">Preço</th><th class="n">Margem</th><th class="n">Sugerido</th><th class="n">' + (t === 'abaixo_custo' ? 'Perde por mês' : 'Vale por mês') + '</th></tr>';
  var b = arr.slice(0, LINHAS).map(function (a) {
    return '<tr><td class="lj"><b>' + LJ(a.loja) + '</b></td><td>' + esc(a.desc) + tag(a) + '</td><td class="n">' + money(a.custo) + '</td><td class="n">' + money(a.preco) + '</td>' +
      '<td class="n' + (a.margem < 0 ? ' neg' : '') + '">' + pct(a.margem) + '</td><td class="n sug">' + (a.sugerido ? money(a.sugerido) : '—') + '</td>' +
      '<td class="n' + (t === 'abaixo_custo' ? ' neg' : '') + '">' + money(t === 'abaixo_custo' ? a.perdaMes : a.ganhoMes) + '</td></tr>';
  }).join('');
  return '<table><colgroup>' + cols + '</colgroup>' + h + b + '</table>';
}
function desenhar() {
  if (!D) return;
  var tipos = ['abaixo_custo', 'custo_subiu', 'sem_custo', 'abaixo_margem'];
  document.getElementById('cards').innerHTML = tipos.map(function (t, i) {
    var n = total(t);
    return '<div class="cd ' + (n ? 'g' + D.tipos[t].grav : 'zero') + (i === 3 ? ' ult' : '') + '"><div class="nm">' + esc(D.tipos[t].curto || D.tipos[t].nome) + '</div><div class="v">' + n + '</div><div class="lj">' + esc(porLoja(t)) + '</div></div>';
  }).join('');
  for (var i = 0; i < PAGINAS.length; i++) {
    var t = PAGINAS[i], arr = D[t] || [], n = total(t);
    document.getElementById('p' + i).innerHTML = '<h2>' + esc(D.tipos[t].nome) + '<small>' + (n > LINHAS ? 'os ' + LINHAS + ' mais urgentes de ' + n : n + ' em aberto') + ' · lojas ' + D.lojas.map(LJ).join(' e ') + '</small></h2>' + tabela(t, arr);
  }
  var a = D.assertividade || {}, c = D.calculadoEm ? new Date(D.calculadoEm) : null;
  document.getElementById('sub').textContent = 'Lojas ' + D.lojas.map(LJ).join(' e ') + (c ? ' · atualizado às ' + ('0' + c.getHours()).slice(-2) + ':' + ('0' + c.getMinutes()).slice(-2) : '');
  document.getElementById('rod').innerHTML = 'Carnes fora · final <b>7</b> = rebaixa · final <b>8</b> = promoção · alto giro não sobe · responda os alertas em <b>Precificação › Alertas de Preço</b>' + (a.total ? ' · ' + a.total + ' respostas, ' + a.pct + '% eram pra corrigir' : '');
  mostrar(atual);
}
function mostrar(i) { atual = i; for (var k = 0; k < PAGINAS.length; k++) document.getElementById('p' + k).className = 'pag' + (k === i ? ' on' : ''); }
function proxima() {
  if (!D) return;
  for (var k = 1; k <= PAGINAS.length; k++) { var i = (atual + k) % PAGINAS.length; if (total(PAGINAS[i]) > 0) return mostrar(i); }   // pula página vazia
}
function ler() {
  fetch('/api/paineis-publico/precificacao-dados?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'erro'); return j; }); })
    .then(function (j) { D = j; desenhar(); })
    .catch(function (e) { if (!D) document.getElementById('sub').innerHTML = '<span class="erro">sem dados: ' + esc(e.message) + '</span>'; });
}
window.tvSlideAtual = function () { return D ? D.tipos[PAGINAS[atual]].nome : ''; };
window.addEventListener('resize', encaixar);
encaixar(); relogio(); ler();
setInterval(relogio, 20000); setInterval(ler, 60000); setInterval(proxima, 20000);
</script>
<script src="/tv-heartbeat.js" data-painel="precificacao" defer></script>
</body>
</html>
