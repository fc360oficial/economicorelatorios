<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fornecedor">
<title>Portal do Fornecedor — Econômico</title>
<link rel="manifest" href="/fornecedor/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png?v=2">
<link rel="icon" href="/icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--pap:#EBEBE9;--crd:#fff;--ln:#DADAD6;--ln2:#C9C9C4;--ink:#0E1626;--ink2:#4E5A72;--am:#F5B800;--amk:#6B4E00;--amw:#FFF6D9;--amln:#EFD98F;--pos:#137A48;--posw:#E7F5EC;--neg:#C22F49;--negw:#FBEAED;--inf:#2E5E8C;--infw:#E9EEF6}
html,body{height:100%}
body{font-family:Inter,'Segoe UI',system-ui,sans-serif;background:var(--pap);color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--inf)}
.top{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;gap:12px}
.top .ey{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--am)}
.top h1{font-size:19px;font-weight:700;line-height:1.2;margin-top:3px}
.top .sub{font-size:12.5px;color:#AEB8CE;margin-top:2px}
.top .l{flex:1;min-width:0}
.bell{width:44px;height:44px;border-radius:22px;border:1px solid #2A3A5E;background:#101A30;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;font-size:18px;flex-shrink:0}
.bell.on::after{content:'';position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:5px;background:var(--am);border:2px solid var(--ink)}
main{padding:14px 14px calc(84px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.sec{margin-bottom:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.sec-h b{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--ink2)}
.sec-h span{font-size:12px;font-weight:600;color:var(--ink2)}
.card{background:var(--crd);border:1px solid var(--ln);border-radius:9px;padding:12px 14px;margin-bottom:8px;display:block;color:inherit;text-decoration:none}
a.card{display:flex;align-items:center;gap:12px}
a.card:active{background:#F4F4F2}
.card .c{flex:1;min-width:0}
.card .t{font-size:15px;font-weight:700}
.card .s{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.4}
.card .chev{color:var(--ink2);font-size:20px;flex-shrink:0}
.card.am{border-left:4px solid var(--am)}.card.inf{border-left:4px solid var(--inf)}.card.neg{border-left:4px solid var(--neg)}.card.pos{border-left:4px solid var(--pos)}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;border-radius:7px;padding:2px 8px;margin-top:5px}
.pill.am{color:var(--amk);background:var(--amw);border:1px solid var(--amln)}.pill.inf{color:var(--inf);background:var(--infw)}.pill.pos{color:var(--pos);background:var(--posw)}.pill.neg{color:var(--neg);background:var(--negw)}.pill.off{color:var(--ink2);background:#F4F4F2}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.row:last-child{border-bottom:none;padding-bottom:0}.row:first-child{padding-top:0}
.row .dot{width:8px;height:8px;border-radius:4px;background:var(--ln2);flex-shrink:0}.row .dot.pos{background:var(--pos)}
.row .n{flex:1;font-size:14px}.row .v{font-size:13px;font-weight:600;color:var(--ink2);text-align:right}.row .v.pos{color:var(--pos)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 14px;border-radius:7px;border:1px solid var(--ln2);background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer}
.btn.d{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700;flex:1}.btn.p{background:var(--am);color:var(--ink);border-color:var(--am);font-weight:700;flex:1}.btn[disabled]{opacity:.55}
.empty{color:var(--ink2);font-size:13px;padding:14px;text-align:center;background:#fff;border:1px dashed var(--ln2);border-radius:9px}
.push{background:var(--ink);color:#fff;border-radius:9px;padding:12px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center}
.push .c{flex:1;font-size:13px;line-height:1.4}.push b{color:var(--am)}.push .btn{height:38px;border-color:#2A3A5E;background:#101A30;color:#fff}.push .btn.p{background:var(--am);color:var(--ink);border-color:var(--am);flex:none}
.push.ok{background:var(--posw);color:var(--ink)}.push.ok b{color:var(--pos)}.push.ok .btn{background:#fff;color:var(--ink);border-color:var(--ln2)}
.demo{background:var(--amw);color:var(--amk);border:1px solid var(--amln);border-radius:9px;padding:8px 12px;font-size:12.5px;margin-bottom:12px;font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;text-decoration:none;color:var(--ink2);font-size:11px;font-weight:600}
nav.tabs a.on{color:var(--ink);font-weight:700}nav.tabs a .i{font-size:20px;line-height:1}
.hid{display:none!important}
.entrada{max-width:440px;margin:0 auto;padding:10px 0}
.entrada h2{font-size:20px;font-weight:800;margin-bottom:6px}.entrada p{color:var(--ink2);line-height:1.45;margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.fld input,.fld select{width:100%;height:44px;border:1px solid var(--ln2);border-radius:9px;padding:0 12px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
.fld input:focus,.fld select:focus{outline:2px solid var(--am);border-color:var(--am)}
.fld input.pin{font-size:22px;letter-spacing:.35em;font-weight:700}
.fld small{display:block;font-size:11.5px;color:var(--ink2);margin-top:4px;line-height:1.4}
.sen{position:relative}.sen input{padding-right:46px}.sen .eye{position:absolute;right:4px;top:4px;width:36px;height:36px;border:none;background:transparent;font-size:17px;cursor:pointer;color:var(--ink2)}
.links{font-size:13px;margin-top:14px;line-height:1.7}
.de{background:var(--infw);color:var(--inf);border-radius:9px;padding:8px 12px;font-size:12.5px;margin-bottom:12px;font-weight:600;line-height:1.4}
.mini{font-size:12.5px;color:var(--ink2)}
.cad .k{font-size:12px;color:var(--ink2)}.cad .v{font-size:14px;font-weight:600;margin-bottom:8px}
.err{color:var(--neg);font-weight:600;font-size:13px;margin-top:6px}.err:empty{display:none}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:50}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"><div class="empty" style="margin:40px 14px">Carregando…</div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var ls = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del: function (k) { try { localStorage.removeItem(k); } catch (e) {} } };
var KEY = 'portalVt', SUB = 'portalSubOk', TAB = 'portalTab', NOME = 'portalNome', ULT = 'portalUltWhats';
var fmtR = function (n) { return 'R$ ' + (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
var fone = function (d) { d = String(d || '').replace(/\D/g, ''); if (d.length === 11) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7); if (d.length === 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6); return d; };
var DIAS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
function prazoTxt(p) { if (!p) return 'sem prazo'; var d = new Date(p); if (isNaN(d)) return esc(p); return DIAS[d.getDay()] + ' ' + String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + ' às ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function restam(p) { if (!p) return ''; var ms = new Date(p) - Date.now(); if (ms <= 0) return 'prazo encerrado'; var m = Math.round(ms / 60000); if (m < 60) return 'faltam ' + m + ' min'; var h = Math.floor(m / 60); if (h < 48) return 'faltam ' + h + ' h'; return 'faltam ' + Math.floor(h / 24) + ' dias'; }
function dt(s) { return s ? new Date(s).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''; }
function dd(s) { return s ? new Date(s).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) : ''; }
function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(window._tt); window._tt = setTimeout(function () { t.classList.remove('on'); }, 3600); }
function api(url, body) { var vt = ls.get(KEY); return fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 'vt=' + encodeURIComponent(vt || ''), body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ vt: vt }, body)) } : { cache: 'no-store' }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || j.error) { var e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; } return j; }); }); }
function b64(s) { var p = '='.repeat((4 - s.length % 4) % 4); var b = (s + p).replace(/-/g, '+').replace(/_/g, '/'); var raw = atob(b); var a = new Uint8Array(raw.length); for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i); return a; }

var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
var pushOk = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
var deferred = null; window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; var b = $('#btn-instalar'); if (b) b.classList.remove('hid'); });
var DEMO = new URLSearchParams(location.search).get('demo') === '1';
var D = null, TABA = ls.get(TAB) || 'cot', subAtual = null;
// de onde o vendedor veio (painel na página da cotação/pedido): pré-preenche o cadastro e volta pra lá depois de entrar
var DE = (function () { var m = (new URLSearchParams(location.search).get('de') || '').match(/^(cotacao|pedido)\/([a-f0-9]{32})$/); return m ? { tipo: m[1], token: m[2] } : null; })();
var MODO = /criar/.test(location.hash) ? 'criar' : 'entrar', CONV = null;

// ── exemplo (Tiago: toda tela nova entra com exemplo visível) ──
function demoDados() {
  var h = Date.now(), dia = 86400000;
  var iso = function (ms, hh) { var d = new Date(ms); d.setHours(hh || 18, 0, 0, 0); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + 'T' + String(hh || 18).padStart(2, '0') + ':00'; };
  return {
    vendedor: { id: '81998124410', nome: 'Carlos Menezes', whats: '81998124410', whats_mascara: '(81) 9••••-4410', email: 'carlos@somar.com.br', tem_pin: true, empresas: [{ codFornec: 1234, nome: 'Somar Distribuidora' }], dispositivos: 1 },
    cotacoes_abertas: [
      { id: 13, nome: 'Bebidas', status: 'aberta', prazo: iso(h + 2 * dia, 18), itens: 42, cotados: 34, f_status: 'digitacao', link: '#', fornecedor: 'Somar Distribuidora', comprador: { nome: 'Patrícia' } },
      { id: 12, nome: 'Mercearia', status: 'aberta', prazo: iso(h + 1 * dia, 18), itens: 65, cotados: 65, f_status: 'finalizado', finalizadoEm: new Date(h - dia).toISOString(), link: '#', fornecedor: 'Somar Distribuidora', comprador: { nome: 'Patrícia' } }
    ],
    resultados: [
      { id: 11, nome: 'Limpeza', status: 'fechada', itens: 30, cotados: 30, f_status: 'finalizado', venceu: { itens: 14, total: 12340, pedidoId: 58 } },
      { id: 10, nome: 'Bebidas', status: 'fechada', itens: 38, cotados: 36, f_status: 'finalizado', venceu: { itens: 0, total: 0 } }
    ],
    pedidos_pendentes: [{ id: 58, lista_nome: 'Limpeza', fornecedor: 'Somar Distribuidora', status: 'aguardando', itens: 14, lojas: [1, 2, 3, 10], total: 12340, link: '#', pdf: '#', cotacao: { id: 11, nome: 'Limpeza', entrega: iso(h + 3 * dia).slice(0, 10) } }],
    pedidos_historico: [{ id: 51, lista_nome: 'Bebidas', fornecedor: 'Somar Distribuidora', status: 'aprovado', itens: 22, lojas: [1, 4], total: 8930.5, finalizadoEm: new Date(h - 9 * dia).toISOString(), link: '#', pdf: '#', cotacao: { id: 9, nome: 'Bebidas' } }],
    cadastro: { fornecedor: 'Somar Distribuidora', condicao: 'Boleto 28 dias', prazo_entrega: 3, faturamento_minimo: 1500, email: 'carlos@somar.com.br', listas: [277, 281] },
    push: { disponivel: true, chave: null, dispositivos: 1 }
  };
}

// ── entrada: entrar com WhatsApp e PIN, ou criar o login ──
function topo(t, s) { return '<div class="top"><div class="l"><div class="ey">ECONÔMICO SUPERMERCADOS · REDE CAHU</div><h1>' + esc(t) + '</h1><div class="sub">' + esc(s) + '</div></div></div>'; }
function entrada(msg) {
  $('#app').innerHTML = topo('Portal do Fornecedor', 'cotações e pedidos no seu celular') + '<main><div class="entrada">' + (msg ? '<div class="err" style="margin-bottom:12px">' + esc(msg) + '</div>' : '') + '<div id="de-info"></div>' +
    (MODO === 'criar' ? formCriar() : formEntrar()) +
    '</div></main>';
  var ew = $('#ew'); if (ew && ls.get(ULT)) ew.value = fone(ls.get(ULT));
  var f = (ew && ew.value) ? $('#sp') : (ew || $('#cn')); if (f && !DE) f.focus();
  if (DE) { if (CONV) aplicarConvite(); else api('/api/portal/convite/' + DE.tipo + '/' + DE.token).then(function (c) { CONV = c; aplicarConvite(); }).catch(function () {}); }
}
function trocarModo(m) { MODO = m; history.replaceState(null, '', location.pathname + location.search + '#' + m); entrada(); }
var PIN_ATTR = 'type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••"';
function campoPin(id, rotulo, auto, dica) { return '<label for="' + id + '">' + rotulo + '</label><div class="sen"><input id="' + id + '" class="pin" ' + PIN_ATTR + ' autocomplete="' + auto + '" required><button type="button" class="eye" onclick="olho(\'' + id + '\',this)" aria-label="mostrar PIN">👁</button></div>' + (dica ? '<small>' + dica + '</small>' : ''); }
function formEntrar() {
  return '<h2>Entrar no portal</h2><p>Seu WhatsApp e o PIN de 6 números que você criou. Aqui você vê suas cotações abertas, pedidos e resultados, e recebe as próximas cotações da Econômico como aviso no celular.</p>' +
    '<form class="fld" onsubmit="entrar();return false" autocomplete="on"><label for="ew">WhatsApp com DDD</label><input id="ew" inputmode="tel" autocomplete="tel" placeholder="81 99999-0000" required>' +
    campoPin('sp', 'PIN', 'current-password') +
    '<div class="err" id="f-err"></div><button class="btn d" type="submit" id="f-ok" style="width:100%;margin-top:14px">Entrar</button></form>' +
    '<p class="links">Primeira vez aqui? <a href="#criar" onclick="trocarModo(\'criar\');return false">Criar meu login</a><br>Esqueceu o PIN? <a href="#" onclick="esqueci();return false">veja como recuperar</a></p>' +
    '<div id="esq" class="hid card" style="font-size:13px;line-height:1.45"><b>Esqueceu o PIN?</b> Peça pro(a) comprador(a) da Econômico redefinir: ele(a) faz isso na hora pela tela Portal do Fornecedor e te manda o novo PIN pelo WhatsApp. Depois troque por um seu na aba Cadastro.</div>';
}
function formCriar() {
  return '<h2>Criar meu login</h2><p>Seu WhatsApp e um PIN de 6 números. Com eles você entra em qualquer celular e recebe as próximas cotações da Econômico como aviso, sem esperar o link no WhatsApp.</p>' +
    '<form class="fld" onsubmit="criar();return false" autocomplete="on"><div id="de-quem"></div>' +
    '<label for="cn">Seu nome</label><input id="cn" autocomplete="name" placeholder="Nome e sobrenome" required>' +
    '<label for="cw">WhatsApp com DDD</label><input id="cw" inputmode="tel" autocomplete="tel" placeholder="81 99999-0000" required><small>é o seu login: o mesmo número que a Econômico usa pra te mandar as cotações</small>' +
    campoPin('cp', 'Crie um PIN de 6 números', 'new-password', 'só números, ex. 482913') +
    campoPin('cp2', 'Repita o PIN', 'new-password') +
    '<label for="ce">E-mail</label><input id="ce" type="email" inputmode="email" autocomplete="email" placeholder="seu@email.com.br" required><small>pro cadastro do fornecedor (pedidos e nota); pra entrar você usa o WhatsApp</small>' +
    '<div class="err" id="f-err"></div><button class="btn d" type="submit" id="f-ok" style="width:100%;margin-top:14px">Criar login e entrar</button></form>' +
    '<p class="links">Já tem login? <a href="#entrar" onclick="trocarModo(\'entrar\');return false">Entrar</a></p>';
}
function olho(id, b) { var i = $('#' + id); i.type = i.type === 'password' ? 'text' : 'password'; b.textContent = i.type === 'password' ? '👁' : '🙈'; }
function esqueci() { $('#esq').classList.toggle('hid'); }
function fErr(m) { var e = $('#f-err'); if (e) e.textContent = m || ''; }
function ocupado(on, txt) { var b = $('#f-ok'); if (b) { b.disabled = on; if (txt) b.textContent = txt; } }
function pinOk(p) { return /^\d{6}$/.test(String(p || '').trim()); }
// convite da cotação/pedido de onde o vendedor veio: diz de onde ele veio e preenche nome/WhatsApp/e-mail no cadastro
function aplicarConvite() {
  var c = CONV; if (!c) return;
  var alvo = (c.tipo === 'pedido' ? 'o pedido' : 'a cotação') + ' #' + c.id + (c.nome ? ' · ' + esc(c.nome) : '') + (c.fornecedor ? ' (' + esc(c.fornecedor) + ')' : '');
  var info = $('#de-info'); if (info) info.innerHTML = '<div class="de">' + (c.exige_login && c.tipo === 'cotacao' ? 'Pra responder ' + alvo + ' é preciso entrar no portal. ' : 'Você veio d' + alvo + '. ') + 'Depois de entrar você volta pra ' + (c.tipo === 'pedido' ? 'ele' : 'ela') + '.</div>';
  var vs = c.vendedores || [];
  if (MODO !== 'criar') { var ew = $('#ew'); if (ew && !ew.value && vs.length === 1 && vs[0].whats) { ew.value = fone(vs[0].whats); var sp = $('#sp'); if (sp) sp.focus(); } return; }
  var q = $('#de-quem'); if (!q) return;
  var comPin = vs.filter(function (v) { return v.tem_pin; });
  var h = comPin.length ? '<div class="card inf" style="font-size:13px;line-height:1.45">' + esc(comPin[0].nome || 'Este vendedor') + ' já tem login' + (comPin[0].whats ? ' (' + esc(fone(comPin[0].whats)) + ')' : '') + '. <a href="#entrar" onclick="trocarModo(\'entrar\');return false">Entrar com WhatsApp e PIN</a></div>' : '';
  if (vs.length > 1) h += '<label for="de-sel">Quem é você?</label><select id="de-sel" onchange="escolherQuem(this.value)"><option value="">— escolha seu nome —</option>' + vs.map(function (v, k) { return '<option value="' + k + '">' + esc(v.nome || fone(v.whats) || 'Vendedor ' + (k + 1)) + (v.tem_pin ? ' · já tem login' : '') + '</option>'; }).join('') + '</select><small>só pra preencher os campos; você pode corrigir</small>';
  q.innerHTML = h;
  if (vs.length === 1) preencher(vs[0]);
}
function escolherQuem(k) { var v = CONV && CONV.vendedores[parseInt(k, 10)]; if (v) preencher(v); }
function preencher(v) { if ($('#cn')) $('#cn').value = v.nome || ''; if ($('#cw')) $('#cw').value = v.whats ? fone(v.whats) : ''; if ($('#ce')) $('#ce').value = v.email || ''; var p = $('#cp'); if (p) p.focus(); }
function entrar() {
  var whats = ($('#ew').value || '').trim(), pin = ($('#sp').value || '').trim();
  if (!whats || !pin) { fErr('Digite o WhatsApp e o PIN.'); return; }
  if (!pinOk(pin)) { fErr('O PIN tem 6 números.'); return; }
  fErr(''); ocupado(true, 'Entrando…');
  api('/api/portal/conta/entrar', { whats: whats, pin: pin, de: DE }).then(logado).catch(function (e) { ocupado(false, 'Entrar'); fErr(e.message); });
}
function criar() {
  var nome = ($('#cn').value || '').trim(), whats = ($('#cw').value || '').trim(), email = ($('#ce').value || '').trim(), p1 = ($('#cp').value || '').trim(), p2 = ($('#cp2').value || '').trim();
  if (!nome || !whats || !email) { fErr('Preencha nome, WhatsApp e e-mail.'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { fErr('E-mail inválido.'); return; }
  if (!pinOk(p1)) { fErr('O PIN tem 6 números.'); return; }
  if (p1 !== p2) { fErr('Os dois PINs não são iguais.'); return; }
  fErr(''); ocupado(true, 'Criando…');
  api('/api/portal/conta/criar', { nome: nome, whats: whats, email: email, pin: p1, de: DE }).then(logado).catch(function (e) { ocupado(false, 'Criar login e entrar'); fErr(e.message); });
}
function logado(r) {
  ls.set(KEY, r.vt); ls.del(SUB); ls.set(NOME, (r.vendedor && r.vendedor.nome) || ''); if (r.vendedor && r.vendedor.whats) ls.set(ULT, r.vendedor.whats);
  if (DE) { location.href = '/fornecedor/' + DE.tipo + '/' + DE.token + '#avisos'; return; }   // volta pra cotação; lá o painel oferece os avisos
  history.replaceState(null, '', location.pathname);
  carregar().then(function () { toast('Pronto' + (r.vendedor && r.vendedor.nome ? ', ' + r.vendedor.nome.split(' ')[0] : '') + '! Agora ative os avisos pra receber as próximas cotações aqui.'); });
}
// vendedor que entrou pelo "Sou eu" (antes do login existir): ainda não tem PIN, cria aqui
function telaPin() {
  var v = D.vendedor;
  $('#app').innerHTML = topo('Olá, ' + ((v.nome || '').split(' ')[0] || 'vendedor'), 'crie seu PIN pra continuar') + '<main><div class="entrada"><h2>Crie seu PIN</h2><p>O portal agora entra com o seu WhatsApp ' + (v.whats ? '<b>' + esc(fone(v.whats)) + '</b> ' : '') + 'e um PIN de 6 números. Escolha o seu uma vez; a partir daí é só entrar, em qualquer celular.</p>' +
    '<form class="fld" onsubmit="definirPin();return false"><label for="le">E-mail</label><input id="le" type="email" inputmode="email" autocomplete="email" value="' + esc(v.email || '') + '" placeholder="seu@email.com.br" required><small>pro cadastro do fornecedor; pra entrar você usa o WhatsApp</small>' + campoPin('lp1', 'PIN de 6 números', 'new-password', 'só números, ex. 482913') + campoPin('lp2', 'Repita o PIN', 'new-password') +
    '<div class="err" id="f-err"></div><button class="btn d" type="submit" id="f-ok" style="width:100%;margin-top:14px">Salvar e continuar</button></form>' +
    '<p class="links"><a href="#" onclick="sair();return false">Sair deste celular</a></p></div></main>';
}
function definirPin() {
  var p1 = ($('#lp1').value || '').trim(), p2 = ($('#lp2').value || '').trim(), em = ($('#le').value || '').trim();
  if (!em) { fErr('Informe o e-mail.'); return; }
  if (!pinOk(p1)) { fErr('O PIN tem 6 números.'); return; }
  if (p1 !== p2) { fErr('Os dois PINs não são iguais.'); return; }
  fErr(''); ocupado(true, 'Salvando…');
  api('/api/portal/conta/pin', { pin_novo: p1, email: em }).then(function () { toast('PIN criado ✓'); return carregar(); }).catch(function (e) { ocupado(false, 'Salvar e continuar'); fErr(e.message); });
}

// ── telas ──
function cardCot(c) {
  var fin = c.f_status === 'finalizado', venc = c.prazo_vencido;
  var cls = fin ? 'inf' : (venc ? 'neg' : 'am');
  var pill = fin ? '<span class="pill inf">proposta enviada · aguardando resultado</span>' : venc ? '<span class="pill neg">prazo encerrado · fale com o(a) comprador(a)</span>' : (c.itens - c.cotados > 0 ? '<span class="pill am">faltam ' + (c.itens - c.cotados) + ' itens</span>' : '<span class="pill pos">tudo com preço · falta enviar</span>');
  return '<a class="card ' + cls + '" href="' + esc(c.link) + '"><div class="c"><div class="t">#' + c.id + ' · ' + esc(c.nome) + '</div><div class="s">' + c.itens + ' itens · prazo ' + prazoTxt(c.prazo) + (!fin && !venc && c.prazo ? ' · ' + restam(c.prazo) : '') + (c.comprador && c.comprador.nome ? '<br>comprador(a): ' + esc(c.comprador.nome) : '') + '</div>' + pill + '</div><span class="chev">›</span></a>';
}
function cardPed(p, pend) {
  var ent = p.cotacao && p.cotacao.entrega ? ' · entrega ' + String(p.cotacao.entrega).slice(0, 10).split('-').reverse().slice(0, 2).join('/') : '';
  var lojas = (p.lojas || []).map(function (l) { return l === 10 ? 'CD' : 'E' + l; }).join(' ');
  var st = { aguardando: 'aguardando sua confirmação', digitacao: 'em preenchimento', finalizado: 'confirmado · aguardando aprovação', aprovado: 'aprovado · entregar', conciliado: 'entregue', fechado: 'encerrado' }[p.status] || p.status;
  return '<div class="card' + (pend ? ' am' : '') + '"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div class="c"><div class="t">Pedido #' + p.id + ' · ' + esc(p.lista_nome || '') + '</div><div class="s">' + p.itens + ' itens' + (lojas ? ' · ' + lojas : '') + ent + '<br><span class="pill ' + (pend ? 'am' : p.status === 'aprovado' ? 'pos' : 'off') + '">' + esc(st) + '</span></div></div>' + (p.total ? '<div style="font-size:15px;font-weight:700;white-space:nowrap">' + fmtR(p.total) + '</div>' : '') + '</div>' +
    '<div class="btns"><a class="btn d" href="' + esc(p.link) + '">' + (pend ? 'Confirmar entrega' : 'Abrir pedido') + '</a><a class="btn" href="' + esc(p.pdf) + '" target="_blank" rel="noopener">PDF</a></div></div>';
}
function pushCard() {
  var v = D.vendedor, perm = DEMO ? 'granted' : (pushOk ? Notification.permission : 'unsupported');
  if (!pushOk && !DEMO) return isIOS && !standalone
    ? '<div class="push"><div class="c"><b>Avisos no iPhone:</b> toque em Compartilhar e em <b>Adicionar à Tela de Início</b>. Depois abra o app Fornecedor e ative os avisos aqui.</div></div>'
    : '<div class="push"><div class="c">Este navegador não recebe avisos. Use o Chrome no Android ou instale o app.</div></div>';
  if (perm === 'granted' && subAtual) return '<div class="push ok"><div class="c"><b>Avisos ativados</b> neste celular' + (v.dispositivos > 1 ? ' e em mais ' + (v.dispositivos - 1) + ' aparelho(s)' : '') + '. Nova cotação, lembrete de prazo e pedido chegam aqui.</div><button class="btn" onclick="testarPush()">Testar</button></div>';
  if (perm === 'denied') return '<div class="push"><div class="c"><b>Avisos bloqueados</b> neste navegador. Libere em Configurações do site → Notificações e volte aqui.</div></div>';
  return '<div class="push"><div class="c"><b>Avisos desligados.</b> Ative pra receber as próximas cotações neste celular, sem esperar o WhatsApp.</div><button class="btn p" onclick="ativarPush()">🔔 Ativar</button></div>';
}
function render() {
  var v = D.vendedor, nome = (v.nome || v.whats_mascara || 'vendedor').split(' ')[0];
  var emp = (v.empresas || []).map(function (e) { return e.nome; }).join(' · ');
  var ab = D.cotacoes_abertas || [], rs = D.resultados || [], pp = D.pedidos_pendentes || [], ph = D.pedidos_historico || [], cad = D.cadastro;
  var h = '<div class="top"><div class="l"><div class="ey">ECONÔMICO SUPERMERCADOS · REDE CAHU</div><h1>Olá, ' + esc(nome) + '</h1><div class="sub">' + esc(emp || 'Portal do Fornecedor') + (pushOk && Notification.permission === 'granted' && subAtual ? ' · avisos ativados' : '') + '</div></div><button class="bell' + (ab.filter(function (c) { return c.f_status !== 'finalizado'; }).length || pp.length ? ' on' : '') + '" aria-label="Avisos" onclick="ativarPush()">🔔</button></div><main>';
  if (DEMO) h += '<div class="demo">EXEMPLO · dados fictícios pra mostrar como o portal fica. <a href="/fornecedor/">sair do exemplo</a></div>';
  h += pushCard();
  // Cotações
  h += '<div class="sec" data-tab="cot"><div class="sec-h"><b>COTAÇÕES ABERTAS</b><span>' + ab.length + '</span></div>' + (ab.length ? ab.map(cardCot).join('') : '<div class="empty">Nenhuma cotação aberta pra você agora. Quando a Econômico abrir uma, ela aparece aqui' + (pushOk && subAtual ? ' e você recebe o aviso' : '') + '.</div>') + '</div>';
  if (pp.length) h += '<div class="sec" data-tab="cot ped"><div class="sec-h"><b>PEDIDO' + (pp.length > 1 ? 'S' : '') + ' PRA CONFIRMAR</b><span>' + pp.length + '</span></div>' + pp.map(function (p) { return cardPed(p, true); }).join('') + '</div>';
  h += '<div class="sec" data-tab="cot hist"><div class="sec-h"><b>ÚLTIMOS RESULTADOS</b></div>' + (rs.length ? '<div class="card">' + rs.slice(0, TABA === 'hist' ? 12 : 3).map(function (r) { var w = r.venceu; var ok = w && w.itens > 0; return '<div class="row"><div class="dot' + (ok ? ' pos' : '') + '"></div><div class="n">#' + r.id + ' · ' + esc(r.nome) + (r.status === 'cancelada' ? ' <span class="pill off">cancelada</span>' : '') + '</div><div class="v' + (ok ? ' pos' : '') + '">' + (w ? (ok ? 'venceu ' + w.itens + ' de ' + r.itens + ' itens' + (w.total ? ' · ' + fmtR(w.total) : '') : 'venceu 0 de ' + r.itens + ' itens') : (r.f_status === 'finalizado' ? 'proposta enviada' : 'não respondida')) + '</div></div>'; }).join('') + '</div>' : '<div class="empty">Ainda não tem cotação encerrada no seu nome.</div>') + '</div>';
  // Pedidos
  h += '<div class="sec" data-tab="ped"><div class="sec-h"><b>PEDIDOS ANTERIORES</b><span>' + ph.length + '</span></div>' + (ph.length ? ph.map(function (p) { return cardPed(p, false); }).join('') : '<div class="empty">Nenhum pedido anterior.</div>') + '</div>';
  // Cadastro
  h += '<div class="sec" data-tab="cad"><div class="sec-h"><b>SEU CADASTRO</b></div><div class="card cad">' + (cad ? '<div class="k">Fornecedor</div><div class="v">' + esc(cad.fornecedor || emp) + '</div><div class="k">Condição de pagamento</div><div class="v">' + esc(cad.condicao || 'não informada') + '</div><div class="k">Pedido mínimo</div><div class="v">' + (cad.faturamento_minimo != null ? fmtR(cad.faturamento_minimo) : 'não informado') + '</div><div class="k">Tempo de entrega</div><div class="v">' + (cad.prazo_entrega != null ? cad.prazo_entrega + ' dia(s)' : 'não informado') + '</div><div class="k">E-mail do cadastro</div><div class="v">' + esc(cad.email || v.email || 'não informado') + '</div>' : '<div class="k">Fornecedor</div><div class="v">' + esc(emp || '—') + '</div><div class="s">Seu cadastro (condição, pedido mínimo, entrega, e-mail) é preenchido na primeira cotação que você responder.</div>') +
    '<div class="k">Vendedor</div><div class="v">' + esc(v.nome || '—') + '</div><div class="k">Login (WhatsApp)</div><div class="v">' + esc(v.whats ? fone(v.whats) : (v.whats_mascara || '—')) + '</div><div class="s" style="margin-top:6px">Pra corrigir o cadastro, preencha o bloco "Estamos atualizando nosso cadastro de fornecedor" na próxima cotação, ou fale com o(a) comprador(a).</div>' +
    '<div class="btns"><button class="btn" onclick="formTroca()">Trocar PIN</button><button class="btn hid" id="btn-instalar" onclick="instalar()">📲 Instalar na tela inicial</button><button class="btn" onclick="sair()">Sair deste celular</button></div>' +
    '<div id="troca" class="hid" style="margin-top:10px"><form class="fld" onsubmit="trocar();return false">' + campoPin('pa', 'PIN atual', 'current-password') + campoPin('pn', 'Novo PIN (6 números)', 'new-password') + campoPin('pn2', 'Repita o novo PIN', 'new-password') + '<div class="err" id="t-err"></div><div class="btns"><button class="btn d" type="submit">Salvar novo PIN</button><button class="btn" type="button" onclick="formTroca()">Cancelar</button></div></form></div></div></div>';
  h += '</main><nav class="tabs">' + [['cot', '📋', 'Cotações'], ['ped', '📦', 'Pedidos'], ['hist', '🕘', 'Histórico'], ['cad', '👤', 'Cadastro']].map(function (t) { return '<a href="#" data-t="' + t[0] + '"' + (TABA === t[0] ? ' class="on"' : '') + ' onclick="aba(\'' + t[0] + '\');return false"><span class="i">' + t[1] + '</span>' + t[2] + '</a>'; }).join('') + '</nav>';
  $('#app').innerHTML = h;
  var bi = $('#btn-instalar'); if (bi) { if (!deferred) bi.classList.add('hid'); else bi.classList.remove('hid'); }
  pintar();
}
function aba(t) { var prev = TABA; TABA = t; ls.set(TAB, t); if (D && (t === 'hist' || prev === 'hist') && t !== prev) { render(); return; } pintar(); }
function pintar() { document.querySelectorAll('.sec[data-tab]').forEach(function (s) { s.classList.toggle('hid', s.getAttribute('data-tab').split(' ').indexOf(TABA) < 0); }); document.querySelectorAll('nav.tabs a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-t') === TABA); }); }
function formTroca() { var t = $('#troca'); t.classList.toggle('hid'); if (!t.classList.contains('hid')) $('#pa').focus(); }
function trocar() {
  if (DEMO) { toast('No exemplo não dá pra trocar o PIN.'); return; }
  var a = ($('#pa').value || '').trim(), n1 = ($('#pn').value || '').trim(), n2 = ($('#pn2').value || '').trim(), e = $('#t-err');
  if (!pinOk(n1)) { e.textContent = 'O novo PIN tem 6 números.'; return; }
  if (n1 !== n2) { e.textContent = 'Os dois PINs não são iguais.'; return; }
  e.textContent = '';
  api('/api/portal/conta/pin', { pin_atual: a, pin_novo: n1 }).then(function () { toast('PIN trocado ✓'); render(); }).catch(function (x) { e.textContent = x.message; });
}

// ── push / instalar / sair ──
function swReg() { return navigator.serviceWorker.register('/fornecedor/sw.js', { scope: '/fornecedor/' }); }
function lerSub() { if (!pushOk) return Promise.resolve(null); return swReg().then(function (r) { return r.pushManager.getSubscription(); }).catch(function () { return null; }); }
function ativarPush() {
  if (DEMO) { toast('No exemplo os avisos não são ativados de verdade.'); return; }
  if (!pushOk) { toast(isIOS && !standalone ? 'No iPhone: Compartilhar → Adicionar à Tela de Início, depois ative aqui dentro do app.' : 'Este navegador não recebe avisos.'); return; }
  Notification.requestPermission().then(function (perm) {
    if (perm !== 'granted') { toast(perm === 'denied' ? 'Avisos bloqueados neste navegador.' : 'Você não permitiu os avisos.'); return; }
    return api('/api/portal/vapid').then(function (k) {
      if (!k.chave) throw new Error('Avisos ainda não disponíveis no servidor' + (k.erro ? ': ' + k.erro : ''));
      return swReg().then(function (reg) { return navigator.serviceWorker.ready.then(function () { return reg.pushManager.getSubscription(); }).then(function (s) { return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(k.chave) }); }); });
    }).then(function (sub) { subAtual = sub; return api('/api/portal/push/inscrever', { subscription: sub.toJSON ? sub.toJSON() : sub }); })
      .then(function () { ls.set(SUB, '1'); toast('Avisos ativados ✓ — mandei um aviso de teste'); return api('/api/portal/push/testar', {}).catch(function () {}); })
      .then(function () { return carregar(); });
  }).catch(function (e) { toast('Não deu: ' + e.message); });
}
function testarPush() { if (DEMO) { toast('No exemplo não tem aviso de verdade.'); return; } api('/api/portal/push/testar', {}).then(function (r) { toast(r.ok ? 'Aviso de teste enviado. Olhe a barra de notificações.' : 'Nenhum aparelho recebeu: ' + (r.erro || 'reative os avisos')); }).catch(function (e) { toast('Erro: ' + e.message); }); }
function instalar() { if (deferred) { deferred.prompt(); deferred = null; } else toast(isIOS ? 'Compartilhar → Adicionar à Tela de Início' : 'Menu ⋮ do navegador → Instalar app'); }
function sair() {
  if (DEMO) { location.href = '/fornecedor/'; return; }
  if (!confirm('Sair deste celular? Os avisos param aqui. Pra voltar, entre de novo com seu WhatsApp e PIN.')) return;
  var fim = function () { ls.del(KEY); ls.del(SUB); ls.del(NOME); location.reload(); };
  lerSub().then(function (s) { if (!s) return; return api('/api/portal/push/sair', { endpoint: s.endpoint }).catch(function () {}).then(function () { return s.unsubscribe().catch(function () {}); }); }).then(fim, fim);
}

// ── carga ──
function carregar() {
  if (DEMO) { D = demoDados(); subAtual = { fake: true }; render(); return Promise.resolve(); }
  if (!ls.get(KEY)) { entrada(); return Promise.resolve(); }
  return Promise.all([api('/api/portal/eu'), lerSub()]).then(function (r) {
    D = r[0]; subAtual = r[1];
    if (D.vendedor && !D.vendedor.tem_pin) { telaPin(); return; }   // entrou pelo "Sou eu" antes do login existir
    // navegador tem inscrição mas o servidor não sabe (dados apagados no .254, celular restaurado): reenvia
    if (subAtual && !ls.get(SUB)) api('/api/portal/push/inscrever', { subscription: subAtual.toJSON ? subAtual.toJSON() : subAtual }).then(function () { ls.set(SUB, '1'); }).catch(function () {});
    render();
  }).catch(function (e) { if (e.status === 401) { ls.del(KEY); ls.del(SUB); ls.del(NOME); entrada('Sua sessão venceu ou foi desligada pelo(a) comprador(a). Entre de novo com WhatsApp e PIN.'); } else $('#app').innerHTML = '<div class="empty" style="margin:40px 14px">Não consegui carregar o portal: ' + esc(e.message) + '<br><br><button class="btn d" onclick="carregar()">Tentar de novo</button></div>'; });
}
if (pushOk && !DEMO) swReg().catch(function () {});
carregar();
document.addEventListener('visibilitychange', function () { if (!document.hidden && D && !DEMO) carregar(); });
// #criar / #entrar tocados com a página de entrada aberta (link do WhatsApp com o portal já aberto)
window.addEventListener('hashchange', function () { if (ls.get(KEY) || DEMO) return; var m = /criar/.test(location.hash) ? 'criar' : 'entrar'; if (m !== MODO) { MODO = m; entrada(); } });
</script>
</body>
</html>
