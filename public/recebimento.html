<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E1626">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recebimento">
<link rel="manifest" href="/manifest-recebimento.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/design-system.css">
<title>Recebimento — Econômico</title>
<style>
:root{--navy:#0E1626;--navy2:#1B2A4A}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:var(--font);background:var(--pap);color:var(--ink);font-size:14px;line-height:1.45;display:flex;flex-direction:column;min-height:100dvh}
.mono{font-variant-numeric:tabular-nums}
.btn{height:42px;padding:0 14px;border-radius:var(--r);border:1px solid transparent;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--am);outline-offset:1px}
.btn:disabled{opacity:.55;cursor:default}
.btn-primary{background:var(--am);color:var(--amk)}
.btn-primary:hover{background:var(--am-hover)}
.btn-secondary{background:var(--crd);color:var(--ink2);border-color:var(--ln2)}
.btn-ghost{background:transparent;color:var(--ink2)}
.btn.blk{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── login ── */
#login{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lbox{background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);box-shadow:var(--sh-md);padding:22px 20px;width:100%;max-width:380px}
.lbox img{height:34px;margin-bottom:14px}
.lbox h1{font-size:19px;font-weight:800}
.lbox p{font-size:12.5px;color:var(--ink3);margin:4px 0 16px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.fld input{width:100%;height:46px;border-radius:var(--r);border:1.5px solid var(--ln2);background:var(--pap);color:var(--ink);font-family:var(--font);font-size:16px;padding:0 12px;outline:none}
.fld input:focus{border-color:var(--am)}
.fld input.pin{font-variant-numeric:tabular-nums;font-size:24px;letter-spacing:8px;text-align:center;font-weight:700}
.lojas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lojas button{border:1.5px solid var(--ln2);border-radius:var(--r-sm);padding:10px 0;text-align:center;font-weight:700;font-size:13px;background:var(--pap);color:var(--ink);font-family:var(--font);cursor:pointer;line-height:1.15}
.lojas button small{display:block;font-size:9.5px;font-weight:600;color:var(--ink3);letter-spacing:.3px}
.lojas button[aria-pressed="true"]{border-color:var(--am);background:var(--amw);color:var(--amk)}
.lojas button[aria-pressed="true"] small{color:var(--amk)}
.erro{color:var(--neg);font-size:12.5px;font-weight:600;margin:-4px 0 10px;min-height:16px}
.tip{font-size:11.5px;color:var(--ink3)}

/* ── telas do app ── */
.tela{flex:1;display:flex;flex-direction:column;min-height:0}
.bar{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.bar .logo{width:28px;height:28px;border-radius:7px;background:var(--am);display:grid;place-items:center;color:#0E1626;font-weight:800;font-size:12px;flex:none}
.bar .t{font-size:13.5px;font-weight:700;line-height:1.15}
.bar .s{font-size:11px;color:#AEB8CE}
.bar .right{margin-left:auto;font-size:11px;color:#AEB8CE;text-align:right;flex:none}
.bar .voltar{background:transparent;border:0;color:#AEB8CE;font:inherit;font-size:19px;font-weight:700;cursor:pointer;padding:0 6px 0 0;flex:none}
.acoes{display:flex;gap:8px;padding:10px 12px 2px}
.acoes .btn{flex:1;min-width:0;white-space:normal;height:auto;min-height:42px;padding:8px 10px;line-height:1.2}
.corpo{flex:1;overflow-y:auto;padding:10px 12px 24px;display:flex;flex-direction:column;gap:10px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.pill.ok{background:var(--posw);color:var(--pos)}
.pill.bad{background:var(--negw);color:var(--neg)}
.pill.warn{background:var(--amw);color:var(--amk);border:1px solid var(--am-ln)}
.pill.mut{background:var(--wsh);color:var(--ink2)}

.hero{background:var(--navy2);color:#fff;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.hero .big{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1}
.hero .s{font-size:11.5px;color:#AEB8CE}
.hero .kp{display:flex;gap:16px;margin-top:6px}
.hero .kp div{font-size:11px;color:#AEB8CE}
.hero .kp b{display:block;color:#fff;font-size:15px}

.sec{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin:6px 0 -4px;display:flex;justify-content:space-between;gap:8px}
.sec span{color:var(--ink2);letter-spacing:0;text-transform:none;font-weight:600}
.nota{border:1px solid var(--ln);border-radius:var(--r);padding:10px 11px;display:grid;grid-template-columns:1fr auto;gap:4px 8px;background:var(--crd);text-align:left;font-family:var(--font);color:var(--ink);cursor:pointer;width:100%;box-shadow:var(--sh-sm)}
.nota .f{font-weight:700;font-size:13.5px;line-height:1.2;grid-column:1}
.nota .m{font-size:11.5px;color:var(--ink3);grid-column:1}
.nota .m b{color:var(--ink2);font-weight:600}
.nota .st{grid-column:2;grid-row:1/span 2;align-self:center}
.nota .why{grid-column:1/-1;font-size:11.5px;color:var(--neg);border-top:1px dashed var(--ln);padding-top:6px;margin-top:2px}
.nota .why.w{color:var(--amk)}
.nota .why.i{color:var(--ink2)}

/* ── bipagem ── */
.scan{display:flex;gap:8px;align-items:center;background:var(--wsh);border:1.5px solid var(--ln2);border-radius:var(--r);padding:9px 10px}
.scan.focus{border-color:var(--am);background:var(--amw)}
.scan input{flex:1;border:0;background:transparent;font-family:var(--font);font-size:16px;color:var(--ink);outline:0;min-width:0}
.scan .ico{font-size:15px;letter-spacing:-1px}
.scan .cam{border:0;background:transparent;font-size:17px;cursor:pointer;padding:0 2px;color:var(--ink2)}
.scan .dig{border:1px solid var(--ln2);background:var(--crd);color:var(--ink2);border-radius:var(--r-sm);font-family:var(--font);font-size:11px;font-weight:700;padding:5px 8px;cursor:pointer;white-space:nowrap;flex:none}
.scan .dig[aria-pressed="true"]{background:var(--am);border-color:var(--am);color:var(--amk)}
.dev .kv b{white-space:nowrap}
.dev .kv span{line-height:1.25}
.prog{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--ink2)}
.prog b{color:var(--ink);font-variant-numeric:tabular-nums}
.descartes{background:var(--negw);border:1px solid var(--neg);border-radius:var(--r-sm);padding:8px 10px;font-size:12px;color:var(--ink);display:flex;gap:8px;align-items:flex-start}
.descartes .x{margin-left:auto;border:0;background:transparent;color:var(--neg);font-size:16px;font-weight:800;cursor:pointer;line-height:1;padding:0 2px;flex:none}
.itens{display:flex;flex-direction:column;gap:6px}
.it{display:grid;grid-template-columns:4px 1fr auto;gap:0 9px;border:1px solid var(--ln);border-radius:var(--r-sm);padding:7px 9px 7px 0;background:var(--crd);align-items:center;text-align:left;width:100%;font-family:var(--font);color:var(--ink)}
.it .stripe{align-self:stretch;border-radius:0 2px 2px 0;background:var(--ln2)}
.it.e-bad .stripe{background:var(--neg)}
.it.e-warn .stripe{background:var(--am)}
.it .d{font-size:12.5px;font-weight:600;line-height:1.2}
.it .c{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.it.e-bad .c{color:var(--neg)}
.it.e-warn .c{color:var(--amk)}
.it .q{text-align:right;font-variant-numeric:tabular-nums;line-height:1.15}
.it .q b{font-size:16px;font-weight:800;display:block}
.it .q small{font-size:10.5px;color:var(--ink3)}
.it.e-bad .q b{color:var(--neg)}
.it.e-warn .q b{color:var(--amk)}

.card{border:1px solid var(--ln);border-radius:var(--r);padding:10px 11px;display:flex;flex-direction:column;gap:7px;background:var(--crd)}
.card .t{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3)}
.card.am{border-color:var(--am);background:var(--amw)}
.card.am .t{color:var(--amk);font-size:13px;letter-spacing:0;text-transform:none}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.kv b{font-variant-numeric:tabular-nums}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f2 label,.f1 label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.f2 input,.f1 input{width:100%;height:46px;border-radius:var(--r-sm);border:1.5px solid var(--am-ln);background:var(--crd);color:var(--ink);font-family:var(--font);font-size:18px;font-weight:700;padding:0 10px;outline:none;font-variant-numeric:tabular-nums}
.f2 input:focus,.f1 input:focus{border-color:var(--am)}
.aviso{background:var(--negw);border:1px solid var(--neg);border-radius:var(--r);padding:10px 12px;font-size:12.5px;color:var(--ink)}
.aviso b{color:var(--neg)}
.aviso.ok{background:var(--posw);border-color:var(--pos)}
.aviso.ok b{color:var(--pos)}
.vazio{padding:36px 20px;text-align:center;color:var(--ink3);font-size:13.5px}
.vazio b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:6px}
.foot{background:var(--crd);border-top:1px solid var(--ln);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink3);gap:8px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pos);margin-right:5px;vertical-align:middle}
.dot.off{background:var(--neg)}
.dot.pend{background:var(--am)}
.toast{position:fixed;left:14px;right:14px;bottom:18px;background:var(--ink);color:var(--pap);padding:11px 14px;border-radius:var(--r);font-size:13px;font-weight:600;box-shadow:var(--sh-md);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:40}
.toast.show{opacity:1;transform:none}
.toast.ruim{background:var(--neg);color:#fff}
.modal{position:fixed;inset:0;background:rgba(14,22,38,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0}
.modal .sheet{background:var(--crd);border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;max-width:520px;max-height:86dvh;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.modal h3{font-size:15px;font-weight:800}
.motivos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal textarea{width:100%;min-height:70px;border-radius:var(--r-sm);border:1.5px solid var(--ln2);background:var(--pap);color:var(--ink);font-family:var(--font);font-size:15px;padding:9px 10px;outline:none;resize:vertical}
.modal textarea:focus{border-color:var(--am)}
/* ── conversa com a central (presa à nota) ── */
.msgs{display:flex;flex-direction:column;gap:8px;padding:2px 0;max-height:34dvh;overflow-y:auto}
.msg{border:1px solid var(--ln);border-radius:12px;padding:7px 9px;font-size:12.5px;background:var(--pap);max-width:88%;line-height:1.35;word-break:break-word}
.msg .w{font-size:10.5px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.msg.loja{align-self:flex-end;background:var(--amw);border-color:var(--am-ln);border-bottom-right-radius:4px}
.msg.central{align-self:flex-start;background:var(--navy2);border-color:var(--navy2);color:#fff;border-bottom-left-radius:4px}
.msg.central .w{color:#AEB8CE}
.msg .h{font-size:10px;color:var(--ink3);margin-top:3px}
.msg.central .h{color:#8C97B0}
.msg .ac{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;background:var(--am);color:var(--amk);border-radius:999px;padding:2px 9px}
.chip{display:flex;align-items:center;gap:7px;background:var(--wsh);border:1px solid var(--ln2);border-radius:999px;padding:6px 8px 6px 12px;font-size:11.5px;color:var(--ink3);min-width:0}
.chip b{color:var(--ink);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.chip .x{margin-left:auto;border:0;background:transparent;color:var(--ink2);font:inherit;font-size:17px;font-weight:700;line-height:1;cursor:pointer;padding:0 6px;flex:none}
.bdg{display:inline-block;min-width:18px;padding:1px 6px;border-radius:999px;background:var(--neg);color:#fff;font-size:10.5px;font-weight:800;text-align:center;line-height:16px}
#camBox{position:fixed;inset:0;background:#000;z-index:35;display:flex;flex-direction:column}
#camBox video{flex:1;width:100%;object-fit:cover;min-height:0}
#camBox .btn{margin:10px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body class="ds">

<!-- ═══ 1 · Entrar ═══ -->
<div id="login">
  <form class="lbox" onsubmit="entrar(event)">
    <img src="/logo.png" alt="Econômico">
    <h1>Recebimento</h1>
    <p>Escolha sua loja e digite o PIN. Só precisa uma vez neste coletor.</p>
    <div class="fld"><label>Loja</label>
      <div class="lojas" id="lojas"></div></div>
    <div class="fld"><label for="pin">PIN da loja</label><input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" required></div>
    <div class="fld"><label for="nome">Seu nome (vai pro ERP como operador)</label><input id="nome" type="text" autocomplete="name" placeholder="Como aparece pra central" required></div>
    <div class="erro" id="lerro"></div>
    <p class="tip" style="margin:0 0 12px">O leitor do coletor bipa como teclado. Não precisa configurar nada.</p>
    <button class="btn btn-primary blk" style="height:46px" type="submit" id="btnEntrar">Entrar</button>
  </form>
</div>

<!-- ═══ 2 · Notas da loja ═══ -->
<div id="telaNotas" class="tela" hidden>
  <div class="bar">
    <div class="logo">E</div>
    <div><div class="t" id="nTitulo">Loja</div><div class="s" id="nSub">—</div></div>
    <div class="right" id="nHora">—</div>
  </div>
  <div class="acoes">
    <button class="btn btn-secondary" onclick="carregarNotas(true)">↻ Atualizar</button>
    <button class="btn btn-secondary" id="btnConferidas" onclick="verConferidas()">Já conferidas hoje (0)</button>
  </div>
  <div class="corpo" id="nLista"></div>
  <div class="foot">
    <span><span class="dot" id="netDot"></span><span id="netTxt">—</span></span>
    <span><span id="quem"></span> · <button class="btn btn-ghost" style="height:auto;padding:0;font-size:11.5px" onclick="sair()">sair</button></span>
  </div>
</div>

<!-- ═══ 3 · Bipando às cegas ═══ -->
<div id="telaBip" class="tela" hidden>
  <div class="bar">
    <button class="voltar" onclick="voltarNotas()" title="Voltar">‹</button>
    <div class="logo">E</div>
    <div><div class="t" id="bTitulo">—</div><div class="s" id="bSub">—</div></div>
    <div class="right" id="bPill"></div>
  </div>
  <div class="acoes">
    <button class="btn btn-secondary" onclick="escolherCorrigir()">Corrigir qtd</button>
    <button class="btn btn-secondary" id="btnChat" onclick="abrirChat()">Chamar central</button>
    <button class="btn btn-primary" onclick="terminei()">Terminei a nota</button>
  </div>
  <div class="corpo">
    <div class="scan" id="scanBox">
      <span class="ico">▮▯▮</span>
      <input id="bip" placeholder="Bipe o código de barras" autocomplete="off" inputmode="none" enterkeyhint="done">
      <button class="dig" id="btnDigitar" type="button" aria-pressed="false" onclick="toggleDigitar()" title="Digitar o código à mão">Digitar código</button>
      <button class="cam" id="btnCam" onclick="abrirCamera()" title="Ler com a câmera" hidden>📷</button>
    </div>
    <div class="prog">
      <div>Você bipou <b id="pProd">0</b> produtos · <b id="pUn">0</b> unidades</div>
      <div id="pFila" style="color:var(--amk)"></div>
    </div>
    <div id="pDescartes" class="descartes" hidden></div>
    <div id="cartao"></div>
    <div class="itens" id="bItens"></div>
  </div>
</div>

<!-- ═══ 4 · Terminei ═══ -->
<div id="telaFim" class="tela" hidden>
  <div class="bar">
    <button class="voltar" onclick="voltarNotas()" title="Voltar">‹</button>
    <div class="logo">E</div>
    <div><div class="t" id="fTitulo">Terminei</div><div class="s" id="fSub">—</div></div>
  </div>
  <div class="acoes" id="fAcoes"></div>
  <div class="corpo" id="fCorpo"></div>
</div>

<div class="toast" id="toast"></div>
<div id="modal"></div>
<div id="camBox" hidden><video id="camVideo" playsinline muted></video><button class="btn btn-secondary" onclick="fecharCamera()">Fechar câmera</button></div>

<script>
'use strict';
// ── constantes / sessão ────────────────────────────────────────────────────
const LS_SESSAO = 'rec_sessao', LS_FILA = 'rec_fila', LS_CAD = 'rec_cadastros', LS_DESCARTES = 'rec_descartes';
const NOMES_LOJA = { 1: 'CAHU', 2: 'MURIBECA', 3: 'PONTE', 4: 'ATACAREJO', 5: 'PORTA LARGA', 6: 'JARDIM JORDÃO' };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const num = n => { const v = +n || 0; return Number.isInteger(v) ? String(v) : String(+v.toFixed(3)); };
// Coletor com armazenamento cheio (ou modo privado) faz setItem lançar. Nunca pode derrubar o fluxo:
// avisa e segue — o que está na memória continua valendo e o envio pela rede acontece do mesmo jeito.
function guardar(chave, valor) {
  try { localStorage.setItem(chave, JSON.stringify(valor)); return true; }
  catch (e) { toast('Sem espaço pra guardar offline', true); return false; }
}

let sess = null; try { sess = JSON.parse(localStorage.getItem(LS_SESSAO) || 'null'); } catch (e) {}
let fila = []; try { fila = JSON.parse(localStorage.getItem(LS_FILA) || '[]'); } catch (e) {}
// cadastro já visto neste coletor: deixa bipar sem rede um produto que o coletor já conhece
let cads = {}; try { cads = JSON.parse(localStorage.getItem(LS_CAD) || '{}'); } catch (e) {}
function guardarCad(cod, c) {
  cads[cod] = { descricao: c.descricao, qtdemb: c.qtdemb, emb: c.emb };
  const ks = Object.keys(cads); if (ks.length > 3000) for (const k of ks.slice(0, 500)) delete cads[k];
  guardar(LS_CAD, cads);
}
let lojaSel = null;          // loja escolhida na tela de login
let notas = [];              // /notas
let visao = null;            // visão da conferência aberta (cega)
let notaAtual = null;        // nota da lista que abriu a conferência
let fimDados = null;         // resposta do /terminei
let cartao = null;           // { cod, descricao, emb, modo:'bipar'|'corrigir' }
let tela = 'login';
let timerNotas = null;
let timerVisao = null;        // poll de 5 s da conferência aberta (chat + estado dos itens)
let ultimoBipado = null;      // { cod, descricao } do último produto bipado — vai anexado no chat

// ── tela de login ──────────────────────────────────────────────────────────
$('lojas').innerHTML = Object.keys(NOMES_LOJA).map(n =>
  `<button type="button" aria-pressed="false" data-loja="${n}" onclick="selLoja(${n})">${n}<small>${esc(NOMES_LOJA[n])}</small></button>`).join('');
function selLoja(n) {
  lojaSel = n;
  for (const b of $('lojas').querySelectorAll('button')) b.setAttribute('aria-pressed', String(+b.dataset.loja === n));
  $('btnEntrar').textContent = 'Entrar na Loja ' + n;
  $('pin').focus();
}
async function entrar(ev) {
  ev.preventDefault(); $('lerro').textContent = '';
  const pin = $('pin').value.trim(), nome = $('nome').value.trim();
  if (!lojaSel) { $('lerro').textContent = 'Escolha a loja.'; return; }
  try {
    const r = await fetch('/api/recebimento-publico/entrar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ loja: lojaSel, pin, nome }) });
    const j = await r.json();
    if (!r.ok) { $('lerro').textContent = j.error || 'Não foi possível entrar.'; return; }
    sess = { loja: j.loja, token: j.token, nome: j.nome || nome.toUpperCase() };
    guardar(LS_SESSAO, sess);
    iniciar();
  } catch (e) { $('lerro').textContent = 'Sem conexão. Tente de novo quando tiver sinal.'; }
}

}

// ── rede ───────────────────────────────────────────────────────────────────
async function api(caminho, opts) {
  const r = await fetch(caminho, opts);
  if (r.status === 401) { localStorage.removeItem(LS_SESSAO); location.reload(); throw new Error('sessão'); }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error((j && j.error) || 'Falhou'); err.status = r.status; err.corpo = j; throw err; }
  return j;
}
const post = (rota, body) => api('/api/recebimento-publico/' + rota, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, t: sess.token }) });

function setNet(on) {
  const dot = $('netDot'), tx = $('netTxt');
  const h = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  if (!on) { dot.className = 'dot off'; tx.textContent = fila.length ? 'Sem sinal · ' + fila.length + ' pra enviar' : 'Sem sinal'; }
  else if (fila.length) { dot.className = 'dot pend'; tx.textContent = 'Enviando ' + fila.length + '…'; }
  else { dot.className = 'dot'; tx.textContent = 'Online · ' + h; }
  $('pFila').textContent = fila.length ? fila.length + ' bipes aguardando rede' : '';
}

const dataBr = s => { const p = String(s || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0].slice(2) : String(s || ''); };

// O leitor do coletor bipa como teclado, então o #bip fica com inputmode="none" pra não abrir o
// teclado do Android por cima da tela. "Digitar código" liga o teclado numérico e desliga sozinho

let digitando = false;
function aplicarDigitar() {

  b.setAttribute('inputmode', digitando ? 'numeric' : 'none');
  $('btnDigitar').setAttribute('aria-pressed', String(digitando));

}
function toggleDigitar() { digitando = !digitando; aplicarDigitar(); }

// Só devolve o foco pro leitor quando não há NADA na frente: cartão de quantidade, painel (chat ou
// "corrigir qual produto"), câmera. Sem essa trava o refoco de 100 ms rouba cada tecla do chat.
function podeFocarBip() {

}
function focarBip() { if (!podeFocarBip()) return; const b = $('bip'); if (b) { b.focus(); $('scanBox').classList.add('focus'); } }
$('bip').addEventListener('blur', () => { $('scanBox').classList.remove('focus'); setTimeout(focarBip, 100); });
$('bip').addEventListener('focus', () => $('scanBox').classList.add('focus'));
$('bip').addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); const c = $('bip').value.trim(); $('bip').value = ''; if (c) lerCodigo(c); } });

async function lerCodigo(cod) {
  if (!visao) return;
  pararDigitar();
  // guarda o último código lido mesmo quando o produto não existe no cadastro: é justamente esse
  // caso que o conferente manda pra central ("código não cadastrado").
  ultimoBipado = { cod, descricao: ((visao.itens || []).find(i => i.cod === cod) || {}).descricao || (cads[cod] || {}).descricao || '' };
  const jaTem = (visao.itens || []).find(i => i.cod === cod);
  if (jaTem) { await enviarBipe('bipar', { cod, quant: 1, emb: jaTem.emb }); return; }
  let cad;
  try { cad = await api('/api/recebimento-publico/cadastro/' + encodeURIComponent(cod) + '?t=' + sess.token); guardarCad(cod, cad); }
  catch (e) {
    if (e.status === 404) { toast(e.message || 'Produto não cadastrado. Chame a central.', true); return; }
    cad = cads[cod];
    if (!cad) { toast('Sem sinal pra buscar o cadastro. Bipe de novo quando voltar a rede.', true); return; }
    setNet(false);

  abrirCartao({ cod, descricao: cad.descricao, emb: cad.qtdemb || 1, quant: '', validade: '', modo: 'bipar' });

function abrirCartao(c) {

  $('cartao').innerHTML = `<div class="card am">
    <div class="t">${esc(c.descricao)}</div>

    </div>

    <div class="f1"><label for="cVal">Vence em</label><input id="cVal" type="date" value="${esc(c.validade)}"></div>

function fecharCartao() { cartao = null; $('cartao').innerHTML = ''; focarBip(); }
function gravarCartao() {

  const c = cartao;

  const emb = +String(($('cEmb') || {}).value || '').replace(',', '.') || +c.emb || 1;
  const validade = ($('cVal') || {}).value || '';
  if (!quant) { toast('Digite a quantidade.', true); $('cQuant').focus(); return; }
  fecharCartao();

const AVISO_RESULTADO = {
  recusado: ['A central recusou este item. Separe pra devolução.', true],
  bloqueado_validade: ['Validade curta: bloqueado. Separe pra devolução.', true],
  nao_esta_na_nota: ['Este produto não está na nota. Chame a central.', true],
  sem_validade: ['Faltou a validade deste produto.', true],
  nao_cadastrado: ['Produto não cadastrado. Chame a central.', true]
};
// Um id por bipe: se a rede cair depois do servidor aplicar mas antes da resposta chegar, o reenvio
// da fila carrega o mesmo bipeId e o servidor devolve o resultado guardado em vez de somar de novo.
const novoBipeId = () => {
  try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
};
async function enviarBipe(acao, body) {
  const corpo = { id: visao.id, cod: body.cod, quant: body.quant, emb: body.emb, validade: body.validade || '', bipeId: novoBipeId() };
  aplicarLocal(acao, corpo);  // mostra na hora; a visão do servidor sobrescreve quando responder
  ultimoBipado = { cod: corpo.cod, descricao: ((visao.itens || []).find(i => i.cod === corpo.cod) || {}).descricao || (cads[corpo.cod] || {}).descricao || '' };
  renderBip(); focarBip();
  try {
    const r = await post(acao, corpo);
    if (r.visao) visao = r.visao;
    const av = AVISO_RESULTADO[r.resultado];
    if (av) toast(av[0], true);
    else if (r.item) toast(String(r.item.descricao || r.item.cod) + ' · ' + num(r.item.quant) + ' × ' + num(r.item.emb) + ' = ' + num(r.item.un) + ' un');
    renderBip(); setNet(true);
  } catch (e) {
    if (e.status) { toast(e.message || 'Bipe recusado', true); await recarregarVisao(); return; }
    fila.push({ acao, body: corpo, em: Date.now() });
    guardar(LS_FILA, fila);
    setNet(false);
    toast('Sem sinal · guardado no coletor');
  }
}

// aplica o bipe localmente (offline / eco imediato), sem inventar estado do servidor
function aplicarLocal(acao, c) {
  if (!visao) return;
  visao.itens = visao.itens || [];
  const it = visao.itens.find(i => i.cod === c.cod);
  const un = +((+c.quant || 0) * (+c.emb || 1)).toFixed(3);
  if (!it) visao.itens.push({ cod: c.cod, descricao: (cartao && cartao.cod === c.cod ? cartao.descricao : (cads[c.cod] || {}).descricao || c.cod), quant: +c.quant || 0, emb: +c.emb || 1, un, validade: c.validade || null, estado: 'ok', aviso: null });
  else if (acao === 'corrigir') { it.quant = +c.quant || 0; it.emb = +c.emb || 1; it.un = un; it.validade = c.validade || null; }
  else { it.quant = +(it.quant + (+c.quant || 0)).toFixed(3); it.emb = +c.emb || it.emb; it.un = +(it.un + un).toFixed(3); if (c.validade && (!it.validade || c.validade < it.validade)) it.validade = c.validade; }
  visao.produtos = visao.itens.length;
  visao.unidades = +visao.itens.reduce((a, i) => a + (+i.un || 0), 0).toFixed(3);
}
async function recarregarVisao() {
  if (!visao) return;
  try { visao = await api('/api/recebimento-publico/conferencia/' + encodeURIComponent(visao.id) + '?t=' + sess.token); renderBip(); } catch (e) {}
}

// bipes da fila que a central recusou (4xx): ficam à vista até o conferente dar ok, senão ele acha
// que enviou e a quantidade no ERP fica menor do que ele contou. Persiste no coletor porque um
// reload não pode apagar o aviso sozinho — só o conferente ou abrir outra nota faz isso.
let descartes = []; try { descartes = JSON.parse(localStorage.getItem(LS_DESCARTES) || '[]'); } catch (e) {}
function renderDescartes() {
  const el = $('pDescartes'); if (!el) return;
  el.hidden = !descartes.length;
  if (!descartes.length) { el.innerHTML = ''; return; }
  const txt = descartes.length === 1 ? '1 bipe não entrou: ' : descartes.length + ' bipes não entraram: ';
  el.innerHTML = '<span><b>' + esc(txt) + '</b>' + esc(descartes.map(d => d.cod + ' — ' + d.erro).join(' · ')) + ' Bipe de novo.</span>' +
    '<button class="x" type="button" onclick="limparDescartes()" title="Entendi">×</button>';
}
function limparDescartes() { descartes = []; guardar(LS_DESCARTES, descartes); renderDescartes(); }

let enviandoFila = false;
async function flush() {
  if (enviandoFila || !fila.length) return;
  enviandoFila = true;
  let recusou = false;
  try {
    while (fila.length) {
      const f = fila[0];
      const r = await post(f.acao, f.body).catch(err => { if (err.status) return { recusado: err.message || 'recusado pela central' }; throw err; });
      fila.shift(); guardar(LS_FILA, fila);
      if (r && r.recusado) {
        recusou = true;
        descartes.push({ cod: (f.body && f.body.cod) || f.acao, erro: r.recusado });
        if (descartes.length > 6) descartes = descartes.slice(-6);
        guardar(LS_DESCARTES, descartes);
        continue;
      }
      if (r && r.visao && visao && r.visao.id === visao.id) visao = r.visao;
    }
    setNet(true);
    if (recusou) { toast(descartes[descartes.length - 1].erro, true); await recarregarVisao(); }
    if (tela === 'bipagem') renderBip();
  } catch (e) { setNet(false); }
  finally { enviandoFila = false; renderDescartes(); }
}

function escolherCorrigir() {
  const itens = (visao && visao.itens) || [];

  abrirModal('<h3>Corrigir qual produto?</h3>' + itens.slice().reverse().map(i =>
    `<button class="nota" data-cod="${esc(i.cod)}" onclick="corrigirItem(this.dataset.cod)"><div class="f">${esc(i.descricao)}</div><div class="m">${esc(i.cod)} · <b>${num(i.un)} un</b> (${num(i.quant)} × ${num(i.emb)})</div></button>`).join('') +
    '<button class="btn btn-secondary blk" onclick="fecharModal()">Cancelar</button>');
}
function corrigirItem(cod) {
  const i = (visao.itens || []).find(x => x.cod === cod); if (!i) return;
  fecharModal();
  abrirCartao({ cod: i.cod, descricao: i.descricao, emb: i.emb, quant: i.quant, validade: i.validade || '', modo: 'corrigir' });
}

// ── conversa com a central, presa à nota aberta ────────────────────────────
const MOTIVOS = [['codigo_nao_cadastrado', 'Código não cadastrado'], ['avaria', 'Avaria'], ['validade', 'Validade'], ['nao_esta_na_nota', 'Não está na nota'], ['outro', 'Outro']];
const MOTIVO_TXT = Object.fromEntries(MOTIVOS);
const ACAO_TXT = { pode_receber: 'Pode receber', devolver: 'Devolver', liberar_validade: 'Validade liberada', aguarde: 'Aguarde' };
const LS_VISTOS = 'rec_chat_vistos';
// valor de cada nota = data (ISO) da última mensagem da central já vista. Formato antigo guardava
// um contador; um contador velho maior que a contagem de hoje esconderia o badge pra sempre, então
// qualquer coisa que não seja texto é descartada na carga (no pior caso o badge aparece uma vez a mais).
let vistos = {}; try { vistos = JSON.parse(localStorage.getItem(LS_VISTOS) || '{}'); } catch (e) {}
for (const k of Object.keys(vistos)) if (typeof vistos[k] !== 'string') delete vistos[k];
let chatMotivo = 'outro', chatAberto = false, chatCod = null;

const msgsDe = v => (v && v.mensagens) || [];
const nCentrais = v => msgsDe(v).filter(m => m.de === 'central').length;
function salvarVistos() {
  const ks = Object.keys(vistos); if (ks.length > 200) for (const k of ks.slice(0, 100)) delete vistos[k];
  guardar(LS_VISTOS, vistos);
}
// O servidor devolve só as últimas 50 mensagens, então contar quantas já foram vistas erra assim que
// a conversa passa de 50: o total para de crescer e o badge nunca mais sobe. Por isso comparamos pela
// data da última mensagem da central já vista, que continua certa com a janela deslizante.
function ultimaCentralEm(v) { const ms = msgsDe(v).filter(m => m.de === 'central'); return ms.length ? ms[ms.length - 1].em : null; }
function naoLidas() {
  if (!visao) return 0;
  const vis = vistos[visao.id];
  if (!vis) return nCentrais(visao);
  return msgsDe(visao).filter(m => m.de === 'central' && String(m.em) > vis).length;
}
function marcarLidas() { if (!visao || !chatAberto) return; const em = ultimaCentralEm(visao); if (em) vistos[visao.id] = em; salvarVistos(); atualizarBadge(); }
function atualizarBadge() {
  const b = $('btnChat'); if (!b) return;
  const n = naoLidas();
  b.innerHTML = 'Chamar central' + (n ? ' <span class="bdg">' + n + '</span>' : '');
}

const horaMsg = em => { try { return new Date(em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
function descCod(cod) {
  if (!cod) return '';
  const i = (visao && visao.itens || []).find(x => x.cod === cod);
  return (i && i.descricao) || (cads[cod] || {}).descricao || (ultimoBipado && ultimoBipado.cod === cod ? ultimoBipado.descricao : '') || '';
}
function threadHtml() {
  const ms = msgsDe(visao);
  if (!ms.length) return '<div class="tip">Nenhuma mensagem ainda. Escolha o motivo e chame a central.</div>';
  return ms.map(m => {
    const central = m.de === 'central';
    const quem = central ? 'Central' + (m.nome ? ' · ' + esc(m.nome) : '') : esc(m.nome || 'Loja');
    const mot = m.motivo ? ' · ' + esc(MOTIVO_TXT[m.motivo] || m.motivo) : '';
    const prod = m.cod ? `<div class="h">${esc(m.cod)}${descCod(m.cod) ? ' · ' + esc(descCod(m.cod)) : ''}</div>` : '';
    const ac = m.acao ? `<div><span class="ac">${esc(ACAO_TXT[m.acao] || m.acao)}</span></div>` : '';
    return `<div class="msg ${central ? 'central' : 'loja'}"><div class="w">${quem}${mot}</div>${esc(m.texto || '')}${ac}${prod}<div class="h">${esc(horaMsg(m.em))}</div></div>`;
  }).join('');
}

function abrirChat() {
  if (!visao) return;
  chatMotivo = 'outro'; chatCod = ultimoBipado ? ultimoBipado.cod : null;
  abrirModal(`<h3>Chamar a central</h3>
    <div class="tip">NF-e ${esc(visao.nNota)} · ${esc(visao.fornecedor || '')}</div>
    <div class="msgs" id="chatMsgs">${threadHtml()}</div>
    <div id="chatProd"></div>
    <div class="motivos" id="chatMotivos">${MOTIVOS.map(m => `<button class="btn btn-secondary" type="button" data-m="${m[0]}" aria-pressed="false" onclick="selMotivo('${m[0]}')">${esc(m[1])}</button>`).join('')}</div>
    <textarea id="chatTxt" placeholder="Escreva se precisar (opcional)"></textarea>
    <div class="row2"><button class="btn btn-secondary" type="button" onclick="fecharModal()">Fechar</button><button class="btn btn-primary" type="button" id="btnEnviarChat" onclick="enviarChat()">Enviar</button></div>`);
  chatAberto = true;   // depois do abrirModal, que zera a flag
  selMotivo('outro'); renderChatProd(); rolarChat(); marcarLidas();
}
function selMotivo(m) {
  chatMotivo = m;
  for (const b of $('chatMotivos').querySelectorAll('button')) {
    const on = b.dataset.m === m;
    b.setAttribute('aria-pressed', String(on));
    b.className = on ? 'btn btn-primary' : 'btn btn-secondary';
  }
}
function renderChatProd() {
  const el = $('chatProd'); if (!el) return;
  if (!chatCod) {
    el.innerHTML = ultimoBipado
      ? `<button class="btn btn-secondary blk" type="button" onclick="anexarUltimo()">Anexar ${esc(ultimoBipado.descricao || ultimoBipado.cod)}</button>`
      : '<div class="tip">Nenhum produto bipado ainda pra anexar.</div>';
    return;
  }
  const d = descCod(chatCod);
  el.innerHTML = `<div class="chip">📦 <b>${esc(d || chatCod)}</b> <span>${esc(chatCod)}</span><button class="x" type="button" onclick="tirarProduto()" title="Tirar o produto da mensagem">×</button></div>`;
}
function anexarUltimo() { if (ultimoBipado) { chatCod = ultimoBipado.cod; renderChatProd(); } }
function tirarProduto() { chatCod = null; renderChatProd(); }
function rolarChat() { const m = $('chatMsgs'); if (m) m.scrollTop = m.scrollHeight; }

async function enviarChat() {
  if (!visao) return;
  const texto = (($('chatTxt') || {}).value || '').trim();
  // msgId igual ao bipeId: se a fila reenviar essa mensagem depois de a rede cair no meio da resposta,
  // o servidor pode reconhecer o mesmo id e não duplicar o post no chat.
  const corpo = { id: visao.id, motivo: chatMotivo, texto, cod: chatCod || null, msgId: novoBipeId() };
  const b = $('btnEnviarChat'); if (b) b.disabled = true;
  try {
    const m = await post('chat', corpo);
    visao.mensagens = msgsDe(visao).concat([m]);
    const t = $('chatTxt'); if (t) t.value = '';
    chatCod = null; renderChatProd();
    const el = $('chatMsgs'); if (el) { el.innerHTML = threadHtml(); rolarChat(); }
    marcarLidas(); setNet(true); toast('Central avisada.');
  } catch (e) {
    if (e.status) { toast(e.message || 'A central não recebeu a mensagem.', true); }
    else {
      // mesma fila offline do bipe: a rota /chat aceita o mesmo corpo quando a rede voltar
      fila.push({ acao: 'chat', body: corpo, em: Date.now() });
      guardar(LS_FILA, fila);
      setNet(false); toast('Sem sinal · aviso guardado, sai sozinho quando a rede voltar.');
      fecharModal();
    }
  } finally { if (b) b.disabled = false; }
}

// poll de 5 s enquanto a nota está aberta: traz resposta da central e o estado novo dos itens
// (um item liberado pela central muda de cor sem o conferente fazer nada).
async function pollVisao() {
  if (!visao || tela !== 'bipagem') return;
  const id = visao.id;
  let v;
  try { v = await api('/api/recebimento-publico/conferencia/' + encodeURIComponent(id) + '?t=' + sess.token); }
  catch (e) { setNet(false); return; }
  if (!v || !visao || visao.id !== id || v.id !== id || tela !== 'bipagem') return;
  const antes = nCentrais(visao);
  // com bipe na fila ou cartão aberto a visão local vale mais que a do servidor: só as mensagens entram
  const podeTrocar = !fila.length && !cartao;
  if (podeTrocar) visao = v; else visao.mensagens = v.mensagens || visao.mensagens;
  setNet(true);
  if (nCentrais(visao) > antes) {
    const m = msgsDe(visao).filter(x => x.de === 'central').pop() || {};
    const corpoMsg = [ACAO_TXT[m.acao] || '', m.texto || ''].filter(Boolean).join(' · ') || 'respondeu.';
    toast('Central: ' + corpoMsg);
    try { if (navigator.vibrate) navigator.vibrate(120); } catch (e) {}
  }
  if (podeTrocar) renderBip(); else atualizarBadge();
  if (chatAberto) {
    const el = $('chatMsgs');
    if (el) { const perto = el.scrollHeight - el.scrollTop - el.clientHeight < 40; el.innerHTML = threadHtml(); if (perto) rolarChat(); }
    marcarLidas();
  }
}

// ── tela 4 · terminei ──────────────────────────────────────────────────────
// origem 'coletor' cobre validade curta e avaria — o motivo do servidor diz qual, e é isso que o
// motorista precisa ler no aviso.
const ORIGEM_DEV = { compras: 'Compras', coletor: 'Coletor', falta: 'Falta' };
function rotuloOrigem(d) {
  const m = String((d && d.motivo) || '').toLowerCase();
  if (d && d.origem === 'coletor') return /avaria/.test(m) ? 'Avaria' : /validade/.test(m) ? 'Validade' : 'Coletor';
  return ORIGEM_DEV[d && d.origem] || (d && d.origem) || '';
}
function cardDevolucao(devs) {
  if (!Array.isArray(devs) || !devs.length) return '';
  return `<div class="card dev"><div class="t">Devolução · um aviso só pro motorista</div>
    ${devs.map(d => `<div class="kv"><span>${esc(d.descricao || d.cod)}</span><b>${esc(rotuloOrigem(d))} · ${num(d.qtd)} un</b></div>`).join('')}
    <div class="tip" style="text-align:left"><b>Compras</b> decidiu antes do caminhão (preço, não pedido, a mais). <b>Validade/avaria</b> nasce no coletor. <b>Falta</b> é o que a nota diz e não veio: sai por nota de devolução também, o motorista só assina.</div></div>`;
}
const MOT_PILL = { recontar: ['bad', 'recontar'], nao_bipado: ['warn', 'não bipado'], nao_esta_na_nota: ['warn', 'não está na nota'] };
async function terminei() {
  if (fila.length) { await flush(); if (fila.length) { toast('Sem sinal: ainda tem bipe pra enviar.', true); return; } }
  try {
    fimDados = await post('terminei', { id: visao.id });
    mostrar('fim'); renderFim();
  } catch (e) { toast(e.message || 'Não deu pra terminar', true); }
}
function renderFim() {
  const f = fimDados || {};
  $('fTitulo').textContent = f.bateu ? 'Conferência enviada' : 'Conferência não bateu';
  $('fSub').textContent = (visao.fornecedor || '') + ' · NF-e ' + visao.nNota;
  if (f.bateu) {
    $('fAcoes').innerHTML = '<button class="btn btn-primary blk" onclick="voltarNotas()">Voltar às notas</button>';
    $('fCorpo').innerHTML = '<div class="aviso ok"><b>Tudo certo, enviado pra central liberar.</b><br>Pode liberar o motorista assim que a central confirmar.</div>' + cardDevolucao(f.devolucoes);
    return;
  }
  const n = (f.recontar || []).length;
  $('fAcoes').innerHTML = '<button class="btn btn-primary" onclick="voltarBipagem()">Recontar</button>' +
    (f.podeEnviar ? '<button class="btn btn-secondary" onclick="enviarAssim()">Recontei, está assim mesmo · enviar pra central</button>' : '');
  $('fCorpo').innerHTML = `<div class="aviso"><b>${n} ${n === 1 ? 'produto não bateu' : 'produtos não bateram'} com a nota.</b> Reconte só ${n === 1 ? 'ele' : 'esses'}. A quantidade da nota continua escondida.</div>
    <div class="card"><div class="t">Recontar</div>${(f.recontar || []).map(r => {
      const p = MOT_PILL[r.motivo] || ['mut', r.motivo];
      return `<div class="kv"><span>${esc(r.descricao || r.cod)}</span><span class="pill ${p[0]}">${esc(p[1])}</span></div>`;
    }).join('')}</div>` + cardDevolucao(f.devolucoes);
}
async function voltarBipagem() {
  await recarregarVisao();
  mostrar('bipagem'); renderBip();
}
async function enviarAssim() {
  try {
    const r = await post('enviar', { id: visao.id });
    fimDados = { bateu: true, devolucoes: r && r.devolucoes }; renderFim(); toast('Enviado pra central.');
  } catch (e) { toast(e.message || 'Não deu pra enviar', true); }
}

// ── modal / toast ──────────────────────────────────────────────────────────
// qualquer painel novo derruba a flag do chat: só abrirChat() a liga de novo, logo depois. Assim
// marcarLidas() e o refoco do bipe nunca acham que a conversa está à vista quando não está.
function abrirModal(html) { chatAberto = false; $('modal').innerHTML = `<div class="modal" onclick="if(event.target===this)fecharModal()"><div class="sheet">${html}</div></div>`; }
function fecharModal() { if (chatAberto) { marcarLidas(); chatAberto = false; } $('modal').innerHTML = ''; focarBip(); }
function toast(m, ruim) {
  const t = $('toast'); t.textContent = m; t.className = 'toast show' + (ruim ? ' ruim' : '');
  clearTimeout(t._x); t._x = setTimeout(() => { t.className = 'toast'; }, ruim ? 4000 : 2600);
}

// ── câmera (opcional; só onde o navegador tem BarcodeDetector) ─────────────
let camStream = null, camParar = false;
if ('BarcodeDetector' in window && navigator.mediaDevices) $('btnCam').hidden = false;
async function abrirCamera() {
  try {
    const Det = window.BarcodeDetector;
    const det = new Det({ formats: ['ean_13', 'ean_8', 'code_128', 'itf', 'upc_a'] });
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = $('camVideo'); v.srcObject = camStream; await v.play();
    $('camBox').hidden = false; camParar = false;
    const laco = async () => {
      if (camParar) return;
      try { const cods = await det.detect(v); if (cods && cods.length) { const c = String(cods[0].rawValue || '').trim(); fecharCamera(); if (c) lerCodigo(c); return; } } catch (e) {}
      requestAnimationFrame(laco);
    };
    laco();
  } catch (e) { toast('Câmera indisponível. Use o leitor do coletor.', true); fecharCamera(); }
}
function fecharCamera() {
  camParar = true; $('camBox').hidden = true;
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  focarBip();
}

// ── PWA ────────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
window.addEventListener('online', () => setNet(true));
window.addEventListener('offline', () => setNet(false));

if (sess && sess.token) iniciar();
</script>
</body>
