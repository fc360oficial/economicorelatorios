<title>Gestão Documental — DP / RH · Econômico Supermercados</title>
<!-- DP / RH › Gestão Documental — Central de Gestão Documental (CGD). Etapa 01 (28/10/2026) = interface; etapa 02 (28/10/2026) =
     funcionamento real: prontuário digital por funcionário (id do PontoCerto), CPD envia → RH confere e arquiva, importação
     histórica direta e em lote pelo RH, solicitações às unidades, autorização da Coordenação (reautenticada) pra excluir/substituir
     documento validado, auditoria. Regras em lib/gestao-documental.js, rotas em lib/gestao-documental-rotas.js. Mesma casca das
     telas irmãs do DP / RH (rail do nav.js + cabeçalho + abas + página). Permissões = designação na central de pessoas
     (papéis cpd / RH / coordenação / diretoria). -->
<style>

[hidden]{display:none!important}

.page{padding:20px 24px 40px;max-width:1700px;width:100%}

.card{background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);box-shadow:var(--sh-sm);margin-bottom:14px;min-width:0}

.card .hd b .ds-ic{color:#FFC933}.card .hd .prot{color:#FFC933}.card .hd a.lk{color:#FFC933}.card .hd .ds-btn-ghost{color:#D7DDEA}.card .hd .ds-btn-ghost:hover{background:rgba(255,255,255,.1);color:#fff}.card .hd .cnt{color:#B7C0D6}.card .hd .etq{margin-left:0}

.g2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.donut{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}.donut .cv{position:relative;width:150px;height:150px}.donut .cv canvas{width:150px!important;height:150px!important}.donut .cv .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}.donut .cv .mid b{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1}.donut .cv .mid small{font-size:10.5px;color:var(--ink3)}

.pcard .pess{min-width:0}.pcard .pess>div{min-width:0}.pcard .pess b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2}.pcard .pess small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
const { $, $$, esc, toast } = G;
const API = '/api/gestao-documental';
const ic = n => '<svg class="ds-ic"><use href="/icons.svg#' + n + '"/></svg>';
const ci = (n, cls) => '<svg class="ds-ic' + (cls ? ' ' + cls : '') + '"><use href="#cgd-' + n + '"/></svg>';
const ini = n => String(n || '').trim().split(/\s+/).slice(0, 2).map(s => s[0]).join('').toUpperCase();
const dBR = s => s ? String(s).slice(8, 10) + '/' + String(s).slice(5, 7) + '/' + String(s).slice(0, 4) : '—';
const dtBR = iso => iso ? new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const ha = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); if (m < 1) return 'agora'; if (m < 60) return 'há ' + m + ' min'; if (m < 1440) return 'há ' + Math.round(m / 60) + ' h'; return 'há ' + Math.round(m / 1440) + ' d'; };
const fmtB = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.round((b || 0) / 1024) + ' KB';
const selOpts = (arr, v, vazio) => (vazio != null ? '<option value="">' + esc(vazio) + '</option>' : '') + arr.map(o => { const [k, t] = Array.isArray(o) ? o : [o, o]; return '<option value="' + esc(k) + '"' + (String(k) === String(v) ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('');
const skel = () => '<div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div>';
const erroBox = e => '<div class="aviso neg">' + esc(e.message || e) + '</div>';
async function api(url, opts) { const r = await fetch(url, opts && opts.body && !(opts.body instanceof FormData) ? { method: opts.method || 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(opts.body) } : opts); let j = null; try { j = await r.json(); } catch (e) {} if (!r.ok) { const err = new Error((j && j.error) || ('HTTP ' + r.status)); err.status = r.status; err.duplicadoDe = j && j.duplicadoDe; throw err; } return j; }
const post = (url, body) => api(url, { body }); const upload = (url, fd) => api(url, { method: 'POST', body: fd });

let ME = null, PAG = null;
const C = () => ME.catalogos; const CATS = () => Object.keys(C().categorias).sort(); const catTxt = k => k + ' — ' + C().categorias[k].nome;
const lojaCod = n => +n === 10 ? 'CD' : 'E' + n; const lojaNome = n => { const l = ME.lojas.find(x => x.n === +n); return l ? l.txt.split(' · ')[1] : ('Loja ' + n); };
const etq = n => '<span class="etq' + (+n === 10 ? ' cd' : '') + '">' + lojaCod(n) + '</span>'; const lojaTxt = n => etq(n) + esc(lojaNome(n));
const selLoja = (v, vazio, lista) => selOpts((lista || ME.lojas).map(l => [l.n, l.txt]), v, vazio);
const ST_CLS = { aguardando_rh: 'warn', em_analise: 'info', correcao_solicitada: 'bad', rejeitado: 'gr', arquivado: 'ok', excluido: 'gr' };
const stPill = d => '<span class="pill ' + (ST_CLS[d.status] || 'gr') + '">' + esc(d.statusTxt || C().status[d.status] || d.status) + '</span>';
const pess = c => '<div class="pess"><span class="av">' + esc(ini(c.nome)) + '</span><div><b title="' + esc(c.nome) + '">' + esc(c.nome) + '</b><small>' + (c.matricula ? 'matr. ' + esc(c.matricula) : 'sem matrícula no cadastro') + '</small></div></div>';
const arquivoUrl = (p, v, dl) => API + '/arquivo/' + p + '?' + (v ? 'v=' + v + '&' : '') + (dl ? 'download=1' : '');

/* ═══════════ casca: abas, cabeçalho, rota ═══════════ */
const NAV = [
  { id: 'painel', txt: 'Painel Documental', ic: 'dashboard', sub: 'Visão geral: indicadores, documentos recebidos, situação e últimas ações' },
  { id: 'prontuarios', txt: 'Prontuários Digitais', ic: 'folder', sub: 'Pasta digital de cada funcionário: dez pastas, o que está arquivado e o que está em andamento' },
  { id: 'cpd', txt: 'Recebimento · CPD', ic: 'download', sub: 'A unidade digitaliza e envia os documentos dos funcionários ao RH', so: u => u.cpd || u.rh },
  { id: 'rh', txt: 'Conferência · RH', ic: 'check', sub: 'Fila do RH: analisar, validar e arquivar, pedir correção ou rejeitar', so: u => u.rh, cnt: 'rh' },
  { id: 'ponto', txt: 'Central de Ponto', ic: 'calendar', sub: 'Importação direta da VR, conferência, distribuição e arquivamento dos espelhos de ponto' },
  { id: 'contracheques', txt: 'Contracheques', ic: 'bank', sub: 'Importação do PDF da contabilidade, separação, identificação, conferência e arquivamento no prontuário', so: u => u.rh || u.coord },
  { id: 'protocolos', txt: 'Protocolos', ic: 'list', sub: 'Todos os protocolos com rastreio completo e versões' },
  { id: 'solicitacoes', txt: 'Solicitações', ic: 'alert', sub: 'Pedidos de documentos do RH às unidades, com prazo', so: u => u.rh || u.cpd, cnt: 'sol' },
  { id: 'autorizacoes', txt: 'Autorizações', ic: 'shield', sub: 'Coordenação: exclusão e substituição de documento validado', so: u => u.rh || u.coord || u.dir, cnt: 'aut' },
  { id: 'auditoria', txt: 'Auditoria', ic: 'search', sub: 'Quem fez o quê, quando e em qual protocolo' },
  { id: 'cfg', txt: 'Configurações', ic: 'settings', sub: 'Prazos, retenção por pasta, notificações e quem pode o quê', so: u => u.config }
];
const PAGINAS = { painel, prontuarios, cpd, rh, ponto, contracheques, protocolos, solicitacoes, autorizacoes, auditoria, cfg };
const visivel = n => !n.so || n.so(ME);
function ir(p, arg) {
  const n = NAV.find(x => x.id === p); if (!n || !visivel(n)) return; PAG = p;
  $$('#modnav a').forEach(a => a.classList.toggle('on', a.dataset.p === p));
  $('#tb-h1').innerHTML = '<span class="crumb">DP / RH · Gestão Documental</span>' + ic('chevron-right') + esc(n.txt); $('#tb-sub').textContent = n.sub;
  if (!/^#(p=|f=)/.test(location.hash) || !arg) history.replaceState(null, '', '#' + p + (arg ? '/' + arg : ''));
  window.scrollTo(0, 0); $('#page').innerHTML = skel(); PAGINAS[p](arg);
}
async function contadores() {
  try { const p = await api(API + '/painel'); const I = p.indicadores;
    const set = (id, n) => { const el = $('#cnt-' + id); if (el) { el.textContent = n; el.hidden = !n; } };
    set('rh', I.aguardandoRh); set('sol', I.solicitacoesAtrasadas); set('aut', I.autorizacoesPendentes);
  } catch (e) {}
}
function rota() { const h = location.hash.replace('#', ''); let m = h.match(/^p=(CGD-\d{4}-\d{4,7})$/i); if (m) { if (!PAG) ir('protocolos'); abrirProtocolo(m[1].toUpperCase()); return; } m = h.match(/^f=(\d+)(?:\/(\d{2}))?$/); if (m) { ir('prontuarios', m[1]); return; } m = h.match(/^([a-z]+)(?:\/(.*))?$/); const id = m ? m[1] : ''; ir(NAV.some(n => n.id === id && visivel(n)) ? id : 'painel', m && m[2]); }
async function iniciar() {
  try { ME = await api(API + '/me'); } catch (e) { $('#page').innerHTML = e.status === 403 ? '<div class="aviso neg"><b>Sem acesso à Gestão Documental.</b> ' + esc(e.message) + '</div>' : erroBox(e); $('#who').innerHTML = ''; return; }
  $('#modnav').innerHTML = NAV.filter(visivel).map(n => '<a data-p="' + n.id + '">' + ic(n.ic) + '<span>' + esc(n.txt) + '</span>' + (n.cnt ? '<span class="b" id="cnt-' + n.cnt + '" hidden></span>' : '') + '</a>').join('');

/* ═══════════ 5. Protocolos + gaveta ═══════════ */
const FPR = { loja: '', per: '', q: '', categoria: '', status: '', origem: '' };
async function protocolos(arg) {
  if (arg) { const m = arg.match(/^(\w+)=(.+)$/); if (m && m[1] in FPR) FPR[m[1]] = m[2]; }
  const el = $('#page'); let lista; try { lista = await api(API + '/documentos?' + qs(FPR)); } catch (e) { el.innerHTML = erroBox(e); return; }
  const n = st => lista.filter(d => d.status === st).length;
  el.innerHTML = filtrosDocs(FPR) + '<div class="card"><div class="hd"><b>' + ci('file') + 'Protocolos</b><small class="cnt">' + lista.length + '</small><div class="end"><span class="pill ok">' + n('arquivado') + ' arquivados</span><span class="pill warn">' + (n('aguardando_rh') + n('em_analise')) + ' com o RH</span><span class="pill bad">' + n('correcao_solicitada') + ' em correção</span><span class="pill gr">' + (n('rejeitado') + n('excluido')) + ' rejeitados/excluídos</span></div></div><div class="bd p0">' + tabelaDocs(lista) + '</div></div>' +
    '<p class="hint">Cada protocolo guarda quem enviou, quando, quem conferiu, o que decidiu, as versões e as autorizações — clique em <b>Visualizar</b> para abrir o rastreio.</p>';
  ligarDocs(); ligarFiltros(FPR, protocolos);
}
async function abrirProtocolo(p) {

  gaveta({ titulo: '<span class="prot" style="color:#FFC933;font-size:15px">' + d.protocolo + '</span>', sub: esc(d.tipo + ' · ' + d.colab.nome),
    corpo: '<div>' + stPill(d) + (d.sensivel ? ' <span class="pill pur">saúde ocupacional · restrito</span>' : '') + '</div><dl class="kv"><dt>Funcionário</dt><dd>' + esc(d.colab.nome) + ' · matr. ' + esc(d.colab.matricula || '—') + ' · <a style="cursor:pointer;color:var(--inf)" data-f="' + d.colab.id + '">prontuário</a></dd><dt>Unidade</dt><dd>' + lojaTxt(d.loja) + '</dd><dt>Pasta</dt><dd>' + esc(d.categoria + ' · ' + d.categoriaTxt) + '</dd><dt>Tipo</dt><dd>' + esc(d.tipo) + '</dd><dt>Data do documento</dt><dd>' + dBR(d.dataDocumento) + (d.competencia ? ' · competência ' + d.competencia : '') + '</dd><dt>Origem</dt><dd>' + esc(d.origemTxt) + (d.lote ? ' · ' + d.lote : '') + '</dd><dt>Enviado por</dt><dd>' + esc(d.enviadoPor.nome) + ' · ' + dtBR(d.enviadoEm) + '</dd><dt>Validado por</dt><dd>' + (d.validadoPor ? esc(d.validadoPor.nome) + ' · ' + dtBR(d.validadoEm) : '—') + '</dd>' + (d.retencaoAte ? '<dt>Retenção até</dt><dd>' + dBR(d.retencaoAte) + '</dd>' : '') + (d.observacoes ? '<dt>Observação</dt><dd>' + esc(d.observacoes) + '</dd>' : '') + (d.parecer ? '<dt>Parecer do RH</dt><dd>' + esc(d.parecer) + '</dd>' : '') + (d.rejeicao ? '<dt>Rejeição</dt><dd style="color:var(--neg)">' + esc(d.rejeicao.motivo) + '</dd>' : '') + (d.exclusao ? '<dt>Exclusão</dt><dd style="color:var(--neg)">' + esc(d.exclusao.autorizacao + ' · ' + d.exclusao.por.nome + ' · ' + d.exclusao.justificativa) + '</dd>' : '') + (d.substituicaoAutorizada ? '<dt>Substituição</dt><dd style="color:var(--amk)">autorizada (' + d.substituicaoAutorizada + ') — aguardando o RH anexar a nova versão</dd>' : '') + '</dl>' +

    rodape: (ME.rh && ['aguardando_rh', 'em_analise'].includes(d.status) ? '<button class="ds-btn ds-btn-primary" data-conf="' + d.protocolo + '">' + ci('check-circle') + 'Conferir agora</button>' : '') + ((ME.cpd || ME.rh) && d.status === 'correcao_solicitada' ? '<button class="ds-btn ds-btn-primary" data-reenv="' + d.protocolo + '">' + ci('upload') + 'Reenviar corrigido</button>' : '') +

  const g = $('#gav'); g.querySelector('[data-f]').onclick = () => { g.remove(); location.hash = 'f=' + d.colab.id; };

      '<label>Data original do documento <span class="req">*</span><input class="ds-input" type="date" id="i-data" max="' + ME.hoje + '"></label><label>Competência (quando aplicável)<input class="ds-input" type="month" id="i-comp"></label>' +

    onOk: async ov => {

    onOk: async ov => { const c = colab || resolverColab('n-f'); if (!c) { toast('Escolha o funcionário na lista', 'neg'); return false; } const tipo = ov.querySelector('#n-tipo').value; if (!tipo) { toast('Escolha o documento', 'neg'); return false; } const s = await post(API + '/solicitacoes', { colabId: c.id, categoria: cat, tipo, prazo: ov.querySelector('#n-prazo').value, observacoes: ov.querySelector('#n-obs').value.trim() }); toast(s.protocolo + ' enviada ao CPD ' + lojaCod(c.loja), 'pos'); contadores(); return true; } });
}

/* ═══════════ 7. Autorizações ═══════════ */
async function autorizacoes() {
  const el = $('#page'); let lista; try { lista = await api(API + '/autorizacoes'); } catch (e) { el.innerHTML = erroBox(e); return; }
  const pend = lista.filter(a => a.status === 'pendente'), hist = lista.filter(a => a.status !== 'pendente'); const ico = a => a.operacao === 'excluir' ? ['trash', 't-neg'] : ['file-check', 't-inf'];
  el.innerHTML = '<div class="aviso inf"><b>Documento validado é protegido.</b> Excluir ou substituir só com pedido justificado do RH e decisão da Coordenação Administrativa, que confirma a própria senha na hora de decidir. Quem pediu não decide o próprio pedido; a Diretoria só acompanha. O servidor verifica tudo isso de novo, não só a tela.</div>' +
    '<div class="card"><div class="hd"><b>' + ci('lock') + 'Aguardando decisão</b><small class="cnt">' + pend.length + '</small></div><div class="bd">' + (pend.length ? '<div class="auts">' + pend.map(a => '<div class="aut"><div class="top"><div class="ico ' + ico(a)[1] + '">' + ci(ico(a)[0]) + '</div><div><b>' + esc(a.operacaoTxt) + '</b><small>' + a.protocolo + ' · pedido por ' + esc(a.solicitante.nome) + ' · ' + dtBR(a.solicitadoEm) + '</small></div></div><p><b>Documento:</b> ' + a.documento + ' · ' + esc(a.categoria + ' ' + a.tipo + ' · ' + a.colab.nome) + ' · ' + lojaTxt(a.loja) + (a.versao > 1 ? ' · v' + a.versao : '') + '</p><div class="just"><small>Justificativa</small>' + esc(a.justificativa) + '</div><div class="acoes" style="margin-top:4px"><button class="ds-btn ds-btn-ghost btn-s" data-ver="' + a.documento + '">' + ci('eye') + 'Ver documento</button><div class="end">' + (a.podeDecidir ? '<button class="ds-btn ds-btn-danger btn-s" data-dec="indeferir" data-a="' + a.protocolo + '">Indeferir</button><button class="ds-btn pos btn-s" data-dec="aprovar" data-a="' + a.protocolo + '">Aprovar</button>' : '<span class="pill warn">' + (a.solicitante.usuario === ME.usuario ? 'seu pedido' : 'aguardando a Coordenação') + '</span>') + '</div></div></div>').join('') + '</div>' : '<div class="empty"><b>Nada pendente</b>Todas as autorizações foram decididas.</div>') + '</div></div>' +
    '<div class="card"><div class="hd"><b>' + ci('history') + 'Decididas</b></div><div class="bd p0">' + (hist.length ? '<div class="tw"><table class="t"><thead><tr><th>Protocolo</th><th>Operação</th><th>Documento</th><th>Pedido por</th><th>Decisão</th><th>Por</th></tr></thead><tbody>' + hist.map(a => '<tr><td class="nw"><span class="prot">' + a.protocolo + '</span></td><td class="w">' + esc(a.operacaoTxt) + '</td><td class="w"><a style="cursor:pointer;color:var(--inf);font-weight:700" data-ver="' + a.documento + '">' + a.documento + '</a> · ' + esc(a.tipo + ' · ' + a.colab.nome) + '<span class="sub">' + esc(a.justificativa) + '</span></td><td class="nw">' + esc(a.solicitante.nome) + '<span class="sub">' + dtBR(a.solicitadoEm) + '</span></td><td><span class="pill ' + (a.status === 'indeferida' ? 'bad' : 'ok') + '">' + esc(a.statusTxt) + '</span>' + (a.decisao && a.decisao.texto ? '<span class="sub">' + esc(a.decisao.texto) + '</span>' : '') + '</td><td class="nw">' + (a.decisao ? esc(a.decisao.por.nome) + '<span class="sub">' + dtBR(a.decisao.em) + '</span>' : '—') + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">Nenhuma decisão ainda.</div>') + '</div></div>';
  ligarDocs();
  $$('[data-dec]').forEach(b => b.onclick = async () => {
    const a = lista.find(x => x.protocolo === b.dataset.a); const aprovar = b.dataset.dec === 'aprovar';
    const r = await modal({ titulo: (aprovar ? 'Aprovar' : 'Indeferir') + ' · ' + a.operacaoTxt, sub: a.protocolo + ' · ' + a.documento + ' · ' + a.colab.nome, corpo: '<p style="font-size:12.5px;line-height:1.5"><b>Justificativa do RH:</b> ' + esc(a.justificativa) + '</p><label class="lb">' + (aprovar ? 'Observação (opcional)' : 'Motivo do indeferimento *') + '<textarea class="ta" id="m-txt"></textarea></label><label class="lb">Confirme sua senha para ' + (aprovar ? 'autorizar' : 'decidir') + ' <span style="color:var(--neg)">*</span><input class="ds-input" type="password" id="m-senha" autocomplete="current-password" placeholder="senha da sua conta (' + esc(ME.usuario) + ')"></label><p class="hint" style="margin-top:0">A senha é conferida no servidor contra a sua conta e não é guardada. Depois de 5 erros a decisão fica bloqueada por 15 minutos.' + (aprovar && a.operacao === 'excluir' ? ' <b>Aprovar exclui o documento do prontuário</b> (o arquivo fica retido fora dele, com o rastreio).' : '') + '</p>', ok: aprovar ? 'Autorizar' : 'Indeferir', cls: aprovar ? 'pos' : 'ds-btn-danger',
      onOk: async ov => { const t = ov.querySelector('#m-txt').value.trim(); const senha = ov.querySelector('#m-senha').value; if (!aprovar && t.length < 5) { toast('Informe o motivo', 'neg'); return false; } if (!senha) { toast('Confirme sua senha', 'neg'); return false; } await post(API + '/autorizacoes/' + a.protocolo + '/decidir', { decisao: aprovar ? 'aprovar' : 'indeferir', texto: t, senha }); return true; } });
    if (r) { toast(a.protocolo + (aprovar ? ' autorizada' : ' indeferida'), 'pos'); contadores(); autorizacoes(); }
  });
}

/* ═══════════ 8. Auditoria ═══════════ */
const FA = { usuario: '', acao: '', q: '', loja: '', mes: '' };
async function auditoria() {
  const el = $('#page'); let lista; try { lista = await api(API + '/auditoria?' + qs(FA)); } catch (e) { el.innerHTML = erroBox(e); return; }
  const US = [...new Set(lista.map(l => l.usuario))].sort(), AC = Object.entries(C().acoes).concat([['importar_lote', 'Importação em lote']]);
  el.innerHTML = '<div class="tb"><label>Usuário<select class="ds-select" id="a-u">' + selOpts(US, FA.usuario, 'Todos') + '</select></label><label>Ação<select class="ds-select" id="a-a">' + selOpts(AC, FA.acao, 'Todas') + '</select></label><label>Unidade<select class="ds-select" id="a-loja">' + selLoja(FA.loja, 'Todas') + '</select></label><label>Protocolo ou detalhe<div class="ds-search">' + ic('search') + '<input class="ds-input" id="a-q" placeholder="CGD-, SOL-, AUT- ou texto…" value="' + esc(FA.q) + '"></div></label><label class="sm">Mês<input class="ds-input" type="month" id="a-mes" value="' + esc(FA.mes) + '"></label><div class="end"><button class="ds-btn ds-btn-primary" id="a-ok">' + ci('filter') + 'Filtrar</button><button class="ds-btn ds-btn-secondary" id="a-limpa">' + ic('refresh') + 'Limpar</button></div></div>' +
    '<div class="card"><div class="hd"><b>' + ic('search') + 'Trilha de auditoria</b><small class="cnt">' + lista.length + ' registro(s) · arquivo só de acréscimo (' + (FA.mes || 'mês atual e anterior') + ')</small></div><div class="bd p0">' + (lista.length ? '<div class="tw"><table class="t"><thead><tr><th>Data e hora</th><th>Usuário</th><th>Ação</th><th>Protocolo</th><th>Unidade</th><th>Detalhe</th><th>Origem</th></tr></thead><tbody>' + lista.map(l => '<tr><td class="nw">' + dtBR(l.em) + '</td><td class="nw"><b>' + esc(l.nome || l.usuario) + '</b><span class="sub">' + esc(l.usuario) + '</span></td><td class="nw">' + esc(l.acaoTxt) + '</td><td class="nw">' + (l.ref ? (/^CGD-/.test(l.ref) ? '<a class="prot" style="cursor:pointer;color:var(--inf)" data-ver="' + l.ref + '">' + l.ref + '</a>' : '<span class="prot">' + esc(l.ref) + '</span>') : '—') + '</td><td class="nw">' + (l.loja ? lojaTxt(l.loja) : '—') + '</td><td class="w">' + esc(l.detalhe || '') + (l.versao ? ' · versão ' + l.versao : '') + '</td><td class="nw"><span class="sub">' + esc(l.ip || '') + '</span></td></tr>').join('') + '</tbody></table></div>' : '<div class="empty"><b>Nenhum registro</b>Nada com os filtros atuais.</div>') + '</div></div>';
  const ler = () => { FA.usuario = $('#a-u').value; FA.acao = $('#a-a').value; FA.loja = $('#a-loja').value; FA.q = $('#a-q').value.trim(); FA.mes = $('#a-mes').value; };
  $('#a-ok').onclick = () => { ler(); auditoria(); }; $('#a-q').onkeydown = e => { if (e.key === 'Enter') { ler(); auditoria(); } }; $('#a-limpa').onclick = () => { Object.assign(FA, { usuario: '', acao: '', q: '', loja: '', mes: '' }); auditoria(); }; ligarDocs();
}

/* ═══════════ 9. Configurações ═══════════ */
async function cfg() {
  const el = $('#page'); let c, au = null; try { c = await api(API + '/config'); try { au = await api(API + '/autentique/config'); } catch (e) {} } catch (e) { el.innerHTML = erroBox(e); return; }

  const PERM = [['Enviar documento ao RH', [1, 1, 1, 0]], ['Reenviar após correção', [1, 1, 1, 0]], ['Conferir, validar e arquivar', [0, 1, 1, 0]], ['Solicitar correção / rejeitar', [0, 1, 1, 0]], ['Importar documento histórico (unitário e lote)', [0, 1, 1, 0]], ['Abrir solicitação à unidade', [0, 1, 1, 0]], ['Ver prontuário da própria unidade', [1, 1, 1, 1]], ['Ver prontuário de todas as unidades', [0, 1, 1, 1]], ['Abrir arquivos de Saúde Ocupacional', [0, 1, 1, 0]], ['Baixar arquivos', [1, 1, 1, 0]], ['Pedir exclusão / substituição de validado', [0, 1, 1, 0]], ['Autorizar exclusão / substituição (com senha)', [0, 0, 1, 0]], ['Consultar auditoria', [1, 1, 1, 1]], ['Alterar configurações', [0, 0, 1, 0]]];
  el.innerHTML = '<div class="cfg">' +
    '<div><div class="card"><div class="hd"><b>' + ci('clock') + 'Prazos e limites</b></div><div class="bd p0">' +
      '<div class="lin"><div><b>Conferência do RH</b><small>dias até o documento contar como "fora do prazo" na fila</small></div><div class="end"><input class="ds-input" type="number" id="c-rh" value="' + c.prazoRhDias + '" min="1" max="30"> dias</div></div>' +
      '<div class="lin"><div><b>Atendimento de solicitação pela unidade</b><small>prazo sugerido ao abrir a solicitação</small></div><div class="end"><input class="ds-input" type="number" id="c-cpd" value="' + c.prazoCpdDias + '" min="1" max="60"> dias</div></div>' +
      '<div class="lin"><div><b>Tamanho máximo por arquivo</b><small>PDF, JPG, PNG ou WEBP — conteúdo conferido pelos primeiros bytes</small></div><div class="end"><b>' + c.maxMb + ' MB</b></div></div></div></div>' +
    '<div class="card"><div class="hd"><b>' + ci('bell') + 'Notificações</b></div><div class="bd p0">' + [['Documento recebido → RH da unidade', 'painel (central de pessoas)'], ['Correção, rejeição ou validação → CPD da unidade', 'painel'], ['Solicitação aberta → CPD da unidade', 'painel'], ['Autorização pendente → Coordenação', 'painel'], ['Decisão da Coordenação → RH', 'painel']].map(n => '<div class="lin"><div><b>' + n[0] + '</b><small>' + n[1] + '</small></div><div class="end"><span class="pill ok">ativo</span></div></div>').join('') + '<div class="lin"><div><b>Avisar também pelo WhatsApp (Robô Central Cahu)</b><small>preparado para a próxima etapa — hoje só registra a preferência</small></div><div class="end"><span class="sw' + (c.avisarWhatsapp ? ' on' : '') + '" id="c-wpp"></span></div></div></div></div></div>' +
    '<div><div class="card"><div class="hd"><b>' + ci('archive') + 'Retenção por pasta</b><small class="cnt">anos a partir da data do documento</small></div><div class="bd p0">' + CATS().map(k => '<div class="lin"><div><b style="font-weight:600">' + esc(catTxt(k)) + '</b>' + (C().categorias[k].sensivel ? '<small>saúde ocupacional · acesso restrito</small>' : '') + '</div><div class="end"><input class="ds-input" type="number" data-ret="' + k + '" value="' + c.retencaoAnos[k] + '" min="1" max="99"> anos</div></div>').join('') + '</div><div class="bd"><p class="hint" style="margin:0">Proposta inicial (CLT, FGTS, NR-7) a validar com o jurídico. O prazo é gravado em cada documento ao arquivar; nada é descartado automaticamente — descarte só com autorização da Coordenação.</p></div></div></div>' +
    '<div><div class="card"><div class="hd"><b>' + ci('key') + 'Quem pode o quê</b><small class="cnt">regras do servidor</small></div><div class="bd p0"><div class="perm"><div class="h">Ação</div>' + PERFIS.map(p => '<div class="h">' + p + '</div>').join('') + PERM.map(r => '<div>' + r[0] + '</div>' + r[1].map(v => '<div>' + (v ? ci('check-circle', 'ok') : ci('x-circle', 'no')) + '</div>').join('')).join('') + '</div></div><div class="bd"><p class="hint" style="margin:0">Papéis e unidades de cada pessoa são designados em <a href="/gestao-pessoas.html" style="color:var(--inf);font-weight:700">DP / RH › Gestão de Pessoas › Configurações</a> (papel "CPD da unidade" com as lojas; RH; Coordenação; Diretoria). O administrador do sistema opera como RH e Coordenação.</p></div></div></div>' +
'<div><div class="card"><div class="hd"><b>' + ci('paperclip') + 'Assinatura eletrônica · Autentique</b><small class="cnt">' + (au ? (au.ultimo_teste && au.ultimo_teste.ok ? 'conectada' : au.tem_token ? 'chave salva · teste pendente' : 'sem chave') : 'só a Coordenação') + '</small></div>' + (au ? '<div class="bd"><div class="campos"><label>Chave da API (Bearer)<input class="ds-input" type="password" id="au-token" placeholder="' + esc(au.tem_token ? 'salva: ' + au.token_mascarado + ' — cole aqui só para trocar' : 'cole a chave gerada no painel da Autentique') + '" autocomplete="new-password"></label><label>Segredo do webhook (HMAC)<input class="ds-input" type="password" id="au-secret" placeholder="' + esc(au.tem_segredo ? 'salvo: ' + au.segredo_mascarado : 'segredo informado no cadastro do webhook') + '" autocomplete="new-password"></label><label class="c2">URL do webhook (cadastrar no painel da Autentique, eventos: ' + esc(au.eventosUteis.join(', ')) + ')<input class="ds-input" value="' + esc(au.webhookUrl) + '" readonly onclick="this.select()"></label></div><div class="lin" style="padding:10px 0 0;border:0"><div><b>Modo sandbox (documentos de teste, sem consumir crédito)</b><small>fica ligado até a homologação; nenhum documento real é enviado nesta fase</small></div><div class="end"><span class="sw' + (au.sandbox ? ' on' : '') + '" id="au-sandbox"></span></div></div>' + (au.ultimo_teste ? '<div class="aviso ' + (au.ultimo_teste.ok ? 'ok' : 'neg') + '" style="margin:12px 0 0"><b>Último teste ' + dtBR(au.ultimo_teste.em) + (au.ultimo_teste.por ? ' por ' + esc(au.ultimo_teste.por) : '') + ':</b> ' + (au.ultimo_teste.ok ? 'autenticado em ' + au.ultimo_teste.ms + ' ms · conta ' + esc(au.ultimo_teste.conta.nome) + ' (' + esc(au.ultimo_teste.conta.email) + ')' + (au.ultimo_teste.conta.organizacao ? ' · organização ' + esc(au.ultimo_teste.conta.organizacao.nome) : '') + (au.ultimo_teste.conta.plano ? ' · ' + au.ultimo_teste.conta.plano.creditos + ' crédito(s)' : '') : esc(au.ultimo_teste.erro)) + '</div>' : '') + '<div class="acoes"><div class="end"><button class="ds-btn ds-btn-secondary" id="au-salvar">Salvar chave e segredo</button><button class="ds-btn ds-btn-primary" id="au-testar"' + (au.tem_token ? '' : ' disabled') + '>' + ic('refresh') + 'Testar autenticação</button></div></div>' + (au.eventos.length ? '<div class="h4" style="margin-top:14px">Últimos webhooks recebidos</div><div class="files">' + au.eventos.slice(0, 8).map(e => '<div>' + ci(e.assinaturaOk ? 'check-circle' : 'x-circle', e.assinaturaOk ? 'ok' : 'bad') + esc(e.tipo || '?') + (e.sandbox ? ' <small>sandbox</small>' : '') + '<small>' + esc(e.documentoId || '') + ' · ' + dtBR(e.recebidoEm) + (e.motivo ? ' · ' + esc(e.motivo) : '') + '</small></div>').join('') + '</div>' : '<p class="hint">Nenhum webhook recebido ainda.</p>') + '</div>' : '<div class="bd"><p class="hint" style="margin:0">A chave e o teste de conexão ficam com a Coordenação.</p></div>') + '</div></div>' +
    '</div><div class="acoes" style="justify-content:flex-end"><button class="ds-btn ds-btn-ghost" id="cf-desc">Descartar</button><button class="ds-btn ds-btn-primary tall" id="cf-salva">Salvar configurações</button></div>';
  $('#c-wpp').onclick = () => $('#c-wpp').classList.toggle('on'); $('#cf-desc').onclick = () => cfg();

  if ($('#au-salvar')) $('#au-salvar').onclick = async () => { const b = { sandbox: $('#au-sandbox').classList.contains('on') }; if ($('#au-token').value.trim()) b.token = $('#au-token').value.trim(); if ($('#au-secret').value.trim()) b.webhookSecret = $('#au-secret').value.trim(); try { await api(API + '/autentique/config', { method: 'PUT', body: b }); toast('Configuração da Autentique salva', 'pos'); cfg(); } catch (e) { toast(e.message, 'neg'); } };
  if ($('#au-testar')) $('#au-testar').onclick = async () => { const b = $('#au-testar'); b.disabled = true; b.textContent = 'Testando…'; try { const t = await post(API + '/autentique/testar', {}); toast(t.ok ? 'Autenticado: ' + (t.conta.organizacao ? t.conta.organizacao.nome : t.conta.nome) : t.erro, t.ok ? 'pos' : 'neg'); } catch (e) { toast(e.message, 'neg'); } cfg(); };
  $('#cf-salva').onclick = async () => { try { await api(API + '/config', { method: 'PUT', body: { prazoRhDias: +$('#c-rh').value, prazoCpdDias: +$('#c-cpd').value, avisarWhatsapp: $('#c-wpp').classList.contains('on'), retencaoAnos: Object.fromEntries($$('[data-ret]').map(i => [i.dataset.ret, +i.value])) } }); ME = await api(API + '/me'); toast('Configurações salvas', 'pos'); cfg(); } catch (e) { toast(e.message, 'neg'); } };
