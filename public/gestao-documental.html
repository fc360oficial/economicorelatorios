<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="/nav.js" defer></script>
<script src="/gente-ui.js"></script>
<script src="/chart.min.js"></script>
<title>Gestão Documental — DP / RH · Econômico Supermercados</title>
<!-- DP / RH › Gestão Documental — Central de Gestão Documental (CGD). ETAPA 01 (28/10/2026): SÓ INTERFACE.
     Prontuários digitais dos funcionários, recebimento de documentos pelo CPD das lojas, conferência pelo RH, protocolos,
     solicitações às unidades, autorizações da coordenação, auditoria e configurações. Nesta etapa nada chama /api, nada grava
     e nenhuma tabela existe: os dados abaixo (MOCK) são fictícios e vivem só na memória da página, pra validar navegação,
     layout e componentes. Mesma casca das telas irmãs do DP / RH (Gestão Disciplinar / Auditoria da Folha): rail do nav.js +
     cabeçalho + abas (modnav) + página. Etapa 02 = lib/gestao-documental.js + rotas + armazenamento dos arquivos. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--font);background:var(--pap);color:var(--ink);min-height:100vh;font-size:13px}
.content{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:58px;background:var(--crd);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:40}
.topbar .tt{display:flex;align-items:center;gap:12px;min-width:0}.topbar .tt .ico{width:38px;height:38px;border-radius:10px;background:var(--amw);color:var(--amk);display:flex;align-items:center;justify-content:center;flex:none}.topbar .tt .ico .ds-ic{width:20px;height:20px}
.topbar h1{font-size:16px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;white-space:nowrap}.topbar h1 .crumb{color:var(--ink3);font-weight:600}.topbar h1 .ds-ic{color:var(--ink3)}
.topbar p{font-size:11.5px;color:var(--ink3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topbar .end{margin-left:auto;display:flex;align-items:center;gap:12px}
.who{display:flex;align-items:center;gap:9px;font-size:12px}.who .ds-avatar{background:#101B33;color:#FFC933}.who b{display:block;font-size:12.5px}.who span{color:var(--ink3);font-size:11px}
.bell{position:relative;width:34px;height:34px;border-radius:9px;border:1px solid var(--ln2);background:var(--crd);display:flex;align-items:center;justify-content:center;color:var(--ink2);cursor:pointer}.bell:hover{background:var(--wsh)}.bell i{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--neg);color:#fff;font-style:normal;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.modnav{background:var(--crd);border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;align-items:stretch;padding:0 14px;position:sticky;top:58px;z-index:39}
.modnav a{display:flex;align-items:center;gap:6px;padding:0 12px;height:42px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;user-select:none}
.modnav a .ds-ic{width:15px;height:15px;color:var(--ink3)}.modnav a:hover{color:var(--ink)}.modnav a.on{color:var(--ink);border-bottom-color:var(--am)}.modnav a.on .ds-ic{color:var(--amk)}
.modnav a .b{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--neg);color:#fff;font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.page{padding:20px 24px 40px;max-width:1700px;width:100%}
.aviso{background:var(--amw);border:1px solid var(--am-ln);color:var(--amk);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.5}.aviso.neg{background:var(--negw);border-color:#F1B9C3;color:var(--neg)}.aviso.inf{background:var(--infw);border-color:var(--inf);color:var(--inf)}.aviso.ok{background:var(--posw);border-color:#B9E2C8;color:var(--pos)}
.hint{font-size:11.5px;color:var(--ink2);margin-top:8px;line-height:1.5}.hint b{color:var(--ink)}
.empty{padding:36px 20px;text-align:center;color:var(--ink3);font-size:12.5px}.empty b{display:block;color:var(--ink2);font-size:13.5px;margin-bottom:3px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--posw);color:var(--pos)}.pill.bad{background:var(--negw);color:var(--neg)}.pill.warn{background:var(--amw);color:var(--amk)}.pill.info{background:var(--infw);color:var(--inf)}.pill.gr{background:var(--wsh);color:var(--ink2)}.pill.pur{background:#EFE7FB;color:#5B32A8}
.etq{display:inline-block;background:#101B33;color:#FFC933;font-weight:800;font-size:10px;padding:2px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}.etq.cd{background:var(--inf);color:#fff}
.prot{font-family:var(--mono,ui-monospace,monospace);font-weight:700;font-size:12px;color:var(--ink)}
.av{width:30px;height:30px;border-radius:50%;background:var(--infw);color:var(--inf);font-weight:800;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.av.lg{width:52px;height:52px;font-size:17px;background:#101B33;color:#FFC933}
.pess{display:flex;align-items:center;gap:9px;min-width:0}.pess b{display:block;font-size:12.5px;color:var(--ink);white-space:nowrap;line-height:1.25}.pess small{display:block;font-size:11px;color:var(--ink3)}
/* KPIs do painel (6 cartões: ícone colorido · rótulo · número · variação · contexto) */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--crd);border:1px solid var(--ln);border-radius:12px;padding:13px 14px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 12px;align-items:start;cursor:pointer;box-shadow:var(--sh-sm)}.kpi:hover{border-color:var(--ln2)}.kpi.on{outline:2px solid var(--am)}
.kpi .ico{grid-row:span 3;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}.kpi .ico .ds-ic{width:20px;height:20px}
.kpi .l{font-size:11px;font-weight:700;color:var(--ink2);line-height:1.3}.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1;display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}.kpi .v .ds-chip{font-size:10.5px}.kpi .c{font-size:11px;color:var(--ink3)}
.t-inf{background:var(--infw);color:var(--inf)}.t-ind{background:#E9E6FB;color:#4338CA}.t-am{background:var(--amw);color:var(--amk)}.t-ok{background:var(--posw);color:var(--pos)}.t-neg{background:var(--negw);color:var(--neg)}.t-pur{background:#EFE7FB;color:#5B32A8}.t-gr{background:var(--wsh);color:var(--ink2)}
/* filtros */
.tb{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:10px 12px;margin-bottom:14px}
.tb label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--ink2);flex:1;min-width:140px}.tb label.sm{flex:0 0 auto;min-width:0}.tb .ds-input,.tb .ds-select{height:36px;font-size:12.5px;width:100%}.tb .end{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb .ds-search{width:100%}.tb .ds-search .ds-input{background:var(--crd);border-color:var(--ln2)}
/* cards */
.card{background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);box-shadow:var(--sh-sm);margin-bottom:14px;min-width:0}
.card .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln)}.card .hd b{font-size:13.5px;display:flex;align-items:center;gap:8px}.card .hd b .ds-ic{color:var(--inf)}.card .hd small{color:var(--ink3);font-size:11.5px}.card .hd .end{margin-left:auto;display:flex;gap:8px;align-items:center}.card .hd a.lk{color:var(--inf);font-weight:700;font-size:12px;cursor:pointer;text-decoration:none}.card .hd a.lk:hover{text-decoration:underline}
.card .bd{padding:14px 16px}.card .bd.p0{padding:0}
/* o gente-ui.js pinta o cabeçalho do card de navy (igual às telas irmãs do DP / RH): o que fica dentro precisa de cor clara */
.card .hd b .ds-ic{color:#FFC933}.card .hd .prot{color:#FFC933}.card .hd a.lk{color:#FFC933}.card .hd .ds-btn-ghost{color:#D7DDEA}.card .hd .ds-btn-ghost:hover{background:rgba(255,255,255,.1);color:#fff}.card .hd .cnt{color:#B7C0D6}.card .hd .etq{margin-left:0}
/* tabela */
.tw{overflow:auto;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r)}.card .tw{border:none;border-radius:0 0 var(--r-lg) var(--r-lg)}
table.t{width:100%;border-collapse:collapse;font-size:12px}table.t th{text-align:left;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);padding:9px 10px;background:var(--wsh);font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:1}table.t td{padding:8px 10px;border-top:1px solid var(--ln);color:var(--ink2);vertical-align:middle}
table.t td.nm{color:var(--ink);font-weight:700;white-space:normal}table.t th.r,table.t td.r{text-align:right}table.t td .sub{display:block;font-size:11px;color:var(--ink3);font-weight:500;white-space:normal;max-width:220px}table.t tr.cl{cursor:pointer}table.t tr.cl:hover td{background:var(--wsh)}table.t td.w{white-space:normal}table.t td.nw{white-space:nowrap}table.t td.ck,table.t th.ck{width:34px;padding-right:0}table.t input[type=checkbox]{accent-color:#101B33;width:15px;height:15px}
table.t tr.sel td{background:var(--amw)}
.acts{display:flex;gap:6px;align-items:center;white-space:nowrap}.btn-s{height:30px;padding:0 11px;font-size:11.5px;border-radius:7px}.btn-i{width:30px;padding:0}
/* painel: grade principal + lateral */
.g2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.donut{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}.donut .cv{position:relative;width:150px;height:150px}.donut .cv canvas{width:150px!important;height:150px!important}.donut .cv .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}.donut .cv .mid b{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1}.donut .cv .mid small{font-size:10.5px;color:var(--ink3)}
.leg{display:grid;gap:8px}.leg div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}.leg div i{width:10px;height:10px;border-radius:3px;flex:none}.leg div b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}.leg div small{color:var(--ink3)}
.tl{display:grid}.tl .t{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:0 10px;padding:7px 0;font-size:12px;border-top:1px solid var(--ln)}.tl .t:first-child{border-top:none}.tl .t i{width:10px;height:10px;border-radius:50%;background:var(--ln2);margin-top:4px}.tl .t i.ok{background:var(--pos)}.tl .t i.bad{background:var(--neg)}.tl .t i.warn{background:var(--am)}.tl .t i.info{background:var(--inf)}.tl .t i.pur{background:#5B32A8}.tl .t b{display:block;color:var(--ink)}.tl .t span{color:var(--ink2);line-height:1.4}.tl .t time{color:var(--ink3);font-size:11px;white-space:nowrap}
.atalhos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.atalho{display:flex;align-items:center;gap:12px;background:var(--crd);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;cursor:pointer;box-shadow:var(--sh-sm)}.atalho:hover{border-color:var(--am);background:var(--amw)}.atalho .ico{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}.atalho .ico .ds-ic{width:22px;height:22px}.atalho b{display:block;font-size:13.5px}.atalho small{color:var(--ink3);font-size:11.5px}.atalho .ds-ic.ch{margin-left:auto;color:var(--ink3)}
/* prontuários */
.pront{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:var(--crd);border:1px solid var(--ln);border-radius:12px;padding:13px 14px;cursor:pointer;display:grid;gap:9px;box-shadow:var(--sh-sm)}.pcard:hover{border-color:var(--am)}.pcard .bar{height:6px;border-radius:3px;background:var(--wsh);position:relative;overflow:hidden}.pcard .bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--pos)}.pcard .bar.warn i{background:var(--am)}.pcard .bar.bad i{background:var(--neg)}.pcard .m{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)}.pcard .m b{color:var(--ink)}
.colab{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:14px}.colab b.n{font-size:15px}.colab .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:3px}.colab .meta span b{color:var(--ink)}.colab .end{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}
.cat .hd .cnt{margin-left:auto;font-size:11px;color:var(--ink3)}.dl{display:grid}.dl>div{display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 16px;border-top:1px solid var(--ln);font-size:12px}.dl>div:first-child{border-top:none}.dl>div .ds-ic{width:16px;height:16px}.dl>div .ok{color:var(--pos)}.dl>div .bad{color:var(--neg)}.dl>div .warn{color:var(--amk)}.dl>div .gr{color:var(--ink3)}.dl>div b{display:block;color:var(--ink);font-weight:600}.dl>div small{display:block;color:var(--ink3);font-size:11px}
/* recebimento (CPD) */
.g2b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.campos label{display:block;font-size:11px;font-weight:700;color:var(--ink2);line-height:1.4}.campos label>.ds-input,.campos label>.ds-select,.campos label>textarea{margin-top:5px;width:100%}.campos .c2{grid-column:1/-1}.campos span.req{color:var(--neg)}
.campos .ds-input,.campos .ds-select{height:36px;font-size:12.5px}textarea.ta{height:auto;min-height:80px;padding:8px 10px;border:1px solid var(--ln2);border-radius:8px;font:inherit;font-size:12.5px;line-height:1.5;background:var(--crd);color:var(--ink);resize:vertical;width:100%;margin-top:5px}
.drop{border:2px dashed var(--ln2);border-radius:12px;padding:22px 16px;text-align:center;color:var(--ink3);font-size:12px;cursor:pointer;background:var(--wsh);margin-top:5px}.drop:hover,.drop.over{border-color:var(--am);background:var(--amw);color:var(--amk)}.drop b{display:block;color:var(--ink);font-size:13px;margin:6px 0 2px}.drop .ds-ic{width:26px;height:26px;color:var(--inf)}
.files{display:grid;gap:6px;margin-top:8px}.files div{display:flex;gap:8px;align-items:center;font-size:12px;background:var(--wsh);border-radius:8px;padding:7px 10px}.files div i{font-style:normal;color:var(--ink3);margin-left:auto;cursor:pointer}.files div i:hover{color:var(--neg)}.files small{color:var(--ink3)}
.acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.acoes .end{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* conferência do RH */
.conf{display:grid;grid-template-columns:380px minmax(0,1fr);gap:14px;align-items:start}
.fila{display:grid}.fila div.it{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--ln);cursor:pointer}.fila div.it:first-child{border-top:none}.fila div.it:hover{background:var(--wsh)}.fila div.it.on{background:var(--amw)}.fila .it b{display:block;font-size:12.5px;color:var(--ink)}.fila .it small{display:block;color:var(--ink3);font-size:11px}
.prev{background:var(--wsh);border:1px solid var(--ln);border-radius:10px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink3);font-size:12px;text-align:center;padding:20px}.prev .ds-ic{width:40px;height:40px;color:var(--ln2)}.prev b{color:var(--ink2);font-size:13px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:12.5px}.kv dt{color:var(--ink3);font-weight:600}.kv dd{color:var(--ink);line-height:1.5}
.checks{display:grid;gap:8px}.checks label{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink);cursor:pointer;line-height:1.4}.checks input{margin-top:2px;accent-color:#101B33;width:15px;height:15px}
.ds-btn.pos{background:var(--pos);color:#fff;border-color:var(--pos)}.ds-btn.pos:hover{filter:brightness(.93)}
/* autorizações */
.auts{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px}
.aut{background:var(--crd);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;display:grid;gap:8px;box-shadow:var(--sh-sm)}.aut .top{display:flex;gap:10px;align-items:center}.aut .top .ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}.aut .top b{display:block;font-size:13px}.aut .top small{color:var(--ink3);font-size:11px}.aut p{font-size:12px;color:var(--ink2);line-height:1.5}.aut .just{background:var(--wsh);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5}.aut .just small{display:block;color:var(--ink3);font-size:10.5px;margin-bottom:2px}
/* configurações */
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:14px}
.sw{display:inline-block;vertical-align:middle;position:relative;width:36px;height:20px;border-radius:10px;background:var(--ln2);cursor:pointer;flex:none;transition:.15s}.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--pos)}.sw.on::after{left:18px}
.perm{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(0,1fr));font-size:12px}.perm>div{padding:8px 10px;border-top:1px solid var(--ln);display:flex;align-items:center;justify-content:center}.perm>div:nth-child(5n+1){justify-content:flex-start;color:var(--ink);font-weight:600}.perm>div.h{border-top:none;background:var(--wsh);font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);text-align:center;line-height:1.2}.perm input{accent-color:#101B33;width:15px;height:15px}
.lin{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--ln);font-size:12.5px}.lin:first-child{border-top:none}.lin b{display:block}.lin small{display:block;color:var(--ink3);font-size:11px}.lin .end{margin-left:auto;display:flex;gap:8px;align-items:center}.lin .ds-input{height:32px;width:80px;text-align:right}
/* detalhe do protocolo (gaveta lateral) */
.gav-ov{position:fixed;inset:0;background:rgba(10,17,32,.45);z-index:9000;display:flex;justify-content:flex-end}
.gav{width:560px;max-width:100%;height:100%;background:var(--crd);box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.gav .hd{background:#101B33;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.gav .hd b{font-size:15px;display:block}.gav .hd small{display:block;color:#B7C0D6;font-size:11.5px;margin-top:2px}.gav .x{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:7px;width:30px;height:30px;font-size:16px;cursor:pointer;flex:none}
.gav .bd{padding:16px 18px;overflow:auto;display:grid;gap:14px;align-content:start}.gav h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);margin-bottom:8px}
.gav .ft{padding:12px 18px;border-top:1px solid var(--ln);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
/* modal */

  $$('a[data-p]').forEach(a => a.onclick = () => { const p = a.dataset.p; if (/^CGD-/.test(p)) location.hash = 'p=' + p; else if (/^SOL-/.test(p)) ir('solicitacoes'); else ir('autorizacoes'); });

/* ═══════════ 9. Configurações ═══════════ */
function cfg() {
  const el = $('#page');
  const PERFIS = ['CPD da loja', 'RH', 'Coordenação', 'Auditoria'];
  const PERM = [['Enviar documento', [1, 1, 1, 0]], ['Conferir e validar', [0, 1, 1, 0]], ['Devolver para correção', [0, 1, 1, 0]], ['Abrir solicitação', [0, 1, 1, 0]], ['Ver prontuário da própria unidade', [1, 1, 1, 1]], ['Ver prontuário de todas as unidades', [0, 1, 1, 1]], ['Aprovar autorizações', [0, 0, 1, 0]], ['Excluir / substituir validado', [0, 0, 1, 0]], ['Consultar auditoria', [0, 0, 1, 1]], ['Alterar configurações', [0, 0, 1, 0]]];
  el.innerHTML = '<div class="cfg">' +
    '<div class="card"><div class="hd"><b>' + ci('file') + 'Tipos de documento</b><small>' + CFG_TIPOS.filter(t => t.ativo).length + ' ativos</small><div class="end"><button class="ds-btn ds-btn-secondary btn-s" id="t-novo">' + ci('plus') + 'Novo tipo</button></div></div><div class="bd p0"><div class="tw"><table class="t"><thead><tr><th>Tipo</th><th>Categoria</th><th>Obrigatório</th><th>Validade</th><th>Ativo</th></tr></thead><tbody>' + CFG_TIPOS.map((t, i) => '<tr><td class="nm">' + esc(t.t) + '</td><td class="w">' + esc(t.cat) + '</td><td><span class="sw' + (t.obrig ? ' on' : '') + '" data-sw="obrig" data-i="' + i + '"></span></td><td class="nw">' + esc(t.validade) + '</td><td><span class="sw' + (t.ativo ? ' on' : '') + '" data-sw="ativo" data-i="' + i + '"></span></td></tr>').join('') + '</tbody></table></div></div></div>' +
    '<div><div class="card"><div class="hd"><b>' + ci('clock') + 'Prazos e alertas</b></div><div class="bd p0">' +
      '<div class="lin"><div><b>Conferência do RH</b><small>dias úteis até o documento ficar "fora do prazo" na fila</small></div><div class="end"><input class="ds-input" type="number" value="2" min="1"> dias</div></div>' +
      '<div class="lin"><div><b>Atendimento de solicitação pela loja</b><small>prazo padrão sugerido ao abrir a solicitação</small></div><div class="end"><input class="ds-input" type="number" value="3" min="1"> dias</div></div>' +
      '<div class="lin"><div><b>Reenvio após devolução</b><small>o CPD tem este prazo para corrigir e reenviar</small></div><div class="end"><input class="ds-input" type="number" value="2" min="1"> dias</div></div>' +
      '<div class="lin"><div><b>Aviso de documento vencendo</b><small>ASO, comprovante de residência, CNH</small></div><div class="end"><input class="ds-input" type="number" value="30" min="1"> dias antes</div></div>' +
      '<div class="lin"><div><b>Prontuário crítico</b><small>abaixo deste percentual de documentos obrigatórios</small></div><div class="end"><input class="ds-input" type="number" value="60" min="1" max="100"> %</div></div></div></div>' +
    '<div class="card"><div class="hd"><b>' + ci('bell') + 'Notificações</b></div><div class="bd p0">' + [['Documento recebido → RH', 'painel + e-mail', 1], ['Documento devolvido → CPD da loja', 'painel + WhatsApp (Robô Central Cahu)', 1], ['Solicitação aberta → CPD da loja', 'painel + WhatsApp', 1], ['Solicitação atrasada → RH e gerente da loja', 'painel + WhatsApp às 08:00', 1], ['Autorização pendente → Coordenação', 'painel + e-mail', 1], ['Documento vencendo → RH', 'painel', 0]].map(n => '<div class="lin"><div><b>' + n[0] + '</b><small>' + n[1] + '</small></div><div class="end"><span class="sw' + (n[2] ? ' on' : '') + '"></span></div></div>').join('') + '</div></div></div>' +
    '<div class="card"><div class="hd"><b>' + ci('key') + 'Perfis e permissões</b><small>quem pode o quê</small></div><div class="bd p0"><div class="perm"><div class="h">Ação</div>' + PERFIS.map(p => '<div class="h">' + p + '</div>').join('') + PERM.map(r => '<div>' + r[0] + '</div>' + r[1].map(v => '<div><input type="checkbox"' + (v ? ' checked' : '') + '></div>').join('')).join('') + '</div></div></div>' +
    '<div class="card"><div class="hd"><b>' + ci('users') + 'Designações</b><small>quem exerce cada papel</small></div><div class="bd p0">' + [['RH · conferência', 'Rodrigo'], ['Coordenação · autorizações', 'Donato'], ['Auditoria', 'Tiago'], ['CPD E1 Cahu', 'Marcos'], ['CPD E2 Muribeca', 'Débora'], ['CPD E3 Ponte', 'Alex'], ['CPD E4 Atacarejo', 'Paula'], ['CPD E5 Porta Larga', 'Cícero'], ['CPD E6 Jardim Jordão', 'Renata'], ['CPD CD', 'Nicoly']].map(d => '<div class="lin"><div><b>' + d[0] + '</b></div><div class="end"><span class="pess"><span class="av">' + ini(d[1]) + '</span><b style="font-size:12px">' + d[1] + '</b></span><button class="ds-btn ds-btn-ghost btn-s" data-demo="Trocar designação">Trocar</button></div></div>').join('') + '</div></div>' +
    '</div><div class="acoes" style="justify-content:flex-end"><button class="ds-btn ds-btn-ghost" id="cf-desc">Descartar</button><button class="ds-btn ds-btn-primary tall" id="cf-salva">Salvar configurações</button></div>';
  $$('.sw').forEach(s => s.onclick = () => { s.classList.toggle('on'); if (s.dataset.sw) CFG_TIPOS[+s.dataset.i][s.dataset.sw] = s.classList.contains('on'); });
  $('#cf-salva').onclick = () => demo('Salvar configurações: ' + MOCK_MSG); $('#cf-desc').onclick = () => cfg(); $('#t-novo').onclick = () => demo('Novo tipo: ' + MOCK_MSG); $$('[data-demo]').forEach(b => b.onclick = () => demo(b.dataset.demo + ': ' + MOCK_MSG));
}

iniciar();
</script>
