<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/design-system.css">
<script src="/nav.js" defer></script>
<title>Promoções — Econômico Relatórios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EBEBE9; --surface:#FFFFFF; --surface-2:#E4E4E1;
  --border:#DADAD6; --border-strong:#C9C9C4;
  --ink:#0E1626; --ink-2:#4E5A72; --ink-3:#98A0B3;
  --brand:#F5B800; --brand-ink:#6B4E00;
  --font:'InterVar','Inter','Segoe UI',system-ui,-apple-system,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh}
.main{padding:24px}
.page-hdr{margin-bottom:18px}
.page-hdr h1{font-size:21px;font-weight:800;color:var(--ink)}
.page-hdr p{font-size:12px;color:var(--ink-3);margin-top:2px}

.painel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px 24px;box-shadow:0 1px 2px rgba(22,35,63,.04);text-align:center;max-width:640px}
.painel .tag{display:inline-block;background:#FFF6D9;color:var(--brand-ink);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:4px 10px;border-radius:999px;margin-bottom:14px}
.painel h2{font-size:16px;font-weight:800;margin-bottom:8px}
.painel p{font-size:13px;color:var(--ink-2);line-height:1.5}
</style>
</head>
<body class="ds">

<div class="main">
  <div class="page-hdr">
    <h1>Promoções</h1>
    <p>Planejamento e acompanhamento de promoções por produto e loja</p>
  </div>

  <div class="painel">
    <span class="tag">Em construção</span>
    <h2>As Promoções ainda estão sendo montadas</h2>
    <p>Esta tela vai concentrar as promoções dos produtos a partir dos dados do ERP. O escopo, as regras e as fontes de cada valor ainda serão definidos.</p>
  </div>
</div>

</body>
</html>
