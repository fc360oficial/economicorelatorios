<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/design-system.css">
<script src="/nav.js" defer></script>
<script src="/gente-ui.js"></script>
<title>Vagas e Quadro de Pessoal — DP / RH · Econômico Supermercados</title>
<!-- DP / RH › Vagas e Quadro de Pessoal (12/11/2026). Desligamento/transferência confirmados pelo RH, vaga em aberto (que aparece
     na escala como "VAGA EM ABERTO"), andamento, vínculo do substituto, quadro por unidade e setor e auditoria.
     Serviço em lib/vagas.js, rotas /api/vagas/*. Mesma casca das outras telas de DP / RH. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--font);background:var(--pap);color:var(--ink);min-height:100vh;font-size:13px}
.content{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:58px;background:var(--crd);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:40}
.topbar h1{font-size:16px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}.topbar h1 .crumb{color:var(--ink3);font-weight:600}.topbar h1 .ds-ic{color:var(--ink3)}
.topbar p{font-size:11.5px;color:var(--ink3);margin-top:1px}.topbar .end{margin-left:auto;display:flex;align-items:center;gap:12px}
.who{display:flex;align-items:center;gap:9px;font-size:12px}.who .ds-avatar{background:#101B33;color:#FFC933}.who b{display:block;font-size:12.5px}.who span{color:var(--ink3);font-size:11px}
.modnav{background:var(--crd);border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;align-items:stretch;padding:0 14px;position:sticky;top:58px;z-index:39}
.modnav a{display:flex;align-items:center;gap:6px;padding:0 12px;height:42px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;user-select:none;text-decoration:none}
.modnav a .ds-ic{width:15px;height:15px;color:var(--ink3)}.modnav a:hover{color:var(--ink)}.modnav a.on{color:var(--ink);border-bottom-color:var(--am)}.modnav a.on .ds-ic{color:var(--amk)}.modnav a.ext{margin-left:auto;color:var(--ink3)}
.page{padding:20px 24px 40px;max-width:1700px;width:100%}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:9px 10px;margin-bottom:16px}
.tb .ds-input,.tb .ds-select{height:34px;font-size:12.5px}.tb .end{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tb .lbl{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px}
.aviso{background:var(--amw);border:1px solid var(--am-ln);color:var(--amk);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.5}.aviso.neg{background:var(--negw);border-color:#F1B9C3;color:var(--neg)}.aviso.inf{background:var(--infw);border-color:var(--inf);color:var(--inf)}.aviso.pos{background:var(--posw);border-color:#9AD9B5;color:var(--pos)}
.note{font-size:11.5px;color:var(--ink3);line-height:1.5;margin:10px 2px 0}
.empty{padding:30px 20px;text-align:center;color:var(--ink3);font-size:12.5px;background:var(--crd);border:1px dashed var(--ln2);border-radius:var(--r-lg);margin-bottom:16px}.empty b{display:block;color:var(--ink2);font-size:13.5px;margin-bottom:3px}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--wsh) 25%,var(--ln) 50%,var(--wsh) 75%);background-size:200% 100%;animation:sk 1.3s ease infinite;margin:10px 14px}@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--posw);color:var(--pos)}.pill.bad{background:var(--negw);color:var(--neg)}.pill.warn{background:var(--amw);color:var(--amk)}.pill.info{background:var(--infw);color:var(--inf)}.pill.gr{background:var(--wsh);color:var(--ink2)}
.etq{display:inline-block;background:#101B33;color:#FFC933;font-weight:800;font-size:10px;padding:2px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}.etq.cd{background:var(--inf);color:#fff}
.kp{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:16px}.kp .k{background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:12px 14px}.kp .k .l{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;line-height:1.3}.kp .k .v{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:3px;font-variant-numeric:tabular-nums}.kp .k.neg .v{color:var(--neg)}.kp .k.am .v{color:var(--amk)}.kp .k.pos .v{color:var(--pos)}.kp .k.z .v{color:var(--ink3)}
.tw{overflow:auto;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);margin-bottom:16px}
table.t{width:100%;border-collapse:collapse;font-size:12px}table.t th{text-align:left;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);padding:8px 10px;background:var(--wsh);font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:1}table.t td{padding:7px 10px;border-top:1px solid var(--ln);color:var(--ink2);vertical-align:middle;white-space:normal;line-height:1.4}table.t th.r,table.t td.r{text-align:right}table.t th.c,table.t td.c{text-align:center;font-variant-numeric:tabular-nums}
table.t td b{color:var(--ink)}table.t td small{display:block;color:var(--ink3);font-size:10.5px}table.t tbody tr:hover td{background:var(--amw)}table.t td.nw{white-space:nowrap}table.t tr.lk{cursor:pointer}table.t tr.tot td{background:var(--wsh);font-weight:800;color:var(--ink)}table.t th small{display:block;font-weight:600;text-transform:none;letter-spacing:0;font-size:9.5px}
table.t td.neg{color:var(--neg);font-weight:800}table.t td.am{color:var(--amk);font-weight:800}table.t td.z{color:var(--ink3)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px;flex-wrap:wrap}.sec h2{font-size:14.5px;font-weight:800;letter-spacing:-.2px}.sec h2 small{color:var(--ink3);font-weight:600;margin-left:6px;font-size:11.5px}.sec .acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sec:first-child{margin-top:0}
.vgtag{display:inline-flex;align-items:center;gap:5px;color:#A3263A;font-weight:800;font-size:11px;background:#FDF1F3;border:1px solid #F1B9C3;border-radius:6px;padding:2px 7px;white-space:nowrap}.vgtag svg{width:13px;height:13px}
.cab{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.cab h3{font-size:15px;font-weight:800}.cab p{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.5}
.dts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.dts>div{background:var(--wsh);border-radius:8px;padding:8px 10px}.dts .l{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}.dts .v{font-size:13.5px;font-weight:800;margin-top:2px}.dts small{display:block;color:var(--ink3);font-size:10.5px;margin-top:1px;line-height:1.35}
.fluxo{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:10.5px;font-weight:700;color:var(--ink3)}.fluxo span{padding:3px 8px;border-radius:999px;background:var(--wsh)}.fluxo span.done{background:var(--posw);color:var(--pos)}.fluxo span.on{background:#101B33;color:#FFC933}.fluxo span.x{background:var(--negw);color:var(--neg)}.fluxo i{font-style:normal}
.hist{display:grid;gap:6px;max-height:260px;overflow:auto}.hist .h{display:grid;grid-template-columns:118px 1fr;gap:8px;font-size:11.5px;line-height:1.45;border-left:3px solid var(--ln2);padding:2px 0 2px 9px}.hist time{color:var(--ink3);font-variant-numeric:tabular-nums}.hist b{color:var(--ink)}.hist p{color:var(--ink2)}
.bts{display:flex;gap:8px;flex-wrap:wrap}
.f-ov{position:fixed;inset:0;background:rgba(10,17,32,.55);z-index:9000;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.f-md{background:var(--crd);color:var(--ink);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.f-md .hd{background:#101B33;color:#fff;padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.f-md .hd b{font-size:14px}.f-md .hd small{display:block;color:#B7C0D6;font-size:11.5px;font-weight:600;margin-top:2px}.f-md .x{background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1}
.f-md .bd{padding:14px 16px;display:grid;gap:10px}.f-md .row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end}.f-md .row.c2{grid-template-columns:1fr 1fr}.f-md .row.c3{grid-template-columns:repeat(3,1fr)}
.f-md label{font-size:11px;font-weight:700;color:var(--ink2);display:grid;gap:4px;align-content:start}.f-md label small{font-weight:500;color:var(--ink3)}.f-md input,.f-md select,.f-md textarea{padding:7px 9px;border:1px solid var(--ln2);border-radius:8px;font:inherit;font-size:12.5px;width:100%;background:var(--crd);color:var(--ink)}
.f-md label.chk{display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:12px;line-height:1.45;background:var(--amw);border:1px solid var(--am-ln);border-radius:8px;padding:9px 10px;color:var(--amk)}.f-md label.chk input{width:auto;margin-top:2px}
.f-md .acoes{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.f-md h4.st{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin:4px 0 -4px}.f-md .tw{margin-bottom:0}.f-md .aviso{margin-bottom:0}
@media(max-width:1599px){.page{padding:18px 20px 36px}}
@media(max-width:1399px){.kp{grid-template-columns:repeat(4,1fr)}}
@media(max-width:1199px){.topbar{padding:0 16px}.page{padding:16px}.modnav a .ds-ic{display:none}.modnav a.ext{margin-left:0}.dts{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.modnav{position:static;overflow-x:auto;flex-wrap:nowrap}.topbar{height:auto;padding:10px 14px;flex-wrap:wrap}.topbar .end{margin-left:0}.page{padding:12px}.kp{grid-template-columns:repeat(2,1fr)}.f-md .row,.f-md .row.c3{grid-template-columns:1fr 1fr}.f-ov{padding:10px 6px}.hist .h{grid-template-columns:1fr}}
</style>
</head>
<body class="dsnav-pad">
<div class="content">
  <header class="topbar"><div><h1 id="tb-h1"><span class="crumb">DP / RH</span></h1><p id="tb-sub"></p></div><div class="end"><div class="who" id="who"></div></div></header>
  <nav class="modnav" id="modnav"></nav>
  <div class="page" id="page"><div class="sk"></div><div class="sk" style="width:60%"></div></div>
</div>
<script>
const { $, $$, esc, api, toast } = G;
let ME = null, PAG = 'painel', SUB = { loja: '', status: 'abertas' };
const ic = n => '<svg class="ds-ic"><use href="/icons.svg#' + n + '"/></svg>';
const ICO_VAGA = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 1.6" aria-hidden="true"><circle cx="8" cy="5" r="3"/><path d="M2.5 14.2c.6-3 2.7-4.6 5.5-4.6s4.9 1.6 5.5 4.6"/></svg>';
const dt = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') + ' ' + new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';
const d1 = iso => iso ? iso.split('-').reverse().join('/') : '—';
const skel = () => '<div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div>';
const erroBox = e => '<div class="aviso neg">' + esc(e.message || e) + '</div>';
const post = (url, body) => api(url, { body });   // G.api já serializa o corpo e manda como JSON
const ST_COR = { aberta: 'bad', aguardando_autorizacao: 'warn', reposicao_autorizada: 'info', em_recrutamento: 'info', contratacao_em_andamento: 'info', preenchida: 'ok', cancelada: 'gr' };
const stPill = v => '<span class="pill ' + (ST_COR[v.status] || 'gr') + '">' + esc(v.statusTxt) + '</span>';
const lojaSel = (id, v, todas) => '<select class="ds-select" id="' + id + '">' + (todas ? '<option value="">Todas as unidades</option>' : '') + ME.lojas.map(l => '<option value="' + l.n + '"' + (String(v) === String(l.n) ? ' selected' : '') + '>' + esc(l.txt) + '</option>').join('') + '</select>';
const diasTxt = v => v.futura ? '<small style="display:inline;color:var(--ink3)">fica vaga em ' + d1(v.desde) + '</small>' : '<b' + (v.diasAberta >= 30 ? ' style="color:var(--neg)"' : v.diasAberta >= 7 ? ' style="color:var(--amk)"' : '') + '>' + v.diasAberta + ' dia(s)</b>';
const cobTxt = c => !c ? '—' : c.compromete ? '<span class="pill bad" title="' + esc(c.blocos + ' faixa(s) de 15 min abaixo do mínimo em ' + c.dias.length + ' dia(s), de ' + d1(c.de) + ' a ' + d1(c.ate) + ' · abertura ' + c.porTurno.abertura + ' · intermediário ' + c.porTurno.intermediario + ' · fechamento ' + c.porTurno.fechamento) + '">compromete o mínimo</span>' : c.avaliavel ? '<span class="pill ok">mínimo mantido</span>' : '<span class="pill gr" title="' + (c.semMinimo ? 'O setor não tem mínimo de cobertura cadastrado' : 'Não há escala gravada para o período') + '">não avaliável</span>';
function dlg({ titulo, sub, corpo, okTxt, largura, ok, perigo }) {
  const ov = document.createElement('div'); ov.className = 'f-ov';
  ov.innerHTML = '<div class="f-md" style="max-width:' + (largura || 640) + 'px"><div class="hd"><div><b>' + esc(titulo) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div><button class="x" type="button">×</button></div><div class="bd">' + corpo + '<div id="d-msg"></div><div class="acoes"><button class="ds-btn ds-btn-ghost" id="d-c" type="button">' + (ok ? 'Cancelar' : 'Fechar') + '</button>' + (ok ? '<button class="ds-btn ' + (perigo ? 'ds-btn-danger' : 'ds-btn-primary') + '" id="d-ok" type="button">' + esc(okTxt || 'Confirmar') + '</button>' : '') + '</div></div></div>';
  document.body.appendChild(ov); const fechar = () => ov.remove(); ov.fechar = fechar; ov.querySelector('.x').onclick = fechar; ov.querySelector('#d-c').onclick = fechar;
  if (ok) ov.querySelector('#d-ok').onclick = async () => { const b = ov.querySelector('#d-ok'); b.disabled = true; try { const r = await ok(ov); if (r !== false) fechar(); else b.disabled = false; } catch (e) { ov.querySelector('#d-msg').innerHTML = '<div class="aviso neg">' + esc(e.message) + '</div>'; b.disabled = false; } };
  return ov;
}
const justCampo = rot => '<label>' + esc(rot || 'Justificativa') + ' <small>(obrigatória — fica na auditoria com seu nome, data e hora)</small><textarea id="d-just" rows="3"></textarea></label>';
const NAV = [{ id: 'painel', txt: 'Painel', ic: 'alert', sub: 'Vagas em aberto, o que o ponto mostra e ainda espera o RH, e o que pede providência' }, { id: 'vagas', txt: 'Vagas', ic: 'list', sub: 'Todas as vagas, com a situação e o andamento de cada uma' },
  { id: 'saidas', txt: 'Desligamentos e transferências', ic: 'logout', sub: 'Movimentos confirmados pelo RH: data contratual, último dia trabalhado, aviso prévio e reposição' }, { id: 'quadro', txt: 'Quadro de pessoal', ic: 'users', sub: 'Quadro autorizado, efetivo, vagas e cobertura por unidade e setor' }, { id: 'auditoria', txt: 'Auditoria', ic: 'shield', sub: 'Quem fez o quê, quando, com que justificativa, antes e depois' }];
function ir(p) { const n = NAV.find(x => x.id === p) || NAV[0]; PAG = n.id; $$('#modnav a[data-p]').forEach(a => a.classList.toggle('on', a.dataset.p === PAG));
  $('#tb-h1').innerHTML = '<span class="crumb">DP / RH · Vagas e Quadro de Pessoal</span>' + ic('chevron-right') + esc(n.txt); $('#tb-sub').textContent = n.sub; history.replaceState(null, '', location.pathname + '#' + PAG); $('#page').innerHTML = skel();
  ({ painel, vagas: vagasPg, saidas, quadro, auditoria })[PAG](); }
const recarregar = () => ir(PAG);
async function iniciar() {
  try { ME = await api('/api/vagas/me'); } catch (e) { $('#page').innerHTML = erroBox(e); return; }
  const nav = NAV.filter(n => (n.id !== 'auditoria' || ME.veAuditoria) && (n.id !== 'quadro' || ME.veQuadro));
  $('#modnav').innerHTML = nav.map(n => '<a data-p="' + n.id + '">' + ic(n.ic) + '<span>' + esc(n.txt) + '</span></a>').join('') + '<a class="ext" href="/escalas.html">' + ic('calendar') + '<span>Escalas</span></a><a class="ext" href="/gestao-pessoas.html" style="margin-left:0">' + ic('users') + '<span>Gestão de Pessoas</span></a>'; $$('#modnav a[data-p]').forEach(a => a.onclick = () => ir(a.dataset.p));
  $('#who').innerHTML = '<span class="ds-avatar">' + esc((ME.nome || ME.usuario).slice(0, 2).toUpperCase()) + '</span><div><b>' + esc(ME.nome || ME.usuario) + '</b><span>' + esc(ME.papeis.join(' · ')) + '</span></div>';
  const h = location.hash.slice(1); if (h.startsWith('vaga=')) { ir('vagas'); vagaDlg(h.slice(5)); } else ir(nav.some(n => n.id === h) ? h : 'painel');
}

// ── Painel ───────────────────────────────────────────────────────────────────────────────────────────────
const tabVagas = (l, comCob) => l.length ? '<div class="tw"><table class="t"><thead><tr><th>Vaga</th><th>Unidade</th><th>Setor · cargo</th><th>Turno de referência</th><th>Era de</th><th>Aberta em</th><th>Sem ocupante</th><th>Situação</th>' + (comCob ? '<th>Cobertura (7 dias)</th>' : '') + '<th></th></tr></thead><tbody>' +
  l.map(v => '<tr class="lk" data-v="' + v.id + '"><td class="nw"><span class="vgtag">' + ICO_VAGA + esc(v.id) + '</span></td><td class="nw">' + esc(v.lojaTxt) + '</td><td><b>' + esc(v.setorTxt) + '</b><small>' + esc(v.cargo || '—') + (v.tipo === 'ampliacao' ? ' · ampliação' : '') + '</small></td><td class="nw">' + esc(v.turnoRef ? v.turnoRef.texto : '—') + (v.turnoRef && v.turnoRef.classeTxt ? '<small>' + esc(v.turnoRef.classeTxt) + '</small>' : '') + '</td><td>' + esc(v.ocupanteAnterior ? v.ocupanteAnterior.nome : '—') + '</td><td class="nw">' + d1(v.abertaEm) + '</td><td class="nw">' + diasTxt(v) + '</td><td class="nw">' + stPill(v) + (v.substituto ? '<small>' + esc(v.substituto.nome) + ' · início ' + d1(v.substituto.inicio) + '</small>' : !v.autorizada && !['preenchida', 'cancelada'].includes(v.status) ? '<small>sem autorização</small>' : '') + (v.revisar ? '<small style="color:var(--neg)">revisar</small>' : '') + '</td>' + (comCob ? '<td class="nw">' + cobTxt(v.cobertura) + (v.candidatos ? '<small>' + v.candidatos + ' compatível(is) no ponto</small>' : '') + '</td>' : '') + '<td class="nw"><a class="ds-btn ds-btn-secondary">Abrir</a></td></tr>').join('') + '</tbody></table></div>' : '';
const ligarVagas = () => $$('#page tr[data-v]').forEach(tr => tr.onclick = () => vagaDlg(tr.dataset.v));
async function painel() {
  let P; try { P = await api('/api/vagas/painel'); } catch (e) { $('#page').innerHTML = erroBox(e); return; } const k = P.kpis;
  const kpi = (l, v, cls) => '<div class="k ' + (v ? cls : 'z') + '"><div class="l">' + l + '</div><div class="v">' + v + '</div></div>';
  $('#page').innerHTML = '<div class="kp">' + kpi('Vagas em aberto', k.emAberto, 'neg') + kpi('Aguardando autorização', k.aguardandoAutorizacao, 'am') + kpi('Em recrutamento', k.emRecrutamento, '') + kpi('Contratação em andamento', k.contratacao, '') + kpi('Comprometem a cobertura', k.comprometemCobertura, 'neg') + kpi('30 dias ou mais sem reposição', k.maisDe30, 'neg') + kpi('Preenchidas · 90 dias', k.preenchidas90, 'pos') + '</div>' +
    '<div class="sec"><h2>Vagas em aberto<small>' + P.vagas.length + '</small></h2><div class="acoes">' + (ME.ehRH ? '<a class="ds-btn ds-btn-primary" id="p-novo">Registrar desligamento ou transferência</a>' : '') + '</div></div>' + (tabVagas(P.vagas, true) || '<div class="empty"><b>Nenhuma vaga em aberto</b>Quando o RH confirma um desligamento com reposição necessária, a vaga nasce aqui e aparece na escala da unidade.</div>') +

      ls.map(l => '<tr><td><b>' + esc(l.setor) + '</b><small>' + esc(l.funcoes.slice(0, 3).map(f => f.n + ' ' + f.cargo).join(' · ')) + '</small></td>' + n(l.autorizado) + n(l.ativos) + n(l.saidasConfirmadas, 'am') + n(l.efetivo) + n(l.deficitQuadro, 'neg') + n(l.ausenciaTemporaria, 'am') + n(l.vagasAbertas, 'neg') + n(l.emRecrutamento) + n(l.preenchidas) + cob(l.cobertura) + '</tr>').join('') +
      '<tr class="tot"><td>Total da unidade</td>' + n(u.autorizado) + n(u.ativos) + n(u.saidasConfirmadas) + n(u.efetivo) + n(u.deficitQuadro) + n(u.ausenciaTemporaria) + n(u.vagasAbertas) + n(u.emRecrutamento) + n(u.preenchidas) + '<td></td></tr></tbody></table></div>'; }).join('') + '<p class="note">' + esc(Q.nota) + '</p>';

  let A; try { A = await api('/api/vagas/auditoria?loja=' + SUB.loja); } catch (e) { $('#page').innerHTML = erroBox(e); return; }
  const res = v => v == null ? '' : Object.entries(v).filter(([, x]) => x != null && typeof x !== 'object').map(([k, x]) => k + ': ' + (/^\d{4}-\d{2}-\d{2}$/.test(String(x)) ? d1(x) : x)).join(' · ');
  $('#page').innerHTML = '<div class="tb"><span class="lbl">Unidade</span>' + lojaSel('f-loja', SUB.loja, true) + '<div class="end"><span class="pill ' + (A.cadeia.ok ? 'ok' : 'bad') + '">' + (A.cadeia.ok ? 'Trilha íntegra · ' + A.cadeia.registros + ' registro(s)' : 'Trilha adulterada no registro ' + A.cadeia.quebradaEm) + '</span></div></div>' +
    (A.registros.length ? '<div class="tw"><table class="t"><thead><tr><th>Quando</th><th>Responsável</th><th>Ação</th><th>Referência</th><th>Justificativa</th><th>Antes → depois</th></tr></thead><tbody>' + A.registros.map(r => '<tr><td class="nw">' + dt(r.em) + '</td><td><b>' + esc(r.nome) + '</b><small>' + esc((r.papeis || []).join(' · ')) + '</small></td><td>' + esc(r.acao.replace(/_/g, ' ')) + '</td><td class="nw">' + esc(r.ref || '') + (r.funcionario ? '<small>' + esc(r.funcionario) + '</small>' : '') + '</td><td>' + esc(r.justificativa || '') + '</td><td><small style="color:var(--ink2)">' + esc(res(r.antes)) + (r.antes && r.depois ? ' → ' : '') + esc(res(r.depois)) + '</small></td></tr>').join('') + '</tbody></table></div>' : '<div class="empty"><b>Nenhum registro ainda</b></div>') +
    '<p class="note">A trilha só acrescenta: cada linha leva o código da anterior, e qualquer alteração ou exclusão quebra a cadeia e aparece aqui.</p>';
  $('#f-loja').onchange = () => { SUB.loja = $('#f-loja').value; auditoria(); };
}
window.addEventListener('hashchange', () => { if (!ME) return; const h = location.hash.slice(1); if (h.startsWith('vaga=')) vagaDlg(h.slice(5)); else if (h !== PAG && NAV.some(n => n.id === h)) ir(h); });
iniciar();
</script>
