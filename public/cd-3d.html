<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CD em 3D — CAHU Distribuidora</title>
<!--
  CD em 3D (03/11/2026, Tiago: "desenhar meus dados do CD em um mundo 3d ... clientes, produtos, pedidos chegando,
  pedidos saindo ... cada objeto clicável abre um cartão de vidro com os meus números reais").
  Dados: /api/cahu-distribuidora/mundo-3d = os 6 blocos do Dashboard Distribuidora (mesmo cache e mesmas regras,
  lib/dashboard-distribuidora.js), só leitura. ?demo=1 = dados de exemplo (TESTE).
  Mapa da cena:
    centro .......... armazém do CD (vidro) com 1 rack por grupo de estoque (pallet vermelho = parado 60+ dias)
    telhado ......... barras do faturamento dos últimos 6 meses · placar com hoje e mês
    céu ............. carrossel com os produtos que mais venderam em 30 dias
    frente .......... Expedição (painel do CD: separação → liberado) · caminhões = NF-e/NFC-e de hoje indo pro cliente
    fundo ........... Recebimento (conferência das notas de fornecedor) · caminhões dos fornecedores na doca
    esquerda ........ torre do Televendas + 1 pilar por vendedor · esferas = pedidos sem NF-e vindo dos clientes
    direita ......... cofre do Financeiro + pilhas de moedas dos boletos vencidos por idade
    frente-direita .. zona de risco: rupturas da Tabela Retirada e lotes vencendo
    anel externo .... cidades com os clientes do mês (altura = compra no mês; cinza = sumidos 30+ dias)
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--tx:#EAF0FF;--tx2:#A9B4CC;--tx3:#7D89A3;--amb:#F5B800;--pos:#34D27B;--neg:#FF5D78;--vid:rgba(16,24,42,.52);--ln:rgba(255,255,255,.16)}
body{background:#070C17;color:var(--tx);font-family:'InterVar','Segoe UI',sans-serif;overflow:hidden;font-variant-numeric:tabular-nums}
#mundo{position:relative;height:100vh;overflow:hidden;background:#070C17}
@media(max-width:820px){#mundo{height:calc(100vh - 96px)}}
#mundo canvas{display:block;outline:none;touch-action:none}
.rotulos{position:absolute;inset:0;pointer-events:none;z-index:1}   /* z-index cria o contexto: o CSS2DRenderer põe z-index alto em cada rótulo */
.vidro{background:linear-gradient(140deg,rgba(255,255,255,.13),rgba(255,255,255,.035) 60%);background-color:var(--vid);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--ln);box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22)}
button{font-family:inherit}

/* HUD */
#hud{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:12px;align-items:flex-start;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.marca{border-radius:14px;padding:10px 14px;min-width:190px}
.marca b{display:block;font-size:14px;font-weight:800;letter-spacing:-.2px}
.marca span{font-size:11px;color:var(--tx2)}
.marca .st{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:10.5px;color:var(--tx3)}
.marca .st i{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 8px var(--pos)}
.marca .st.demo i{background:var(--amb);box-shadow:0 0 8px var(--amb)}
.marca .st.demo{color:var(--amb);font-weight:700}
#kpis{display:flex;gap:8px;flex:1;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#kpis::-webkit-scrollbar{display:none}
.kpi{border-radius:13px;padding:8px 13px;min-width:132px;cursor:pointer;text-align:left;color:var(--tx);transition:transform .15s,border-color .15s}
.kpi:hover{transform:translateY(-2px);border-color:rgba(245,184,0,.55)}
.kpi-mais{display:none}   /* só aparece no celular */
/* nomes flutuantes desligados por padrão (Tiago, 03/11: "muito nome, não dá pra ver a maquete"); botão Nomes liga */
.rotulos.sem-nomes .rot{display:none}
.kpi .l{font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:6px}
.kpi .l i{width:7px;height:7px;border-radius:2px}
.kpi .v{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-top:2px;white-space:nowrap}
.kpi .s{font-size:10.5px;color:var(--tx2);white-space:nowrap}
.pos{color:var(--pos)!important}.neg{color:var(--neg)!important}.amb{color:var(--amb)!important}
.acoes{display:flex;gap:6px;flex-direction:column}
.bt{border-radius:10px;padding:7px 12px;font-size:11.5px;font-weight:700;color:var(--tx);cursor:pointer;white-space:nowrap}
.bt:hover{border-color:rgba(245,184,0,.6)}
.bt.on{color:#1b1400;background:var(--amb);border-color:var(--amb)}

#legenda{position:absolute;left:14px;bottom:14px;border-radius:14px;padding:10px 8px;z-index:5;display:flex;flex-direction:column;gap:1px;max-height:calc(100% - 140px);overflow:auto}
#legenda .t{font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);padding:0 8px 5px}
#legenda button{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--tx2);font-size:11.5px;font-weight:600;padding:5px 8px;border-radius:8px;cursor:pointer;text-align:left}
#legenda button:hover{background:rgba(255,255,255,.08);color:var(--tx)}
#legenda button i{width:9px;height:9px;border-radius:3px;flex-shrink:0}
#dica{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--tx3);background:rgba(7,12,23,.55);padding:5px 12px;border-radius:99px;z-index:4;pointer-events:none;white-space:nowrap}

/* rótulos 3D (CSS2D) — o renderer escreve o transform, não usar transform aqui */
.rot{font-size:10.5px;font-weight:700;color:var(--tx);background:rgba(9,15,29,.62);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:3px 9px;border-radius:99px;white-space:nowrap;letter-spacing:.1px}
.rot small{font-weight:600;color:var(--tx2);margin-left:5px}
.rot.zona{font-size:11.5px;padding:5px 11px;border-color:rgba(255,255,255,.22)}
.rot.zona i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.rot.min{font-size:9.5px;padding:2px 7px;background:rgba(9,15,29,.5)}
.rot.clic{pointer-events:auto;cursor:pointer}
.rot.clic:hover{border-color:var(--amb)}
.rot.placar{padding:10px 18px;border-radius:16px;text-align:center;background:rgba(9,15,29,.55);border-color:rgba(245,184,0,.45);box-shadow:0 0 30px rgba(245,184,0,.18)}
.rot.placar .l{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--tx3);font-weight:800}
.rot.placar .v{font-size:22px;font-weight:800;color:var(--amb);letter-spacing:-.4px;line-height:1.15}
.rot.placar .s{font-size:10.5px;color:var(--tx2);font-weight:600}

/* tooltip do hover */
#tip{position:absolute;z-index:6;pointer-events:none;border-radius:10px;padding:6px 10px;font-size:11.5px;font-weight:700;max-width:280px}
#tip small{display:block;font-weight:600;color:var(--tx2);font-size:10.5px;margin-top:1px}

/* cartão de vidro */
#cartao{position:absolute;top:126px;right:14px;width:390px;max-height:calc(100% - 140px);overflow:auto;border-radius:20px;padding:18px 18px 16px;z-index:7;opacity:0;transform:translateX(24px) scale(.98);transition:opacity .22s,transform .22s;pointer-events:none;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
#cartao.on{opacity:1;transform:none;pointer-events:auto}
#cartao:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;border-radius:20px 20px 0 0;background:var(--cor,#F5B800);box-shadow:0 0 18px var(--cor,#F5B800)}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.c-zona{font-size:9.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--cor,#F5B800)}
.c-x{background:rgba(255,255,255,.08);border:1px solid var(--ln);color:var(--tx);width:28px;height:28px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1}
.c-x:hover{background:rgba(255,255,255,.16)}
#cartao h2{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-top:6px;line-height:1.25}
.c-sub{font-size:11.5px;color:var(--tx2);margin-top:3px;line-height:1.45}
.c-hero{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.c-hero .v{font-size:27px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.c-hero .l{font-size:10.5px;color:var(--tx2);font-weight:600;margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.c-var{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.08)}
.c-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.c-t{padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
.c-t .v{font-size:14.5px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-t .l{font-size:9.5px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.c-sec{font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);margin:14px 0 6px}
.c-lista{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.c-li{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:7px 11px;font-size:11.5px;background:rgba(255,255,255,.03)}
.c-li:nth-child(even){background:rgba(255,255,255,.055)}
.c-li .a{color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.c-li .a small{color:var(--tx3);margin-left:5px;font-weight:600}
.c-li .b{font-weight:800;white-space:nowrap}
.c-barra{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden;display:flex}
.c-barra i{display:block;height:100%}
.c-nota{font-size:10.5px;color:var(--tx3);margin-top:12px;line-height:1.5}
.c-nota a{color:var(--amb);font-weight:700}

/* estilos de dia (Maquete, Brinquedo): vidro claro e texto escuro */
body.claro{--tx:#152033;--tx2:#4E5A72;--tx3:#6E7891;--vid:rgba(255,255,255,.6);--ln:rgba(20,32,51,.14);--pos:#138A4E;--neg:#C22F49;--amb:#9A6C00}
body.claro,body.claro #mundo{background:#E9ECF1}
body.claro .vidro{background:linear-gradient(140deg,rgba(255,255,255,.75),rgba(255,255,255,.45));box-shadow:0 14px 40px rgba(20,32,51,.16),inset 0 1px 0 rgba(255,255,255,.9)}
body.claro .rot{background:rgba(255,255,255,.82);color:#152033;border-color:rgba(20,32,51,.14)}
body.claro .rot.placar{background:rgba(255,255,255,.85);border-color:rgba(154,108,0,.4);box-shadow:0 8px 24px rgba(20,32,51,.15)}
body.claro .c-hero,body.claro .c-t,body.claro .c-li{background:rgba(255,255,255,.55);border-color:rgba(20,32,51,.08)}
body.claro .c-li:nth-child(even){background:rgba(255,255,255,.8)}
body.claro .c-x{background:rgba(20,32,51,.06)}
body.claro #dica{background:rgba(255,255,255,.7)}
body.claro #legenda button:hover{background:rgba(20,32,51,.06)}
body.claro .bt.on{color:#1b1400}
#estilo{border-radius:10px;padding:7px 10px;font-size:11.5px;font-weight:700;color:var(--tx);cursor:pointer;font-family:inherit;outline:none}
#estilo option{color:#152033;background:#fff}
.ic{width:14px;height:14px;vertical-align:-2px;margin-right:6px;flex-shrink:0}
.kpi .l .ic{width:12px;height:12px;margin-right:0}
#carregando{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;pointer-events:none}
#carregando .box{border-radius:16px;padding:16px 22px;text-align:center;max-width:340px;pointer-events:auto}
#carregando b{display:block;font-size:14px}
#carregando span{font-size:11.5px;color:var(--tx2);display:block;margin-top:4px;line-height:1.5}
#carregando .gira{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--amb);margin:0 auto 10px;animation:g 1s linear infinite}
#carregando .bt{margin-top:10px}
@keyframes g{to{transform:rotate(360deg)}}

/* monitores menores (regra: 1920 igual, 1599/1399/1199 apertam) */
@media(max-width:1599px){.kpi{min-width:120px;padding:7px 11px}.kpi .v{font-size:15.5px}#cartao{width:360px}}
@media(max-width:1399px){.kpi{min-width:110px}.kpi .v{font-size:14.5px}.kpi .s{display:none}.marca{min-width:0}#legenda button{font-size:11px;padding:4px 7px}}
@media(max-width:1199px){.marca span,.marca .st{display:none}#cartao{width:340px}}
@media(max-width:820px){
  #hud{top:8px;left:8px;right:8px;flex-wrap:wrap;gap:6px}
  /* KPIs: grade de 2 colunas, só os 4 primeiros até tocar em Ver todos */
  #kpis{display:grid!important;grid-template-columns:1fr 1fr;gap:6px;overflow:visible}
  #kpis .kpi{min-width:0;padding:7px 10px;border-radius:11px}
  #kpis .kpi .l{font-size:9px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #kpis .kpi .v{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #kpis .kpi .s{display:none}
  #kpis .kpi:nth-child(n+5):not(.kpi-mais){display:none}
  #kpis.todos .kpi:nth-child(n+5){display:block}
  .kpi-mais{display:block;grid-column:1/-1;text-align:center!important;font-size:11px;font-weight:700;padding:6px!important;color:var(--tx2)!important}
  .kpi:hover{transform:none}
  /* botões numa linha só: estilo ocupa o que sobrar */
  .acoes{order:1;width:100%;flex-direction:row;margin-left:0!important;gap:6px}
  .acoes .bt{padding:6px 9px;font-size:11px}
  #estilo{flex:1;min-width:0;padding:6px 8px;font-size:11px}
  .rot.zona small{display:none}
  .marca{display:none}
  #kpis{order:2;width:100%;flex:none}
  .acoes{flex-direction:row;margin-left:auto}
  #legenda{display:none}
  #dica{display:none}
  #cartao{top:auto;bottom:0;right:0;left:0;width:auto;max-height:62%;border-radius:20px 20px 0 0;transform:translateY(30px)}
}
</style>

<body>
<div id="mundo">
  <div id="hud">
    <div class="marca vidro"><b>CAHU Distribuidora</b><span>CD em 3D · loja 10</span><div class="st" id="st"><i></i><span>carregando…</span></div></div>
    <div id="kpis"></div>
    <div class="acoes">
      <button class="bt vidro" id="b-visao" title="Volta pra visão de cima do CD inteiro">Visão geral</button>
      <button class="bt vidro" id="b-nomes" title="Mostra ou esconde os nomes em cima dos objetos (o nome sempre aparece ao passar o mouse ou tocar)">Nomes</button>
      <button class="bt vidro on" id="b-girar" title="Liga/desliga a câmera girando sozinha">Girar</button>
      <select id="estilo" class="vidro" title="Estilo visual do mundo (fica guardado neste navegador)"></select>
      <button class="bt vidro" id="b-atual" title="Busca os números de novo (o servidor guarda por 5 min)">Atualizar</button>
    </div>
  </div>
  <div id="legenda" class="vidro"></div>
  <div id="dica">Arraste pra girar · botão direito move · roda aproxima · clique em qualquer objeto</div>
  <div id="tip" class="vidro" hidden></div>
  <aside id="cartao" class="vidro" aria-live="polite"></aside>
  <div id="carregando"><div class="box vidro"><div class="gira"></div><b>Montando o CD em 3D…</b><span>Buscando faturamento, clientes, pedidos, estoque, expedição e financeiro no ERP. Na primeira vez do dia pode levar até 1 minuto.</span></div></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ── utilidades ──────────────────────────────────────────────────────────────────────────────────────
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, d = 0) => (+v || 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const brl = v => 'R$ ' + nf(v, 2);
const brlC = v => { v = +v || 0; const a = Math.abs(v); return a >= 1e6 ? 'R$ ' + nf(v / 1e6, 2) + ' mi' : a >= 1e4 ? 'R$ ' + nf(v / 1e3, 1) + ' mil' : 'R$ ' + nf(v, 0); };
const pctT = v => v == null ? '—' : nf(v, 1) + '%';
const varT = v => v == null ? '' : (v >= 0 ? '+' : '') + nf(v, 1) + '%';
const varC = v => v == null ? '' : v >= 0 ? 'pos' : 'neg';
const dBR = s => s ? String(s).slice(0, 10).split('-').reverse().join('/') : '—';
const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const mesT = m => { const [a, b] = String(m || '').split('-'); return b ? MES[+b - 1] + '/' + a.slice(2) : m; };
const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; };
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
const arr = a => Array.isArray(a) ? a : [];
const primeiro = s => String(s || '').trim().split(/\s+/)[0] || '—';
const hx = c => '#' + c.toString(16).padStart(6, '0');

const COR = { amb: 0xF5B800, teal: 0x2BD4C0, azul: 0x4C8DFF, roxo: 0x9B7BFF, verde: 0x34D27B, verm: 0xFF4D6A, lar: 0xFF8A3D, cinza: 0x56627A, rosa: 0xFF5FA2, ceu: 0x7FD3FF };
const GRUPO = [COR.amb, COR.teal, COR.azul, COR.roxo, COR.lar, COR.verde, COR.rosa, COR.ceu];
const ZONAS = {
  cd:    { nome: 'CD e estoque',  cor: COR.amb,  pos: [0, 4, 0],     dist: 70 },
  prod:  { nome: 'Produtos que mais saem', cor: COR.ceu, pos: [0, 30, 0], dist: 80 },
  exp:   { nome: 'Expedição',      cor: COR.verde, pos: [0, 0, 37],   dist: 50 },
  rec:   { nome: 'Recebimento',    cor: COR.teal, pos: [0, 0, -37],  dist: 55 },
  tv:    { nome: 'Televendas',     cor: COR.roxo, pos: [-42, 8, -2], dist: 55 },
  fin:   { nome: 'Financeiro',     cor: COR.amb,  pos: [42, 4, -2],  dist: 50 },
  risco: { nome: 'Zona de risco',  cor: COR.verm, pos: [56, 0, -54], dist: 42 },
  cli:   { nome: 'Clientes',       cor: COR.azul, pos: [0, 0, 80],   dist: 200 },
  fat:   { nome: 'Faturamento',    cor: COR.amb,  pos: [0, 14, 0],   dist: 70 },
  cheg:  { nome: 'A caminho do CD', cor: COR.lar, pos: [0, 0, -120], dist: 75 },
};
const ZONAS_DIO = {
  cd:    { nome: 'CD e estoque',   cor: COR.azul, pos: [-10, 6, -15], dist: 90 },
  fat:   { nome: 'Faturamento',    cor: COR.amb,  pos: [0, 16, -62],  dist: 60 },
  prod:  { nome: 'Produtos que mais saem', cor: COR.ceu, pos: [8, 2, 14], dist: 60 },
  exp:   { nome: 'Expedição',      cor: COR.verde, pos: [0, 2, 6],    dist: 55 },
  rec:   { nome: 'Recebimento',    cor: COR.roxo, pos: [45, 4, -15],  dist: 55 },
  tv:    { nome: 'Televendas',     cor: COR.verde, pos: [66, 14, -64], dist: 55 },
  fin:   { nome: 'Financeiro',     cor: COR.amb,  pos: [-52, 6, -64], dist: 55 },

  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  x.fillStyle = '#E8B930'; x.fillRect(0, 0, 128, 128); x.strokeStyle = '#B88A12'; x.lineWidth = 8; x.beginPath(); x.arc(64, 64, 54, 0, Math.PI * 2); x.stroke();
  x.fillStyle = '#8A6608'; x.font = 'bold 52px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('R$', 64, 68);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

function diorama(d, ps, notas) {
  const fat = d.faturamento, cli = d.clientes, tv = d.televendas, est = d.estoque, exp = d.expedicao, fin = d.financeiro;
  const ocupado = [];   // retângulos [x1, z1, x2, z2] onde não nasce árvore
  const reserva = (x1, z1, x2, z2) => ocupado.push([x1, z1, x2, z2]);

  // placa
  const placa = new THREE.Mesh(new THREE.BoxGeometry(240, 6, 240), [pm(DP.placaLado), pm(DP.placaLado), pm(DP.placa), pm(DP.placaLado), pm(DP.placaLado), pm(DP.placaLado)]);
  placa.position.y = -3; placa.receiveShadow = true; M.add(placa);

  // ruas: avenida da frente (z = 52), rua da esquerda (x = -78), acesso do pátio de caminhões e rua dos fornecedores (z = -15, lado direito)
  const asfalto = pm(DP.asfalto), faixa = pm(DP.faixa);
  const ruaReta = (x1, z1, x2, z2, larg) => {
    const hor = Math.abs(x2 - x1) > Math.abs(z2 - z1), len = hor ? Math.abs(x2 - x1) : Math.abs(z2 - z1);
    const r = em(caixa(hor ? len : larg, 0.12, hor ? larg : len, asfalto, false), (x1 + x2) / 2, 0, (z1 + z2) / 2); r.receiveShadow = true; M.add(r);
    for (let s = 3; s < len - 3; s += 9) M.add(em(caixa(hor ? 4 : 0.35, 0.05, hor ? 0.35 : 4, faixa, false), hor ? Math.min(x1, x2) + s + 2 : x1, 0.12, hor ? z1 : Math.min(z1, z2) + s + 2));
    reserva(Math.min(x1, x2) - larg / 2 - 2, Math.min(z1, z2) - larg / 2 - 2, Math.max(x1, x2) + larg / 2 + 2, Math.max(z1, z2) + larg / 2 + 2);
  };
  ruaReta(-120, 52, 120, 52, 9); ruaReta(-78, -118, -78, 47.5, 9); ruaReta(72, 36, 72, 47.5, 8); ruaReta(48, -15, 120, -15, 8);

  // 1 ─ galpão do CD
  const GX = 0, GZ = -15, GW = 56, GD = 32, GH = 14;
  M.add(em(caixa(GW + 6, 0.4, GD + 10, pm(0xE6E3DC), false), GX, 0, GZ + 3));
  const galpao = em(caixa(GW, GH, GD, pm(DP.galpao)), GX, 0.4, GZ); M.add(galpao);
  M.add(em(caixa(GW + 1.2, 1, GD + 1.2, pm(DP.galpaoTeto)), GX, GH + 0.4, GZ));
  const solar = pm(DP.solar, { r: 0.35, m: 0.4 }), moldura = new THREE.LineBasicMaterial({ color: 0x9FB0FF, transparent: true, opacity: 0.55 });
  const gPainel = new THREE.BoxGeometry(7, 0.35, 5.2), ePainel = new THREE.EdgesGeometry(gPainel);
  for (let i = 0; i < 6; i++) for (let j = 0; j < 4; j++) {
    const p = new THREE.Mesh(gPainel, solar); p.position.set(GX - 21.5 + i * 8.6, GH + 1.9, GZ - 10.5 + j * 7); p.rotation.x = -0.18; p.castShadow = true; M.add(p);
    p.add(new THREE.LineSegments(ePainel, moldura));

  clicavel(galpao, { nome: 'CAHU Distribuidora · CD', sub: fat ? 'mês ' + brlC(fat.mesAtual.v) : '', card: CARDS.cd, dist: 90, alt: 7 });
  { const r = zonaRot('cd', 'CAHU Distribuidora', 'CD · loja 10'); r.position.set(GX, GH + 6, GZ + 6); M.add(r); }
  reserva(GX - GW / 2 - 4, GZ - GD / 2 - 4, GX + GW / 2 + 22, 22);

  // 2 ─ expedição: uma porta por etapa e a pilha de caixas na frente
  if (exp) {
    const cxG = new THREE.BoxGeometry(1.5, 1.3, 1.5); cxG.translate(0, 0.65, 0);
    arr(exp.etapas).slice(0, 5).forEach((e, i) => {
      const cor = ETAPA_COR[e.k] || COR.cinza, x = GX - 22 + i * 11, g = new THREE.Group(); g.position.set(x, 0.4, GZ + GD / 2); M.add(g);
      g.add(em(caixa(6.4, 7, 0.3, pm(0x1F2650)), 0, 0, 0.15));
      for (let k = 0; k < 6; k++) g.add(em(caixa(6.4, 0.08, 0.35, pm(0x39407A), false), 0, 1 + k * 1.1, 0.15));
      const luz = em(caixa(6.4, 0.7, 0.4, pm(cor, { e: cor, ei: 0.35 })), 0, 7.2, 0.2); g.add(luz);
      const piso = em(caixa(8, 0.1, 8, pm(cor, { op: 0.28 }), false), 0, 0, 5); g.add(piso);
      g.add(em(caixa(5.2, 0.25, 5.2, pm(DP.madeira)), 0, 0.1, 5));

      if (e.k === 'reconferir' && e.n > 0) { const m = luz.material = mat(cor, { e: cor, ei: 0.4 }); anims.push(t => { m.emissiveIntensity = 0.3 + Math.abs(Math.sin(t * 3)) * 1.2; }); }
      const r = rotulo(`${esc(e.nome)} <small>${nf(e.n)}</small>`, 'min'); r.position.set(0, 9, 4); g.add(r);

    const r = zonaRot('exp', 'Expedição', nf(exp.emAberto) + ' em aberto'); r.position.set(GX - 30, 4, GZ + GD / 2 + 7); M.add(r); rotCidade.push(r);

  // 3 ─ esteira com os produtos que mais saem (cada caixa é um produto do top 30 dias)
  {
    const z = 13.5, x1 = -27, x2 = 44, L = x2 - x1;

    for (let x = x1 + 2; x < x2; x += 6) M.add(em(caixa(0.3, 1.5, 3, pm(0x6B7385)), x, 0, z));
    const max = Math.max(...ps.map(p => p.v30 || 0), 1);
    ps.slice(0, 10).forEach((p, i, a) => {
      const s = 1.3 + 1.3 * Math.sqrt((p.v30 || 0) / max), cor = new THREE.Color(DP.papelao).lerp(new THREE.Color(corGrupo(est, p.grupo)), 0.55).getHex();

      c.add(em(caixa(s, s * 0.8, s, pm(cor)), 0, 0, 0)); c.add(em(caixa(s + 0.02, 0.12, s * 0.25, pm(0xF1E6CF), false), 0, s * 0.8, 0));
      const fase = i / a.length;
      anims.push(t => { const q = (t * 3.2 / L + fase) % 1; c.position.set(x1 + q * L, 1.85, z); c.visible = q < 0.985; });

    });
    if (ps.length) { const r = zonaRot('prod', 'Produtos que mais saem', '30 dias · na esteira'); r.position.set(30, 5, z + 3); M.add(r); rotCidade.push(r); }
  }

  // 4 ─ anexo roxo do recebimento + caminhões dos fornecedores na doca
  const conf = exp && exp.conferencia;
  {
    const AX = 37, AZ = -15;
    const anexo = em(caixa(16, 9, 22, pm(DP.anexo)), AX, 0.4, AZ); M.add(anexo);
    M.add(em(caixa(16.8, 0.8, 22.8, pm(DP.anexoTeto)), AX, 9.4, AZ));
    for (const z of [-21, -9]) M.add(em(caixa(0.3, 6, 6, pm(0x3B2A7A)), AX + 8.15, 0.4, z));
    clicavel(anexo, { nome: 'Recebimento', sub: conf ? nf(conf.total) + ' notas na conferência' : '', card: () => CARDS.rec ? CARDS.rec() : SEM('Recebimento', COR.teal, 'Conferência'), dist: 55, alt: 5 });
    if (conf) {
      let k = 0;
      arr(conf.etapas).filter(e => e.k !== 'liberado').forEach(e => arr(e.notas).forEach(n => {

        const z = -24 + k * 6, vaga = new THREE.Vector3(AX + 16, 0.1, z), cam = caminhaoBranco(ETAPA_COR[e.k] || COR.teal); M.add(cam);

        clicavel(cam, { nome: n.nome || 'Fornecedor', sub: e.nome, dist: 25, alt: 2, card: () => cardNotaFor(n, e) });

      const r = zonaRot('rec', 'Recebimento', nf(conf.total) + ' notas'); r.position.set(AX, 13, AZ); M.add(r); rotCidade.push(r);
    }
    reserva(AX + 8, -30, 70, -2);
  }

  // 5 ─ pátio de estoque: uma pilha de pallets por grupo, empilhadeiras rodando
  {
    const gr = arr(est && est.grupos).slice(0, 8), max = Math.max(...gr.map(x => x.valor), 1);
    gr.forEach((x, i) => {
      const cor = GRUPO[i % GRUPO.length], g = new THREE.Group(); g.position.set(-58 + (i % 2) * 13, 0, -26 + Math.floor(i / 2) * 9); M.add(g);
      const camadas = Math.max(1, Math.round(1 + 5 * x.valor / max)), parado = x.valor > 0 ? Math.round(camadas * Math.min(1, (x.parado || 0) / x.valor)) : 0;

      clicavel(g, { nome: x.grupo, sub: brlC(x.valor) + ' em estoque', dist: 35, alt: camadas, card: () => cardGrupo(x, cor) });

    if (gr.length) {

  // 6 ─ pátio de caminhões: liberados hoje estacionados
  {

    M.add(em(caixa(54, 0.15, 36, pm(DP.asfalto), false), PX, 0, PZ));
    for (let k = 0; k < 7; k++) for (const z of [PZ - 9, PZ + 9]) M.add(em(caixa(0.35, 0.05, 10, faixa, false), PX - 24 + k * 7.5, 0.16, z));

    });

      clicavel(andar, { nome: v.nome, sub: brlC(v.mes.v) + ' faturado no mês', dist: 40, alt: h / 2, card: () => cardVend(v, tvV.get(+v.cod), COR.verde) });
      y += h;

    M.add(em(caixa(16, 1, 16, pm(DP.torre2)), TX, y, TZ));
    M.add(em(caixa(5, 2.5, 5, pm(0xE9F7EF)), TX + 3, y + 1, TZ - 3));

    const luz = em(new THREE.Mesh(new THREE.SphereGeometry(0.6, 12, 8), mat(COR.verm, { e: COR.verm, ei: 1 })), TX - 4, y + 7.3, TZ + 3); M.add(luz);

    g.add(caixa(24, 0.7, 17, pm(DP.bancoPedra))); g.add(em(caixa(21, 0.7, 14, pm(DP.bancoPedra)), 0, 0.7, -0.5));

    g.add(em(caixa(19, 1.3, 12, pm(DP.bancoPedra)), 0, 10.4, -0.5));
    const fr = prisma(19, 3.6, 0.8, pm(DP.bancoPedra)); fr.position.set(0, 11.7, 5.1); g.add(fr);

    const r = zonaRot('fin', 'Financeiro', fin ? brlC(fin.vencidos.v) + ' vencido' : ''); r.position.set(0, 27, 0); g.add(r);
    if (fin) pilhasAging(g, fin, i => new THREE.Vector3(15, 0.1, -6 + i * 4));
    reserva(BX - 13, BZ - 10, BX + 18, BZ + 10);
  }

  // 9 ─ outdoor do faturamento atrás do galpão
  if (fat) {
    const g = new THREE.Group(); g.position.set(0, 0, -62); M.add(g);
    for (const x of [-15, 15]) g.add(em(caixa(0.9, 11, 0.9, pm(0x6B7385)), x, 0, 0));
    const quadro = em(caixa(36, 16, 1, pm(0xFFFFFF)), 0, 10, 0); g.add(quadro);
    g.add(em(caixa(36.6, 0.6, 1.4, pm(DP.galpao)), 0, 26, 0));
    const ms = arr(fat.meses).slice(-6), max = Math.max(...ms.map(m => m.v), 1);
    ms.forEach((m, i) => {
      const atual = i === ms.length - 1, h = 1 + 11 * m.v / max, cor = atual ? COR.amb : 0x5B6CF0;
      const b = em(caixa(3.8, h, 0.8, pm(cor)), -12.5 + i * 5, 12, 0.7); g.add(b);

      clicavel(b, { nome: 'Faturamento de ' + mesT(m.m), sub: brlC(m.v), dist: 35, alt: h / 2, card: () => cardMes(m, ms, atual, cor) });
    });

    reserva(-19, -66, 19, -58);
  }

  // 10 ─ zona de risco: área isolada com cones, placa de atenção, pallets vazios (ruptura) e caixas vencendo
  if (est) {
    const RX = -54, RZ = 31, g = new THREE.Group(); g.position.set(RX, 0, RZ); M.add(g);
    g.add(em(caixa(28, 0.15, 20, pm(0xF8E4E2), false), 0, 0, 0));
    for (let i = 0; i < 14; i++) g.add(em(caixa(2, 0.18, 0.5, pm(i % 2 ? 0xFFFFFF : 0xE24A4A), false), -13 + i * 2, 0.08, -10));
    for (let i = 0; i < 14; i++) g.add(em(caixa(2, 0.18, 0.5, pm(i % 2 ? 0xFFFFFF : 0xE24A4A), false), -13 + i * 2, 0.08, 10));
    for (const [x, z] of [[-14, -10], [14, -10], [-14, 10], [14, 10], [0, -10], [0, 10]]) {
      const c = new THREE.Group(); c.position.set(x, 0, z); g.add(c);
      c.add(caixa(1.6, 0.2, 1.6, pm(0xE8641E)));
      const cone = em(new THREE.Mesh(new THREE.ConeGeometry(0.75, 2.4, 14), pm(0xF2742B)), 0, 1.4, 0); cone.castShadow = true; c.add(cone);
      c.add(em(new THREE.Mesh(new THREE.CylinderGeometry(0.47, 0.55, 0.35, 14), pm(0xFFFFFF)), 0, 1.3, 0));
    }
    const placa = new THREE.Group(); placa.position.set(0, 0, -3); g.add(placa); placa.userData.fundir = false;   // a placa balança
    placa.add(caixa(0.4, 8, 0.4, pm(0x6B7385)));
    const tri = prisma(6, 5.2, 0.4, pm(0xF5C02B)); tri.rotation.x = Math.PI / 2; tri.rotation.set(0, 0, 0); tri.position.set(0, 7, 0.3);
    const triG = new THREE.Group(); triG.add(tri); triG.add(em(caixa(0.55, 2.2, 0.2, pm(0x1C1F26), false), 0, 8, 0.55)); triG.add(em(caixa(0.55, 0.55, 0.2, pm(0x1C1F26), false), 0, 7.35, 0.55));
    placa.add(triG); anims.push(t => { triG.rotation.z = Math.sin(t * 1.5) * 0.04; });
    clicavel(placa, { nome: 'Zona de risco', sub: 'rupturas, validade e encalhe', dist: 45, alt: 6, card: CARDS.risco });
    itensRisco(g, est, 7.5, 0.2);
    const V = est.vencendo || {}, R = est.rupturas || {};
    const r = zonaRot('risco', 'Zona de risco', nf(R.n) + ' rupturas · ' + nf((V.n30 || 0) + (V.vencidos || 0)) + ' lotes'); r.position.set(0, 15, -3); g.add(r);

  // 11 ─ bairros: uma cidade por quadra; casa = cliente (tamanho = compra no mês, telhado = curva ABC; roxo = novo; cinza = sumido)

    const vagasEsq = [-90, -54, -18, 18].map(z => ({ x: -101, z, w: 36, d: 32, lado: 'esq', cols: 2, rows: 2 }));
    const slots = [...vagasFrente, ...vagasEsq];
    cid.forEach((c, i) => {
      const q = slots[i]; if (!q) return;
      const g = new THREE.Group(); g.position.set(q.x, 0, q.z); M.add(g);
      const chao = em(caixa(q.w, 0.12, q.d, pm(DP.grama), false), 0, 0, 0); chao.receiveShadow = true; g.add(chao);

      if (q.lado === 'frente') r.position.set(0, 1, -q.d / 2 + 1.5); else r.position.set(q.w / 2 - 2, 1, 0);

    const top = arr(cli.top), max = Math.max(...top.map(x => x.v), 1), maxS = Math.max(...arr(cli.sumidos).map(x => x.vAno || 0), 1);

      const b = casa(parede, telhado, w, w * 0.85, h);
      b.position.set(lx, 0.06, lz); b.rotation.y = k.q.lado === 'frente' ? 0 : Math.PI / 2;   // fachada virada pra câmera (antes as casas da frente apareciam de costas)
      k.g.add(b);

      else if (x.rank <= 5) { const r = rotulo(`${x.rank}º ${esc(primeiro(x.nome))} <small>${brlC(x.v)}</small>`, 'min'); r.position.set(0, h + w * 0.42 + 1.5, 0); b.add(r); }
      const wp = new THREE.Vector3(k.q.x + lx, 0, k.q.z + lz), frente = k.q.lado === 'frente' ? new THREE.Vector3(0, 0, -(w * 0.85) / 2 - 2.5) : new THREE.Vector3((w * 0.85) / 2 + 2.5, 0, 0);
      if (!sumido) porCli.set(String(x.cli), { k, pos: wp, porta: wp.clone().add(frente), alt: h + w * 0.42 });

        ? { nome: x.nome + ' (sumido)', sub: nf(x.dias) + ' dias sem pedir', dist: 30, alt: h / 2, card: () => cardSumido(x) }

  }

  // 13 ─ pedidos chegando: envelope voando da casa do cliente até o prédio do televendas
  const ab = arr(tv && tv.abertos);

      cor => { const o = new THREE.Group(); o.add(new THREE.Mesh(gEnv, pm(0xFFFFFF))); const sel = em(new THREE.Mesh(new THREE.BoxGeometry(2.42, 0.32, 0.5), pm(cor)), 0, 0, 0); o.add(sel); return o; });
  }

  // 14 ─ carrinhos na avenida e árvores nos espaços livres
  [[0x5B6CF0, 0], [0xF2C230, 0.33], [0xE8735A, 0.66]].forEach(([cor, f], i) => {
    const c = animado(carrinho(cor)); M.add(c); const pista = i % 2 ? 54 : 50;

  });
  let s = 1234567; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;

  for (let i = 0, n = 0; i < 900 && n < 120; i++) { const x = -114 + rnd() * 228, z = -114 + rnd() * 228; if (livre(x, z)) { M.add(arvore(x, z, 0.8 + rnd() * 0.6, n)); n++; } }

  for (const k of quadras) for (let i = 0; i < 4; i++) { const x = (rnd() - 0.5) * (k.q.w - 4), z = (rnd() - 0.5) * (k.q.d - 4); const t = arvore(x, z, 0.6, i); t.position.y = 0.06; if (Math.abs(x) % (k.q.w / k.q.cols) > 3) k.g.add(t); }
  M.traverse(o => { if (o.isMesh && o.castShadow === undefined) o.castShadow = true; });
}

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $('tip');
let hoverObj = null, ptr = null, hoverPend = false, ultMov = null;
function achar(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(picks, true).find(h => h.object.visible);
  if (!hit) return null;
  let o = hit.object; while (o && !o.userData.info) o = o.parent; return o;
}
renderer.domElement.addEventListener('pointermove', ev => {
  ultMov = ev; if (hoverPend) return; hoverPend = true;
  requestAnimationFrame(() => {
    hoverPend = false; const e = ultMov, o = achar(e);
    hoverObj = o; renderer.domElement.style.cursor = o ? 'pointer' : '';
    if (o) {
      const i = o.userData.info, r = wrap.getBoundingClientRect();
      tip.innerHTML = esc(i.nome) + (i.sub ? `<small>${esc(i.sub)}</small>` : ''); tip.hidden = false;
      const x = Math.min(e.clientX - r.left + 16, r.width - 290);
      tip.style.left = x + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px';
    } else tip.hidden = true;
  });
});
renderer.domElement.addEventListener('pointerleave', () => { tip.hidden = true; hoverObj = null; });
renderer.domElement.addEventListener('pointerdown', ev => { ptr = { x: ev.clientX, y: ev.clientY }; });
renderer.domElement.addEventListener('pointerup', ev => {
  if (!ptr || Math.hypot(ev.clientX - ptr.x, ev.clientY - ptr.y) > 6) return; ptr = null;
  const o = achar(ev);
  if (!o) { fecharCartao(); return; }
  const i = o.userData.info, p = new THREE.Vector3(); o.getWorldPosition(p); p.y += i.alt || 0;
  voarPara(p, i.dist || 35); abrirCartao(i.card && i.card());
});

{ const sel = $('estilo'); sel.innerHTML = Object.entries(ESTILOS).map(([k, e]) => '<option value="' + k + '"' + (k === ESTILO_ID ? ' selected' : '') + '>Estilo: ' + e.nome + '</option>').join('');
  sel.onchange = () => { try { localStorage.setItem('cd3d_estilo', sel.value); } catch {} const u = new URL(location.href); u.searchParams.set('estilo', sel.value); location.href = u.toString(); }; }

// ── loop ────────────────────────────────────────────────────────────────────────────────────────────
const relogio = new THREE.Clock(), _v = new THREE.Vector3();
let fpsT = 0, fpsN = 0;
function baixarQualidade(fps) {
  if (renderer.getPixelRatio() > 1) { renderer.setPixelRatio(1); tamanho(); console.info('[CD-3D] ' + fps.toFixed(0) + ' qps: resolução 1x'); return; }
  if (usaBloom) { usaBloom = false; console.info('[CD-3D] ' + fps.toFixed(0) + ' qps: sem brilho'); return; }
  if (renderer.shadowMap.enabled) { renderer.shadowMap.enabled = false; scene.traverse(o => { if (o.material) for (const m of [].concat(o.material)) m.needsUpdate = true; }); console.info('[CD-3D] ' + fps.toFixed(0) + ' qps: sem sombra'); }
}
let ultimaMexida = 0, ultimoQuadro = 0;
const mexeu = () => { ultimaMexida = performance.now(); };
for (const ev of ['pointerdown', 'pointermove', 'wheel', 'touchstart']) renderer.domElement.addEventListener(ev, mexeu, { passive: true });
controls.addEventListener('change', () => { if (!controls.autoRotate) mexeu(); });
function loop() {
  requestAnimationFrame(loop);
  const agora = performance.now();
  if (!voo && agora - ultimaMexida > 1500 && agora - ultimoQuadro < 30) return;   // parado: ~30 qps (notebook não esquenta e não engasga)
  ultimoQuadro = agora;
  const dt = Math.min(relogio.getDelta(), 0.05), t = relogio.elapsedTime;
  for (const a of anims) a(t, dt);
  for (const o of picks) { const alvo = o.userData.base * (o === hoverObj ? 1.08 : 1), s = o.scale.x; if (Math.abs(alvo - s) > 0.001 && !o.userData.semEscala) o.scale.setScalar(s + (alvo - s) * 0.2); }
  passoVoo(dt); controls.update();
  for (const r of rotCidade) r.visible = camera.zoom > 1.3;
  for (const r of rotPerto) { r.getWorldPosition(_v); r.visible = DIO ? camera.zoom > 1.7 : camera.position.distanceTo(_v) < 95 * DK; }
  if (usaBloom) composer.render(); else renderer.render(scene, camera);
  if (!css.domElement.classList.contains('sem-nomes')) css.render(scene, camera);
  // máquina fraca: depois de 5 s abaixo de 24 fps desliga o brilho e as sombras
  if (t > 2) { fpsT += dt; fpsN++; if (fpsT > 4) { const fps = fpsN / fpsT; fpsT = 0; fpsN = 0; if (fps < 22) baixarQualidade(fps); } }
}
loop();
// diagnóstico (testes headless): onde cada objeto clicável aparece na tela agora
window.CD3D = { abrir: n => { const o = picks.find(p => p.userData.info.nome.includes(n)); if (!o) return false; abrirCartao(o.userData.info.card()); return true; }, todos: () => { const erros = []; for (const o of picks) { try { abrirCartao(o.userData.info.card()); } catch (e) { erros.push(o.userData.info.nome + ': ' + e.message); } } for (const k of Object.keys(CARDS)) { try { abrirCartao(CARDS[k]()); } catch (e) { erros.push('CARD ' + k + ': ' + e.message); } } return { total: picks.length, erros }; }, alvos: () => { const r = renderer.domElement.getBoundingClientRect(), v = new THREE.Vector3(); return picks.filter(o => o.visible).map(o => { o.getWorldPosition(v); v.y += o.userData.info.alt || 0; v.project(camera); return { nome: o.userData.info.nome, x: Math.round(r.left + (v.x + 1) / 2 * r.width), y: Math.round(r.top + (1 - v.y) / 2 * r.height), z: +v.z.toFixed(3) }; }); } };

// ── dados ───────────────────────────────────────────────────────────────────────────────────────────
let primeiraVez = true, timer = null, ultimaAssin = '';
async function carregar(manual) {
  const st = $('st'), ld = $('carregando');
  if (primeiraVez) ld.style.display = '';
  st.querySelector('span').textContent = 'buscando…';
  try {
    const r = await fetch('/api/cahu-distribuidora/mundo-3d' + (DEMO ? '?demo=1' : manual ? '?forcar=1' : ''), { cache: 'no-store' });
    if (r.status === 401) { location.href = '/login.html'; return; }
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    const aberto = cartaoEl.classList.contains('on');
    // os caminhões carregam os pedidos por cliente: mesmo pedido aberto não muda de posição
    const assin = JSON.stringify(d, (k, v) => (k === 'geradoEm' || k === 'atualizadoEm' ? undefined : v));
    if (manual || assin !== ultimaAssin) construir(d);   // 03/11: mesmos números = não remonta (remontar engasgava a cada 5 min)
    ultimaAssin = assin;
    if (aberto && manual) fecharCartao();
    const h = new Date(d.geradoEm);
    st.className = 'st' + (d.demo ? ' demo' : '');
    st.querySelector('span').textContent = d.demo ? 'DADOS DE EXEMPLO · TESTE' : 'dados reais · ' + h.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    ld.style.display = 'none';
    if (primeiraVez) { primeiraVez = false; voo = vooGeral(); }
  } catch (e) {
    st.querySelector('span').textContent = 'erro ao buscar';
    ld.style.display = '';
    ld.querySelector('.box').innerHTML = `<b>Não consegui buscar os números do CD</b><span>${esc(e.message)}</span><button class="bt vidro" id="b-tenta">Tentar de novo</button>`;
    $('b-tenta').onclick = () => { ld.querySelector('.box').innerHTML = '<div class="gira"></div><b>Montando o CD em 3D…</b><span>Buscando os números no ERP…</span>'; carregar(true); };
  }
  clearTimeout(timer); timer = setTimeout(() => carregar(false), 5 * 60 * 1000);
}
carregar(false);
</script>
