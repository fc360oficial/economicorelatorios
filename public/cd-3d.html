<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/design-system.css">
<script src="/nav.js" defer></script>
<title>CD em 3D — CAHU Distribuidora</title>
<!--
  CD em 3D (03/11/2026, Tiago: "desenhar meus dados do CD em um mundo 3d ... clientes, produtos, pedidos chegando,
  pedidos saindo ... cada objeto clicável abre um cartão de vidro com os meus números reais").
  Dados: /api/cahu-distribuidora/mundo-3d = os 6 blocos do Dashboard Distribuidora (mesmo cache e mesmas regras,
  lib/dashboard-distribuidora.js), só leitura. ?demo=1 = dados de exemplo (TESTE).
  Mapa da cena:
    centro .......... armazém do CD (vidro) com 1 rack por grupo de estoque (pallet vermelho = parado 60+ dias)
    telhado ......... barras do faturamento dos últimos 6 meses · placar com hoje e mês
    céu ............. carrossel com os produtos que mais venderam em 30 dias
    frente .......... Expedição (painel do CD: separação → liberado) · caminhões = NF-e/NFC-e de hoje indo pro cliente
    fundo ........... Recebimento (conferência das notas de fornecedor) · caminhões dos fornecedores na doca
    esquerda ........ torre do Televendas + 1 pilar por vendedor · esferas = pedidos sem NF-e vindo dos clientes
    direita ......... cofre do Financeiro + pilhas de moedas dos boletos vencidos por idade
    frente-direita .. zona de risco: rupturas da Tabela Retirada e lotes vencendo
    anel externo .... cidades com os clientes do mês (altura = compra no mês; cinza = sumidos 30+ dias)
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--tx:#EAF0FF;--tx2:#A9B4CC;--tx3:#7D89A3;--amb:#F5B800;--pos:#34D27B;--neg:#FF5D78;--vid:rgba(16,24,42,.52);--ln:rgba(255,255,255,.16)}
body{background:#070C17;color:var(--tx);font-family:'InterVar','Segoe UI',sans-serif;overflow:hidden;font-variant-numeric:tabular-nums}
#mundo{position:relative;height:100vh;overflow:hidden;background:#070C17}
@media(max-width:820px){#mundo{height:calc(100vh - 96px)}}
#mundo canvas{display:block;outline:none;touch-action:none}
.rotulos{position:absolute;inset:0;pointer-events:none;z-index:1}   /* z-index cria o contexto: o CSS2DRenderer põe z-index alto em cada rótulo */
.vidro{background:linear-gradient(140deg,rgba(255,255,255,.13),rgba(255,255,255,.035) 60%);background-color:var(--vid);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--ln);box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22)}
button{font-family:inherit}

/* HUD */
#hud{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:12px;align-items:flex-start;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.marca{border-radius:14px;padding:10px 14px;min-width:190px}
.marca b{display:block;font-size:14px;font-weight:800;letter-spacing:-.2px}
.marca span{font-size:11px;color:var(--tx2)}
.marca .st{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:10.5px;color:var(--tx3)}
.marca .st i{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 8px var(--pos)}
.marca .st.demo i{background:var(--amb);box-shadow:0 0 8px var(--amb)}
.marca .st.demo{color:var(--amb);font-weight:700}
#kpis{display:flex;gap:8px;flex:1;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#kpis::-webkit-scrollbar{display:none}
.kpi{border-radius:13px;padding:8px 13px;min-width:132px;cursor:pointer;text-align:left;color:var(--tx);transition:transform .15s,border-color .15s}
.kpi:hover{transform:translateY(-2px);border-color:rgba(245,184,0,.55)}
.kpi .l{font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:6px}
.kpi .l i{width:7px;height:7px;border-radius:2px}
.kpi .v{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-top:2px;white-space:nowrap}
.kpi .s{font-size:10.5px;color:var(--tx2);white-space:nowrap}
.pos{color:var(--pos)!important}.neg{color:var(--neg)!important}.amb{color:var(--amb)!important}
.acoes{display:flex;gap:6px;flex-direction:column}
.bt{border-radius:10px;padding:7px 12px;font-size:11.5px;font-weight:700;color:var(--tx);cursor:pointer;white-space:nowrap}
.bt:hover{border-color:rgba(245,184,0,.6)}
.bt.on{color:#1b1400;background:var(--amb);border-color:var(--amb)}

#legenda{position:absolute;left:14px;bottom:14px;border-radius:14px;padding:10px 8px;z-index:5;display:flex;flex-direction:column;gap:1px;max-height:calc(100% - 140px);overflow:auto}
#legenda .t{font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);padding:0 8px 5px}
#legenda button{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--tx2);font-size:11.5px;font-weight:600;padding:5px 8px;border-radius:8px;cursor:pointer;text-align:left}
#legenda button:hover{background:rgba(255,255,255,.08);color:var(--tx)}
#legenda button i{width:9px;height:9px;border-radius:3px;flex-shrink:0}
#dica{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--tx3);background:rgba(7,12,23,.55);padding:5px 12px;border-radius:99px;z-index:4;pointer-events:none;white-space:nowrap}

/* rótulos 3D (CSS2D) — o renderer escreve o transform, não usar transform aqui */
.rot{font-size:10.5px;font-weight:700;color:var(--tx);background:rgba(9,15,29,.62);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:3px 9px;border-radius:99px;white-space:nowrap;letter-spacing:.1px}
.rot small{font-weight:600;color:var(--tx2);margin-left:5px}
.rot.zona{font-size:11.5px;padding:5px 11px;border-color:rgba(255,255,255,.22)}
.rot.zona i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.rot.min{font-size:9.5px;padding:2px 7px;background:rgba(9,15,29,.5)}
.rot.clic{pointer-events:auto;cursor:pointer}
.rot.clic:hover{border-color:var(--amb)}
.rot.placar{padding:10px 18px;border-radius:16px;text-align:center;background:rgba(9,15,29,.55);border-color:rgba(245,184,0,.45);box-shadow:0 0 30px rgba(245,184,0,.18)}
.rot.placar .l{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--tx3);font-weight:800}
.rot.placar .v{font-size:22px;font-weight:800;color:var(--amb);letter-spacing:-.4px;line-height:1.15}
.rot.placar .s{font-size:10.5px;color:var(--tx2);font-weight:600}

/* tooltip do hover */
#tip{position:absolute;z-index:6;pointer-events:none;border-radius:10px;padding:6px 10px;font-size:11.5px;font-weight:700;max-width:280px}
#tip small{display:block;font-weight:600;color:var(--tx2);font-size:10.5px;margin-top:1px}

/* cartão de vidro */
#cartao{position:absolute;top:126px;right:14px;width:390px;max-height:calc(100% - 140px);overflow:auto;border-radius:20px;padding:18px 18px 16px;z-index:7;opacity:0;transform:translateX(24px) scale(.98);transition:opacity .22s,transform .22s;pointer-events:none;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
#cartao.on{opacity:1;transform:none;pointer-events:auto}
#cartao:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;border-radius:20px 20px 0 0;background:var(--cor,#F5B800);box-shadow:0 0 18px var(--cor,#F5B800)}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.c-zona{font-size:9.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--cor,#F5B800)}
.c-x{background:rgba(255,255,255,.08);border:1px solid var(--ln);color:var(--tx);width:28px;height:28px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1}
.c-x:hover{background:rgba(255,255,255,.16)}
#cartao h2{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-top:6px;line-height:1.25}
.c-sub{font-size:11.5px;color:var(--tx2);margin-top:3px;line-height:1.45}
.c-hero{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.c-hero .v{font-size:27px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.c-hero .l{font-size:10.5px;color:var(--tx2);font-weight:600;margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.c-var{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.08)}
.c-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.c-t{padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
.c-t .v{font-size:14.5px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-t .l{font-size:9.5px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.c-sec{font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);margin:14px 0 6px}
.c-lista{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.c-li{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:7px 11px;font-size:11.5px;background:rgba(255,255,255,.03)}
.c-li:nth-child(even){background:rgba(255,255,255,.055)}
.c-li .a{color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.c-li .a small{color:var(--tx3);margin-left:5px;font-weight:600}
.c-li .b{font-weight:800;white-space:nowrap}
.c-barra{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden;display:flex}
.c-barra i{display:block;height:100%}
.c-nota{font-size:10.5px;color:var(--tx3);margin-top:12px;line-height:1.5}
.c-nota a{color:var(--amb);font-weight:700}

/* estilos de dia (Maquete, Brinquedo): vidro claro e texto escuro */
body.claro{--tx:#152033;--tx2:#4E5A72;--tx3:#6E7891;--vid:rgba(255,255,255,.6);--ln:rgba(20,32,51,.14);--pos:#138A4E;--neg:#C22F49;--amb:#9A6C00}
body.claro,body.claro #mundo{background:#E9ECF1}
body.claro .vidro{background:linear-gradient(140deg,rgba(255,255,255,.75),rgba(255,255,255,.45));box-shadow:0 14px 40px rgba(20,32,51,.16),inset 0 1px 0 rgba(255,255,255,.9)}
body.claro .rot{background:rgba(255,255,255,.82);color:#152033;border-color:rgba(20,32,51,.14)}
body.claro .rot.placar{background:rgba(255,255,255,.85);border-color:rgba(154,108,0,.4);box-shadow:0 8px 24px rgba(20,32,51,.15)}
body.claro .c-hero,body.claro .c-t,body.claro .c-li{background:rgba(255,255,255,.55);border-color:rgba(20,32,51,.08)}
body.claro .c-li:nth-child(even){background:rgba(255,255,255,.8)}
body.claro .c-x{background:rgba(20,32,51,.06)}
body.claro #dica{background:rgba(255,255,255,.7)}
body.claro #legenda button:hover{background:rgba(20,32,51,.06)}
body.claro .bt.on{color:#1b1400}
#estilo{border-radius:10px;padding:7px 10px;font-size:11.5px;font-weight:700;color:var(--tx);cursor:pointer;font-family:inherit;outline:none}
#estilo option{color:#152033;background:#fff}
#carregando{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;pointer-events:none}
#carregando .box{border-radius:16px;padding:16px 22px;text-align:center;max-width:340px;pointer-events:auto}
#carregando b{display:block;font-size:14px}
#carregando span{font-size:11.5px;color:var(--tx2);display:block;margin-top:4px;line-height:1.5}
#carregando .gira{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--amb);margin:0 auto 10px;animation:g 1s linear infinite}
#carregando .bt{margin-top:10px}
@keyframes g{to{transform:rotate(360deg)}}

/* monitores menores (regra: 1920 igual, 1599/1399/1199 apertam) */
@media(max-width:1599px){.kpi{min-width:120px;padding:7px 11px}.kpi .v{font-size:15.5px}#cartao{width:360px}}
@media(max-width:1399px){.kpi{min-width:110px}.kpi .v{font-size:14.5px}.kpi .s{display:none}.marca{min-width:0}#legenda button{font-size:11px;padding:4px 7px}}
@media(max-width:1199px){.marca span,.marca .st{display:none}#cartao{width:340px}}
@media(max-width:820px){
  #hud{top:8px;left:8px;right:8px;flex-wrap:wrap;gap:6px}
  .marca{display:none}
  #kpis{order:2;width:100%;flex:none}
  .acoes{flex-direction:row;margin-left:auto}
  #legenda{display:none}
  #dica{display:none}
  #cartao{top:auto;bottom:0;right:0;left:0;width:auto;max-height:62%;border-radius:20px 20px 0 0;transform:translateY(30px)}
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }

<body>
<div id="mundo">
  <div id="hud">
    <div class="marca vidro"><b>CAHU Distribuidora</b><span>CD em 3D · loja 10</span><div class="st" id="st"><i></i><span>carregando…</span></div></div>
    <div id="kpis"></div>
    <div class="acoes">
      <button class="bt vidro" id="b-visao" title="Volta pra visão de cima do CD inteiro">Visão geral</button>
      <button class="bt vidro on" id="b-girar" title="Liga/desliga a câmera girando sozinha">Girar</button>
      <select id="estilo" class="vidro" title="Estilo visual do mundo (fica guardado neste navegador)"></select>
      <button class="bt vidro" id="b-atual" title="Busca os números de novo (o servidor guarda por 5 min)">Atualizar</button>
    </div>
  </div>
  <div id="legenda" class="vidro"></div>
  <div id="dica">Arraste pra girar · botão direito move · roda aproxima · clique em qualquer objeto</div>
  <div id="tip" class="vidro" hidden></div>
  <aside id="cartao" class="vidro" aria-live="polite"></aside>
  <div id="carregando"><div class="box vidro"><div class="gira"></div><b>Montando o CD em 3D…</b><span>Buscando faturamento, clientes, pedidos, estoque, expedição e financeiro no ERP. Na primeira vez do dia pode levar até 1 minuto.</span></div></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ── utilidades ──────────────────────────────────────────────────────────────────────────────────────
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, d = 0) => (+v || 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const brl = v => 'R$ ' + nf(v, 2);
const brlC = v => { v = +v || 0; const a = Math.abs(v); return a >= 1e6 ? 'R$ ' + nf(v / 1e6, 2) + ' mi' : a >= 1e4 ? 'R$ ' + nf(v / 1e3, 1) + ' mil' : 'R$ ' + nf(v, 0); };
const pctT = v => v == null ? '—' : nf(v, 1) + '%';
const varT = v => v == null ? '' : (v >= 0 ? '+' : '') + nf(v, 1) + '%';
const varC = v => v == null ? '' : v >= 0 ? 'pos' : 'neg';
const dBR = s => s ? String(s).slice(0, 10).split('-').reverse().join('/') : '—';
const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const mesT = m => { const [a, b] = String(m || '').split('-'); return b ? MES[+b - 1] + '/' + a.slice(2) : m; };
const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; };
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
const arr = a => Array.isArray(a) ? a : [];
const primeiro = s => String(s || '').trim().split(/\s+/)[0] || '—';
const hx = c => '#' + c.toString(16).padStart(6, '0');

const COR = { amb: 0xF5B800, teal: 0x2BD4C0, azul: 0x4C8DFF, roxo: 0x9B7BFF, verde: 0x34D27B, verm: 0xFF4D6A, lar: 0xFF8A3D, cinza: 0x56627A, rosa: 0xFF5FA2, ceu: 0x7FD3FF };
const GRUPO = [COR.amb, COR.teal, COR.azul, COR.roxo, COR.lar, COR.verde, COR.rosa, COR.ceu];
const ZONAS = {
  cd:    { nome: 'CD e estoque',  cor: COR.amb,  pos: [0, 4, 0],     dist: 70 },
  prod:  { nome: 'Produtos que mais saem', cor: COR.ceu, pos: [0, 30, 0], dist: 80 },
  exp:   { nome: 'Expedição',      cor: COR.verde, pos: [0, 0, 24],   dist: 45 },
  rec:   { nome: 'Recebimento',    cor: COR.teal, pos: [0, 0, -24],  dist: 50 },
  tv:    { nome: 'Televendas',     cor: COR.roxo, pos: [-42, 8, -2], dist: 55 },
  fin:   { nome: 'Financeiro',     cor: COR.amb,  pos: [42, 4, -2],  dist: 50 },
  risco: { nome: 'Zona de risco',  cor: COR.verm, pos: [44, 0, 44],  dist: 42 },
  cli:   { nome: 'Clientes',       cor: COR.azul, pos: [0, 0, 70],   dist: 175 },
};

// ── cena, câmera, luz ─────────────────────────────────────────────────────────────────────────────────
const wrap = $('mundo');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
wrap.prepend(renderer.domElement);
const css = new CSS2DRenderer(); css.domElement.className = 'rotulos'; wrap.insertBefore(css.domElement, $('hud'));

// ── estilos visuais (03/11/26, Tiago: "me manda mais exemplos ... outros estilos") ──────────────────────
// ?estilo=noite|maquete|holograma|brinquedo|entardecer, ou o seletor no topo (fica guardado no navegador).
const ESTILOS = {
  noite:      { nome: 'Noite neon', ceu: ['#04070F', '#0B1426'], nevoa: [0x070C17, 0.0036], chao: 0x0A1222, grade: [0x1B2A48, 0x111B31, 0.55], estrelas: true,
                hemi: [0x8FA8FF, 0x0A0F1C, 1.25], sol: [0xD4DDFF, 2.1, [-90, 150, 80]], luz2: [0xFFC56B, 0.55], bloom: 0.8, expo: 1.1, fov: 46 },
  maquete:    { nome: 'Maquete branca', ceu: ['#DDE2E9', '#F6F7F9'], nevoa: [0xE6EAF0, 0.0008], chao: 0xE4E7EC, grade: [0xD5DAE2, 0xE3E7ED, 0.9], claro: true, mats: 'maquete',
                hemi: [0xFFFFFF, 0x8D96A5, 1.15], sol: [0xFFFFFF, 3.1, [-80, 150, 110]], luz2: [0xFFFFFF, 0.45], bloom: 0, expo: 1.0, fov: 40 },
  holograma:  { nome: 'Holograma', ceu: ['#000308', '#021626'], nevoa: [0x010A14, 0.0028], chao: 0x010812, grade: [0x1A8FBF, 0x07344A, 0.95], estrelas: true, mats: 'holo',
                hemi: [0x60D8FF, 0x000000, 0.5], sol: [0x9FE8FF, 0.4, [-90, 150, 80]], luz2: [0x60D8FF, 0], bloom: 0.75, expo: 1.0, fov: 46 },
  brinquedo:  { nome: 'Cidade de brinquedo', ceu: ['#7FC4F0', '#D9F0FF'], nevoa: [0xCDE9FA, 0.0007], chao: 0x8DC26F, grade: null, claro: true, mats: 'toon',
                hemi: [0xFFFFFF, 0x5E8F4A, 1.5], sol: [0xFFF1D6, 2.8, [-70, 150, 100]], luz2: [0xFFFFFF, 0.5], bloom: 0, expo: 1.0, fov: 17 },
  entardecer: { nome: 'Pôr do sol', ceu: ['#2A1F4A', '#F29A5B'], nevoa: [0xB8705E, 0.0019], chao: 0x2E2129, grade: [0x5A3E46, 0x4A333B, 0.5], mats: 'sol',

function racks(est) {
  const gr = arr(est && est.grupos).slice(0, 8); if (!gr.length) return;
  const max = Math.max(...gr.map(x => x.valor), 1);
  const ferro = mat(0x3B4D75, { m: 0.7, r: 0.35 }), viga = mat(0xFF8A3D, { m: 0.4, r: 0.5 }), madeira = mat(0x8A6A3A, { r: 0.9 });
  const pal = new THREE.BoxGeometry(2.3, 1.55, 2.0); pal.translate(0, 0.95, 0);
  const base = new THREE.BoxGeometry(2.4, 0.18, 2.1); base.translate(0, 0.09, 0);
  gr.forEach((x, i) => {
    const g = new THREE.Group(); g.position.set(-15 + (i % 4) * 10, 0.5, i < 4 ? -6 : 5); M.add(g);
    const cor = GRUPO[i % GRUPO.length];
    for (const px of [-4, 4]) for (const pz of [-1.2, 1.2]) g.add(em(caixa(0.22, 8.4, 0.22, ferro), px, 0, pz));
    for (let n = 0; n < 4; n++) for (const pz of [-1.2, 1.2]) g.add(em(caixa(8.2, 0.16, 0.16, viga), 0, n * 2.1 + 0.1, pz));
    const cheio = Math.max(1, Math.round(12 * x.valor / max)), parado = x.valor > 0 ? Math.round(cheio * Math.min(1, (x.parado || 0) / x.valor)) : 0;
    const mBom = mat(cor, { r: 0.6, e: cor, ei: 0.12 }), mPar = mat(0x7A2433, { r: 0.6, e: 0xFF4D6A, ei: 0.25 });
    for (let k = 0; k < cheio; k++) {
      const nivel = Math.floor(k / 3), col = k % 3, y = nivel * 2.1 + 0.26;
      g.add(em(new THREE.Mesh(base, madeira), -2.6 + col * 2.6, y, 0));
      const p = em(new THREE.Mesh(pal, k >= cheio - parado ? mPar : mBom), -2.6 + col * 2.6, y, 0); p.castShadow = true; g.add(p);
    }
    const card = () => ({
      zona: 'Estoque · grupo', cor, titulo: x.grupo, sub: `${nf(x.itens)} itens com estoque no CD. Cada pallet do rack = 1/12 do maior grupo; vermelho = parado há 60+ dias.`,
      hero: [brlC(x.valor), 'estoque a custo', pctT(x.pct) + ' do CD'],
      tiles: [[brlC(x.valorTab), 'valor na Tabela Retirada'], [brlC(x.parado), 'parado 60+ dias', x.parado > 0 ? 'neg' : ''], [nf(x.itens), 'itens'], [x.valorTab > 0 ? pctT((x.valorTab - x.valor) / x.valorTab * 100) : '—', 'margem na tabela']],
      barra: [[x.valor ? (x.valor - x.parado) / x.valor * 100 : 0, hx(cor)], [x.valor ? x.parado / x.valor * 100 : 0, '#FF4D6A']],
    });
    clicavel(g, { nome: x.grupo, sub: brlC(x.valor) + ' em estoque', card, dist: 26, alt: 4 });
  });
  CARDS.estoque = () => ({
    zona: 'Estoque do CD', cor: COR.amb, titulo: 'Estoque por grupo', sub: `Valor a custo (estoquen10 × custoloja10). ${nf(est.itens)} itens com saldo.`,
    hero: [brlC(est.valor), 'estoque a custo', 'tabela ' + brlC(est.valorTabela)],
    tiles: [[pctT(est.margemTabela), 'margem na tabela'], [nf(est.tabelaComEstoque) + '/' + nf(est.tabelaItens), 'itens da tabela com estoque'], [brlC(est.parados && est.parados.v), 'parado 60+ dias', 'neg'], [nf(est.rupturas && est.rupturas.n), 'rupturas na tabela', 'neg']],
    listas: [{ t: 'Grupos', linhas: arr(est.grupos).map(x => [esc(x.grupo) + `<small>${pctT(x.pct)}</small>`, brlC(x.valor)]) }],
  });
}

// 4 ─ carrossel no céu: produtos que mais venderam em 30 dias
function carrossel(est, tv) {
  const prodTv = new Map(arr(tv && tv.produtos).map(p => [String(p.cod), p]));
  let ps = arr(est && est.top).slice(0, 14).map(p => ({ ...p, tv: prodTv.get(String(p.cod)) }));
  if (!ps.length) ps = arr(tv && tv.produtos).slice(0, 14).map(p => ({ cod: p.cod, descricao: p.descricao, v30: p.v, q30: p.q, tv: p }));
  if (!ps.length) return;
  const roda = new THREE.Group(); roda.position.y = 27; M.add(roda);
  const max = Math.max(...ps.map(p => p.v30 || 0), 1), R = 36;
  const grupos = arr(est && est.grupos).map(g => g.grupo);
  ps.forEach((p, i) => {
    const a = i / ps.length * Math.PI * 2, s = 3 + 4 * Math.sqrt((p.v30 || 0) / max);
    const gi = grupos.indexOf(p.grupo), cor = gi >= 0 ? GRUPO[gi % GRUPO.length] : COR.ceu;
    const c = new THREE.Group(); c.position.set(Math.cos(a) * R, 0, Math.sin(a) * R); roda.add(c);
    const cx = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), mat(cor, { r: 0.35, m: 0.2, e: cor, ei: 0.35 })); cx.castShadow = true; c.add(cx);
    const ar = new THREE.LineSegments(new THREE.EdgesGeometry(cx.geometry), new THREE.LineBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.6 })); c.add(ar);
    const fase = hash(p.cod) * 6;
    anims.push(t => { c.position.y = Math.sin(t * 0.9 + fase) * 1.2; cx.rotation.y = ar.rotation.y = t * 0.4 + fase; cx.rotation.x = ar.rotation.x = Math.sin(t * 0.3 + fase) * 0.25; });
    const T = p.tv;
    clicavel(c, { nome: p.descricao, sub: 'vendeu ' + brlC(p.v30) + ' em 30 dias', dist: 22, card: () => ({
      zona: 'Produto · ' + (i + 1) + 'º em venda (30 dias)', cor, titulo: p.descricao, sub: `Código ${esc(p.cod)}${p.grupo ? ' · ' + esc(p.grupo) : ''}`,
      hero: [brlC(p.v30), 'vendido em 30 dias', p.ped30 ? nf(p.ped30) + ' pedidos' : ''],

        p.preco != null && [brl(p.preco), 'preço na tabela'], p.custo != null && [brl(p.custo), 'custo'], p.valor != null && [brlC(p.valor), 'estoque a custo'],
        T && T.margem != null && [pctT(T.margem), 'margem no mês', T.margem < 0 ? 'neg' : ''], T && [brlC(T.v), 'vendido no mês (pedidos)']],

    }) });

  CARDS.prod = () => ({
    zona: 'Produtos', cor: COR.ceu, titulo: 'Os que mais saem do CD', sub: 'Venda dos últimos 30 dias. Tamanho da caixa = venda; cor = grupo.',
    listas: [{ t: 'Top ' + ps.length, linhas: ps.map((p, i) => [`${i + 1}. ${esc(p.descricao)}`, brlC(p.v30)]) }],
  });
  const r = rotulo('<i style="background:#7FD3FF"></i>Produtos que mais saem <small>30 dias</small>', 'zona', () => { irZona('prod'); abrirCartao(CARDS.prod()); });
  r.position.set(0, 37, -R); M.add(r);

// 5 ─ expedição (frente): uma faixa por etapa do painel do CD, caixinhas = pedidos
const ETAPA_COR = { separacao: COR.azul, em_separacao: COR.roxo, aguardando_liberacao: COR.amb, reconferir: COR.verm, liberado: COR.verde,
  conf_pedido: COR.azul, conf_coletor: COR.roxo, conferido: COR.teal };
function faixas(etapas, zBase, sentido, zona, rotPed) {
  const cx = new THREE.BoxGeometry(1.3, 1.3, 1.3); cx.translate(0, 0.65, 0);
  arr(etapas).slice(0, 5).forEach((e, i) => {
    const cor = ETAPA_COR[e.k] || COR.cinza, g = new THREE.Group(); g.position.set(-18 + i * 9, 0, zBase); M.add(g);
    const piso = new THREE.Mesh(new THREE.PlaneGeometry(7, 12), new THREE.MeshStandardMaterial({ color: cor, emissive: cor, emissiveIntensity: 0.25, transparent: true, opacity: 0.35 }));
    piso.rotation.x = -Math.PI / 2; piso.position.set(0, 0.06, sentido * 6); piso.receiveShadow = true; g.add(piso);
    const mb = mat(cor, { r: 0.5, e: cor, ei: 0.3 }), n = Math.min(e.n || 0, 24);
    for (let k = 0; k < n; k++) { const b = em(new THREE.Mesh(cx, mb), -2 + (k % 3) * 2, Math.floor(k / 12) * 1.35, sentido * (1.4 + Math.floor((k % 12) / 3) * 2.2)); b.castShadow = true; g.add(b); }
    if (e.k === 'reconferir' && e.n > 0) anims.push(t => { mb.emissiveIntensity = 0.4 + Math.abs(Math.sin(t * 3)) * 1.4; piso.material.emissiveIntensity = 0.25 + Math.abs(Math.sin(t * 3)) * 0.5; });
    const r = rotulo(`${esc(e.nome)} <small>${nf(e.n)}</small>`, 'min'); r.position.set(0, 3.6, sentido * 13); g.add(r);
    const lista = arr(e.pedidos || e.notas);
    clicavel(g, { nome: e.nome, sub: nf(e.n) + ' ' + (zona === 'exp' ? 'pedidos' : 'notas'), dist: 26, alt: 1, card: () => ({
      zona: zona === 'exp' ? 'Expedição · painel do CD' : 'Recebimento · conferência', cor, titulo: e.nome,
      hero: [nf(e.n), zona === 'exp' ? 'pedidos nesta etapa' : 'notas nesta etapa'],
      listas: [{ t: zona === 'exp' ? 'Pedidos' : 'Notas', linhas: lista.map(rotPed) }],
      nota: e.n > lista.length ? `Mostrando ${lista.length} de ${nf(e.n)}.` : '',
    }) });
  });
}
function expedicao(exp) {
  if (!exp) return;
  faixas(exp.etapas, 17, 1, 'exp', p => [esc(p.nome || p.cliente || '—'), '#' + esc(p.pedido || p.ped || '')]);
  const pico = arr(exp.porHora).reduce((a, h) => (h.entrou > (a ? a.entrou : -1) ? h : a), null);
  CARDS.exp = () => ({
    zona: 'Expedição', cor: COR.verde, titulo: 'Pedidos saindo do CD', sub: 'Painel do CD: separação → conferência → liberação. Cada caixinha na faixa é um pedido.',

    tiles: [[nf(exp.entraramHoje), 'entraram hoje'], [nf(exp.liberadosHoje), 'liberados hoje', 'pos'], [exp.tempoMedioMin != null ? nf(exp.tempoMedioMin) + ' min' : '—', 'tempo médio até liberar'], [exp.tempoMaxMin != null ? nf(exp.tempoMaxMin) + ' min' : '—', 'maior tempo hoje'],

    listas: [{ t: 'Etapas', linhas: arr(exp.etapas).map(e => [esc(e.nome), nf(e.n), e.k === 'reconferir' && e.n ? 'neg' : '']) },
      { t: 'Pendentes de dias anteriores', linhas: arr(exp.pendAntigos).map(p => [esc(p.nome) + `<small>#${esc(p.ped)}</small>`, nf(p.dias) + ' d', 'neg']) },
      { t: 'Itens pra reconferir', linhas: arr(exp.reconferirItens).flatMap(r => arr(r.itens).map(it => [esc(typeof it === 'string' ? it : it.descricao || it.nome || ''), '#' + esc(r.pedido)])) }],
  });
  const r = rotulo('<i style="background:#34D27B"></i>Expedição <small>' + nf(exp.emAberto) + ' em aberto</small>', 'zona', () => irZona('exp', CARDS.exp));

// 6 ─ recebimento (fundo): conferência das notas de fornecedor + caminhões chegando
function recebimento(exp) {
  const conf = exp && exp.conferencia; if (!conf) return;
  faixas(conf.etapas, -17, -1, 'rec', n => [esc(n.nome || '—'), '#' + esc(n.pedido || '')]);
  const curvaFor = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, -230), new THREE.Vector3(0, 0, -60), new THREE.Vector3(0, 0, -38)]);
  M.add(rua(curvaFor, 4));
  // um caminhão por nota em conferência (estaciona na faixa da etapa) e os liberados hoje saindo em loop
  let k = 0;
  arr(conf.etapas).slice(0, 5).forEach((e, i) => {
    const x = -18 + i * 9;
    arr(e.notas).slice(0, e.k === 'liberado' ? 3 : 2).forEach((n, j) => {
      const cam = caminhao(ETAPA_COR[e.k] || COR.teal); cam.scale.setScalar(1.05); M.add(cam);
      const vaga = new THREE.Vector3(x - 1.8 + j * 3.6, 0, -33);
      const curva = new THREE.CatmullRomCurve3([new THREE.Vector3(j * 3 - 1.5, 0, -230), new THREE.Vector3(j * 3 - 1.5, 0, -70), new THREE.Vector3(x, 0, -46), vaga]);
      const sai = e.k === 'liberado', dur = 14 + hash(n.pedido) * 6, atraso = k++ * 1.7, olhar = new THREE.Vector3();
      anims.push(t => {
        let p;
        if (sai) { p = 1 - (((t + atraso) / dur) % 1); } else { p = Math.min(1, Math.max(0, (t - atraso) / dur)); p = 1 - Math.pow(1 - p, 2); }
        cam.position.copy(curva.getPointAt(p));
        if (p < 0.999) { olhar.copy(curva.getPointAt(sai ? Math.max(0, p - 0.01) : Math.min(1, p + 0.01))); cam.lookAt(olhar); }
        else cam.lookAt(vaga.x, 0, 0);
        cam.visible = !(sai && p < 0.03);
      });
      clicavel(cam, { nome: n.nome || 'Fornecedor', sub: e.nome, dist: 18, alt: 2, card: () => ({
        zona: 'Recebimento · nota de fornecedor', cor: ETAPA_COR[e.k] || COR.teal, titulo: n.nome || 'Fornecedor', sub: 'Nota em conferência no CD.',
        hero: ['#' + esc(n.pedido || '—'), 'pedido / nota'], tiles: [[esc(e.nome), 'etapa agora']],
      }) });
    });
  });
  CARDS.rec = () => ({
    zona: 'Recebimento', cor: COR.teal, titulo: 'Pedidos chegando dos fornecedores', sub: 'Conferência das notas de entrada no CD (central.conferencia). Caminhão parado = nota sendo conferida; saindo = liberada hoje.',
    hero: [nf(conf.total), 'notas na conferência'],
    listas: [{ t: 'Etapas', linhas: arr(conf.etapas).map(e => [esc(e.nome), nf(e.n), e.k === 'reconferir' && e.n ? 'neg' : '']) },
      { t: 'Itens pra reconferir', linhas: arr(conf.reconferirItens).flatMap(r => arr(r.itens).map(it => [esc(typeof it === 'string' ? it : it.descricao || it.nome || ''), '#' + esc(r.pedido)])) }],
  });
  const r = rotulo('<i style="background:#2BD4C0"></i>Recebimento <small>' + nf(conf.total) + ' notas</small>', 'zona', () => irZona('rec', CARDS.rec));
  r.position.set(0, 6, -32); M.add(r);
}

// 7 ─ cidades e clientes (anel externo)
function cidades(cli) {
  const mapa = { distritos: [], porCli: new Map(), porCidade: new Map() };
  if (!cli) return mapa;
  let cid = arr(cli.porCidade).filter(c => c.cidade).slice(0, 8);
  if (!cid.length) { const s = new Map(); for (const c of arr(cli.top)) if (c.cidade && !s.has(norm(c.cidade))) s.set(norm(c.cidade), { cidade: c.cidade, v: 0, n: 0, clientes: 0 }); cid = [...s.values()].slice(0, 8); }
  if (!cid.length) cid = [{ cidade: 'CLIENTES', v: cli.vendaMes || 0, n: 0, clientes: cli.ativosMes || 0 }];
  const R = 104, n = cid.length, P0 = new THREE.Vector3(0, 0, 36);
  for (const l of [-1, 1]) M.add(rua(new THREE.CatmullRomCurve3([new THREE.Vector3(l * 25, 0, 6), new THREE.Vector3(l * 25, 0, 30), new THREE.Vector3(l * 12, 0, 35), P0]), 2.2));
  cid.forEach((c, i) => {
    const ang = n === 1 ? 0 : (-108 + 216 * i / (n - 1)) * Math.PI / 180;
    const C = new THREE.Vector3(Math.sin(ang) * R, 0, Math.cos(ang) * R), dir = C.clone().normalize();
    const borda = C.clone().sub(dir.clone().multiplyScalar(17));
    const meio = P0.clone().lerp(borda, 0.5); meio.z += 10;
    const curva = new THREE.CatmullRomCurve3([P0, new THREE.Vector3(0, 0, 50), meio, borda]);
    M.add(rua(curva));
    const g = new THREE.Group(); g.position.copy(C); M.add(g);
    const disco = new THREE.Mesh(new THREE.CylinderGeometry(16, 16.5, 0.5, 64), mat(0x101C33, { r: 0.9 })); disco.position.y = 0.25; disco.receiveShadow = true; g.add(disco);
    const a = anel(16, 16.6, COR.azul, 1.4, 0.8); a.position.y = 0.55; g.add(a);
    const d = { c, C, curva, g, ang, k: 0 };
    mapa.distritos.push(d); mapa.porCidade.set(norm(c.cidade), d);
    const card = () => ({
      zona: 'Clientes · cidade', cor: COR.azul, titulo: c.cidade, sub: 'Compras do mês nesta cidade. Prédios = maiores clientes; cinza = sumidos (30+ dias sem pedir).',
      hero: [brlC(c.v), 'comprado no mês', pctT(c.pct) + ' da venda'],
      tiles: [[nf(c.clientes), 'clientes compraram'], [nf(c.n), 'pedidos'], [c.n ? brl(c.v / c.n) : '—', 'ticket por pedido']],
      listas: [{ t: 'Maiores clientes aqui', linhas: arr(cli.top).filter(x => norm(x.cidade) === norm(c.cidade)).map(x => [esc(x.nome), brlC(x.v)]) },
        { t: 'Sumidos aqui', linhas: arr(cli.sumidos).filter(x => norm(x.cidade) === norm(c.cidade)).map(x => [esc(x.nome), nf(x.dias) + ' d', 'neg']) }],
    });
    const r = rotulo(`<i style="background:#4C8DFF"></i>${esc(c.cidade)} <small>${brlC(c.v)}</small>`, 'zona', () => { voarPara(C.clone(), 60); abrirCartao(card()); });

// 8 ─ caminhões saindo: uma NF-e/NFC-e de hoje = um caminhão indo pro cliente
function saindo(fat, mapa) {
  const notas = arr(fat && fat.notasHoje); if (!notas.length || !mapa.distritos.length) return;
  notas.forEach((n, i) => {
    const c = mapa.porCli.get(String(n.cli)), d = c ? c.d : mapa.distritos[Math.floor(hash(n.cli || n.nn) * mapa.distritos.length)];
    const fim = c ? d.C.clone().add(c.b.position.clone().setY(0)).add(new THREE.Vector3(0, 0, 2.5)) : d.C.clone();
    const l = i % 2 ? 1 : -1;
    const curva = new THREE.CatmullRomCurve3([new THREE.Vector3(l * 25, 0, 6), new THREE.Vector3(l * 25, 0, 30), new THREE.Vector3(l * 12, 0, 35), ...d.curva.points, fim]);
    const nfce = n.tipo === 'NFC-e', cor = nfce ? COR.teal : COR.amb;
    const cam = caminhao(cor); M.add(cam);
    const dur = 26 + hash(n.nn) * 10, fase = (i / notas.length) * dur, olhar = new THREE.Vector3();
    anims.push(t => {
      const p = ((t + fase) / dur) % 1;
      cam.position.copy(curva.getPointAt(p)); olhar.copy(curva.getPointAt(Math.min(1, p + 0.004))); cam.lookAt(olhar);
      const s = p < 0.03 ? p / 0.03 : p > 0.96 ? (1 - p) / 0.04 : 1; cam.scale.setScalar(Math.max(0.01, s) * 1.1);
    });
    cam.userData.semEscala = true;
    clicavel(cam, { nome: `${n.tipo} ${n.nn} · ${n.cliente}`, sub: brl(n.v) + ' · ' + String(n.hora || '').slice(0, 5), dist: 20, alt: 2, card: () => ({
      zona: 'Pedido saindo · ' + n.tipo, cor, titulo: n.cliente || 'Consumidor', sub: `${n.tipo} nº ${esc(n.nn)} emitida hoje às ${esc(String(n.hora || '').slice(0, 5))}${n.ped ? ' · pedido #' + esc(n.ped) : ''}`,
      hero: [brl(n.v), 'valor da nota', n.margem != null ? 'margem ' + pctT(n.margem) : '', n.margem != null && n.margem < 0 ? 'neg' : ''],
      tiles: [[esc(n.vend || '—'), 'vendedor'], [esc(n.forma || '—'), 'pagamento'], n.custo != null && [brl(n.custo), 'custo dos itens'], c && [esc(c.d.c.cidade), 'cidade']],
      nota: n.chave ? `<a href="/api/dashboard-distribuidora/nfe/${encodeURIComponent(n.chave)}/danfe" target="_blank" rel="noopener">Abrir a DANFE</a>` : '',
    }) });
  });
  CARDS.saindo = () => ({
    zona: 'Pedidos saindo', cor: COR.amb, titulo: 'Notas emitidas hoje', sub: 'Cada caminhão é uma nota de hoje indo pro cliente. Âmbar = NF-e do televendas; verde-água = NFC-e do caixa.',
    hero: [brlC(fat.hoje.v), nf(fat.hoje.n) + ' notas hoje'],
    listas: [{ t: 'Últimas notas', linhas: notas.map(n => [`${esc(String(n.hora || '').slice(0, 5))} · ${esc(n.cliente)}<small>${esc(n.tipo)}</small>`, brl(n.v)]) }],
  });
}

// 9 ─ pedidos chegando: pedido do televendas ainda sem NF-e = esfera voando do cliente pra torre
const TORRE = new THREE.Vector3(-42, 0, -2);
function chegando(tv, mapa) {
  const ab = arr(tv && tv.abertos); if (!ab.length || !mapa.distritos.length) return;
  const geo = new THREE.SphereGeometry(0.9, 18, 14);
  const geoHit = new THREE.SphereGeometry(3.4, 8, 6), matHit = new THREE.MeshBasicMaterial({ visible: false });
  ab.forEach((p, i) => {
    const c = mapa.porCli.get(String(p.cli)), d = c ? c.d : mapa.distritos[Math.floor(hash(p.cli || p.ped) * mapa.distritos.length)];
    const ini = c ? d.C.clone().add(c.b.position.clone().setY(c.alt + 1)) : d.C.clone().setY(4);
    const fim = TORRE.clone().setY(25), meio = ini.clone().lerp(fim, 0.5).setY(48 + hash(p.ped) * 18);
    const curva = new THREE.QuadraticBezierCurve3(ini, meio, fim);
    const cor = p.idade >= 24 ? COR.verm : p.idade >= 4 ? COR.amb : COR.verde;
    const o = new THREE.Mesh(geo, brilho(cor, 3)); M.add(o);
    o.add(new THREE.Mesh(geoHit, matHit));   // área de clique maior que a esfera (de longe ela tem 2 px)
    const rastro = new THREE.Mesh(new THREE.SphereGeometry(0.5, 10, 8), new THREE.MeshBasicMaterial({ color: cor, transparent: true, opacity: 0.35 })); M.add(rastro);
    const dur = 9 + hash(p.ped) * 6, fase = i / ab.length * dur;
    anims.push(t => { const q = ((t + fase) / dur) % 1; o.position.copy(curva.getPoint(q)); rastro.position.copy(curva.getPoint(Math.max(0, q - 0.03))); o.scale.setScalar(q > 0.95 ? (1 - q) / 0.05 + 0.01 : 1); });
    o.userData.semEscala = true;
    clicavel(o, { nome: `Pedido #${p.ped} · ${p.cliente}`, sub: brl(p.v) + ' · há ' + nf(p.idade, 1) + ' h', dist: 22, card: () => ({
      zona: 'Pedido chegando · televendas', cor, titulo: p.cliente || '—', sub: `Pedido #${esc(p.ped)} de ${dBR(p.d)} às ${esc(String(p.hora || '').slice(0, 5))} · ainda sem NF-e`,
      hero: [brl(p.v), 'valor do pedido', 'há ' + nf(p.idade, 1) + ' h', p.idade >= 24 ? 'neg' : p.idade >= 4 ? 'amb' : 'pos'],
      tiles: [[esc(p.vend || '—'), 'vendedor'], [esc(p.forma || '—'), 'pagamento'], [+p.st === 1 ? 'Em andamento' : 'Novo', 'status no televendas']],
      nota: 'Verde = menos de 4 h · âmbar = 4 a 24 h · vermelho = mais de 24 h esperando nota.',
    }) });
  });
}

  }) : SEM('Televendas', COR.roxo, 'Central de Televendas');

  const max = Math.max(...vs.map(v => v.mes.v), 1);

// 12 ─ zona de risco: rupturas da Tabela Retirada e lotes vencendo
function risco(est) {
  if (!est) return;
  const g = new THREE.Group(); g.position.set(44, 0, 44); M.add(g);
  g.add(em(new THREE.Mesh(new THREE.CylinderGeometry(11, 11.5, 0.4, 56), mat(0x2A0F1A, { r: 0.85 })), 0, 0.2, 0));
  const a = anel(11, 11.7, COR.verm, 2, 0.9); a.position.y = 0.45; g.add(a);
  anims.push(t => { a.material.opacity = 0.35 + Math.abs(Math.sin(t * 2)) * 0.6; });
  const rup = arr(est.rupturas && est.rupturas.itens).slice(0, 8), lot = arr(est.vencendo && est.vencendo.lotes).slice(0, 8);
  const base = new THREE.BoxGeometry(2.2, 0.18, 2.0); base.translate(0, 0.09, 0);
  const madeira = mat(0x6B5230, { r: 0.9 }), arame = new THREE.LineBasicMaterial({ color: 0xFF4D6A, transparent: true, opacity: 0.9 });
  const fantasma = new THREE.EdgesGeometry(new THREE.BoxGeometry(2, 1.6, 1.8));
  rup.forEach((p, i) => {
    const ang = Math.PI + i / Math.max(rup.length, 1) * Math.PI, s = new THREE.Group(); s.position.set(Math.cos(ang) * 7, 0.4, Math.sin(ang) * 7); s.rotation.y = -ang; g.add(s);
    s.add(new THREE.Mesh(base, madeira)); const w = em(new THREE.LineSegments(fantasma, arame), 0, 1, 0); s.add(w);
    const f = hash(p.cod) * 5; anims.push(t => { w.visible = Math.sin(t * 4 + f) > -0.6; });
    clicavel(s, { nome: p.descricao + ' (ruptura)', sub: 'sem estoque · ' + brlC(p.v30) + ' em 30 dias', dist: 18, alt: 1, card: () => ({
      zona: 'Ruptura · Tabela Retirada sem estoque', cor: COR.verm, titulo: p.descricao, sub: `Código ${esc(p.cod)}${p.grupo ? ' · ' + esc(p.grupo) : ''}. Está na tabela mas o CD está zerado.`,
      hero: [brlC(p.v30), 'vendia em 30 dias', nf(p.ped30) + ' pedidos'], tiles: [[nf(p.q30), 'quantidade 30 dias'], [brl(p.preco), 'preço na tabela'], [dBR(p.ult), 'última venda']],
    }) });
  });
  const cx = new THREE.BoxGeometry(1.8, 1.8, 1.8); cx.translate(0, 0.9, 0);
  lot.forEach((l, i) => {
    const ang = i / Math.max(lot.length, 1) * Math.PI, cor = l.dias < 0 ? COR.verm : l.dias <= 30 ? COR.lar : COR.amb;
    const c = em(new THREE.Mesh(cx, mat(cor, { e: cor, ei: l.dias <= 30 ? 0.6 : 0.25, r: 0.5 })), Math.cos(ang) * 7, 0.4, Math.sin(ang) * 7);
    c.castShadow = true; g.add(c);
    if (l.dias <= 30) { const f = i; anims.push(t => { c.material.emissiveIntensity = 0.3 + Math.abs(Math.sin(t * 2.5 + f)) * 1.1; }); }
    clicavel(c, { nome: l.descricao, sub: 'vence ' + dBR(l.validade) + (l.dias < 0 ? ' (vencido)' : ' · ' + nf(l.dias) + ' d'), dist: 18, alt: 1, card: () => ({
      zona: 'Lote vencendo', cor, titulo: l.descricao, sub: `Código ${esc(l.cod)} · lote ${esc(l.lote || '—')} · entrada ${dBR(l.entrada)}`,
      hero: [l.dias < 0 ? 'vencido há ' + nf(-l.dias) + ' d' : nf(l.dias) + ' dias', 'validade ' + dBR(l.validade)],
      tiles: [[nf(l.qtd), 'quantidade do lote'], [nf(l.est), 'estoque no CD'], [brlC((l.qtd || 0) * (l.custo || 0)), 'valor do lote a custo', 'neg']],
      nota: 'Mais detalhe em CAHU Distribuidora › Lotes e Validades.',
    }) });
  });
  const V = est.vencendo || {}, R = est.rupturas || {}, Pd = est.parados || {};
  CARDS.risco = () => ({
    zona: 'Zona de risco', cor: COR.verm, titulo: 'Rupturas, validade e encalhe', sub: 'Pallet vazio piscando = ruptura da Tabela Retirada. Caixa laranja/vermelha = lote vencendo.',
    hero: [nf(R.n), 'itens da tabela sem estoque', nf(R.comVenda30) + ' vendiam em 30 dias', 'neg'],
    tiles: [[nf(V.vencidos), 'lotes vencidos', V.vencidos ? 'neg' : ''], [nf(V.n30), 'vencem em 30 dias', 'amb'], [nf(V.n60), 'vencem em 31-60 dias'], [nf(est.cobBaixa && est.cobBaixa.n), 'cobertura baixa'],
      [brlC(Pd.v), nf(Pd.n) + ' itens parados 60+ d', 'neg'], Pd.f120 && [brlC(Pd.f120.v), 'parado 120+ dias', 'neg']],
    listas: [{ t: 'Rupturas que mais vendiam', linhas: rup.map(p => [esc(p.descricao), brlC(p.v30), 'neg']) },
      { t: 'Cobertura baixa (dias de estoque)', linhas: arr(est.cobBaixa && est.cobBaixa.itens).slice(0, 8).map(p => [esc(p.descricao), nf(p.cob, 1) + ' d', 'amb']) }],
  });
  const r = rotulo('<i style="background:#FF4D6A"></i>Zona de risco <small>' + nf(R.n) + ' rupturas · ' + nf((V.n30 || 0) + (V.vencidos || 0)) + ' lotes</small>', 'zona', () => irZona('risco', CARDS.risco));
  r.position.set(0, 6, 0); g.add(r);
}

    f && { l: 'Mês', c: COR.amb, v: brlC(f.mesAtual.v), s: 'projeção ' + brlC(f.mesAtual.projecao), z: 'cd', card: CARDS.fat, alvo: [0, 14, 0], dist: 70 },

    d.clientes && { l: 'Clientes no mês', c: COR.azul, v: nf(d.clientes.ativosMes), s: nf(d.clientes.sumidosN) + ' sumidos', z: 'cli', card: CARDS.cli },
    fi && { l: 'Vencido a receber', c: COR.verm, v: brlC(fi.vencidos.v), s: nf(fi.vencidos.n) + ' boletos', z: 'fin', card: CARDS.fin },

function legenda() {

  for (const [k, z] of Object.entries(ZONAS)) {

}

// ── hover e clique ──────────────────────────────────────────────────────────────────────────────────
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $('tip');
let hoverObj = null, ptr = null, hoverPend = false, ultMov = null;
function achar(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(picks, true).find(h => h.object.visible);
  if (!hit) return null;
  let o = hit.object; while (o && !o.userData.info) o = o.parent; return o;
}
renderer.domElement.addEventListener('pointermove', ev => {
  ultMov = ev; if (hoverPend) return; hoverPend = true;
  requestAnimationFrame(() => {
    hoverPend = false; const e = ultMov, o = achar(e);
    hoverObj = o; renderer.domElement.style.cursor = o ? 'pointer' : '';
    if (o) {
      const i = o.userData.info, r = wrap.getBoundingClientRect();
      tip.innerHTML = esc(i.nome) + (i.sub ? `<small>${esc(i.sub)}</small>` : ''); tip.hidden = false;
      const x = Math.min(e.clientX - r.left + 16, r.width - 290);
      tip.style.left = x + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px';
    } else tip.hidden = true;
  });
});
renderer.domElement.addEventListener('pointerleave', () => { tip.hidden = true; hoverObj = null; });
renderer.domElement.addEventListener('pointerdown', ev => { ptr = { x: ev.clientX, y: ev.clientY }; });
renderer.domElement.addEventListener('pointerup', ev => {
  if (!ptr || Math.hypot(ev.clientX - ptr.x, ev.clientY - ptr.y) > 6) return; ptr = null;
  const o = achar(ev);
  if (!o) { fecharCartao(); return; }
  const i = o.userData.info, p = new THREE.Vector3(); o.getWorldPosition(p); p.y += i.alt || 0;
  voarPara(p, i.dist || 35); abrirCartao(i.card && i.card());
});

$('b-girar').onclick = () => setGirar(!controls.autoRotate);

{ const sel = $('estilo'); sel.innerHTML = Object.entries(ESTILOS).map(([k, e]) => '<option value="' + k + '"' + (k === ESTILO_ID ? ' selected' : '') + '>Estilo: ' + e.nome + '</option>').join('');
  sel.onchange = () => { try { localStorage.setItem('cd3d_estilo', sel.value); } catch {} const u = new URL(location.href); u.searchParams.set('estilo', sel.value); location.href = u.toString(); }; }

// ── loop ────────────────────────────────────────────────────────────────────────────────────────────
const relogio = new THREE.Clock(), _v = new THREE.Vector3();
let fpsT = 0, fpsN = 0, fpsChecado = false;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(relogio.getDelta(), 0.05), t = relogio.elapsedTime;
  for (const a of anims) a(t, dt);
  for (const o of picks) { const alvo = o.userData.base * (o === hoverObj ? 1.08 : 1), s = o.scale.x; if (Math.abs(alvo - s) > 0.001 && !o.userData.semEscala) o.scale.setScalar(s + (alvo - s) * 0.2); }
  passoVoo(dt); controls.update();
  for (const r of rotPerto) { r.getWorldPosition(_v); r.visible = camera.position.distanceTo(_v) < 95 * DK; }
  if (usaBloom) composer.render(); else renderer.render(scene, camera);
  css.render(scene, camera);
  // máquina fraca: depois de 5 s abaixo de 24 fps desliga o brilho e as sombras
  if (!fpsChecado && t > 2) { fpsT += dt; fpsN++; if (fpsT > 5) { fpsChecado = true; if (fpsN / fpsT < 24) { usaBloom = false; renderer.shadowMap.enabled = false; console.info('[CD-3D] modo leve: ' + (fpsN / fpsT).toFixed(0) + ' fps'); } } }
}
loop();
// diagnóstico (testes headless): onde cada objeto clicável aparece na tela agora
window.CD3D = { abrir: n => { const o = picks.find(p => p.userData.info.nome.includes(n)); if (!o) return false; abrirCartao(o.userData.info.card()); return true; }, todos: () => { const erros = []; for (const o of picks) { try { abrirCartao(o.userData.info.card()); } catch (e) { erros.push(o.userData.info.nome + ': ' + e.message); } } for (const k of Object.keys(CARDS)) { try { abrirCartao(CARDS[k]()); } catch (e) { erros.push('CARD ' + k + ': ' + e.message); } } return { total: picks.length, erros }; }, alvos: () => { const r = renderer.domElement.getBoundingClientRect(), v = new THREE.Vector3(); return picks.filter(o => o.visible).map(o => { o.getWorldPosition(v); v.y += o.userData.info.alt || 0; v.project(camera); return { nome: o.userData.info.nome, x: Math.round(r.left + (v.x + 1) / 2 * r.width), y: Math.round(r.top + (1 - v.y) / 2 * r.height), z: +v.z.toFixed(3) }; }); } };

// ── dados ───────────────────────────────────────────────────────────────────────────────────────────
let primeiraVez = true, timer = null;
async function carregar(manual) {
  const st = $('st'), ld = $('carregando');
  if (primeiraVez) ld.style.display = '';
  st.querySelector('span').textContent = 'buscando…';
  try {
    const r = await fetch('/api/cahu-distribuidora/mundo-3d' + (DEMO ? '?demo=1' : ''), { cache: 'no-store' });
    if (r.status === 401) { location.href = '/login.html'; return; }
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    const aberto = cartaoEl.classList.contains('on');
    // os caminhões carregam os pedidos por cliente: mesmo pedido aberto não muda de posição
    construir(d);
    if (aberto && manual) fecharCartao();
    const h = new Date(d.geradoEm);
    st.className = 'st' + (d.demo ? ' demo' : '');
    st.querySelector('span').textContent = d.demo ? 'DADOS DE EXEMPLO · TESTE' : 'dados reais · ' + h.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    ld.style.display = 'none';
    if (primeiraVez) { primeiraVez = false; voo = { t: 0, p0: camera.position.clone(), a0: controls.target.clone(), p1: new THREE.Vector3(0, 118 * DK, 178 * DK), a1: new THREE.Vector3(0, 0, 12) }; }
  } catch (e) {
    st.querySelector('span').textContent = 'erro ao buscar';
    ld.style.display = '';
    ld.querySelector('.box').innerHTML = `<b>Não consegui buscar os números do CD</b><span>${esc(e.message)}</span><button class="bt vidro" id="b-tenta">Tentar de novo</button>`;
    $('b-tenta').onclick = () => { ld.querySelector('.box').innerHTML = '<div class="gira"></div><b>Montando o CD em 3D…</b><span>Buscando os números no ERP…</span>'; carregar(true); };
  }
  clearTimeout(timer); timer = setTimeout(() => carregar(false), 5 * 60 * 1000);
}
carregar(false);
