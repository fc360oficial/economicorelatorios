<script>

const diasAtras=d=>{const a=new Date();a.setHours(0,0,0,0);const b=new Date(d);b.setHours(0,0,0,0);return Math.round((a-b)/864e5);};

// enviado dias antes, então "Hoje" ficava vazio mesmo com nota chegando, loja fechando e XML conferido hoje. Agora conta qualquer
// MOVIMENTO do pedido no dia: enviado, aberto, finalizado, aprovado, recebido, XML conferido/aceito, chegou/fechou na loja.
// Linha por loja (p._ln) usa só os eventos daquela loja. Data 'AAAA-MM-DD' (chegou.em) é lida como dia LOCAL, senão vira véspera.
const dLocal=s=>{ if(!s) return null; const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s)); const d=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(s); return isNaN(d)?null:d; };
// modo = KPI escolhido: com "Chegou na loja" o período olha só a ENTRADA na loja; com "Finalizado na loja", só o FECHAMENTO.
// Assim "Hoje + Finalizado na loja" = lojas que fecharam hoje (Tiago, 08/10: "esse hoje tá coligado junto com os kpis?").
function datasMov(p,modo){ const ds=[];
  const lojas=p._ln?[p.xml?.lojas?.[p._ln]]:Object.values(p.xml?.lojas||{});
  if(modo==='chegou'||modo==='finalizado_loja'){ for(const x of lojas){ const c=x?.chegou; if(!c) continue; if(modo==='chegou') ds.push(c.em,c.horaEntrada,c.detectadoEm); else if(c.fechada) ds.push(c.fechadaEm,c.horaFecho); } return ds.map(dLocal).filter(Boolean); }
  // linha por loja: recebidoEm é do pedido INTEIRO (todas as lojas conciliadas) e não diz nada daquela loja
  ds.push(p.criadoEm,p.abertoEm,p.finalizadoEm,p.aprovadoEm); if(!p._ln) ds.push(p.recebidoEm);
  for(const x of lojas){ if(!x) continue;
    // conferidoEm só quando conciliou (em consistência ele é reescrito a cada ciclo de 30 min e viraria "movimento" todo dia);
    // a chegada do XML conta pela data de emissão da nota
    // na API da lista `notas` é um NÚMERO (contagem) e a lista vem em notas_det — percorrer o número quebrava a tela inteira (09/10)
    if(x.status==='conciliado') ds.push(x.conferidoEm); ds.push(x.aceito?.em||x.aceitoEm); for(const n of (Array.isArray(x.notas)?x.notas:(x.notas_det||[]))) ds.push(n.data);
    const c=x.chegou; if(c) ds.push(c.em,c.detectadoEm,c.horaEntrada,c.fechadaEm,c.horaFecho); }
  return ds.map(dLocal).filter(Boolean); }
const dataRef=p=>{ const ds=datasMov(p,filtro); return ds.length?new Date(Math.max(...ds)):(dLocal(p.criadoEm)||new Date(0)); };   // último movimento (ordena e agrupa)
function passaPeriodo(p,modo){ if(!per) return true; const ds=datasMov(p,modo); if(!ds.length) return false;
  if(per==='hoje') return ds.some(d=>diasAtras(d)===0); if(per==='ontem') return ds.some(d=>diasAtras(d)===1); if(per==='7d') return ds.some(d=>{const o=diasAtras(d);return o>=0&&o<7;});
  if(per==='mes'){const h=new Date();return ds.some(d=>d.getMonth()===h.getMonth()&&d.getFullYear()===h.getFullYear());}
  if(per==='dia') return ds.some(d=>diaKey(d)===diaKey(diaSel)); return true; }

const OPC_STATUS=[['analise','Em análise · não enviado'],['sugestao','Ruptura de entrega'],['aguardando','Aguardando vendedor'],['digitacao','Em digitação'],['finalizado','Finalizado · aguardando aprovação'],['cancelado','Cancelado'],['excluido','Excluído'],['aprovado','Aprovado · aguardando XML'],['xml_consistencia','Consistência XML'],['recebido','Conciliado'],['chegou','Chegou na loja'],['finalizado_loja','Finalizado na loja']];

    $('#pg-sub').textContent='Pedidos que vieram do Radar pra você analisar antes de ir pro fornecedor. Confira quantidades e caixas, envie ao vendedor (ele digita os preços no link), negocie o preço e aprove. Aprovado vai pra Pedidos de Compra. Nada é gravado no ERP.';

function msgCobranca(p,ln,x){

  for(const i of x.itens||[]){
    if(i.tipo==='falta') L.push('• '+i.descricao+': pedimos '+fmt(i.pedida,0)+', não veio.');
    else if(i.tipo==='parcial') L.push('• '+i.descricao+': pedimos '+fmt(i.pedida,0)+', veio '+fmt(i.recebida,0)+'.');
    else if(i.tipo==='a_mais') L.push('• '+i.descricao+': pedimos '+fmt(i.pedida,0)+', veio '+fmt(i.recebida,0)+' (a mais).');
    if(i.preco_status==='maior') L.push('• '+i.descricao+': preço combinado R$ '+fmt(i.preco_digitado,2)+', cobrado R$ '+fmt(i.preco_xml,2)+' × '+fmt(i.recebida,0)+' = R$ '+fmt((i.preco_xml-i.preco_digitado)*i.recebida,2)+' a mais.');
  }
  for(const i of x.nao_pedidos||[]) L.push('• '+i.descricao+': veio '+fmt(i.recebida,0)+' e não estava no pedido.');
  const f=x.financeiro||{}; if(f.boletos&&Math.abs(f.boletos-f.nfe)>0.01) L.push('• Boletos somam R$ '+fmt(f.boletos,2)+' e a NF-e é R$ '+fmt(f.nfe,2)+'.');
  const rec=recusas(x);
  if(rec.length){ L.push('VAMOS RECUSAR NA ENTREGA e será emitida NOTA DE DEVOLUÇÃO:'); for(const r of rec) L.push('• '+r.descricao+': '+fmt(r.qtd,0)+' un ('+r.motivo+')'); L.push('Aviso em PDF: '+p.link+'/devolucao/'+ln+'/pdf'); }

function recusas(x){
  const out=[];
  for(const i of x.itens||[]){ if(i.decisao?.acao!=='recusar') continue; if(i.tipo==='a_mais') out.push({descricao:i.descricao,qtd:i.recebida-i.pedida,motivo:'veio a mais'}); else if(i.preco_status==='maior') out.push({descricao:i.descricao,qtd:i.recebida,motivo:'preço maior que o combinado'}); else out.push({descricao:i.descricao,qtd:i.recebida,motivo:'recusado'}); }
  for(const i of x.nao_pedidos||[]) if(i.decisao?.acao==='recusar') out.push({descricao:i.descricao,qtd:i.recebida,motivo:'item não pedido'});
  return out;
}

function pillXml(p,ln){
  if(['analise','sugestao','aguardando','digitacao','finalizado'].includes(p.status)) return '';   // XML só existe depois de aprovado
  if(ln){ const x=p.xml?.lojas?.[ln]; const st=x?x.status:'aguardando'; const pr=probTxt(x?.problemas); return '<div><span class="xml '+st+'" title="'+esc(pr)+'">'+(st==='consistencia'?'<b>Consistência XML</b>'+(pr?'<i>'+esc(pr)+'</i>':''):(XML_ST[st]||st)+(pr?' · '+esc(pr):''))+'</span>'+fiscalTag(x)+'</div>'; }
  if(!p.xml) return p.status==='aprovado'?'<div><span class="xml aguardando">Aguardando conferência XML</span></div>':'';
  const lj=Object.entries(p.xml.lojas||{}).map(([l,x])=>ETQ(l)+': '+(XML_ST[x.status]||x.status)+(x.problemas?.length?' ('+probTxt(x.problemas)+')':'')).join(' · ');

const PED={};
const precoDe=i=>(i.preco!=null?i.preco:i.ultimo_custo)||0;
function totLojas(p,LN){
  const lojas=LN?[+LN]:[...new Set(p.itens.flatMap(i=>Object.keys(i.lojas_qtd||{}).filter(l=>(i.lojas_qtd[l]||0)>0).map(Number)))].sort((a,b)=>a-b);

  const tot={itens:p.itens.filter(i=>lojas.some(ln=>(i.lojas_qtd[ln]||0)>0)).length,vol:out.reduce((s,l)=>s+l.vol,0),total:out.reduce((s,l)=>s+l.total,0),semPreco:p.itens.filter(i=>i.preco==null&&lojas.some(ln=>(i.lojas_qtd[ln]||0)>0)).length};
  return {lojas:out,tot};
}

  const p=PED[id]; if(!p) return;
  const feitas=(p.erp_teste&&p.erp_teste.lojas)||{}; const pend=(p.lojas||[]).filter(l=>!(feitas[l]&&feitas[l].nReg));
  if(!confirm('Gerar o pedido #'+id+' ('+esc(p.fornecedor||'')+') no ERP de TESTE do .254?\n\nVai criar '+pend.length+' pedido(s) Dlinks (1 por loja: '+pend.map(ETQ).join(', ')+'), com cabeçalho, itens e envio.\nO ERP de produção (.252) NÃO é tocado. Tudo fica em Processos > Log.')) return;
  try{
    const r=await fetch('/api/pedidos-fornecedor/'+id+'/erp-teste',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lojas:pend})});
    const j=await r.json(); if(j.error) throw new Error(j.error);
    const ok=Object.entries(j.lojas||{}).map(([l,x])=>ETQ(l)+' → nº '+x.nReg+' ('+x.itens+' itens, R$ '+fmt(x.total,2)+')');
    const er=(j.erros||[]).map(e=>ETQ(e.loja)+': '+e.erro);
    await carregar(); render();
    alert((ok.length?'Criado no ERP teste:\n'+ok.join('\n'):'Nada criado.')+(er.length?'\n\nErros:\n'+er.join('\n'):''));
  }catch(e){ alert('Falhou: '+e.message); }
}
async function aprovarMsgErp(j){
  const e=j&&j.erp_teste; if(!e) return '';
  const ok=Object.entries(e.lojas||{}).map(([l,x])=>ETQ(l)+' → nº '+x.nReg); const er=(e.erros||[]).map(x=>ETQ(x.loja)+': '+x.erro);
  return '\n\nERP teste (.254): '+(ok.length?ok.join(', '):'nada gravado')+(er.length?'\nERROS: '+er.join(' | ')+'\n(veja na tela do pedido e em Processos > Log)':'');
}
// Tiago, 07/10/26: "Obs. pro Fiscal" é do(a) comprador(a) e é obrigatória pra aprovar — campo vazio fica vermelho, ganha foco e o aprovar não sai
async function aprovar(id){
  { const el=document.getElementById('obsf-'+id), obs=String(el?el.value:(PED[id]?.obs_fiscal||'')).trim();
    if(!obs){ if(el){ el.classList.add('falta'); try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){} el.focus(); const d=document.getElementById('obsfd-'+id); if(d){ d.innerHTML='<b>obrigatória pra aprovar</b>: escreva a orientação pro fiscal que vai receber a nota (ex.: conferir validade mínima 60 d / recusar caixa avariada)'; d.style.color='#C22F49'; } }
      alert('Pra aprovar o pedido #'+id+', preencha a "Obs. pro Fiscal": é a orientação do(a) comprador(a) pra quem vai receber a nota.'); return; } }
  const pa=PED[id]?.avarias; if(!confirm('Aprovar o pedido #'+id+'?'+(pa&&pa.n?'\n\nATENÇÃO: '+pa.n+' avaria(s) pendente(s) com este fornecedor (R$ '+fmt(pa.total,2)+'). '+(pa.resposta_vendedor?'Resposta do vendedor: "'+pa.resposta_vendedor+'"':'O vendedor NÃO respondeu sobre as avarias.')+'\nAprovar mesmo assim?':''))) return;
  const r=await fetch('/api/pedidos-fornecedor/'+id+'/aprovar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({obs_fiscal:String((document.getElementById('obsf-'+id)||{}).value||PED[id]?.obs_fiscal||'')})}); const j=await r.json();
  if(j.error){alert(j.error);return;} await carregar(); if(ANALISE){ aberto=null; render(); } else { aberto=id; render(); carregarDetalhe(id); }   // na Análise o aprovado sai da lista: foi pra Pedidos de Compra
  const msgErp=await aprovarMsgErp(j); if(msgErp||ANALISE) alert('Pedido #'+id+' aprovado.'+(ANALISE?' Ele saiu da Análise e está em Pedidos de Compra.':'')+(msgErp||''));
  try{const r2=await fetch('/api/pedidos-fornecedor/'+id);const p=await r2.json();if(!p.error)modalPdf(p);}catch(e){}
}
// Célula da quantidade do item: total + "N vol × [caixa]" com a caixa numa caixinha de digitar (Tiago, 30/09/26: "que nem na
// Cotação": digita a embalagem e Enter/Tab/↓ grava e já pula pro produto de baixo; antes era um prompt() no ✎).
function pqHtml(p,i,LN){
  const q=LN?(i.lojas_qtd[LN]||0):i.qtd, e=i.emb>1?i.emb:0;
  return '<b>'+fmt(q,0)+'</b> '+esc(i.unid)+'<div class="s2">'+(e?Math.ceil(q/e)+' vol':'<span class="mut">caixa?</span>')+'</div>';
}
// caixa padrão (un/cx) na coluna Emb, igual à Cotação (Tiago, 06/10/26); antes ficava dentro da célula Qtd ("N vol × [cx]")
function pembHtml(p,i){
  const e=i.emb>1?i.emb:0;
  return '<div class="cxe" onclick="event.stopPropagation()"><span class="mut">'+esc(i.unid||'UN')+' ×</span><input class="embi" type="text" inputmode="numeric" maxlength="5" value="'+(e||'')+'" data-last="'+(e||'')+'" data-pid="'+p.id+'" data-cod="'+esc(i.cod)+'" data-unid="'+esc(i.unid||'UN')+'" placeholder="cx" title="Caixa padrão (unidades por caixa). Digite e dê Enter: grava e pula pro produto de baixo (↑ ↓ andam na lista). Vale no Radar e na Cotação; se o pedido ainda não foi aprovado, as quantidades por loja fecham na caixa nova." onkeydown="embKey(event,this)" onchange="embChange(this)"></div>';
}
// cabeçalho do detalhe: último custo × digitado (com id pra redesenhar quando um preço é negociado)
function hdigHtml(p){ return 'último custo <b>'+money2(p.totais.ultimo_custo)+'</b> · digitado <b>'+(p.totais.com_preco?money2(p.totais.digitado):'—')+'</b> ('+p.totais.com_preco+'/'+p.totais.itens+' itens) '+seta(p.totais.com_preco?p.totais.digitado:null,ultProp(p),true); }
// 🤝 negociar preço, igual à Cotação (Tiago, 07/10/26: "quando eu clico eu altero o preço que o vendedor colocou"): clique abre o preço
// pra digitar o fechado com o vendedor; negociado fica azul com o preço do vendedor riscado; apagar o valor volta ao do vendedor.
// Só enquanto o pedido não foi aprovado.
function precoCellHtml(p,i){
  const pr=i.preco!=null?i.preco:null, dif=pr!=null&&i.ultimo_custo>0?pr-i.ultimo_custo:null, ng=i.negociado||null;
  const pode=['analise','sugestao','aguardando','digitacao','finalizado'].includes(p.status);
  const btn=pode?'<button class="neg-btn'+(ng?' on':'')+'" title="'+(ng?'Preço negociado (vendedor digitou '+(ng.preco_vendedor!=null?fmt(ng.preco_vendedor,2):'nada')+(ng.por?' · por '+esc(ng.por):'')+'): clique pra mudar, ou apague o valor pra voltar ao do vendedor':'Negociar: digitar o preço fechado com o vendedor')+'" onclick="event.stopPropagation();negociarPreco('+p.id+',\''+esc(i.cod)+'\')">🤝</button>':'';
  return btn+'<span class="vlr '+(ng?'neg':(dif!=null&&dif>0.004?'up':(dif!=null&&dif<-0.004?'dn':'eq')))+'" title="'+(ng?'negociado · vendedor digitou '+(ng.preco_vendedor!=null?fmt(ng.preco_vendedor,2):'nada'):'preço digitado pelo vendedor')+'">'+(pr==null?'—':fmt(pr,2))+'</span>'+(ng?'<div class="s2"><span class="negv" title="preço que o vendedor digitou">'+(ng.preco_vendedor!=null?fmt(ng.preco_vendedor,2):'sem preço')+'</span></div>':'');
}
async function negociarPreco(pid,cod){
  const p=PED[pid], it=p&&p.itens.find(i=>String(i.cod)===String(cod)); if(!it) return;
  const atual=it.preco!=null?Number(it.preco).toFixed(2).replace('.',','):'';
  const v=prompt('Preço negociado com o vendedor (R$ por unidade).\nDeixe em branco pra voltar ao preço que o vendedor digitou.',atual); if(v===null) return;
  try{
    const r=await fetch('/api/pedidos-fornecedor/'+pid+'/negociar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cod,preco:v.trim()})}); const j=await r.json().catch(()=>({}));
    if(!r.ok||j.error) throw new Error(j.error||('HTTP '+r.status));
    if(j.item){ it.preco=j.item.preco; it.negociado=j.item.negociado||null; } if(j.totais) p.totais=j.totais;
    // redesenha só o que mudou: célula do preço, seta, total do item, totais por loja e do cabeçalho — a tela fica onde está
    const LN=lnDetalhe(pid), c=document.getElementById('pp-'+pid+'-'+cod); if(c) c.innerHTML=precoCellHtml(p,it);
    { const s=document.getElementById('ps-'+pid+'-'+cod); if(s) s.innerHTML=seta(it.preco,it.ultimo_custo,true); }
    { const pt=document.getElementById('pt-'+pid+'-'+cod); if(pt) pt.innerHTML=ptHtml(it,LN); }
    { const hd=document.getElementById('hdig-'+pid); if(hd) hd.innerHTML=hdigHtml(p); }
    const tr=c&&c.closest('tr'); if(tr){ const pede=it.preco!=null||['sugestao','analise'].includes(p.status); tr.classList.toggle('pede',pede); tr.classList.toggle('zero',!pede); }
    const lt=document.getElementById('lt-'+pid); if(lt) lt.innerHTML=lojaTotaisHtml(p, lt.dataset.ln?+lt.dataset.ln:null, true);
    atualizarThLojas(pid);
    const L=LISTA.find(x=>x.id===pid); if(L&&j.totais){ L.totais=j.totais; }
  }catch(e){ alert('Não deu pra negociar o preço: '+e.message); }
}
// total do item: qtd × preço digitado (sem preço: × último custo); embaixo, o total a último custo quando difere
function ptHtml(i,LN){ const q=LN?(i.lojas_qtd[LN]||0):i.qtd, pr=i.preco!=null?i.preco:null; return '<b>'+money2(q*(pr!=null?pr:i.ultimo_custo))+'</b>'+(pr!=null&&Math.abs(pr-i.ultimo_custo)>0.004?'<div class="s2">últ. custo '+money2(q*i.ultimo_custo)+'</div>':''); }
// totais por loja no cabeçalho das colunas de loja (igual à Cotação), redesenhados a cada edição
// Tiago, 13/10 ("coloca aqui em Análise de Compras do mesmo jeito que está em Radar de Pedidos esse cabeçalho"): embaixo do total da
// loja, quanto falta pro pedido mínimo (negativo, vermelho) ou quanto passa (azul); o vendedor fatura por loja (CNPJ). Cópia da minTh() do Radar.
function minTh(min,rs){ min=+min||0; if(!(min>0)) return ''; const d=(+rs||0)-min; return d<0?'<span class="neg" title="'+esc('falta '+money(-d)+' pro pedido mínimo de '+money(min)+' nesta loja')+'">−'+money(-d)+' <small>fat. mín</small></span>':'<span class="azul" title="'+esc(money(d)+' acima do pedido mínimo de '+money(min))+'">+'+money(d)+' <small>fat. mín</small></span>'; }
function atualizarThLojas(id){ const p=PED[id]; if(!p) return; const T=totLojas(p,null).lojas; document.querySelectorAll('[id^="th-tl-'+id+'-"]').forEach(s=>{ const l=+s.id.split('-').pop(); const t=T.find(x=>x.ln===l); s.textContent=money2(t?t.total:0); }); document.querySelectorAll('[id^="th-mn-'+id+'-"]').forEach(s=>{ const l=+s.id.split('-').pop(); const t=T.find(x=>x.ln===l); s.innerHTML=minTh(p.pedido_minimo,t?t.total:0); }); }
// Filtro em cima da tabela do pedido (Tiago, 30/09/26): "Todos · Com preço · Com quantidade e sem preço". Depois que o vendedor
// finaliza, mostra rápido o que ele deixou sem preço (as linhas sem preço já eram cinza; o filtro só esconde as outras). Só na
// tela, nada gravado; a escolha fica por pedido enquanto a página está aberta.
const FILT_IT={};
function itemF(i,LN){ const q=LN?(i.lojas_qtd?.[LN]||0):i.qtd; return i.preco!=null?'cp':(q>0?'sp':'zq'); }
function itfHtml(p,LN){
  const its=p.itens.filter(i=>!LN||(i.lojas_qtd?.[LN]||0)>0), n={todos:its.length,cp:0,sp:0,zq:0}; its.forEach(i=>n[itemF(i,LN)]++);
  const m=FILT_IT[p.id]||'todos', b=(k,l,t)=>'<button class="'+k+(m===k?' on':'')+'" title="'+t+'" onclick="event.stopPropagation();filtrarItensPedido('+p.id+',\''+k+'\')">'+l+'<span class="n">'+(k==='todos'?n.todos:String(n[k]).padStart(String(n.todos).length,'0')+'/'+n.todos)+'</span></button>';   // Tiago, 13/10: contador n/total (02/32, 30/32)
  return '<div class="itf" id="itf-'+p.id+'" onclick="event.stopPropagation()"><span class="l">Mostrar</span>'+b('todos','Todos','Todos os itens do pedido')+b('cp','Com preço','Itens em que o vendedor digitou preço')+b('sp','Com quantidade e sem preço','Itens pedidos que o vendedor deixou sem preço: cobrar do vendedor ou zerar a quantidade')+b('zq','Sem quantidade','Itens zerados (não vão no pedido)')+'</div>';
}
function filtrarItensPedido(pid,modo){
  FILT_IT[pid]=modo; const f=document.getElementById('itf-'+pid); if(f) f.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.classList.contains(modo)));
  document.querySelectorAll('#itt-'+pid+' tbody tr[data-f]').forEach(tr=>{ tr.hidden=modo!=='todos'&&tr.dataset.f!==modo; });
}
function atualizarItf(pid){ const f=document.getElementById('itf-'+pid), p=PED[pid]; if(f&&p) f.outerHTML=itfHtml(p,lnDetalhe(pid)); }
function lnDetalhe(id){ const lt=document.getElementById('lt-'+id); return lt&&lt.dataset.ln?+lt.dataset.ln:0; }
function embViz(el,dir){ const L=[...document.querySelectorAll('input.embi')], k=L.indexOf(el); return k<0?null:(L[k+dir]||null); }
function embIr(n){ if(!n) return; n.focus(); n.select(); try{ n.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){} }
function embNum(el){ return Math.round(parseFloat(String(el.value||'').trim().replace(',','.'))); }
function embKey(ev,el){
  if(ev.key==='ArrowDown'){ ev.preventDefault(); embIr(embViz(el,1)); return; }
  if(ev.key==='ArrowUp'){ ev.preventDefault(); embIr(embViz(el,-1)); return; }
  if(ev.key==='Enter'||(ev.key==='Tab'&&!ev.shiftKey)){
    ev.preventDefault(); const px=embViz(el,1);
    if(String(el.value||'').trim()) salvarEmb(el);   // Enter no mesmo número também vale: fecha as quantidades na caixa (regra do ajustarEmb)
    if(px) embIr(px); else el.blur();
  }
}
function embChange(el){ const e=embNum(el); if(!(e>=1)){ el.value=el.dataset.last||''; return; } if(String(e)===el.dataset.last) return; salvarEmb(el); }   // o Enter já gravou: não grava 2×
async function salvarEmb(el){
  const pid=+el.dataset.pid, cod=el.dataset.cod, unid=el.dataset.unid||'UN', e=embNum(el);
  if(!(e>=1)){ el.value=el.dataset.last||''; return; }
  el.dataset.last=String(e); el.classList.remove('warn','ok'); el.title='';
  const p=PED[pid], it=p&&p.itens.find(i=>String(i.cod)===String(cod));
  try{
    let r=await fetch('/api/itens/unidade-embalagem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo:cod,unidade:unid,embalagem:e})}); let j=await r.json().catch(()=>({})); if(!r.ok||j.error) throw new Error(j.error||('HTTP '+r.status));
    r=await fetch('/api/pedidos-fornecedor/'+pid+'/emb',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cod,emb:e})}); j=await r.json().catch(()=>({}));
    if(j.error){ el.classList.add('warn'); el.title=j.error; return; }   // pedido aprovado/recebido: a caixa ficou gravada no cadastro, o pedido não muda mais
    if(!it) return;
    if(j.item){ it.emb=j.item.emb; it.qtd=j.item.qtd; it.volumes=j.item.volumes; if(j.item.lojas_qtd) it.lojas_qtd=j.item.lojas_qtd; } else { it.emb=e; it.volumes=it.qtd?Math.ceil(it.qtd/e):0; }
    if(j.totais) p.totais=j.totais;
    // redesenha só o que mudou (célula, caixas por loja, totais) — sem carregar() pra não perder o cursor no produto de baixo
    const c=document.getElementById('pq-'+pid+'-'+cod); if(c) c.innerHTML=pqHtml(p,it,lnDetalhe(pid)); el.classList.add('ok');
    { const pt=document.getElementById('pt-'+pid+'-'+cod); if(pt) pt.innerHTML=ptHtml(it,lnDetalhe(pid)); }
    document.querySelectorAll('input.qin[data-id="'+pid+'"][data-cod="'+cod+'"]').forEach(q=>{ const v=it.lojas_qtd[q.dataset.ln]||0; if(String(q.value)!==String(v||'')){ q.value=v||''; q.classList.add('ed'); } q.closest('td').classList.toggle('tem',v>0); });
    const lt=document.getElementById('lt-'+pid); if(lt) lt.innerHTML=lojaTotaisHtml(p, lt.dataset.ln?+lt.dataset.ln:null, true);
    atualizarThLojas(pid);
    const L=LISTA.find(x=>x.id===pid); if(L&&j.totais){ L.totais=j.totais; L.lojas=j.lojas; }
  }catch(err){ el.classList.add('warn'); el.title='Erro ao gravar a caixa: '+err.message; }
}
// Tiago, 06/10/26: "tira esse nome salvar porque o que eu escrever já fica salvo" — grava no change (sair do campo / Enter), sem botão
async function salvarObsFiscal(id){

  const r=await fetch('/api/pedidos-fornecedor/'+id+'/obs-fiscal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({obs:el.value})}); const j=await r.json();
  if(j.error){alert(j.error);return;} el.style.borderColor='#137A48'; setTimeout(()=>{el.style.borderColor='#EFD98F';},1500); if(PED[id]) PED[id].obs_fiscal=j.obs_fiscal;
  const d=document.getElementById('obsfd-'+id); if(d){ const t=d.textContent, c=d.style.color; d.textContent='✓ salvo'; d.style.color='#137A48'; setTimeout(()=>{ d.textContent=t; d.style.color=c; },1500); }
}
