<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/fornecedor/manifest.webmanifest">
<meta name="theme-color" content="#0E1626">
<title>Cotação — Econômico</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,'Segoe UI',system-ui,sans-serif;background:#EBEBE9;color:#0E1626;font-size:14px;font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px 90px}
.top{background:#101B33;color:#fff;border-radius:14px;padding:14px 18px 16px;margin-bottom:14px;transition:padding .15s}
.top.compact{padding:8px 14px 9px;border-radius:0 0 12px 12px;box-shadow:0 6px 18px rgba(14,22,38,.25)}
.top.compact .sub,.top.compact .ey{display:none}
.top.compact .tophd{margin-bottom:0;float:left;margin-right:10px}
.top.compact .logo{width:32px;height:32px;padding:3px}
.top.compact h1{font-size:14px;margin:6px 0 0;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.compact .st{position:absolute;right:14px;top:10px;transform:none}
.top.compact::after{content:'';display:block;clear:both}.tophd{display:flex;align-items:center;gap:12px;margin-bottom:10px}.top .logo{width:56px;height:56px;border-radius:12px;background:#fff;object-fit:contain;padding:4px;flex:none}
.top .ey{font-size:10px;font-weight:800;letter-spacing:.1em;color:#FFC933}
.top h1{font-size:18px;font-weight:800;letter-spacing:-.2px;margin-top:0}
.top .sub{font-size:12px;color:#AEB8CE;margin-top:4px;line-height:1.5}
.top .sub b{color:#fff}
.st{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.04em;margin-top:8px}
.st-dig{background:#FFF6D9;color:#6B4E00}.st-fin{background:#E7F5EC;color:#137A48}.st-enc{background:#DADAD6;color:#4E5A72}
.card{background:#fff;border:1px solid #DADAD6;border-radius:12px;overflow:hidden;margin-bottom:12px}
.card .hd{padding:10px 14px;border-bottom:1px solid #DADAD6;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card .hd span{font-weight:500;color:#4E5A72;font-size:11.5px}
table{width:100%;border-collapse:collapse}
th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#4E5A72;background:#EBEBE9;padding:8px 10px;text-align:left}
th.r,td.r{text-align:right}
td{padding:9px 10px;border-top:1px solid #EEEEEA;vertical-align:middle}
.desc{font-weight:600;line-height:1.3}
.cod{display:block;font-size:11px;color:#98A0B3;font-weight:500;margin-top:3px;white-space:nowrap}.cod i{font-style:normal;color:#4E5A72;font-weight:600;margin-left:8px}
.embv{width:96px;font:inherit;font-size:11px;padding:2px 6px;border:1px dashed #C9C9C4;border-radius:6px;margin-left:8px;color:#0E1626;background:#fff;vertical-align:middle}
.embv:focus{outline:none;border-color:#F5B800;background:#FFFDF3}
.cod i.embv-ok{color:#8A6A00;background:#FFF6D6;border-radius:5px;padding:1px 6px}
.qtd{font-weight:800;font-size:15px;white-space:nowrap}.qtd small{font-size:11px;color:#4E5A72;font-weight:600;display:block}
input.preco{width:104px;font:inherit;font-size:15px;font-weight:700;text-align:right;padding:8px 10px;border:2px solid #C9C9C4;border-radius:9px;background:#fff;color:#0E1626}
input.preco:focus{outline:none;border-color:#F5B800;background:#FFFDF3}
input.preco.ok{border-color:#137A48}
input.obs{width:100%;min-width:140px;font:inherit;font-size:12.5px;padding:8px 10px;border:1px solid #DADAD6;border-radius:9px;background:#fff}
input.obs:focus{outline:none;border-color:#F5B800}
.cond{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:12px 14px}
.ftb{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid #EEEEEA;background:#FAFAF8}
.ftb input[type=search]{flex:1;min-width:200px;border:1px solid #DADAD6;border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}
.ftb label{display:flex;gap:6px;align-items:center;font-size:12.5px;cursor:pointer;white-space:nowrap;font-weight:600;color:#4E5A72}
.cond.cad4{grid-template-columns:2fr 1fr 1fr 1fr;align-items:end;column-gap:14px}
.cond.cad4 label{white-space:nowrap}
.cond.cad4 input{width:100%;box-sizing:border-box}
@media(max-width:700px){.cond.cad4{grid-template-columns:1fr 1fr}}
.cond label{display:block;font-size:10.5px;font-weight:800;color:#4E5A72;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.tot{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:#4E5A72}
.tot b{color:#0E1626;font-size:16px}
.bar[hidden]{display:none!important}.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #DADAD6;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 -6px 20px -12px rgba(14,22,38,.3)}
.bar .info{font-size:12px;color:#4E5A72}
.bar .info b{color:#0E1626}
/* prazo encerrado (Tiago, 05/10/26): barra fixa no rodapé que acompanha a rolagem — dia e hora do fim + WhatsApp do(a) comprador(a) */
.barfim{background:#FFF6D9;border-top:2px solid #F5B800;z-index:20}
.barfim .info{font-size:12.5px;color:#6B4E00;line-height:1.45}.barfim .info b{color:#241a00}
.btn-wa{background:#25D366;color:#fff;text-decoration:none;white-space:nowrap;font-size:15px;display:inline-block}.btn-wa:hover{background:#1EBE5A}
body.venc .wrap{padding-bottom:150px}
/* faixa fixa no topo (Tiago, 10/11/26): preço que não chegou no servidor (âmbar, com Tentar agora) e avisos curtos (verde: "Preços salvos ✓",
   "Prazo liberado"). Fora do #app porque o render() redesenha tudo lá dentro; celular e PC, sem largura fixa. */
.salvobar{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:9px 14px;font-size:13px;font-weight:600;line-height:1.4;box-shadow:0 6px 18px -8px rgba(14,22,38,.35)}
.salvobar[hidden]{display:none!important}
.salvobar.sb-av{background:#FFF6D9;color:#6B4E00;border-bottom:2px solid #F5B800}
.salvobar.sb-ok{background:#E7F5EC;color:#137A48;border-bottom:2px solid #137A48}
.salvobar .sb-btn{border:none;border-radius:9px;padding:7px 14px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;background:#0E1626;color:#fff;white-space:nowrap}
.salvobar .sb-btn:hover{background:#1C2A4A}.salvobar b{white-space:nowrap}
@media(max-width:640px){.salvobar{padding:8px 10px;font-size:12.5px;flex-wrap:nowrap}.salvobar span{flex:1;min-width:0}}
.fim.fimv{font-size:13.5px;line-height:1.6}.fim.fimv .wl{font-size:15px;white-space:nowrap}
.btn{border:none;border-radius:10px;padding:12px 20px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.btn-amber{background:#F5B800;color:#6B4E00}.btn-amber:hover{background:#E5AC00}.btn:disabled{opacity:.45;cursor:default}
.fim{background:#E7F5EC;border:1px solid #BFE3CC;color:#137A48;border-radius:12px;padding:14px 16px;font-size:13px;margin-bottom:12px;line-height:1.5}
.fim.av{background:#FFF6D9;border-color:#EFD98F;color:#6B4E00}
/* tela travada: "último preço digitado não chegou a ser salvo" (revisão 10/11, achado 16) */
.fim .perdido{margin-top:10px;padding:8px 10px;border-radius:8px;background:#FDECEC;border-left:3px solid #C0392B;color:#8A1C1C;font-weight:700;font-size:13px;line-height:1.45}.fim .perdido[hidden]{display:none}
/* Reabrir proposta (Tiago, 09/11/26): linha dentro do aviso "Proposta enviada" com a pergunta e o botão */
.fim .reab{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(14,22,38,.18)}
.fim .reab span{flex:1;min-width:180px}
.btn-reab{background:#0E1626;color:#fff;padding:10px 16px;font-size:13px;white-space:nowrap}.btn-reab:hover{background:#1C2A4A}
@media(max-width:640px){.fim .reab .btn-reab{width:100%}}
.msgc{position:static;background:#FFF6D9;border:1px solid #EFD98F;border-radius:12px;padding:12px 16px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start;box-shadow:0 4px 14px rgba(14,22,38,.10)}
.msgc .ic{width:34px;height:34px;border-radius:50%;background:#F5B800;color:#241a00;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.msgc .t{flex:1;min-width:0}
.msgc .t .l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#6B4E00}
.msgc .t .m{font-size:13.5px;color:#241a00;line-height:1.5;white-space:pre-wrap;margin-top:2px}
.msgc .t .q{font-size:11px;color:#8A6A00;margin-top:4px}
.wa-c{display:inline-flex;align-items:center;gap:7px;background:#25D366;color:#fff;border-radius:9px;padding:9px 13px;font-weight:800;font-size:12.5px;text-decoration:none;white-space:nowrap;flex:none}
.wa-c:hover{background:#1EBE5A}
.wa-c.off{background:#DADAD6;color:#4E5A72;cursor:default}
.fim a.wl{color:#0F6239;font-weight:800}
.empty{padding:60px 20px;text-align:center;color:#98A0B3}
.msgc .mais{display:none}
/* MOBILE (Tiago, 25/09): recado deixa de ser fixo (cobria os produtos), itens viram cartões, campos ocupam a largura */
@media(max-width:640px){
  .wrap{padding:8px 8px 120px}
  .card .hd{padding:10px 12px}
  .cond{grid-template-columns:1fr;padding:10px 12px}
  .cond.cad4{grid-template-columns:1fr}
  .ftb{padding:8px 10px;gap:8px}
  .ftb input[type=search]{min-width:0;width:100%;flex-basis:100%}
  /* recado: rola com a página, texto resumido com "ler tudo" */
  .msgc{position:static;flex-direction:column;gap:8px;padding:10px 12px;box-shadow:none}
  .msgc .ic{width:28px;height:28px;font-size:13px}
  .msgc .t .m{max-height:6.2em;overflow:hidden;position:relative}
  .msgc .t .m::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2.2em;background:linear-gradient(rgba(255,246,217,0),#FFF6D9)}
  .msgc.open .t .m{max-height:none}.msgc.open .t .m::after{display:none}
  .msgc .t .m.curto{max-height:none}.msgc .t .m.curto::after{display:none}
  .msgc .mais{display:inline-block;margin-top:4px;font-size:12px;font-weight:800;color:#6B4E00;background:none;border:none;padding:0;cursor:pointer;text-decoration:underline}
  .msgc .wa-c{width:100%;justify-content:center;box-sizing:border-box;margin-top:2px}
  /* itens: mesmo desenho da digitação do pedido ao fornecedor (Radar) — bloco por produto, preço à esquerda, observação à direita */
  thead{display:none}
  table,tbody{display:block}
  tr{display:grid;grid-template-columns:112px 1fr;gap:6px 8px;padding:9px 10px;border-top:1px solid #EEEEEA;align-items:center}
  tr:first-child{border-top:none}
  td{display:block;padding:0!important;border:0!important}
  td.desc{grid-column:1 / -1;font-size:13px}
  .cod{white-space:normal;line-height:1.7}.cod i{margin-left:0;margin-right:8px}
  .embv{width:82px;margin-left:0;font-size:11px;padding:2px 6px}
  td.r{text-align:left}
  input.preco{width:100%;box-sizing:border-box;font-size:16px;padding:9px 10px}
  input.obs{min-width:0;width:100%;box-sizing:border-box;font-size:13px;padding:9px 10px}
  .tot{flex-direction:column;align-items:flex-start;gap:4px}
  .bar{padding:10px 12px;flex-direction:column;align-items:stretch}
  .bar .btn{width:100%;padding:14px}
  .bar .info{text-align:center}
}
.msgc .m{white-space:pre-line;line-height:1.5}
.parceiro{background:#0E1626;color:#fff;border-radius:12px;padding:16px 18px;margin:4px 0 14px;display:flex;gap:14px;align-items:flex-start}
.parceiro .ic{width:44px;height:44px;border-radius:12px;background:#F5B800;color:#0E1626;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.parceiro h3{font-size:15px;font-weight:800;margin:0 0 4px;color:#F5B800}
.parceiro p{margin:0;font-size:13.5px;line-height:1.5;color:#E6EAF2}.parceiro p+p{margin-top:6px}
.parceiro b{color:#fff}
.sugnota{margin:10px 0 0;font-size:12.5px;line-height:1.45;color:#7C4A03;background:#FFF4E0;border-left:3px solid #F59E0B;border-radius:6px;padding:8px 10px}
</style>
</head>
<body>
<div class="salvobar" id="salvoBar" hidden><span id="salvoTxt"></span><button type="button" class="sb-btn" id="salvoBtn">Tentar agora</button></div>
<div class="wrap" id="app"><div class="empty">Carregando cotação…</div></div>
<div class="bar" id="bar" hidden><div class="info" id="barinfo"></div><button class="btn btn-amber" id="btnFim">Enviar proposta</button></div>
<div class="bar barfim" id="barfim" hidden></div>
<script>
const token=location.pathname.split('/').pop();
const $=s=>document.querySelector(s);
const fmt=(v,d=2)=>v==null?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=s=>s?new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const dd=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const dtp=s=>{if(!s)return '';const t=String(s);return t.length>10?new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):dd(t)+' 23:59';};
// prazo por extenso (Tiago, 05/10/26: "mensagem explicando o dia e a hora do fim da cotação"): "sexta-feira, 03/10/2026 às 18:00"
const prazoDate=s=>{if(!s)return null;const t=String(s);const d=new Date(t.length>10?t:t.slice(0,10)+'T23:59');return isNaN(d)?null:d;};
const dtpLong=s=>{const d=prazoDate(s);if(!d)return dtp(s);return ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'][d.getDay()]+', '+d.toLocaleDateString('pt-BR')+' às '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
// nº do WhatsApp do(a) comprador(a) legível: 5581999998888 / 81999998888 → (81) 99999-8888
const fmtFone=v=>{let d=String(v||'').replace(/\D/g,'');if((d.length===12||d.length===13)&&d.startsWith('55'))d=d.slice(2);if(d.length===11)return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);if(d.length===10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);return d;};
let P=null, dirty=false, saveTimer=null; const DIRTY=new Set(); let extraDirty=false;   // DIRTY = códigos dos itens mexidos nesta tela (só eles vão no salvar)
// revisão 10/11: lockAtual = tela travada (prazo/encerrada/enviada: nada mais sai dela) · perdido = "último preço digitado não chegou a ser salvo"
// · saindo = recarregando depois de 409/404 (nada de beforeunload nem POST solto) · enviando = Enviar proposta em andamento (salvar() não roda)
let lockAtual=false, perdido=false, saindo=false, enviando=false;
// Relógio do aparelho × servidor (revisão 10/11, achado 20): o GET traz `agora` (hora do servidor); OFF corrige a trava do prazo e a decisão
// de liberar. Celular adiantado travava antes da hora e o poll "liberava" sem ninguém ter liberado. Sem o campo (servidor antigo), OFF = 0.
let OFF=0;
const horaServ=()=>Date.now()+OFF;
function ajustarRelogio(iso){const t=Date.parse(iso||'');if(isFinite(t))OFF=t-Date.now();}
function precoNum(v){const n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isFinite(n)?n:null;}
// Só itens com o campo de preço na tela (revisão 10/11, achado 16): a tela travada (prazo/encerrada/enviada) não tem campo, e cair no P —
// a fotografia do carregamento — mandava preco null e apagava no servidor o preço salvo antes.
function itensForm(so){const out=[];for(const i of P.itens){if(so&&!so.has(i.cod))continue;const el=document.querySelector('input.preco[data-cod="'+i.cod+'"]');if(!el)continue;const ob=document.querySelector('input.obs[data-cod="'+i.cod+'"]');const mk=document.querySelector('input.marca[data-cod="'+i.cod+'"]');const ev=document.querySelector('input.embv[data-cod="'+i.cod+'"]');out.push({cod:i.cod,preco:precoNum(el.value)>0?precoNum(el.value):'',obs:ob?ob.value:i.obs,marca:mk?mk.value:(i.marca||''),emb_vendedor:ev?ev.value:(i.emb_vendedor||'')});}return out;}
// sem os campos .cad na tela (travada) não manda nada: cadastro:{} zerava o cadastro do vendedor no servidor (revisão 10/11, achado 16)
function extras(){if(!$('#cad-email'))return {};const g=id=>($('#'+id)||{}).value;const pp=parseInt(g('cad-prazo'))||0;return {condicao:pp>0?'Boleto '+pp+' dias':((P.fornecedor&&P.fornecedor.condicao)||''),obs:g('obsg'),cadastro:{email:g('cad-email'),prazo_pagamento:g('cad-prazo'),prazo_entrega:g('cad-tempo'),pedido_minimo:g('cad-min')}};}
function cadastroFaltando(){const x=extras().cadastro||{};const f=[];if(!x.email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x.email))f.push('e-mail');if(!(parseInt(x.prazo_pagamento)>0))f.push('prazo de pagamento');if(x.prazo_entrega===''||x.prazo_entrega==null||!(parseInt(x.prazo_entrega)>0))f.push('tempo de entrega (maior que zero)');var pm=parseFloat(String(x.pedido_minimo==null?'':x.pedido_minimo).replace(/[^0-9,.]/g,'').replace(/[.](?=[0-9]{3}([^0-9]|$))/g,'').replace(',','.'));if(!(pm>0))f.push('pedido mínimo (maior que zero)');return f;}
function totais(){let t=0,n=0;for(const i of itensForm()){if(i.preco!=null&&i.preco!==''){t+=i.preco*(P.itens.find(x=>x.cod===i.cod)?.qtd||0);n++;}}return {t,n};}
function atualizarTot(){const {t,n}=totais();$('#tot').innerHTML='<span>'+n+' de '+P.itens.length+' itens com preço</span><span>Total da proposta: <b>R$ '+fmt(t)+'</b></span>';$('#barinfo').innerHTML=n<P.itens.length?'Faltam <b>'+(P.itens.length-n)+'</b> itens sem preço. Você pode enviar mesmo assim (item sem preço = não cotado).'+(P.so_respondido?' Os preços só entram na cotação depois que você tocar em <b>Enviar proposta</b>.':''):'Todos os itens com preço.'+(P.so_respondido?' Toque em <b>Enviar proposta</b>: só depois disso eles entram na cotação.':' Não esqueça de tocar em <b>Enviar proposta</b>.');}
function render(){
  // ped: o(a) comprador(a) já realizou o pedido com esta proposta (28/10/26) — trava igual à proposta enviada (o servidor também recusa)
  const fin=P.fornecedor.status==='finalizado', enc=P.status!=='aberta', ped=P.fornecedor.pedido_realizado!=null&&!fin&&!enc, venc=!!P.prazo_vencido&&!fin&&!enc&&!ped, lock=fin||enc||venc||ped;
  // Travando (prazo, encerrada, enviada) — revisão 10/11, achado 16: nada que ainda não chegou no servidor sai mais desta tela (o retry
  // mandava a fotografia do carregamento e apagava preço salvo quando o(a) comprador(a) liberava o prazo). Cancela debounce/retry/contagem
  // e zera o pendente; se tinha preço digitado sem salvar, a tela travada avisa. No Enviar proposta o estado já chega limpo.

// preço digitado que não chegou (a tela travou com o salvar em voo e ele falhou): acende o aviso da tela travada (revisão 10/11, achado 16)
function marcarPerdido(){perdido=true;const el=$('#avisoPerdido');if(el)el.hidden=false;}
// o que o servidor aceitou passa a valer no P (revisão 10/11): a tela travada mostra o preço salvo, não a fotografia do carregamento
function espelhar(itens){for(const n of itens){const i=P.itens.find(x=>x.cod===n.cod);if(!i)continue;i.preco=n.preco===''||n.preco==null?null:n.preco;i.obs=n.obs;i.marca=n.marca;i.emb_vendedor=n.emb_vendedor;}}
function salvar(forcar){
  if(!dirty||saindo||enviando)return;   // enviando: o Enviar proposta leva o DIRTY no corpo dele e espera o que está em voo (revisão 10/11, achado 17)
  if(emVoo&&!forcar)return;   // já tem um salvar em voo: quando ele terminar, o que sujou no meio (dirty continua true) é agendado de novo
  return vooProm=(async()=>{
    clearTimeout(retryTimer);retryTimer=null;
    dirty=false;const cods=new Set(DIRTY),ex=extraDirty;DIRTY.clear();extraDirty=false;
    // só o que está na tela (revisão 10/11, achado 16): tela travada não tem campo → nada a mandar, limpa o pendente e sai
    const itens=itensForm(cods),ext=ex?extras():{};
    if(!itens.length&&!Object.keys(ext).length){zerarPendente();return;}
    if(salvoFalhou)faixa('espera','Salvando os preços…');
    emVoo++;let ok=false;
    try{
      const body=JSON.stringify(Object.assign({itens},ext));
      // keepalive deixa o POST terminar se a página fechar no meio (o navegador limita a 64 KB: corpo maior vai sem); 20 s sem resposta = falha, tenta de novo
      const r=await fetch('/api/cotacao-publica/'+token+'/salvar',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:body.length<60000,body,signal:(typeof AbortSignal!=='undefined'&&AbortSignal.timeout)?AbortSignal.timeout(20000):undefined});
      // 409 (encerrada/prazo/enviada) e 404 (link não existe mais) são definitivos: avisa e recarrega, tentar de novo não salvaria nada
      if(r.status===409||r.status===404){const j=await r.json().catch(()=>({}));sair(j.error||'Cotação encerrada');return;}
      ok=r.ok;
    }catch(e){}
    finally{emVoo--;}
    if(!ok){
      if(lockAtual){marcarPerdido();zerarPendente();return;}   // travou enquanto salvava: o servidor não aceita mais, não tenta de novo e avisa (achado 16)
      dirty=true;cods.forEach(c=>DIRTY.add(c));if(ex)extraDirty=true;salvoFalhou=true;agendarRetry();return;}
    espelhar(itens);retryN=0;
    if(lockAtual){render();return;}   // travou enquanto salvava e deu certo: redesenha a tela travada com o preço que chegou
    if(dirty){agendarSave();return;}   // sujou enquanto salvava: vai no próximo salvar (a faixa, se estiver aberta, acompanha ele)
    if(salvoFalhou){salvoFalhou=false;faixa('ok','Preços salvos ✓');}
  })();
}
// Tentar agora: tenta na hora e a contagem volta pro começo (com um salvar ainda em voo, só mostra que está salvando: ele reagenda ao terminar)
$('#salvoBtn').onclick=()=>{retryN=0;if(!dirty){faixa(null);return;}if(emVoo){faixa('espera','Salvando os preços…');return;}salvar();};
window.addEventListener('online',()=>{if(dirty){retryN=0;salvar();}});   // internet voltou: não espera a contagem
$('#btnFim').onclick=async()=>{
  const {n}=totais();
  const faltam=cadastroFaltando(); if(faltam.length){alert('Antes de enviar, preencha no bloco "Estamos atualizando nosso cadastro de fornecedor": '+faltam.join(', ')+'.');const el=document.querySelector('input.cad');if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.focus();}return;}
  if(!confirm(n<P.itens.length?'Ainda tem '+(P.itens.length-n)+' item(ns) sem preço (não cotados). Enviar a proposta mesmo assim?':'Enviar a proposta? Depois disso não dá mais pra alterar os preços.')) return;
  $('#btnFim').disabled=true;
  // Revisão 10/11 (achado 17): nenhum salvar solto depois do envio — cancela debounce/retry/contagem (um retry vencido durante o confirm
  // chegava DEPOIS do finalizar: 409 "Proposta já enviada" + alert + reload, e a faixa âmbar ficava presa na tela Proposta enviada) e
  // espera o salvar em voo terminar; o que ele não gravou volta pro DIRTY e vai no corpo do finalizar. Tecla digitada enquanto envia fica
  // no DIRTY (salvar() não roda com enviando). Falhou o envio: o retry/debounce volta como estava.
  // a espera pelo salvar em voo pode levar até 20 s (rede lenta): o botão e a faixa dizem que está enviando (revisão 3, 10/11)
  enviando=true;pararTimers();$('#btnFim').textContent='Enviando…';faixa('espera','Enviando a proposta…');
  while(emVoo){const p=vooProm;if(p)await p.catch(()=>{});if(emVoo&&vooProm===p)await new Promise(r=>setTimeout(r,100));}
  pararTimers();faixa('espera','Enviando a proposta…');
  if(saindo)return;   // o salvar em voo levou 409/404: a página já está recarregando
  try{const cods=new Set(DIRTY);const r=await fetch('/api/cotacao-publica/'+token+'/finalizar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({itens:itensForm(cods),...extras(),nome:(P.fornecedor.vendedor&&P.fornecedor.vendedor.nome)||''})});const j=await r.json();if(j.error)throw new Error(j.error);
    zerarPendente();ajustarRelogio(j.agora);P=j;enviando=false;$('#btnFim').textContent='Enviar proposta';render();window.scrollTo(0,0);}
  catch(e){enviando=false;faixa(null);$('#btnFim').textContent='Enviar proposta';alert('Não foi possível enviar: '+e.message);$('#btnFim').disabled=false;if(dirty){if(salvoFalhou)agendarRetry();else agendarSave();}}
};
// Reabrir a própria proposta (Tiago, 09/11/26): pergunta se quer mesmo, o servidor volta a proposta pra digitação e a tela
// recarrega com os campos liberados. O botão é redesenhado a cada render(), por isso o clique é capturado no documento.
document.addEventListener('click',async e=>{
  const b=e.target.closest&&e.target.closest('#btnReabrir'); if(!b||b.disabled) return;
  const nC=P.itens.filter(i=>i.preco!=null).length;
  if(!confirm('Reabrir a proposta pra '+(nC?'corrigir os preços':'digitar os preços')+'?\n\nEla volta pra digitação e '+(P.so_respondido?'sai da cotação até você tocar em Enviar proposta de novo.':'você precisa tocar em Enviar proposta de novo quando terminar.'))) return;
  b.disabled=true;
  try{const r=await fetch('/api/cotacao-publica/'+token+'/reabrir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:(P.fornecedor.vendedor&&P.fornecedor.vendedor.nome)||''})});const j=await r.json().catch(()=>({}));
    // recusa do servidor (409: cotação encerrada/cancelada, prazo, pedido gerado; 404: link inválido): avisa e recarrega pra tela mostrar a situação atual
    if(!r.ok){const msg='Não foi possível reabrir: '+(j.error||'erro '+r.status);if(r.status===409||r.status===404)sair(msg);else{alert(msg);b.disabled=false;}return;}   // sair(): reload sem beforeunload (achado 18)
    ajustarRelogio(j.agora);P=j;dirty=false;DIRTY.clear();extraDirty=false;render();window.scrollTo(0,0);}
  catch(e2){alert('Não foi possível reabrir: '+e2.message);b.disabled=false;}
});
// saindo da página com preço ainda não salvo (Tiago, 10/11/26): manda com keepalive e o navegador pergunta se quer sair mesmo
// (saindo: recarregando depois de 409/404 — nada a perguntar nem a mandar, o servidor não aceita mais — revisão 10/11, achado 18)
window.addEventListener('beforeunload',e=>{if(!dirty||saindo)return;salvar(true);e.preventDefault();e.returnValue='';});
// Prazo liberado destrava sozinho (Tiago, 10/11/26): a tela ficava em "Prazo encerrado" até o vendedor recarregar, mesmo depois de o(a)
// comprador(a) adiar o prazo. Travada por prazo, consulta a cotação a cada 60 s (só com a aba visível; window.__POLL_MS é só pra teste) e
// ao voltar pra aba; vindo prazo_vencido=false com a cotação aberta, redesenha liberada e avisa na faixa. O _tPrazo do render() continua
// travando na hora em que o prazo chega.
let pollT=null;   // null = sem consulta agendada (revisão 10/11, achado 19: antes o clearTimeout não zerava e pollT!=null não dizia nada)
function travadoPrazo(){return !!(P&&P.prazo_vencido&&P.fornecedor.status!=='finalizado'&&P.status==='aberta');}
function agendarPrazo(){clearTimeout(pollT);pollT=null;if(travadoPrazo()&&!document.hidden&&!saindo)pollT=setTimeout(checarPrazo,window.__POLL_MS||60000);}
// link que não existe mais (404) ou cotação cancelada (410): tela de "não encontrada", igual ao carregamento, e nada mais a consultar (revisão 10/11, achado 19)
function semCotacao(msg){P=null;clearTimeout(window._tPrazo);zerarPendente();clearTimeout(pollT);pollT=null;$('#app').innerHTML='<div class="empty">'+(msg?esc(msg)+'.':'Cotação não encontrada ou link inválido.')+'</div>';$('#bar').hidden=true;$('#barfim').hidden=true;document.body.classList.remove('venc');}
// Revisão 10/11 (achados 19 e 20): resposta definitiva pro poll — encerrada/cancelada ou proposta enviada em outra aba → redesenha (COTAÇÃO
// ENCERRADA / PROPOSTA ENVIADA) e para; 404/410 → "não encontrada" e para. Só é "Prazo liberado pelo(a) comprador(a)" quando o prazo MUDOU;
// prazo igual e não vencido no servidor é relógio do aparelho adiantado: se, pela hora do servidor, o prazo ainda está no futuro, destrava em
// silêncio (o _tPrazo rearma na hora certa); senão segue consultando em silêncio. Falha de rede ou 5xx só reagenda.
async function checarPrazo(){clearTimeout(pollT);pollT=null;if(!travadoPrazo()||saindo)return;
  let r=null,j=null;
  try{r=await fetch('/api/cotacao-publica/'+token,{cache:'no-store'});j=await r.json().catch(()=>null);}catch(e){}
  if(saindo||!travadoPrazo())return;   // mudou enquanto consultava (recarregando, destravada por outra via)
  if(r&&(r.status===404||r.status===410)){semCotacao(r.status===410&&j&&j.error?j.error:null);return;}
  if(r&&r.ok&&j&&!j.error){
    ajustarRelogio(j.agora);
    if(j.status!=='aberta'||(j.fornecedor&&j.fornecedor.status==='finalizado')){P=j;render();return;}
    if(!j.prazo_vencido){
      if(j.prazo!==P.prazo){P=j;render();faixa('prazo','Prazo liberado pelo(a) comprador(a): pode continuar digitando.');return;}
      const d=prazoDate(j.prazo);if(d&&d.getTime()>horaServ()){P=j;render();return;}
    }
  }
  agendarPrazo();}
// aba escondida: para de consultar e manda o que falta salvar (keepalive: celular troca de app e congela a página); aba de volta: confere o prazo na hora
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(pollT);pollT=null;if(dirty)salvar(true);}else if(travadoPrazo())checarPrazo();});
(async()=>{let r=null,j=null;try{r=await fetch('/api/cotacao-publica/'+token);j=await r.json();}catch(e){}
  if(!r||!r.ok||!j||j.error){semCotacao(r&&r.status===410&&j&&j.error?j.error:null);return;}   // 410 = cancelada: mostra o motivo do servidor
  ajustarRelogio(j.agora);P=j;render();})();
</script>
<script>
// cabeçalho fixo e compacto ao rolar (Tiago, 25/09: "fixa o cabeçalho, mas o recado não; PC e celular")
// (Tiago, 25/09: cabeçalho fixo SEM encolher — o modo compacto ficou desligado)
// celular: recado resumido com "ler tudo" (Tiago, 25/09: recado fixo cobria os produtos)
document.addEventListener('click', function(e){ var b = e.target.closest && e.target.closest('.msgc .mais'); if (!b) return; var c = b.closest('.msgc'); c.classList.toggle('open'); b.textContent = c.classList.contains('open') ? 'mostrar menos' : 'ler tudo'; });
new MutationObserver(function(){ document.querySelectorAll('.msgc .t .m').forEach(function(m){ if (m.dataset.mais) return; m.dataset.mais = '1'; if (m.textContent.length < 160) { m.classList.add('curto'); return; } var b = document.createElement('button'); b.className = 'mais'; b.type = 'button'; b.textContent = 'ler tudo'; m.insertAdjacentElement('afterend', b); }); }).observe(document.body, { childList: true, subtree: true });
</script>
