<body class="dsnav-pad">
<div class="content">
  <header class="topbar"><div><h1><span class="crumb">DP / RH</span><svg class="ds-ic"><use href="/icons.svg#chevron-right"/></svg>Comprovantes Bancários</h1><p>Consulta, conciliação e arquivamento de pagamentos trabalhistas e encargos</p></div><div class="end"><div class="who" id="who"></div></div></header>
  <div class="page" id="page"><div class="sk"></div><div class="sk" style="width:60%"></div></div>
</div>
<script>
const { $, $$, esc, api, toast } = G;
let ME = null, D = null, TAB = 'painel', SUB = 'sync', PERFIL = 'coordenacao', SEL = null, FSIT = '', FAL = '';
const F = { loja: '', cnpj: '', comp: '', de: '', ate: '', tipo: '', sit: '', busca: '' }, FG = { tipo: '', loja: '', cnpj: '', comp: '', venc: '', sit: '', busca: '' };
const ic = n => '<svg class="ds-ic"><use href="/icons.svg#' + n + '"/></svg>';
const brl = n => (+n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dBR = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '—';
const dhBR = s => { if (!s) return '—'; const d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
const compTxt = c => c ? c.slice(5, 7) + '/' + c.slice(0, 4) : '—';
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const loja = n => D.LOJAS.find(l => l.n === +n) || {};
const etq = n => '<span class="etq' + (+n === 10 ? ' cd' : '') + '">' + esc(loja(n).txt) + '</span>';
const demoMsg = t => toast('Disponível na Fase C: ' + t + '.');
const opts = (mapa, v, vazio) => '<option value="">' + vazio + '</option>' + Object.entries(mapa).map(([k, t]) => '<option value="' + k + '"' + (k === v ? ' selected' : '') + '>' + esc(t) + '</option>').join('');
const optLojas = v => '<option value="">Todas as unidades</option>' + D.LOJAS.map(l => '<option value="' + l.n + '"' + (String(l.n) === v ? ' selected' : '') + '>' + l.txt + ' · ' + esc(l.nome) + '</option>').join('');
const optCnpj = v => '<option value="">Todos os CNPJs</option>' + D.LOJAS.map(l => '<option value="' + l.n + '"' + (String(l.n) === v ? ' selected' : '') + '>' + l.txt + ' · ' + l.cnpj + '</option>').join('');
const comps = lista => [...new Set(lista.map(x => x.comp))].sort().reverse();
const optComp = (v, lista) => '<option value="">Todas</option>' + comps(lista).map(c => '<option value="' + c + '"' + (c === v ? ' selected' : '') + '>' + compTxt(c) + '</option>').join('');

  try { const qs = Object.entries(FB).filter(([, v]) => v !== '').map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&'); BR = await api('/api/comprovantes-bancarios/banco/consultar?' + qs); BLOJA = null; desenharBanco(); }
  catch (e) { toast(e.message); $('#resBanco').innerHTML = '<div class="aviso neg">' + esc(e.message) + '</div>'; }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = ic('bank') + 'CONSULTAR BANCO'; } }
}
const compCelB = l => l.comprovante.disponivel ? '<span class="tag pos">Disponível</span>' : (l.membros && l.membros.some(m => m.comprovante.disponivel) ? '<span class="tag am">Por funcionário</span>' : '<span class="tag gr" title="' + esc(l.comprovante.motivo) + '">Indisponível</span>');
function desenharBanco() {
  const r = BR; const lojas = r.lojas.map(l => l.erro ? '<span class="pill bad">' + esc(l.lojaTxt) + ': ' + esc(l.erro) + '</span>' : '<span class="pill ok">' + esc(l.lojaTxt) + ' · ' + l.incluidos + ' de ' + l.lidos + '</span>').join(' ');
  const linhas = r.linhas.map((l, i) => '<tr class="cl" onclick="detBanco(' + i + ')"><td>' + dBR(l.data) + '</td><td class="nm">' + esc(l.favorecido) + (l.vinculo && !l.vinculo.guia && esc(l.vinculo.nome) !== esc(l.favorecido) ? '<small>' + esc(l.vinculo.nome) + '</small>' : '') + (l.lote ? '<small>lote com ' + (l.qtdLote || '?') + ' lançamento(s)' + (l.membros.length ? ' · ' + l.membros.length + ' identificado(s)' : '') + '</small>' : '') + '</td><td>' + esc(l.documentoTxt) + '</td><td>' + etq(l.loja) + '<small>' + esc(l.cnpj) + '</small></td><td>' + esc(BC.TIPOS_BANCO[l.tipo] || l.tipo) + '</td><td class="r"><b>' + brl(l.valor) + '</b></td><td>Itaú (341)</td><td><small style="font-family:monospace">' + esc(l.idBanco || l.ref) + '</small></td><td>' + sitBP(l.situacao) + '</td><td>' + concP(l.conciliacao) + '</td><td class="c">' + compCelB(l) + '</td></tr>').join('');
  $('#resBanco').innerHTML = '<div class="box"><div class="ftb ln"><b style="font-size:13px">' + r.linhas.length + ' lançamento(s) · ' + dBR(r.periodo.de) + ' a ' + dBR(r.periodo.ate) + '</b><span style="color:var(--ink3);font-size:11.5px">' + r.ocultados + ' lançamento(s) fora do escopo trabalhista ocultado(s)</span><div class="end">' + lojas + '</div></div>' + (r.avisos.length ? '<div class="aviso" style="margin:0 0 8px">' + r.avisos.map(esc).join('<br>') + '</div>' : '') +
    (r.linhas.length ? '<div class="tw"><table class="t"><thead><tr><th>Data</th><th>Beneficiário</th><th>CPF/CNPJ</th><th>Empresa</th><th>Categoria</th><th class="r">Valor</th><th>Banco</th><th>Identificador</th><th>Situação</th><th>Conciliação</th><th class="c">Comprovante</th></tr></thead><tbody>' + linhas + '</tbody></table></div>' : '<div class="empty"><b>Nenhum lançamento trabalhista no período com esses filtros</b></div>') + '</div>';
}
function detBanco(i) {
  const l = BR.linhas[i]; BLOJA = l; registrarBanco('detalhes', l.idBanco || l.ref, l.favorecido + ' · ' + brl(l.valor));
  const kv = (a, b) => '<div><span>' + a + '</span><b>' + b + '</b></div>';
  const vinc = l.vinculo ? '<div class="dc"><div class="fi">RH</div><div><b>' + esc(l.vinculo.nome) + '</b><small>' + esc(l.vinculo.tipoTxt) + ' · ' + compTxt(l.vinculo.comp) + ' · ' + brl(l.vinculo.valor) + ' · ' + esc(l.vinculo.id) + (l.vinculo.manual ? ' · vínculo manual por ' + esc(l.vinculo.por.nome) + ' em ' + dhBR(l.vinculo.em) : '') + '</small></div><div class="a"><button class="ds-btn" onclick="fecharDrawer();' + (l.vinculo.guia ? 'abrir(\'guias\');setTimeout(()=>detGuia(\'' + l.vinculo.id + '\'),50)' : 'detPag(\'' + l.vinculo.id + '\')') + '">Abrir</button>' + (l.vinculo.manual && pode('vincular') ? '<button class="ds-btn" onclick="desvincularBanco(\'' + esc(l.ref) + '\')">Desfazer</button>' : '') + '</div></div>' : '<div class="dc vazio">Nenhum lançamento do RH vinculado.</div>';
  const cands = l.candidatos && l.candidatos.length ? '<h4>Lançamentos do RH com dados semelhantes</h4><div class="docl">' + l.candidatos.map(c => '<div class="dc"><div class="fi">RH</div><div><b>' + esc(c.nome) + '</b><small>' + esc(D.TIPOS[c.tipo]) + ' · ' + compTxt(c.comp) + ' · ' + brl(c.valor) + ' · ' + sitP(c.situacao) + '</small></div><div class="a">' + (pode('vincular') && Math.abs(c.valor - l.valor) < 0.005 ? '<button class="ds-btn am" onclick="vincularBanco(\'' + esc(l.ref) + '\',\'' + c.id + '\',\'' + esc(l.idBanco || '') + '\')">Vincular</button>' : '<button class="ds-btn" onclick="fecharDrawer();detPag(\'' + c.id + '\')">Abrir</button>') + '</div></div>').join('') + '</div>' + (l.conciliacao === 'pendente' && l.candidatos.length > 1 ? '<div class="motivo am">Mais de um lançamento semelhante: a associação automática foi bloqueada. Só o Financeiro vincula, com identificação inequívoca.</div>' : '') : '';
  const membros = l.membros && l.membros.length ? '<h4>Funcionários identificados neste lote</h4><div class="docl">' + l.membros.map(m => '<div class="dc"><div class="fi">RH</div><div><b>' + esc(m.nome) + '</b><small>' + esc(m.cpf) + ' · ' + esc(D.TIPOS[m.tipo]) + ' · ' + brl(m.valor) + ' · ' + sitP(m.situacao) + '</small></div><div class="a">' + (m.comprovante.disponivel ? '<button class="ds-btn am" onclick="verComprovante(\'' + m.comprovante.pagamentoId + '\',' + m.comprovante.idx + ')">Comprovante</button>' : '<button class="ds-btn" onclick="fecharDrawer();detPag(\'' + m.id + '\')">Abrir</button>') + '</div></div>').join('') + '</div><div class="motivo am">Comprovante coletivo nunca é atribuído a uma pessoa: cada funcionário só recebe o comprovante individual extraído do PDF do lote.</div>' : '';
  const comp = l.comprovante.disponivel ? '<div class="dc"><div class="fi">PDF</div><div><b>' + esc(l.comprovante.nome) + '</b><small>' + esc(l.comprovante.origem) + '</small></div><div class="a"><button class="ds-btn am" onclick="verComprovante(\'' + l.comprovante.pagamentoId + '\',' + l.comprovante.idx + ')">Visualizar comprovante</button></div></div>' : '<div class="dc vazio">' + esc(l.comprovante.motivo) + '</div>';
  drawer('Detalhes da transação', '<div class="kv">' + kv('Data', dBR(l.data)) + kv('Beneficiário', esc(l.favorecido)) + kv('CPF/CNPJ', esc(l.documentoTxt)) + kv('Empresa pagadora', esc(l.lojaTxt) + ' · ' + esc(l.cnpj)) + kv('Categoria', esc(BC.TIPOS_BANCO[l.tipo] || l.tipo)) + kv('Valor', brl(l.valor)) + kv('Banco', 'Itaú Unibanco (341) · conta ' + esc(l.conta)) + kv('Identificador bancário', '<span style="font-family:monospace;font-size:11px">' + esc(l.idBanco || '—') + '</span>') + kv('Referência interna', '<span style="font-family:monospace;font-size:11px">' + esc(l.ref) + '</span>') + kv('Histórico', esc(l.historico)) + (l.bancoFav ? kv('Banco do favorecido', esc(l.bancoFav) + (l.agenciaFav ? ' · ag ' + esc(l.agenciaFav) : '') + (l.contaFav ? ' · cc ' + esc(l.contaFav) : '')) : '') + (l.finalidade ? kv('Finalidade', esc(l.finalidade)) : '') + kv('Situação', sitBP(l.situacao)) + kv('Conciliação', concP(l.conciliacao)) + '</div>' +
    (l.situacao === 'estornado' ? '<div class="motivo">Lançamento estornado ou devolvido: não comprova pagamento.' + (l.devolucao ? ' O banco creditou de volta ' + brl(l.devolucao.valor) + ' em ' + dBR(l.devolucao.data) + ' (' + esc(l.devolucao.historico) + ').' : '') + '</div>' : '') + '<h4>Lançamento do RH vinculado</h4><div class="docl">' + vinc + '</div>' + cands + membros + '<h4>Comprovante</h4><div class="docl">' + comp + '</div>' +
    '<div class="acts"><button class="ds-btn" onclick="auditoriaDe(\'' + esc(l.idBanco || l.ref) + '\',\'' + esc(l.ref) + '\')">Histórico de auditoria</button></div>');
}
function registrarBanco(acao, ref, det) { fetch('/api/comprovantes-bancarios/banco/evento', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ acao, ref, det }) }).catch(() => {}); }
async function vincularBanco(ref, pagamentoId, idBanco) {
  const obs = prompt('Vincular o lançamento ' + ref + ' ao pagamento ' + pagamentoId + '.\nObservação (opcional):'); if (obs === null) return;
  try { const r = await fetch('/api/comprovantes-bancarios/banco/vincular', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ref, pagamentoId, idBanco, obs }) }); const j = await r.json(); if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); toast('Vinculado a ' + j.pagamento.nome); fecharDrawer(); D = await api('/api/comprovantes-bancarios/dados'); await consultarBanco(); }
  catch (e) { toast(e.message); }
}
async function desvincularBanco(ref) {
  const obs = prompt('Desfazer o vínculo manual de ' + ref + '?\nMotivo:'); if (obs === null) return;
  try { const r = await fetch('/api/comprovantes-bancarios/banco/desvincular', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ref, obs }) }); const j = await r.json(); if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); toast('Vínculo desfeito'); fecharDrawer(); D = await api('/api/comprovantes-bancarios/dados'); await consultarBanco(); }
  catch (e) { toast(e.message); }
}
// comprovante individual: página do funcionário extraída do PDF (?pagina=1); BAIXAR = original da página, IMPRIMIR = diálogo do navegador, ARQUIVAR = GED pasta 08
function verComprovante(pagamentoId, idx) {
  const p = D.PAGAMENTOS.find(x => x.id === pagamentoId); const d = p && p.docs[idx]; if (!d) return toast('Documento não encontrado');
  const url = '/api/comprovantes-bancarios/doc/' + encodeURIComponent(pagamentoId) + '/' + idx + '?pagina=1';
  modal('Comprovante · ' + p.nome, '<iframe id="pdfComp" src="' + url + '" style="width:100%;height:62vh;border:1px solid var(--ln);border-radius:8px;background:#fff"></iframe><div class="aviso inf" style="margin-top:8px">' + esc(d.origem) + '. Documento original preservado; a página é extraída sem alteração.' + (p.arquivado ? ' Arquivado em ' + esc(p.pasta) + '.' : '') + '</div>',
    '<button class="ds-btn" onclick="fecharModal()">Fechar</button><a class="ds-btn" href="' + url + '&download=1">BAIXAR PDF</a><button class="ds-btn" onclick="imprimirComprovante(\'' + pagamentoId + '\')">IMPRIMIR</button>' + (pode('arquivarGed') && !p.arquivado ? '<button class="ds-btn am" onclick="arquivarGed(\'' + pagamentoId + '\',' + idx + ')">ARQUIVAR NO GED</button>' : ''));
}
function imprimirComprovante(pagamentoId) { registrarBanco('impressao', pagamentoId, 'Impressão do comprovante'); const f = $('#pdfComp'); try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { window.open(f.src, '_blank'); } }
async function arquivarGed(pagamentoId, idx) {
  if (!confirm('Arquivar este comprovante na pasta 08 do prontuário do funcionário (Gestão Documental)?')) return;
  try { const r = await fetch('/api/comprovantes-bancarios/banco/arquivar-ged', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pagamentoId, idx }) }); const j = await r.json(); if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); toast('Arquivado: ' + j.protocolo); fecharModal(); D = await api('/api/comprovantes-bancarios/dados'); if (TAB !== 'banco') render(); }
  catch (e) { toast(e.message); }
}
async function auditoriaDe(ref, ref2) {
  try { const a = await api('/api/comprovantes-bancarios/auditoria?ref=' + encodeURIComponent(ref)); const b = ref2 && ref2 !== ref ? await api('/api/comprovantes-bancarios/auditoria?ref=' + encodeURIComponent(ref2)) : { itens: [] }; const itens = [...a.itens, ...b.itens].sort((x, y) => y.em.localeCompare(x.em));
    modal('Auditoria · ' + ref, itens.length ? '<div class="tl">' + itens.map(h => '<div><span><b>' + esc(h.quem) + '</b><small>' + esc(h.perfil) + ' · ' + dhBR(h.em) + '</small></span><span><b>' + esc(h.acao) + '</b> ' + esc(h.det) + '</span></div>').join('') + '</div>' : '<div class="empty"><b>Nenhum registro para esta referência</b></div>'); }
  catch (e) { toast(e.message); }
}
