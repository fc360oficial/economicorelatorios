<body class="dsnav-pad">
<div class="content">
  <header class="topbar"><div><h1><span class="crumb">DP / RH</span><svg class="ds-ic"><use href="/icons.svg#chevron-right"/></svg>Comprovantes Bancários</h1><p>Consulta, conciliação e arquivamento de pagamentos trabalhistas e encargos</p></div><div class="end"><div class="who" id="who"></div></div></header>
  <div class="page" id="page"><div class="sk"></div><div class="sk" style="width:60%"></div></div>
</div>
<script>
const { $, $$, esc, api, toast } = G;
let ME = null, D = null, TAB = 'painel', SUB = 'diag', PERFIL = 'coordenacao', SEL = null, FSIT = '', FAL = '';
const F = { loja: '', cnpj: '', comp: '', de: '', ate: '', tipo: '', sit: '', busca: '' }, FG = { tipo: '', loja: '', cnpj: '', comp: '', venc: '', sit: '', busca: '' };
const ic = n => '<svg class="ds-ic"><use href="/icons.svg#' + n + '"/></svg>';
const brl = n => (+n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dBR = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '—';
const compTxt = c => c ? c.slice(5, 7) + '/' + c.slice(0, 4) : '—';
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const loja = n => D.LOJAS.find(l => l.n === +n) || {};
const etq = n => '<span class="etq' + (+n === 10 ? ' cd' : '') + '">' + esc(loja(n).txt) + '</span>';
const demoMsg = t => toast('Demonstração: ' + t + '. Nada foi gravado.');
const opts = (mapa, v, vazio) => '<option value="">' + vazio + '</option>' + Object.entries(mapa).map(([k, t]) => '<option value="' + k + '"' + (k === v ? ' selected' : '') + '>' + esc(t) + '</option>').join('');
const optLojas = v => '<option value="">Todas as unidades</option>' + D.LOJAS.map(l => '<option value="' + l.n + '"' + (String(l.n) === v ? ' selected' : '') + '>' + l.txt + ' · ' + esc(l.nome) + '</option>').join('');
const optCnpj = v => '<option value="">Todos os CNPJs</option>' + D.LOJAS.map(l => '<option value="' + l.n + '"' + (String(l.n) === v ? ' selected' : '') + '>' + l.txt + ' · ' + l.cnpj + '</option>').join('');
const comps = lista => [...new Set(lista.map(x => x.comp))].sort().reverse();
const optComp = (v, lista) => '<option value="">Todas</option>' + comps(lista).map(c => '<option value="' + c + '"' + (c === v ? ' selected' : '') + '>' + compTxt(c) + '</option>').join('');
const TIPO_CLS = { rescisao: 'neg', salario: 'inf', adiantamento: 'rx', ferias: 'am', decimo: 'inf', abono: 'gr', acordo: 'gr', outros: 'gr' };
const SIT_CLS = { liquidado: 'ok', agendado: 'info', enviado: 'info', processamento: 'info', aguardando_envio: 'warn', comprovante_indisponivel: 'warn', rejeitado: 'bad', devolvido: 'bad', divergente: 'bad' };
const GSIT_CLS = { aguardando: 'warn', paga: 'ok', vencida: 'bad', divergente: 'bad', duplicada: 'bad' };
const CL_DOC = { oficial: 'pos', importado: 'inf', guia: 'am', ordem: 'gr', demonstrativo: 'rx' };
const tipoTag = t => '<span class="tag ' + TIPO_CLS[t] + '">' + esc(D.TIPOS[t]) + '</span>';
const sitP = s => '<span class="pill ' + SIT_CLS[s] + '">' + esc(D.SITUACOES[s]) + '</span>';
