<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Robô · Econômico Supermercados</title>
<!-- Painel Robô (Tiago, 12/11/2026: "não podemos misturar, precificação já tem seu painel... quero um painel chamado robô").
     TV sem login, só leitura. Dados: /api/paineis-publico/robo-dados (lib/robo-ensaio.js), relido a cada 15 s.
     Mostra o ensaio do robô de compras + precificação: as 7 etapas e de quem é a vez. Com mais de um ensaio, troca a cada 20 s.
     Tela desenhada em 1920×1080 e encaixada no aparelho por transform (sem vh/vw, sem grid e sem animação CSS: o
     navegador das TVs é fraco — ver Painel Compras). ?kiosk=1 esconde o cursor. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0c0c0c;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:#f6f4ec}
#palco{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#0c0c0c;transform-origin:0 0}
.topo{position:absolute;left:0;top:0;width:1920px;height:112px;background:#151515;border-bottom:4px solid #FFD500}
.topo h1{position:absolute;left:40px;top:22px;font-size:50px;font-weight:800;letter-spacing:.5px}
.topo h1 b{color:#FFD500}
.topo .selo{position:absolute;left:560px;top:16px;height:80px;line-height:80px;padding:0 34px;background:#FFD500;color:#0c0c0c;font-size:46px;font-weight:800;border-radius:14px;white-space:nowrap}
.topo .dir{position:absolute;right:40px;top:20px;text-align:right}
.topo .hr{font-size:44px;font-weight:800;line-height:1}
.topo .sub{font-size:20px;color:#b9b6ab;margin-top:6px}
.ens{position:absolute;left:40px;top:128px;width:1840px;height:896px}
.ens h2{font-size:44px;font-weight:800;white-space:nowrap;overflow:hidden}
.ens h2 b{color:#FFD500}
.ens .sb{font-size:25px;color:#b9b6ab;margin:4px 0 14px;white-space:nowrap;overflow:hidden}
table{width:1840px;border-collapse:collapse;table-layout:fixed}
td{font-size:30px;padding:0 14px;height:106px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;border-bottom:1px solid #2a2a2a}
td.nu div{width:64px;height:64px;line-height:64px;border-radius:32px;background:#2a2a2a;color:#8f8c82;font-size:32px;font-weight:800;text-align:center}
td.tt b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis}
td.tt span{display:block;font-size:22px;color:#b9b6ab;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
td.st{text-align:right;font-size:24px;font-weight:800;color:#8f8c82}
tr.feito td.nu div{background:#22C55E;color:#0c0c0c}tr.feito td.st{color:#22C55E}
tr.agora td{background:#3a3000}tr.agora td.nu div{background:#FFD500;color:#0c0c0c}tr.agora td.st{color:#FFD500}tr.agora td.tt span{color:#f6f4ec}
tr.espera td.tt b{color:#8f8c82}tr.espera td.tt span{color:#6f6c63}
.vazio{padding:250px 0 0;text-align:center}
.vazio b{display:block;font-size:56px;font-weight:800;color:#f6f4ec}
.vazio span{display:block;font-size:30px;color:#b9b6ab;margin-top:18px}
.rod{position:absolute;left:40px;top:1034px;width:1840px;font-size:20px;color:#8f8c82;white-space:nowrap;overflow:hidden}
.rod.alerta{left:0;top:1026px;width:1920px;height:54px;line-height:54px;padding:0 40px;background:#FFD500;color:#0c0c0c;font-size:27px;font-weight:800}
.rod.ok{left:0;top:1026px;width:1920px;height:54px;line-height:54px;padding:0 40px;background:#22C55E;color:#0c0c0c;font-size:27px;font-weight:800}
.erro{color:#ff5a72}
body.kiosk{cursor:none}
</style>
</head>
<body>
<div id="palco">
  <div class="topo">
    <h1>PAINEL <b>ROBÔ</b></h1>
    <div class="selo" id="selo">COMPRAS + PREÇO</div>
    <div class="dir"><div class="hr" id="hr">--:--</div><div class="sub" id="sub">carregando…</div></div>
  </div>
  <div class="ens" id="ens"></div>
  <div class="rod" id="rod"></div>
</div>
<script>
var QS = new URLSearchParams(location.search);
if (QS.get('kiosk') === '1') document.body.className = 'kiosk';
var D = null, atual = 0;
function LJ(n) { return +n === 10 ? 'CD' : 'E' + n; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function money(v) { return 'R$ ' + (+v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function horaCurta(iso) { if (!iso) return ''; var d = new Date(iso); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function encaixar() {
  var p = document.getElementById('palco'), s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  p.style.transform = 'scale(' + s + ')';
  p.style.left = Math.max(0, (window.innerWidth - 1920 * s) / 2) + 'px';
  p.style.top = Math.max(0, (window.innerHeight - 1080 * s) / 2) + 'px';
}
function relogio() { var d = new Date(); document.getElementById('hr').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function desenhar() {
  if (!D) return;
  var ens = D.ensaios || [], rod = document.getElementById('rod');
  document.getElementById('sub').textContent = 'Ensaio nas lojas ' + (D.lojas || []).map(LJ).join(' e ') + ' · tudo no ERP de teste';
  if (!ens.length) {
    document.getElementById('ens').innerHTML = '<div class="vazio"><b>Nenhum ensaio do robô em andamento</b><span>Pra começar: Processos › Ensaio do Robô › Gerar pedido do robô</span></div>';
    rod.className = 'rod'; rod.innerHTML = 'Nenhum fornecedor é avisado no ensaio · compra e preço são gravados só no ERP de teste';
    return;
  }
  if (atual >= ens.length) atual = 0;
  var x = ens[atual];
  var linhas = x.etapas.map(function (e) {
    var st = e.status === 'feito' ? 'FEITO' + (e.em ? ' ' + horaCurta(e.em) : '') : e.status === 'agora' ? (e.quem === 'você' ? 'ESPERANDO APROVAÇÃO' : 'ROBÔ TRABALHANDO') : 'depois';
    return '<tr class="' + e.status + '"><td class="nu"><div>' + (e.status === 'feito' ? '✓' : e.n) + '</div></td><td class="tt"><b>' + esc(e.titulo) + '</b><span>' + esc(e.detalhe) + '</span></td><td class="st">' + st + '</td></tr>';
  }).join('');
  document.getElementById('ens').innerHTML = '<h2>ROBÔ DE COMPRAS · <b>ENSAIO</b> · pedido #' + x.id + ' · ' + esc(x.lista_nome) + (ens.length > 1 ? ' <span style="font-size:26px;color:#b9b6ab">(' + (atual + 1) + ' de ' + ens.length + ')</span>' : '') + '</h2>' +
    '<div class="sb">' + esc(x.fornecedor || '') + ' · lojas ' + x.lojas.map(LJ).join(' e ') + ' · ' + x.itens + ' itens · ' + money(x.total) + ' · nada vai pro fornecedor' + '</div>' +
    '<table><colgroup><col style="width:100px"><col style="width:1360px"><col style="width:380px"></colgroup>' + linhas + '</table>';
  var esperando = ens.filter(function (y) { return y.agora && y.agora.quem === 'você'; });
  if (esperando.length) { rod.className = 'rod alerta'; rod.innerHTML = 'ROBÔ ESPERANDO APROVAÇÃO · ' + esperando.map(function (y) { return 'pedido #' + y.id + ' ' + esc(y.lista_nome) + ': falta ' + esc(y.agora.pede || y.agora.titulo); }).join(' · '); }
  else if (ens.every(function (y) { return y.concluido; })) { rod.className = 'rod ok'; rod.innerHTML = 'CICLO COMPLETO · compra e preço gravados no ERP de teste'; }
  else { rod.className = 'rod'; rod.innerHTML = 'Robô trabalhando · nenhum fornecedor é avisado no ensaio · tudo no ERP de teste'; }
}
function proxima() { if (D && (D.ensaios || []).length > 1) { atual = (atual + 1) % D.ensaios.length; desenhar(); } }
function ler() {
  fetch('/api/paineis-publico/robo-dados?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'erro'); return j; }); })
    .then(function (j) { D = j; desenhar(); })
    .catch(function (e) { if (!D) document.getElementById('sub').innerHTML = '<span class="erro">sem dados: ' + esc(e.message) + '</span>'; });
}
window.tvSlideAtual = function () { var x = D && D.ensaios && D.ensaios[atual]; return x ? 'Ensaio #' + x.id + ' · ' + x.lista_nome : 'Sem ensaio'; };
window.addEventListener('resize', encaixar);
encaixar(); relogio(); ler();
setInterval(relogio, 20000); setInterval(ler, 15000); setInterval(proxima, 20000);
</script>
<script src="/tv-heartbeat.js" data-painel="robo" defer></script>
</body>
</html>
