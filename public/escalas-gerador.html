<title>Gerador de Escalas 5×2 — DP / RH · Econômico Supermercados</title>

     Validar Jornada e Folgas, Regras e cadastro, Consultar Auditoria. Motor em lib/escalas-gerador.js, serviço em
     lib/escalas-5x2.js, rotas /api/escalas-5x2/*. Mesma casca da tela de Escalas: rail nativo + barra de abas.

<body class="dsnav-pad">
<div class="content">
  <header class="topbar"><div><h1 id="tb-h1"><span class="crumb">DP / RH</span></h1><p id="tb-sub"></p></div><div class="end"><div class="who" id="who"></div></div></header>

<script>
const { $, $$, esc, api, toast, dBR } = G;
let ME = null, PAG = 'gerar', SUB = {}, SIM = null, DET = {}, ANA = {};
const ic = n => '<svg class="ds-ic"><use href="/icons.svg#' + n + '"/></svg>';
const lojaTxt = n => (ME.lojas.find(l => l.n === +n) || {}).txt || ('Loja ' + n); const lojaCod = n => lojaTxt(n).split(' · ')[0]; const lojaNome = n => lojaTxt(n).split(' · ')[1] || '';

  $$('#u-body [data-v]').forEach(a => a.onclick = () => { const r = T.registros[+a.dataset.v]; dlg({ titulo: r.acaoTxt, sub: (r.nome || r.usuario) + ' · ' + dt(r.em), largura: 860, corpo: (r.justificativa ? '<div class="aviso inf" style="margin:0">“' + esc(r.justificativa) + '”</div>' : '') + (r.alteracoes ? r.alteracoes.map(x => '<div><b>' + esc(x.nome) + '</b><div class="dif">' + bloco('Antes', x.antes) + bloco('Depois', x.depois) + '</div></div>').join('') : '<div class="dif">' + bloco('Antes', r.antes) + bloco('Depois', r.depois) + '</div>') }); });
  $$('#u-body [data-g]').forEach(a => a.onclick = async () => { try { const g = await api('/api/escalas-5x2/geracao/' + a.dataset.g); const ks = Object.keys(g.depois).sort((x, y) => x.split('|')[1].localeCompare(y.split('|')[1]) || x.localeCompare(y));
    dlg({ titulo: 'Geração ' + g.id, sub: g.nome + ' · ' + dt(g.em) + ' · ' + ks.length + ' dias' + (g.desfeita ? ' · DESFEITA em ' + dt(g.desfeita.em) + ' por ' + g.desfeita.nome : ''), largura: 860, corpo: '<div class="aviso inf" style="margin:0">“' + esc(g.justificativa) + '”' + (g.cienteDivergencias ? ' · RH confirmou ' + g.divergenciasContratuais.length + ' divergência(s) de contrato' : '') + '</div><div class="tw" style="max-height:440px;margin:0"><table class="t"><thead><tr><th>Dia</th><th>Funcionário</th><th>Antes</th><th>Depois</th></tr></thead><tbody>' + ks.slice(0, 1500).map(k => '<tr><td class="nw">' + dBR(k.split('|')[1]) + '</td><td>' + esc((g.nomes || {})[k.split('|')[0]] || k.split('|')[0]) + '</td><td>' + esc(resumoDia(g.antes[k])) + '</td><td>' + esc(resumoDia(g.depois[k])) + '</td></tr>').join('') + '</tbody></table></div>' }); } catch (e) { toast(e.message, 'neg'); } });
}
async function avisosTab() {
  const A = await sino(); if (!A) { $('#u-body').innerHTML = erroBox('Não foi possível ler os avisos'); return; }
  const fl = A.avisos.filter(a => (!SUB.audLoja || a.loja == null || String(a.loja) === String(SUB.audLoja)) && (!SUB.audMes || !a.mes || a.mes === SUB.audMes)); const NV = { critico: ['crítico', 'bad'], relevante: ['relevante', 'warn'], rotina: ['relatório diário', 'gr'] };
  const stD = d => '<div><b>' + esc(d.usuario) + '</b> · enviado ' + dt(d.enviado) + ' · ' + (d.entregue ? '<span style="color:var(--pos);font-weight:700">entregue ' + dt(d.entregue) + '</span>' : '<span style="color:var(--ink3)">ainda não entregue</span>') + ' · ' + (d.visto ? '<span style="color:var(--pos);font-weight:700">visto ' + dt(d.visto) + '</span>' : '<span style="color:var(--ink3)">não visto</span>') + '</div>';
  $('#u-body').innerHTML = '<div class="aviso inf">Alterações críticas e relevantes (escala aprovada alterada, geração aplicada ou desfeita, regra trabalhista, mexida do RH em domingo, feriado ou folga fixa) avisam a Coordenação na hora. As demais entram num relatório diário, enviado a partir das 18 h quando houve alteração' + (A.pendentes_rotina ? ' — <b>' + A.pendentes_rotina + ' aguardando o relatório de hoje</b>' : '') + '. Envio, entrega e visualização ficam registrados; não é exigida confirmação de leitura.</div>' +
    (fl.length ? '<div class="tw" style="max-height:680px"><table class="t"><thead><tr><th>Quando</th><th>Nível</th><th>Aviso</th><th>Destinatários · envio · entrega · visualização</th></tr></thead><tbody>' + fl.map(a => '<tr><td class="nw">' + dt(a.em) + '</td><td><span class="pill ' + NV[a.nivel][1] + '">' + NV[a.nivel][0] + '</span></td><td>' + esc(a.texto) + (a.itens ? '<small>' + a.itens.map(i => esc(dt(i.em) + ' · ' + i.texto)).join('<br>') + '</small>' : '') + '</td><td>' + (a.destinatarios.length ? a.destinatarios.map(stD).join('') : '<span style="color:var(--neg);font-weight:700">ninguém designado como Coordenação na central de pessoas</span>') + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="empty"><b>Nenhum aviso ainda</b>Os avisos aparecem aqui conforme as escalas forem geradas e alteradas.</div>') +
    '<p class="note">“Entregue” = o aviso chegou à sessão do destinatário (ele abriu o sistema). “Visto” = o destinatário abriu esta lista. Os avisos também caem no sino da Gestão de Pessoas.</p>';
  const meus = A.avisos.filter(a => a.meu && a.destinatarios.some(d => d.usuario === ME.usuario && !d.visto)).map(a => a.id); if (meus.length) { try { await api('/api/escalas-5x2/avisos/vistos', { body: { ids: meus } }); const b = $('#nv-av'); if (b) b.hidden = true; } catch (e) {} }
}
iniciar();
