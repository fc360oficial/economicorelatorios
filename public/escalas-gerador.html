<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/design-system.css">
<script src="/nav.js" defer></script>
<script src="/gente-ui.js"></script>
<title>Gerador de Escalas 5×2 — DP / RH · Econômico Supermercados</title>
<!-- DP / RH › Gerador de Escalas 5×2 (11/11/2026). Gerar (simular → aplicar como rascunho → desfazer), Analisar Cobertura,
     Validar Jornada e Folgas, Regras e cadastro, Consultar Auditoria. Motor em lib/escalas-gerador.js, serviço em
     lib/escalas-5x2.js, rotas /api/escalas-5x2/*. Mesma casca da tela de Escalas: rail nativo + barra de abas.
     Nada aqui publica escala nem escreve no ponto: a proposta vira rascunho e segue gerente → RH → Coordenação. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--font);background:var(--pap);color:var(--ink);min-height:100vh;font-size:13px}
.content{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:58px;background:var(--crd);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:40}
.topbar h1{font-size:16px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}.topbar h1 .crumb{color:var(--ink3);font-weight:600}.topbar h1 .ds-ic{color:var(--ink3)}
.topbar p{font-size:11.5px;color:var(--ink3);margin-top:1px}.topbar .end{margin-left:auto;display:flex;align-items:center;gap:12px}
.who{display:flex;align-items:center;gap:9px;font-size:12px}.who .ds-avatar{background:#101B33;color:#FFC933}.who b{display:block;font-size:12.5px}.who span{color:var(--ink3);font-size:11px}
.modnav{background:var(--crd);border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;align-items:stretch;padding:0 14px;position:sticky;top:58px;z-index:39}
.modnav a{display:flex;align-items:center;gap:6px;padding:0 12px;height:42px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;user-select:none;text-decoration:none}
.modnav a .ds-ic{width:15px;height:15px;color:var(--ink3)}.modnav a:hover{color:var(--ink)}.modnav a.on{color:var(--ink);border-bottom-color:var(--am)}.modnav a.on .ds-ic{color:var(--amk)}.modnav a.ext{margin-left:auto;color:var(--ink3)}
.modnav a small{background:var(--neg);color:#fff;border-radius:9px;font-size:10px;padding:1px 6px;font-weight:800}
.page{padding:20px 24px 40px;max-width:1700px;width:100%}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:9px 10px;margin-bottom:16px}
.tb .ds-input,.tb .ds-select{height:34px;font-size:12.5px}.tb .end{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tb .lbl{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px}
.aviso{background:var(--amw);border:1px solid var(--am-ln);color:var(--amk);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.5}.aviso.neg{background:var(--negw);border-color:#F1B9C3;color:var(--neg)}.aviso.inf{background:var(--infw);border-color:var(--inf);color:var(--inf)}.aviso.pos{background:var(--posw);border-color:#9AD9B5;color:var(--pos)}
.note{font-size:11.5px;color:var(--ink3);line-height:1.5;margin:10px 2px 0}
.empty{padding:36px 20px;text-align:center;color:var(--ink3);font-size:12.5px;background:var(--crd);border:1px dashed var(--ln2);border-radius:var(--r-lg)}.empty b{display:block;color:var(--ink2);font-size:13.5px;margin-bottom:3px}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--wsh) 25%,var(--ln) 50%,var(--wsh) 75%);background-size:200% 100%;animation:sk 1.3s ease infinite;margin:10px 14px}@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--posw);color:var(--pos)}.pill.bad{background:var(--negw);color:var(--neg)}.pill.warn{background:var(--amw);color:var(--amk)}.pill.info{background:var(--infw);color:var(--inf)}.pill.gr{background:var(--wsh);color:var(--ink2)}
.etq{display:inline-block;background:#101B33;color:#FFC933;font-weight:800;font-size:10px;padding:2px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}.etq.cd{background:var(--inf);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--ln2);background:var(--crd);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer;user-select:none;white-space:nowrap}.chip.on{background:#101B33;color:#FFC933;border-color:#101B33}.chip small{opacity:.75;margin-left:3px}.chip.neg small{color:var(--neg);opacity:1}.chip.on.neg small{color:#FFB4C0}
/* unidades simuladas */
.uns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
.un{background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:10px}.un.on{border-color:#101B33;box-shadow:0 0 0 2px #101B33}
.un .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.un .hd b{font-size:14px}
.un .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px}.un .nums div{text-align:center;background:var(--wsh);border-radius:8px;padding:7px 4px}.un .nums b{display:block;font-size:18px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}.un .nums span{font-size:9.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.3px;font-weight:700;line-height:1.2;display:block}
.un .nums b.neg{color:var(--neg)}.un .nums b.pos{color:var(--pos)}.un .nums b.am{color:var(--amk)}
.un ul{list-style:none;display:grid;gap:5px}.un li{font-size:12px;line-height:1.4;padding-left:14px;position:relative;color:var(--ink2)}.un li::before{content:'';position:absolute;left:2px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--neg)}.un li.inf::before{background:var(--ink3)}
.un .bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.un .gs{font-size:11.5px;color:var(--ink2);border-top:1px solid var(--ln);padding-top:8px;display:grid;gap:5px}.un .gs div{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.un .gs a{color:var(--inf);font-weight:700;cursor:pointer}
/* grade (mesma da Escala coletiva) */
.cal{overflow:auto;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg)}
table.cal{border-collapse:separate;border-spacing:2px;font-size:11px;background:var(--crd)}table.cal th{position:sticky;top:0;background:#101B33;font-size:9.5px;color:#fff;font-weight:800;padding:6px 3px;text-align:center;white-space:nowrap;z-index:1;line-height:1.25;border-radius:4px}
table.cal th small{display:block;font-weight:600;color:rgba(255,255,255,.75);font-size:9px}
table.cal th.fds{background:#FFC933;color:#14213D}table.cal th.fds small{color:#14213D}table.cal th.dom{background:#F7A325}table.cal th.fer{background:var(--neg);color:#fff}table.cal th.fer small{color:rgba(255,255,255,.8)}
table.cal th.n,table.cal td.n{text-align:left;position:sticky;left:0;background:var(--crd);z-index:2;min-width:200px;padding:5px 10px;border-radius:4px}table.cal th.n{background:#101B33;font-size:11.5px}
table.cal td.n b{display:block;color:var(--ink);font-weight:700;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;font-size:10.5px}table.cal td.n span{display:block;font-size:10px;color:var(--ink3);white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}
table.cal td{text-align:center;padding:3px 1px;min-width:40px;height:38px;vertical-align:middle;font-variant-numeric:tabular-nums;line-height:1.15;font-size:10.5px;border-radius:4px;background:var(--wsh)}
table.cal td.d{color:#14213D;font-weight:700}table.cal td.alt{box-shadow:inset 0 0 0 2px var(--inf)}table.cal td.fer{border-top:3px solid var(--neg)}table.cal td.vz{color:var(--ink3);background:transparent;font-weight:500}
table.cal td .a{display:block;font-size:9px;font-weight:500;color:#4A5370}table.cal td.folga{color:#6B7280;font-weight:800}table.cal td.ferias,table.cal td.afastado{color:#4C3D8F;font-weight:800}table.cal td.rot{color:#14213D;background:#D9D9D4}
table.cal td.tot{font-weight:800;text-align:center;padding:0 10px;background:#101B33;color:#fff;font-size:11.5px}
.cal-leg{display:flex;flex-wrap:wrap;gap:8px 22px;padding:10px 12px;font-size:11px;color:var(--ink2);border-top:1px solid var(--ln);background:var(--crd)}.cal-leg>span{display:flex;align-items:center;gap:7px}.cal-leg i{width:22px;height:14px;border-radius:4px;flex:none;display:inline-block}
.cal-leg b{display:block;color:var(--ink);font-size:11px}.cal-leg small{display:block;color:var(--ink3);font-size:10px}.cal-leg i.altx{background:var(--crd);box-shadow:inset 0 0 0 2px var(--inf)}.cal-leg i.ferx{background:var(--wsh);border-top:3px solid var(--neg)}
/* Etapa 4: legenda fixa embaixo da grade (acompanha a rolagem), início da semana marcado no cabeçalho, faixa de validação da semana em cada célula e bolinha por pessoa */
.cal-w{border:1px solid var(--ln);border-radius:var(--r-lg);background:var(--crd)}.cal-w>.cal{border:0;border-radius:var(--r-lg) var(--r-lg) 0 0}.cal-w>.cal-leg{position:sticky;bottom:0;z-index:4;border-radius:0 0 var(--r-lg) var(--r-lg);box-shadow:0 -4px 12px rgba(16,27,51,.10)}
table.cal th.seg{box-shadow:inset 3px 0 0 #FFC933}table.cal th.fds.seg{box-shadow:inset 3px 0 0 #101B33}
table.cal td.sx{box-shadow:inset 0 -4px 0 var(--neg)}table.cal td.sr{box-shadow:inset 0 -4px 0 #E0A100}table.cal td.alt.sx{box-shadow:inset 0 0 0 2px var(--inf),inset 0 -6px 0 var(--neg)}table.cal td.alt.sr{box-shadow:inset 0 0 0 2px var(--inf),inset 0 -6px 0 #E0A100}
table.cal td.n span i.vd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--pos)}table.cal td.n span i.vd.bad{background:var(--neg)}table.cal td.n span i.vd.warn{background:#E0A100}
.cal-leg i.sxx{background:var(--wsh);box-shadow:inset 0 -4px 0 var(--neg)}.cal-leg i.srx{background:var(--wsh);box-shadow:inset 0 -4px 0 #E0A100}
.val52{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2);padding:9px 12px;border:1px solid var(--ln);border-radius:var(--r-lg);background:var(--crd);margin-bottom:10px}.val52 b{color:var(--ink)}.val52 .pill{margin-right:5px}
td.sem{cursor:pointer}td.sem.cz{background:#E4E4E1;color:#4B5563}
/* Etapa 5 · motor de validação semanal: indicador por funcionário e semana (verde / amarelo / vermelho / cinza) e o detalhe da semana */
.niv{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}.niv.verde{background:var(--pos)}.niv.amarelo{background:#E0A100}.niv.vermelho{background:var(--neg)}.niv.cinza{background:#9CA3AF}
table.cal td.sg{box-shadow:inset 0 -4px 0 #9CA3AF}table.cal td.alt.sg{box-shadow:inset 0 0 0 2px var(--inf),inset 0 -6px 0 #9CA3AF}.cal-leg i.sgx{background:var(--wsh);box-shadow:inset 0 -4px 0 #9CA3AF}table.cal td.n span i.vd.cz{background:#9CA3AF}table.cal td[data-pw]{cursor:pointer}
.sd7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.sd7>div{border:1px solid var(--ln);border-radius:8px;padding:6px 3px;text-align:center;background:var(--wsh);line-height:1.3}.sd7 b{display:block;font-size:10px;color:var(--ink3);text-transform:uppercase;font-weight:700}.sd7 strong{display:block;font-size:12px;color:#14213D;font-variant-numeric:tabular-nums;margin:2px 0}.sd7 small{display:block;font-size:9.5px;color:#4A5370;min-height:12px}
.sd7>div.env{box-shadow:0 0 0 2px var(--neg)}.sd7>div.fora{border-style:dashed}.sd7>div.prot small{font-weight:700}
.vit{border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;display:grid;gap:3px;color:var(--ink2)}.vit b{color:var(--ink)}.vit small{color:var(--ink3);font-size:11px}.vit.bloqueio{border-left:4px solid var(--neg)}.vit.alerta{border-left:4px solid #E0A100}.vit.info{border-left:4px solid var(--ln2)}
.f-md .bd h4.st{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin:4px 0 -4px}.f-md .bd .tw{margin-bottom:0}.tur{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin:0 2px 10px}.tur i{display:inline-block;width:22px;height:14px;border-radius:4px;vertical-align:-3px;margin-right:6px}.tur b{color:var(--ink)}
table.t input.esp{width:100%;min-width:170px}
/* mesma régua da Escala coletiva: os 31 dias cabem sem rolagem em 1600/1366/1280 (as faixas apertam fonte e largura; nada some) */
table.cal{width:100%}table.hm{width:100%}
@media (max-width:1699px){table.cal td{min-width:34px;font-size:10px;padding:3px 0}table.cal td .a{font-size:8.5px}table.cal th.n,table.cal td.n{min-width:170px}table.cal td.n b{max-width:180px}table.cal td.n span{max-width:180px}table.cal th{font-size:9px;padding:5px 2px}table.cal td.tot{padding:0 6px;font-size:11px}.cal-leg{gap:6px 16px;padding:8px 10px}table.hm td{min-width:30px;font-size:10.5px}table.hm th.s,table.hm td.s{min-width:170px}}
@media (max-width:1399px){table.cal td{min-width:29px;font-size:9px}table.cal td .a{font-size:8px;line-height:1.1}table.cal th.n,table.cal td.n{min-width:150px;padding:4px 8px}table.cal td.n b{max-width:160px;font-size:10px}table.cal td.n span{max-width:160px;font-size:9.5px}table.cal th{font-size:8.5px;padding:4px 1px}table.cal th.n{font-size:10.5px}table.cal td.tot{padding:0 4px;font-size:10px}.cal-leg{font-size:10px}.cal-leg i{width:18px;height:12px}.tb .lbl{font-size:10px}table.hm td{min-width:26px;font-size:9.5px;height:30px}table.hm th{font-size:8.5px;padding:4px 1px}table.hm th.s,table.hm td.s{min-width:150px;padding:4px 8px}}
@media (max-width:1299px){table.cal td{min-width:26px;font-size:8.5px}table.cal td .a{font-size:7.5px}table.cal th.n,table.cal td.n{min-width:140px;padding:3px 6px}table.cal td.n b{max-width:150px}table.cal td.n span{max-width:150px}table.cal td.tot{padding:0 3px;font-size:9.5px}table.cal th{font-size:8px;padding:4px 0}.tb{gap:6px}.tb .ds-btn{padding-left:9px;padding-right:9px}table.hm td{min-width:24px;font-size:9px}table.hm th.s,table.hm td.s{min-width:135px}}
@media (max-width:1199px){table.cal td{min-width:26px;font-size:8.5px;height:34px}table.cal td .a{font-size:7.5px}table.cal th.n,table.cal td.n{min-width:130px;padding:3px 6px}table.cal td.n b{max-width:140px;font-size:9.5px}table.cal td.n span{max-width:140px;font-size:9px}table.cal th{font-size:8px}table.cal td.tot{font-size:9.5px}}
/* tabelas e blocos */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.kpi{background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:12px 14px;cursor:default}.kpi .l{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:3px;font-variant-numeric:tabular-nums}.kpi .s{font-size:11px;color:var(--ink3);margin-top:2px}.kpi.neg .v{color:var(--neg)}.kpi.pos .v{color:var(--pos)}.kpi.am .v{color:var(--amk)}
.tw{overflow:auto;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);margin-bottom:16px}
table.t{width:100%;border-collapse:collapse;font-size:12px}table.t th{text-align:left;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);padding:8px 10px;background:var(--wsh);font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:1}table.t td{padding:7px 10px;border-top:1px solid var(--ln);color:var(--ink2);vertical-align:middle;white-space:normal;line-height:1.4}table.t th.r,table.t td.r{text-align:right}table.t th.c,table.t td.c{text-align:center}
table.t td b{color:var(--ink)}table.t td small{display:block;color:var(--ink3);font-size:10.5px}table.t tbody tr:hover td{background:var(--amw)}table.t td.nw{white-space:nowrap}
table.t input,table.t select{padding:4px 6px;border:1px solid var(--ln2);border-radius:6px;font:inherit;font-size:12px;background:var(--crd);color:var(--ink)}table.t input[type=time]{width:92px}table.t tr.sujo td{background:var(--amw)}
.dsm{display:inline-flex;gap:2px}.dsm label{width:20px;height:22px;border:1px solid var(--ln2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--ink3);cursor:pointer;user-select:none}.dsm input{display:none}.dsm label.on{background:#101B33;color:#FFC933;border-color:#101B33}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px;flex-wrap:wrap}.sec h2{font-size:14.5px;font-weight:800;letter-spacing:-.2px}.sec h2 small{color:var(--ink3);font-weight:600;margin-left:6px;font-size:11.5px}.sec .acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sec:first-child{margin-top:0}
/* cobertura: calor dias × setores */
table.hm{border-collapse:separate;border-spacing:2px;font-size:11px}table.hm th{background:#101B33;color:#fff;font-size:9.5px;font-weight:800;padding:6px 3px;text-align:center;border-radius:4px;line-height:1.25;white-space:nowrap}table.hm th small{display:block;font-weight:600;color:rgba(255,255,255,.75);font-size:9px}table.hm th.fds{background:#FFC933;color:#14213D}table.hm th.fds small{color:#14213D}table.hm th.fer{background:var(--neg)}
table.hm th.s,table.hm td.s{text-align:left;position:sticky;left:0;z-index:2;min-width:190px;padding:6px 10px}table.hm td.s{background:var(--crd);font-weight:700;color:var(--ink)}table.hm td.s small{display:block;color:var(--ink3);font-weight:600;font-size:10px}
table.hm td{min-width:34px;height:34px;text-align:center;border-radius:4px;font-weight:800;font-variant-numeric:tabular-nums;cursor:default}table.hm td.c{cursor:pointer}
td.h0{background:#CDEFD9;color:#0D5C34}td.h1{background:#FFEBA8;color:#6B4E00}td.h2{background:#F9B9A6;color:#7A2613}td.h3{background:#EE8A95;color:#5E0F1F}td.hn{background:var(--wsh);color:var(--ink3);font-weight:500}td.hsel{box-shadow:inset 0 0 0 2px #101B33}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin:8px 2px 14px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
/* semanas por pessoa */
td.sem{white-space:nowrap;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}td.sem small{font-weight:600}td.sem.ok{background:#E7F7EC;color:#0D5C34}td.sem.car{background:#FFF3C9;color:#6B4E00}td.sem.bad{background:#FBDDE2;color:#8E1F33}td.sem.par{background:var(--wsh);color:var(--ink3)}
/* modal */
.f-ov{position:fixed;inset:0;background:rgba(10,17,32,.55);z-index:9000;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.f-md{background:var(--crd);color:var(--ink);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.f-md .hd{background:#101B33;color:#fff;padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.f-md .hd b{font-size:14px}.f-md .hd small{display:block;color:#B7C0D6;font-size:11.5px;font-weight:600;margin-top:2px}.f-md .x{background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1}

<body class="dsnav-pad">
<div class="content">
  <header class="topbar"><div><h1 id="tb-h1"><span class="crumb">DP / RH</span></h1><p id="tb-sub"></p></div><div class="end"><div class="who" id="who"></div></div></header>
  <nav class="modnav" id="modnav"></nav>
  <div class="page" id="page"><div class="sk"></div><div class="sk" style="width:60%"></div></div>
</div>
<script>
const { $, $$, esc, api, toast, dBR } = G;
let ME = null, PAG = 'gerar', SUB = {}, SIM = null, DET = {}, ANA = {};
const ic = n => '<svg class="ds-ic"><use href="/icons.svg#' + n + '"/></svg>';
const lojaTxt = n => (ME.lojas.find(l => l.n === +n) || {}).txt || ('Loja ' + n); const lojaCod = n => lojaTxt(n).split(' · ')[0]; const lojaNome = n => lojaTxt(n).split(' · ')[1] || '';
const etq = n => '<span class="etq' + (+n === 10 ? ' cd' : '') + '">' + esc(lojaCod(n)) + '</span>';
const setTxt = s => (ME.setores.find(x => x.id === s) || {}).txt || (s ? s.charAt(0) + s.slice(1).toLowerCase() : '—');
const stPill = st => '<span class="pill ' + ({ rascunho: 'gr', enviada_rh: 'info', validada_rh: 'warn', aprovada: 'ok', devolvida: 'bad' }[st] || 'gr') + '">' + esc(ME.status[st] || st) + '</span>';
const dt = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') + ' ' + new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';
const dCurta = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : ''; const mesBR = m => m.split('-').reverse().join('/');
const hh = m => m == null ? '—' : Math.floor(m / 60) + 'h' + String(Math.round(m) % 60).padStart(2, '0');
const skel = () => '<div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div>';
const erroBox = e => '<div class="aviso neg">' + esc(e.message || e) + '</div>';
const DSEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'], DL = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'], DNOME = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const diasMes = mes => { const [a, m] = mes.split('-').map(Number); const n = new Date(a, m, 0).getDate(); return Array.from({ length: n }, (_, i) => mes + '-' + String(i + 1).padStart(2, '0')); };
const dw = d => new Date(d + 'T12:00:00').getDay();
const selLoja = v => ME.lojas.map(l => '<option value="' + l.n + '"' + (String(l.n) === String(v) ? ' selected' : '') + '>' + esc(l.txt) + '</option>').join('');
const NAV = [{ id: 'gerar', txt: 'Gerar Escala 5×2', ic: 'calendar', sub: 'Simule, confira e aplique como rascunho — nada é publicado daqui' }, { id: 'cobertura', txt: 'Analisar Cobertura', ic: 'dashboard', sub: 'Onde a escala da grade fica abaixo do mínimo, por setor e por dia' }, { id: 'validar', txt: 'Validar Jornada e Folgas', ic: 'shield', sub: 'Semanas 5×2, carga, descansos e domingos da escala que está na grade' },
  { id: 'regras', txt: 'Regras e cadastro', ic: 'settings', sub: 'Convenções por unidade e categoria, folga fixa, restrições, reforço de pico e pesos por dia' }, { id: 'auditoria', txt: 'Consultar Auditoria', ic: 'list', sub: 'Quem fez o quê, antes e depois, e os avisos enviados à Coordenação' }];
function ir(p) { const n = NAV.find(x => x.id === p); if (!n) return; PAG = p; $$('#modnav a[data-p]').forEach(a => a.classList.toggle('on', a.dataset.p === p)); $('#tb-h1').innerHTML = '<span class="crumb">DP / RH · Gerador de Escalas 5×2</span>' + ic('chevron-right') + esc(n.txt); $('#tb-sub').textContent = n.sub; history.replaceState(null, '', location.pathname + '#' + p); $('#page').innerHTML = skel(); ({ gerar, cobertura, validar, regras, auditoria })[p](); }
async function iniciar() {
  $('#modnav').innerHTML = NAV.map(n => '<a data-p="' + n.id + '">' + ic(n.ic) + '<span>' + esc(n.txt) + '</span>' + (n.id === 'auditoria' ? '<small id="nv-av" hidden></small>' : '') + '</a>').join('') + '<a class="ext" href="/escalas.html#coletiva">' + ic('calendar') + '<span>Abrir a grade de Escalas</span></a>'; $$('#modnav a[data-p]').forEach(a => a.onclick = () => ir(a.dataset.p));
  try { ME = await api('/api/escalas-5x2/me'); } catch (e) { $('#page').innerHTML = e.status === 403 ? '<div class="aviso neg"><b>Você não está entre os designados da central de pessoas.</b> O gerador usa os mesmos papéis das Escalas (gerente da loja, RH, Coordenação, Diretoria): peça a designação em DP / RH › Gestão de Pessoas › Configurações.</div>' : erroBox(e); return; }
  const PAP = { gerente: 'Gerente', rh_ponto: 'RH Ponto', rh_doc: 'RH Documentação', rh_adm: 'RH Admissões', coordenacao: 'Coordenação', diretoria: 'Diretoria', juridico: 'Jurídico', ti: 'TI', financeiro: 'Financeiro', cpd: 'CPD' };
  const pp = ME.papeis.map(p => PAP[p] || p); $('#who').innerHTML = '<div class="ds-avatar">' + esc(ME.nome.split(' ').slice(0, 2).map(s => s[0]).join('')) + '</div><div><b>' + esc(ME.nome) + '</b><span>' + esc(pp.length ? pp.join(' · ') : 'sem papel') + '</span></div>';
  if (!ME.lojas.length) { $('#page').innerHTML = '<div class="aviso neg">Seu papel não tem unidade associada. Peça à Coordenação para designar a(s) loja(s).</div>'; return; }
  const q = new URLSearchParams(location.search); const lq = +q.get('loja'), mq = q.get('mes'); const prox = (() => { const d = new Date(ME.hoje + 'T12:00:00'); d.setDate(1); d.setMonth(d.getMonth() + 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); })();
  SUB = { loja: ME.lojas.some(l => l.n === lq) ? lq : ME.lojas[0].n, mes: /^\d{4}-\d{2}$/.test(mq || '') ? mq : prox, de: '', lojasSel: [] }; SUB.lojasSel = [SUB.loja]; SUB.mesGerar = SUB.mes < ME.hoje.slice(0, 7) ? prox : SUB.mes;
  const h = location.hash.replace('#', ''); ir(NAV.some(n => n.id === h) ? h : 'gerar'); sino();
}
async function sino() { try { const a = await api('/api/escalas-5x2/avisos'); const b = $('#nv-av'); if (b) { b.hidden = !a.nao_vistos; b.textContent = a.nao_vistos; } return a; } catch (e) { return null; } }
// diálogo genérico: ok(ov) pode lançar erro (fica aberto mostrando a mensagem)
function dlg({ titulo, sub, corpo, okTxt, largura, ok, aoAbrir, perigo }) {
  const ov = document.createElement('div'); ov.className = 'f-ov';
  ov.innerHTML = '<div class="f-md" style="max-width:' + (largura || 640) + 'px"><div class="hd"><div><b>' + esc(titulo) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div><button class="x" type="button">×</button></div><div class="bd">' + corpo + '<div id="d-msg"></div><div class="acoes"><button class="ds-btn ds-btn-ghost" id="d-c" type="button">' + (ok ? 'Cancelar' : 'Fechar') + '</button>' + (ok ? '<button class="ds-btn ' + (perigo ? 'ds-btn-danger' : 'ds-btn-primary') + '" id="d-ok" type="button">' + esc(okTxt || 'Confirmar') + '</button>' : '') + '</div></div></div>';
  document.body.appendChild(ov); const fechar = () => ov.remove(); ov.querySelector('.x').onclick = fechar; ov.querySelector('#d-c').onclick = fechar;
  if (ok) ov.querySelector('#d-ok').onclick = async () => { const b = ov.querySelector('#d-ok'); b.disabled = true; try { await ok(ov); fechar(); } catch (e) { ov.querySelector('#d-msg').innerHTML = '<div class="aviso neg" style="margin:0">' + esc(e.message) + (e.lista ? '<ul style="margin:6px 0 0 16px">' + e.lista.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '') + '</div>'; b.disabled = false; } };
  if (aoAbrir) aoAbrir(ov); const f = ov.querySelector('textarea,input:not([type=checkbox])'); if (f) setTimeout(() => f.focus(), 30); return ov;
}
// resumo dos quatro indicadores da validação semanal (por funcionário e semana)
const nivelTxt = v => v ? '<span>' + ['verde', 'amarelo', 'vermelho', 'cinza'].map(k => '<span title="' + ({ verde: 'escala válida', amarelo: 'exige conferência', vermelho: 'bloqueio de publicação', cinza: 'semana excepcional ou fora da regra comum' })[k] + '" style="margin-right:10px;white-space:nowrap"><i class="niv ' + k + '"></i><b>' + v[k] + '</b> ' + ({ verde: 'válidas', amarelo: 'a conferir', vermelho: 'com bloqueio', cinza: 'excepcionais' })[k] + '</span>').join('') + '</span>' : '';
const justCampo = (rot, min) => '<label>' + esc(rot || 'Justificativa') + ' <small>(obrigatória' + (min ? ', mínimo de ' + min + ' caracteres' : '') + ' — fica na auditoria com seu nome, data e hora)</small><textarea id="d-just" rows="3"></textarea></label>';
const resumoDia = c => !c ? 'contratual' : c.tipo === 'trabalho' ? (c.entrada || '?') + '–' + (c.saida || '?') + (c.almoco_ini ? ' (' + c.almoco_ini + '–' + c.almoco_fim + ')' : '') + (c.setor ? ' · ' + setTxt(c.setor) : '') : (ME.tipos[c.tipo] || c.tipo) + (c.folga ? ' ' + c.folga : '');

// ══ A · Gerar Escala 5×2 ══════════════════════════════════════════════════════════════════════════════
function gerar() {
  const el = $('#page');
  el.innerHTML = '<div class="tb"><span class="lbl">Mês</span><input type="month" class="ds-input" id="g-mes" value="' + SUB.mesGerar + '" min="' + ME.hoje.slice(0, 7) + '"><span class="lbl">A partir de</span><input type="date" class="ds-input" id="g-de" value="' + (SUB.de || '') + '" title="Vazio = primeiro dia futuro do mês (no mês corrente, amanhã). Dias passados nunca são alterados.">' +
    '<span class="lbl">Unidades</span><div class="chips" id="g-lojas">' + (ME.lojas.length > 1 ? '<span class="chip" data-l="*">todas</span>' : '') + ME.lojas.map(l => '<span class="chip' + (SUB.lojasSel.includes(l.n) ? ' on' : '') + '" data-l="' + l.n + '">' + esc(l.txt.split(' · ')[0]) + ' <small>' + esc(l.txt.split(' · ')[1] || '') + '</small></span>').join('') + '</div>' +
    '<div class="end"><button class="ds-btn ds-btn-primary" id="g-sim">' + ic('refresh') + 'Simular</button></div></div><div id="g-body"></div><div id="g-det"></div>';
  $('#g-mes').onchange = () => { SUB.mesGerar = $('#g-mes').value; SUB.de = ''; $('#g-de').value = ''; };
  $('#g-de').onchange = () => { SUB.de = $('#g-de').value; };
  $$('#g-lojas .chip').forEach(c => c.onclick = () => { if (c.dataset.l === '*') SUB.lojasSel = SUB.lojasSel.length === ME.lojas.length ? [] : ME.lojas.map(l => l.n); else { const n = +c.dataset.l; SUB.lojasSel = SUB.lojasSel.includes(n) ? SUB.lojasSel.filter(x => x !== n) : [...SUB.lojasSel, n]; } $$('#g-lojas .chip').forEach(x => x.classList.toggle('on', x.dataset.l !== '*' && SUB.lojasSel.includes(+x.dataset.l))); });
  $('#g-sim').onclick = simular;
  if (SIM && SIM.mes === SUB.mesGerar) desenharSim(); else $('#g-body').innerHTML = '<div class="empty"><b>Escolha o mês e as unidades e clique em Simular</b>A simulação lê o quadro, as jornadas contratuais, as férias e os afastamentos do ponto e monta a proposta 5×2.<br>Nada é gravado: a escala só muda quando o RH aplica a proposta como rascunho, e mesmo assim ela segue o fluxo de aprovação.</div>';
}
async function simular() {
  if (!SUB.lojasSel.length) { toast('Escolha ao menos uma unidade', 'neg'); return; }
  const b = $('#g-sim'); b.disabled = true; $('#g-det').innerHTML = ''; $('#g-body').innerHTML = '<div class="aviso inf">Simulando ' + SUB.lojasSel.length + ' unidade(s)… a primeira leitura do quadro no ponto pode levar até 1 minuto.</div>' + skel();
  try { SIM = await api('/api/escalas-5x2/simular', { body: { mes: SUB.mesGerar, lojas: SUB.lojasSel.slice().sort((a, c) => a - c), aPartirDe: SUB.de || null } }); DET = {}; SUB.aberta = null; desenharSim(); }
  catch (e) { $('#g-body').innerHTML = erroBox(e); } finally { b.disabled = false; }
}
function desenharSim() {
  const num = (v, l, cls) => '<div><b class="' + (cls || '') + '">' + v + '</b><span>' + l + '</span></div>';
  $('#g-body').innerHTML = '<div class="uns">' + SIM.unidades.map(u => {
    if (u.erro) return '<div class="un"><div class="hd"><b>' + etq(u.loja) + esc(lojaNome(u.loja)) + '</b><span class="pill bad">não simulada</span></div><div class="aviso neg" style="margin:0">' + esc(u.erro) + '</div></div>';
    const I = u.indicadores, A = u.aplicacao, podeAplicar = A.permitida, ultima = u.geracoes.find(g => !g.desfeita);
    const infos = ['Período: ' + dBR(u.de) + ' a ' + dBR(u.ate) + ' · ' + I.funcionarios + ' funcionários', u.travados ? u.travados + ' dia(s) ajustado(s) à mão serão preservados' : null, u.geradosAtuais ? u.geradosAtuais + ' dia(s) de geração anterior serão trocados (reprocessamento)' : null,
      u.semFolgaFixaRH ? u.semFolgaFixaRH + ' sem folga fixa definida pelo RH (usando a do contrato)' : null,
      u.duasFolgas ? 'Duas folgas por semana (F + FR): ' + u.duasFolgas.ok + ' de ' + u.duasFolgas.semanas + ' semanas com exatamente 2' + (u.duasFolgas.analiseRH ? ' · ' + u.duasFolgas.analiseRH + ' com férias/afastamento para análise do RH' : '') + (u.duasFolgas.excecao ? ' · ' + u.duasFolgas.excecao + ' com exceção do RH' : '') : null,
      u.transicao && u.transicao.necessaria ? 'Semana de transição ' + dCurta(u.transicao.semana.inicio) + '–' + dCurta(u.transicao.semana.fim) + ': os dias antes de ' + dCurta(u.de) + ' vêm do histórico e não são alterados' + (u.transicao.herdados ? ' (' + u.transicao.herdados + ' com excesso já ocorrido)' : '') : null,
      u.historico ? 'Histórico: ' + (u.historico.fonte === 'ponto' ? 'apuração do ponto' : 'só o planejado (ponto indisponível)') + ' · ' + u.historico.trabalho + ' dia(s) com marcação, ' + u.historico.descanso + ' descanso(s) identificado(s)' + (u.historico.indefinido ? ', ' + u.historico.indefinido + ' sem marcação a validar' : '') + (u.historico.naoConfirmado ? ', ' + u.historico.naoConfirmado + ' não confirmado(s)' : '') : null,
      u.pesos && u.pesos.diasPesados.length ? 'Dias de maior movimento (' + u.pesos.diasPesados.map(d => DSEM[d]).join(', ') + '): ' + u.pesos.folgasEmDiaPesado + ' folga(s) rotativa(s) neles, de ' + u.pesos.menorPorPessoa + ' a ' + u.pesos.maiorPorPessoa + ' por pessoa' : null, A.novaVersao ? 'Escala APROVADA: aplicar abre a versão ' + (u.versao + 1) + ' e mantém a publicada guardada' : null, A.exigeCiencia ? A.exigeCiencia + ' com jornada planejada diferente da contratual (o RH confirma ao aplicar)' : null].filter(Boolean);
    return '<div class="un' + (SUB.aberta === u.loja ? ' on' : '') + '" data-l="' + u.loja + '"><div class="hd"><b>' + etq(u.loja) + esc(lojaNome(u.loja)) + '</b><span>' + (podeAplicar ? '<span class="pill ok">pode aplicar</span>' : '<span class="pill bad">' + A.pendencias.length + ' pendência(s)</span>') + ' ' + (u.existe ? stPill(u.status) : '<span class="pill gr">sem escala no mês</span>') + '</span></div>' +
      '<div class="nums">' + num(I.pct_semanas_5x2 == null ? '—' : String(I.pct_semanas_5x2).replace('.', ',') + '%', 'semanas em 5×2', I.pct_semanas_5x2 === 100 ? 'pos' : 'am') + num(u.bloqueiosTrabalhistas, 'conflitos trabalhistas', u.bloqueiosTrabalhistas ? 'neg' : 'pos') + num(u.cobertura.dias_com_deficit + '/' + u.cobertura.dias, 'dias com buraco', u.cobertura.dias_com_deficit ? 'am' : 'pos') +
      num(hh(I.media_semanal_min), 'média semanal') + num(I.domingos_trabalhados, 'domingos trabalhados') + num(I.divergencias_contratuais, 'contrato × escala', I.divergencias_contratuais ? 'am' : '') + '</div>' +
      '<ul>' + A.pendencias.map(p => '<li>' + esc(p.texto) + '</li>').join('') + (u.sugestaoInicio ? '<li class="inf">Começando na segunda-feira não há semana de transição: <a data-seg="' + u.sugestaoInicio + '" style="color:var(--inf);font-weight:800;cursor:pointer">simular a partir de ' + dCurta(u.sugestaoInicio) + '</a></li>' : '') + infos.map(t => '<li class="inf">' + esc(t) + '</li>').join('') + '</ul>' +
      '<div class="bt"><button class="ds-btn ds-btn-secondary" data-ver="' + u.loja + '">Ver proposta</button><button class="ds-btn ds-btn-primary" data-ap="' + u.loja + '"' + (podeAplicar ? '' : ' disabled title="Resolva as pendências acima"') + '>Aplicar como rascunho</button></div>' +
      (u.geracoes.length ? '<div class="gs">' + u.geracoes.slice(0, 3).map(g => '<div><span><b>' + esc(g.id) + '</b> · ' + dt(g.em) + ' · ' + esc(g.nome) + ' · ' + g.dias + ' dias' + (g.desfeita ? ' · <span style="color:var(--neg);font-weight:700">desfeita</span>' : '') + '</span>' + (ultima && g.id === ultima.id && ME.lojas.find(l => l.n === u.loja).aplica ? '<a data-desf="' + esc(g.id) + '" data-l="' + u.loja + '">desfazer</a>' : '') + '</div>').join('') + '</div>' : '') + '</div>'; }).join('') + '</div>';
  $$('#g-body [data-ver]').forEach(b => b.onclick = () => verProposta(+b.dataset.ver));
  $$('#g-body [data-ap]').forEach(b => b.onclick = () => aplicarDlg(+b.dataset.ap));
  $$('#g-body [data-desf]').forEach(b => b.onclick = () => desfazerDlg(+b.dataset.l, b.dataset.desf));
  $$('#g-body [data-seg]').forEach(b => b.onclick = () => { SUB.de = b.dataset.seg; const i = $('#g-de'); if (i) i.value = SUB.de; simular(); });
  if (SUB.aberta && DET[SUB.aberta]) desenharDet(SUB.aberta);
}
async function verProposta(loja) {
  SUB.aberta = loja; $$('#g-body .un').forEach(c => c.classList.toggle('on', +c.dataset.l === loja)); $('#g-det').innerHTML = skel();

    (T.registros.length ? '<div class="tw" style="max-height:680px"><table class="t"><thead><tr><th>Quando</th><th>Quem</th><th>Origem</th><th>O que foi feito</th><th>Unidade · mês</th><th>Justificativa</th><th>Antes → depois</th></tr></thead><tbody>' + T.registros.map((r, i) => '<tr><td class="nw">' + dt(r.em) + '</td><td><b>' + esc(r.nome || r.usuario || '—') + '</b><small>' + esc(r.usuario || '') + '</small></td><td><span class="pill ' + ORI[r.origem][1] + '">' + ORI[r.origem][0] + '</span></td><td><b>' + esc(r.acaoTxt) + '</b>' + (r.validacao && r.validacao.ok != null ? ' <span class="pill ' + (r.validacao.ok ? 'ok' : 'bad') + '">' + (r.validacao.ok ? 'validação ok' : 'semana inválida') + '</span>' : '') + '<small>' + esc([r.ref, r.detalhe].filter(Boolean).join(' · ')) + (r.hash ? ' · #' + r.seq + ' ' + esc(r.hash) : '') + '</small></td><td class="nw">' + (r.loja != null ? esc(lojaCod(r.loja)) : 'rede') + (r.mes ? ' · ' + mesBR(r.mes) : '') + '</td><td>' + esc(r.justificativa || '—') + '</td><td>' + esc(mud(r)) + ((r.antes || r.depois || r.alteracoes) ? ' <a data-v="' + i + '" style="color:var(--inf);font-weight:700;cursor:pointer">ver</a>' : '') + (r.acao === 'gerar_aplicar' ? ' <a data-g="' + esc(r.ref) + '" style="color:var(--inf);font-weight:700;cursor:pointer">dias da geração</a>' : '') + '</td></tr>').join('') + '</tbody></table></div>' + (T.total > T.registros.length ? '<p class="note">mostrando os ' + T.registros.length + ' mais recentes de ' + T.total + '</p>' : '') : '<div class="empty"><b>Nenhum registro com esse filtro</b>Aqui aparecem as gerações aplicadas e desfeitas, as alterações de dia na grade (com antes e depois), o fluxo de aprovação, as regras e o cadastro.</div>');

  $$('#u-body [data-v]').forEach(a => a.onclick = () => { const r = T.registros[+a.dataset.v]; dlg({ titulo: r.acaoTxt, sub: (r.nome || r.usuario) + ' · ' + dt(r.em), largura: 860, corpo: (r.justificativa ? '<div class="aviso inf" style="margin:0">“' + esc(r.justificativa) + '”</div>' : '') + (r.alteracoes ? r.alteracoes.map(x => '<div><b>' + esc(x.nome) + '</b><div class="dif">' + bloco('Antes', x.antes) + bloco('Depois', x.depois) + '</div></div>').join('') : '<div class="dif">' + bloco('Antes', r.antes) + bloco('Depois', r.depois) + '</div>') }); });
  $$('#u-body [data-g]').forEach(a => a.onclick = async () => { try { const g = await api('/api/escalas-5x2/geracao/' + a.dataset.g); const ks = Object.keys(g.depois).sort((x, y) => x.split('|')[1].localeCompare(y.split('|')[1]) || x.localeCompare(y));
    dlg({ titulo: 'Geração ' + g.id, sub: g.nome + ' · ' + dt(g.em) + ' · ' + ks.length + ' dias' + (g.desfeita ? ' · DESFEITA em ' + dt(g.desfeita.em) + ' por ' + g.desfeita.nome : ''), largura: 860, corpo: '<div class="aviso inf" style="margin:0">“' + esc(g.justificativa) + '”' + (g.cienteDivergencias ? ' · RH confirmou ' + g.divergenciasContratuais.length + ' divergência(s) de contrato' : '') + '</div><div class="tw" style="max-height:440px;margin:0"><table class="t"><thead><tr><th>Dia</th><th>Funcionário</th><th>Antes</th><th>Depois</th></tr></thead><tbody>' + ks.slice(0, 1500).map(k => '<tr><td class="nw">' + dBR(k.split('|')[1]) + '</td><td>' + esc((g.nomes || {})[k.split('|')[0]] || k.split('|')[0]) + '</td><td>' + esc(resumoDia(g.antes[k])) + '</td><td>' + esc(resumoDia(g.depois[k])) + '</td></tr>').join('') + '</tbody></table></div>' }); } catch (e) { toast(e.message, 'neg'); } });
}
async function avisosTab() {
  const A = await sino(); if (!A) { $('#u-body').innerHTML = erroBox('Não foi possível ler os avisos'); return; }
  const fl = A.avisos.filter(a => (!SUB.audLoja || a.loja == null || String(a.loja) === String(SUB.audLoja)) && (!SUB.audMes || !a.mes || a.mes === SUB.audMes)); const NV = { critico: ['crítico', 'bad'], relevante: ['relevante', 'warn'], rotina: ['relatório diário', 'gr'] };
  const stD = d => '<div><b>' + esc(d.usuario) + '</b> · enviado ' + dt(d.enviado) + ' · ' + (d.entregue ? '<span style="color:var(--pos);font-weight:700">entregue ' + dt(d.entregue) + '</span>' : '<span style="color:var(--ink3)">ainda não entregue</span>') + ' · ' + (d.visto ? '<span style="color:var(--pos);font-weight:700">visto ' + dt(d.visto) + '</span>' : '<span style="color:var(--ink3)">não visto</span>') + '</div>';
  $('#u-body').innerHTML = '<div class="aviso inf">Alterações críticas e relevantes (escala aprovada alterada, geração aplicada ou desfeita, regra trabalhista, mexida do RH em domingo, feriado ou folga fixa) avisam a Coordenação na hora. As demais entram num relatório diário, enviado a partir das 18 h quando houve alteração' + (A.pendentes_rotina ? ' — <b>' + A.pendentes_rotina + ' aguardando o relatório de hoje</b>' : '') + '. Envio, entrega e visualização ficam registrados; não é exigida confirmação de leitura.</div>' +
    (fl.length ? '<div class="tw" style="max-height:680px"><table class="t"><thead><tr><th>Quando</th><th>Nível</th><th>Aviso</th><th>Destinatários · envio · entrega · visualização</th></tr></thead><tbody>' + fl.map(a => '<tr><td class="nw">' + dt(a.em) + '</td><td><span class="pill ' + NV[a.nivel][1] + '">' + NV[a.nivel][0] + '</span></td><td>' + esc(a.texto) + (a.itens ? '<small>' + a.itens.map(i => esc(dt(i.em) + ' · ' + i.texto)).join('<br>') + '</small>' : '') + '</td><td>' + (a.destinatarios.length ? a.destinatarios.map(stD).join('') : '<span style="color:var(--neg);font-weight:700">ninguém designado como Coordenação na central de pessoas</span>') + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="empty"><b>Nenhum aviso ainda</b>Os avisos aparecem aqui conforme as escalas forem geradas e alteradas.</div>') +
    '<p class="note">“Entregue” = o aviso chegou à sessão do destinatário (ele abriu o sistema). “Visto” = o destinatário abriu esta lista. Os avisos também caem no sino da Gestão de Pessoas.</p>';
  const meus = A.avisos.filter(a => a.meu && a.destinatarios.some(d => d.usuario === ME.usuario && !d.visto)).map(a => a.id); if (meus.length) { try { await api('/api/escalas-5x2/avisos/vistos', { body: { ids: meus } }); const b = $('#nv-av'); if (b) b.hidden = true; } catch (e) {} }
}
iniciar();
