<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escalas — DP / RH · Econômico Supermercados</title>
<!-- DP / RH › Escalas (22/10/2026). Painel da Coordenação, Visão da loja (cobertura por setor em blocos de 15 min),
     Escala coletiva (mês), Escala individual e Configurações. Regras em lib/escalas.js, rotas em lib/escalas-rotas.js.
     Mesma casca da TESTE TIAGO: só o rail nativo + barra de abas na página. Permissões vêm da central de pessoas. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--font);background:var(--pap);color:var(--ink);min-height:100vh;font-size:13px}
.content{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:58px;background:var(--crd);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:40}
.topbar h1{font-size:16px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}.topbar h1 .crumb{color:var(--ink3);font-weight:600}.topbar h1 .ds-ic{color:var(--ink3)}
.topbar p{font-size:11.5px;color:var(--ink3);margin-top:1px}.topbar .end{margin-left:auto;display:flex;align-items:center;gap:12px}
.who{display:flex;align-items:center;gap:9px;font-size:12px}.who .ds-avatar{background:#101B33;color:#FFC933}.who b{display:block;font-size:12.5px}.who span{color:var(--ink3);font-size:11px}
.modnav{background:var(--crd);border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;align-items:stretch;padding:0 14px;position:sticky;top:58px;z-index:39}
.modnav a{display:flex;align-items:center;gap:6px;padding:0 12px;height:42px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;user-select:none}
.modnav a .ds-ic{width:15px;height:15px;color:var(--ink3)}.modnav a:hover{color:var(--ink)}.modnav a.on{color:var(--ink);border-bottom-color:var(--am)}.modnav a.on .ds-ic{color:var(--amk)}
.page{padding:20px 24px 40px;max-width:1700px;width:100%}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:9px 10px;margin-bottom:16px}
.tb .ds-input,.tb .ds-select{height:34px;font-size:12.5px}.tb .end{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tb .lbl{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px}
.aviso{background:var(--amw);border:1px solid var(--am-ln);color:var(--amk);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.5}.aviso.neg{background:var(--negw);border-color:#F1B9C3;color:var(--neg)}.aviso.inf{background:var(--infw);border-color:var(--inf);color:var(--inf)}
.note{font-size:11.5px;color:var(--ink3);line-height:1.5;margin:10px 2px 0}
.empty{padding:36px 20px;text-align:center;color:var(--ink3);font-size:12.5px}.empty b{display:block;color:var(--ink2);font-size:13.5px;margin-bottom:3px}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--wsh) 25%,var(--ln) 50%,var(--wsh) 75%);background-size:200% 100%;animation:sk 1.3s ease infinite;margin:10px 14px}@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--posw);color:var(--pos)}.pill.bad{background:var(--negw);color:var(--neg)}.pill.warn{background:var(--amw);color:var(--amk)}.pill.info{background:var(--infw);color:var(--inf)}.pill.gr{background:var(--wsh);color:var(--ink2)}
.etq{display:inline-block;background:#101B33;color:#FFC933;font-weight:800;font-size:10px;padding:2px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}.etq.cd{background:var(--inf);color:#fff}
/* painel */
.lojas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.lj{background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:14px 16px;cursor:pointer;box-shadow:var(--sh-sm)}.lj:hover{border-color:var(--ink3)}
.lj .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.lj .hd b{font-size:14px}
.lj .nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}.lj .nums div{text-align:center}.lj .nums b{display:block;font-size:19px;font-weight:800;letter-spacing:-.5px}.lj .nums span{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.lj .sets{display:flex;flex-wrap:wrap;gap:4px}.lj .sets span{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--wsh);color:var(--ink2)}.lj .sets span.baixa{background:var(--negw);color:var(--neg)}.lj .sets span.min{background:var(--amw);color:var(--amk)}.lj .sets span.ok{background:var(--posw);color:var(--pos)}
.lj .ft{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ink2)}
/* visão da loja */
.grid-l{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.heat{overflow:auto;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg)}
table.hm{border-collapse:collapse;font-size:11px;min-width:100%}table.hm th{position:sticky;top:0;background:var(--wsh);font-size:9.5px;color:var(--ink3);font-weight:700;padding:6px 4px;text-align:center;white-space:nowrap;z-index:1}
table.hm th.s,table.hm td.s{text-align:left;position:sticky;left:0;background:var(--crd);z-index:2;min-width:150px;padding:6px 10px;font-weight:700;color:var(--ink);border-right:1px solid var(--ln)}table.hm th.s{background:var(--wsh)}
table.hm td{padding:0;border-top:1px solid var(--ln);text-align:center;height:30px;min-width:18px;font-variant-numeric:tabular-nums;font-weight:700}
table.hm td.c{cursor:default}td.ok{background:#CDEFD9;color:#0D5C34}td.min{background:#FFEBA8;color:#6B4E00}td.baixa{background:#F7C4CD;color:#8E1F33}td.neutro{background:var(--wsh);color:var(--ink3);font-weight:500}
td.p-disponivel{background:#CDEFD9}td.p-almoco{background:#FFEBA8}td.p-fora{background:transparent}td.p-folga,td.p-ferias,td.p-afastado,td.p-feriado{background:var(--wsh)}tr.alt td.s{color:var(--inf)}tr.alt td.p-disponivel{box-shadow:inset 0 -2px 0 var(--inf)}
table.hm tr.pessoa td.s{font-weight:600;font-size:11px;padding-left:22px;color:var(--ink2)}table.hm tr.pessoa td{height:18px}
table.hm td.s .tg{cursor:pointer;color:var(--inf);font-size:10px;margin-left:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin:8px 2px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.sug{background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg)}.sug .hd{padding:11px 14px;border-bottom:1px solid var(--ln);font-weight:800;font-size:13px;display:flex;justify-content:space-between}.sug .it{padding:9px 14px;border-bottom:1px solid var(--ln);font-size:12px;line-height:1.45}.sug .it b{display:block;font-size:11px;color:var(--ink3)}.sug .it:last-child{border-bottom:none}
.sug .it.apoio{border-left:3px solid var(--inf)}.sug .it.almoco{border-left:3px solid var(--am)}.sug .it.sem_opcao{border-left:3px solid var(--neg)}.sug .it.div{border-left:3px solid var(--neg)}
/* coletiva */
.cal{overflow:auto;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg)}
/* grade colorida (Tiago, 22/10): cabeçalho azul-marinho, sáb/dom em âmbar, uma cor por turno (vem do servidor em E.turnos), tons fixos pra folga/afastamento/férias/feriado */
table.cal{border-collapse:separate;border-spacing:2px;font-size:11px;background:var(--crd)}table.cal th{position:sticky;top:0;background:#101B33;font-size:9.5px;color:#fff;font-weight:800;padding:6px 3px;text-align:center;white-space:nowrap;z-index:1;line-height:1.25;border-radius:4px}
table.cal th small{display:block;font-weight:600;color:rgba(255,255,255,.75);font-size:9px}
table.cal th.fds{background:#FFC933;color:#14213D}table.cal th.fds small{color:#14213D}table.cal th.dom{background:#F7A325}table.cal th.fer{background:var(--neg);color:#fff}
table.cal th.n,table.cal td.n{text-align:left;position:sticky;left:0;background:var(--crd);z-index:2;min-width:200px;padding:5px 10px;border-radius:4px}table.cal th.n{background:#101B33;font-size:11.5px}
table.cal td.n b{display:block;color:var(--ink);font-weight:700;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;font-size:10.5px}table.cal td.n span{display:block;font-size:10px;color:var(--ink3);white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}
table.cal td{text-align:center;padding:3px 1px;min-width:40px;height:38px;vertical-align:middle;font-variant-numeric:tabular-nums;line-height:1.15;font-size:10.5px;border-radius:4px;background:var(--wsh)}
table.cal td.d{cursor:pointer;color:#14213D;font-weight:700}table.cal td.d:hover{filter:brightness(.93)}table.cal td.alt{box-shadow:inset 0 0 0 2px var(--inf)}table.cal td.fer{border-top:3px solid var(--neg)}table.cal th.fer{background:var(--neg);color:#fff}table.cal th.fer small{color:rgba(255,255,255,.8)}
table.cal td .a{display:block;font-size:9px;font-weight:500;color:#4A5370}table.cal td.folga{color:#6B7280;font-weight:800}table.cal td.ferias,table.cal td.afastado{color:#4C3D8F;font-weight:800}table.cal td.feriado{color:var(--neg);font-weight:800}
table.cal td.tot{font-weight:800;text-align:center;padding:0 10px;background:#101B33;color:#fff;font-size:11.5px}
.cal-leg{display:flex;flex-wrap:wrap;gap:8px 22px;padding:10px 12px;font-size:11px;color:var(--ink2);border-top:1px solid var(--ln);background:var(--crd)}.cal-leg>span{display:flex;align-items:center;gap:7px}.cal-leg i{width:22px;height:14px;border-radius:4px;flex:none;display:inline-block}
.cal-leg b{display:block;color:var(--ink);font-size:11px}.cal-leg small{display:block;color:var(--ink3);font-size:10px}.cal-leg i.altx{background:var(--crd);box-shadow:inset 0 0 0 2px var(--inf)}.cal-leg i.ferx{background:var(--wsh);border-top:3px solid var(--neg)}
.tb input.ds-input::placeholder{color:var(--ink3)}
/* seletor de funcionários (caixinhas) */
.msel{position:relative}.msel .ds-btn.on{background:#101B33;color:#FFC933;border-color:#101B33}.msel-p{position:absolute;top:calc(100% + 6px);left:0;z-index:60;width:340px;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);box-shadow:0 12px 32px rgba(0,0,0,.16);padding:8px}.msel-p .ds-input{width:100%;height:32px;font-size:12px;margin-bottom:6px}
.msel-l{max-height:340px;overflow:auto}.msel-l label{display:grid;grid-template-columns:18px 1fr;gap:2px 8px;align-items:center;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12px}.msel-l label:hover{background:var(--wsh)}.msel-l label input{grid-row:span 2;width:15px;height:15px;accent-color:#101B33}.msel-l label b{font-weight:700;color:var(--ink)}.msel-l label small{font-size:10.5px;color:var(--ink3)}
.msel-f{display:flex;gap:14px;padding:8px 8px 2px;border-top:1px solid var(--ln);margin-top:6px;font-size:11.5px;font-weight:700}.msel-f a{color:var(--inf);cursor:pointer}
/* 22/10/26 (Tiago: "ajuste automático nos monitores", regra do CLAUDE.md): grade coletiva ocupa 100% e as faixas apertam
   fonte, largura da célula e coluna do nome até os 31 dias caberem sem rolagem em 1600/1366/1280. Nada some: almoço quebra linha. */
table.cal{width:100%}
@media (max-width:1599px){table.cal td{min-width:34px;font-size:10px;padding:3px 0}table.cal td .a{font-size:8.5px}table.cal th.n,table.cal td.n{min-width:170px}table.cal td.n b{max-width:180px}table.cal td.n span{max-width:180px}table.cal th{font-size:9px;padding:5px 2px}table.cal td.tot{padding:0 6px;font-size:11px}.cal-leg{gap:6px 16px;padding:8px 10px}}
@media (max-width:1399px){table.cal td{min-width:29px;font-size:9px}table.cal td .a{font-size:8px;line-height:1.1}table.cal th.n,table.cal td.n{min-width:150px;padding:4px 8px}table.cal td.n b{max-width:160px;font-size:10px}table.cal td.n span{max-width:160px;font-size:9.5px}table.cal th{font-size:8.5px;padding:4px 1px}table.cal th.n{font-size:10.5px}table.cal td.tot{padding:0 4px;font-size:10px}.cal-leg{font-size:10px}.cal-leg i{width:18px;height:12px}
  #c-fun{min-width:130px!important;max-width:170px}.tb .lbl{font-size:10px}}
@media (max-width:1299px){table.cal td{min-width:26px;font-size:8.5px}table.cal td .a{font-size:7.5px}table.cal th.n,table.cal td.n{min-width:140px;padding:3px 6px}table.cal td.n b{max-width:150px}table.cal td.n span{max-width:150px}table.cal td.tot{padding:0 3px;font-size:9.5px}table.cal th{font-size:8px;padding:4px 0}#b-loja{min-width:150px!important;width:150px}#c-fun{min-width:120px!important;max-width:140px}.tb{gap:6px}.tb .ds-btn{padding-left:9px;padding-right:9px}}
@media (max-width:1199px){table.cal td{min-width:26px;font-size:8.5px;height:34px}table.cal td .a{font-size:7.5px}table.cal th.n,table.cal td.n{min-width:130px;padding:3px 6px}table.cal td.n b{max-width:140px;font-size:9.5px}table.cal td.n span{max-width:140px;font-size:9px}table.cal th{font-size:8px}table.cal td.tot{font-size:9.5px}#c-fun{min-width:110px!important;max-width:140px}}
.flx{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:11.5px;font-weight:700;margin-bottom:12px}.flx span{padding:5px 10px;border-radius:7px;background:var(--wsh);color:var(--ink3)}.flx span.done{background:var(--posw);color:var(--pos)}.flx span.on{background:#101B33;color:#FFC933}.flx i{color:var(--ink3);font-style:normal}
.hist{font-size:12px;display:grid}.hist .h{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--ln)}.hist .h time{color:var(--ink3)}.hist .h p{color:var(--ink2);white-space:pre-wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.kpi{background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg);padding:12px 14px}.kpi .l{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:3px}.kpi .s{font-size:11px;color:var(--ink3);margin-top:2px}
.tw{overflow:auto;background:var(--crd);border:1px solid var(--ln);border-radius:var(--r-lg)}table.t{width:100%;border-collapse:collapse;font-size:12px}table.t th{text-align:left;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);padding:8px 10px;background:var(--wsh);font-weight:700;white-space:nowrap}table.t td{padding:7px 10px;border-top:1px solid var(--ln);color:var(--ink2);vertical-align:middle}table.t th.r,table.t td.r{text-align:right}
table.cfg input{width:70px;padding:4px 6px;border:1px solid var(--ln2);border-radius:6px;font:inherit;font-size:12px;text-align:right}
.f-ov{position:fixed;inset:0;background:rgba(10,17,32,.55);z-index:9000;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.f-md{background:var(--crd);color:var(--ink);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.f-md .hd{background:#101B33;color:#fff;padding:11px 16px;display:flex;justify-content:space-between;align-items:center}.f-md .hd b{font-size:14px}.f-md .hd small{display:block;color:#B7C0D6;font-size:11.5px}.f-md .x{background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer}
.f-md .bd{padding:14px 16px;display:grid;gap:10px}.f-md .row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.f-md label{font-size:11px;font-weight:700;color:var(--ink2);display:grid;gap:4px}.f-md input,.f-md select,.f-md textarea{padding:7px 9px;border:1px solid var(--ln2);border-radius:8px;font:inherit;font-size:12.5px;width:100%}.f-md .acoes{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:1599px){.page{padding:18px 20px 36px}.lojas{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1399px){.lojas{grid-template-columns:repeat(2,1fr)}.grid-l{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1199px){.topbar{padding:0 16px}.page{padding:16px}.grid2{grid-template-columns:1fr}.modnav a .ds-ic{display:none}}
@media(max-width:820px){.modnav{position:static;overflow-x:auto}.topbar{height:auto;padding:10px 14px;flex-wrap:wrap}.topbar .end{margin-left:0}.page{padding:12px}.lojas{grid-template-columns:1fr}.lj .nums{grid-template-columns:repeat(3,1fr)}.f-md .row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body class="dsnav-pad">
<div class="content">
  <header class="topbar"><div><h1 id="tb-h1"><span class="crumb">DP / RH</span></h1><p id="tb-sub"></p></div><div class="end"><div class="who" id="who"></div></div></header>
  <nav class="modnav" id="modnav"></nav>
  <div class="page" id="page"><div class="sk"></div><div class="sk" style="width:60%"></div></div>
</div>
<svg style="display:none"><symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol></svg>
<script>
const { $, $$, esc, api, toast, dBR, dSem } = G;
let ME = null, PAG = 'coord', SUB = {};
const hoje = () => G.hoje(); const mesDe = d => d.slice(0, 7);
const ic = n => '<svg class="ds-ic"><use href="' + (n.startsWith('ic-') ? '#' + n : '/icons.svg#' + n) + '"/></svg>';
const lojaTxt = n => (ME.lojas.find(l => l.n === +n) || {}).txt || '—'; const lojaCod = n => lojaTxt(n).split(' · ')[0]; const lojaNome = n => lojaTxt(n).split(' · ')[1] || '';
const etq = n => '<span class="etq' + (+n === 10 ? ' cd' : '') + '">' + esc(lojaCod(n)) + '</span>';
const setTxt = s => (ME.setores.find(x => x.id === s) || {}).txt || (s ? s.charAt(0) + s.slice(1).toLowerCase() : '—');
const stPill = st => '<span class="pill ' + ({ rascunho: 'gr', enviada_rh: 'info', validada_rh: 'warn', aprovada: 'ok', devolvida: 'bad' }[st] || 'gr') + '">' + esc(ME.status[st] || st) + '</span>';
const dt = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') + ' ' + new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';
const skel = () => '<div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div>';
const erroBox = e => '<div class="aviso neg">' + esc(e.message || e) + '</div>';
const empty = (t, s) => '<div class="empty"><b>' + esc(t) + '</b>' + (s || '') + '</div>';
const selLoja = v => ME.lojas.map(l => '<option value="' + l.n + '"' + (String(l.n) === String(v) ? ' selected' : '') + '>' + esc(l.txt) + '</option>').join('');

    '<span><i style="background:' + TIPO_COR.afastado + '"></i><div><b>AF · FÉ</b><small>Afastamento/Atestado · Férias</small></div></span><span><i style="background:' + TIPO_COR.folga + '"></i><div><b>F</b><small>Folga</small></div></span><span><i class="ferx"></i><div><b>Feriado</b><small>' + (ferMes.length ? esc(ferMes.map(d => d.slice(8) + ' ' + ferNome(d)).join(' · ')) : 'nenhum neste mês') + '</small></div></span><span><i class="altx"></i><div><b>Borda azul</b><small>Dia alterado (proposta)</small></div></span><span><i style="background:#101B33"></i><div><b>Horas</b><small>Total no mês</small></div></span></div></div>'; };

const resumoDia = c => !c ? '—' : c.tipo === 'trabalho' ? c.entrada + '–' + c.saida + (c.almoco_ini ? ' (' + c.almoco_ini + '–' + c.almoco_fim + ')' : '') + (c.setor ? ' ' + setTxt(c.setor) : '') : ME.tipos[c.tipo];

  const f = E.funcionarios.find(x => x.id === fid); const c = f.dias[d];
  const ov = document.createElement('div'); ov.className = 'f-ov';
  ov.innerHTML = '<div class="f-md"><div class="hd"><div><b>' + esc(f.nome) + '</b><small>' + dBR(d) + ' (' + dSem(d) + ') · contratual: ' + esc(resumoDia({ tipo: f.base[new Date(d + 'T12:00:00').getDay()] ? 'trabalho' : 'folga', ...(f.base[new Date(d + 'T12:00:00').getDay()] || {}) })) + '</small></div><button class="x">×</button></div><div class="bd">' +

}
async function fluxo(E, acao) {

  let texto = '';

  try { const r = await api('/api/escalas/' + E.loja + '/' + E.mes + '/' + acao, { body: { texto } }); toast(r.statusTxt); coletiva(); } catch (e) { toast(e.message, 'neg'); }

// ── D · Escala individual ──

  let F; try { F = await api('/api/escalas/' + SUB.loja + '/' + SUB.mes + '/funcionario/' + SUB.func + (SUB.ponto ? '?ponto=1' : '')); } catch (e) { $('#i-body').innerHTML = erroBox(e); return; }
  const f = F.funcionario; const base = [1, 2, 3, 4, 5, 6, 0].map(d => '<tr><td>' + DSEM[d] + '</td><td>' + (f.base[d] ? f.base[d].entrada + '–' + f.base[d].saida : '<span style="color:var(--ink3)">folga</span>') + '</td><td>' + (f.base[d] && f.base[d].almoco_ini ? f.base[d].almoco_ini + '–' + f.base[d].almoco_fim : '—') + '</td></tr>').join('');

  $('#i-body').innerHTML = '<div class="kpis"><div class="kpi"><div class="l">Horas previstas no mês</div><div class="v">' + esc(f.horas_mes) + '</div><div class="s">' + esc(f.setorTxt) + ' · ' + esc(f.cargo || '') + '</div></div><div class="kpi"><div class="l">Folga fixa</div><div class="v" style="font-size:16px;margin-top:8px">' + (f.folga_fixa.length ? f.folga_fixa.map(x => DSEM[x]).join(' · ') : '—') + '</div><div class="s">' + esc(f.turno || '') + '</div></div><div class="kpi"><div class="l">Banco de horas oficial</div><div class="v" style="color:' + (F.banco_oficial_min == null ? 'var(--ink3)' : F.banco_oficial_min >= 0 ? 'var(--pos)' : 'var(--neg)') + '">' + (F.banco_oficial_min == null ? '—' : (F.banco_oficial_min < 0 ? '−' : '+') + G.hhmm(Math.abs(F.banco_oficial_min)).replace(':', 'h')) + '</div><div class="s">' + (F.banco_oficial_min == null ? 'use "Comparar com o ponto"' : 'saldo acumulado do PontoCerto') + '</div></div><div class="kpi"><div class="l">Divergências no mês</div><div class="v">' + (F.divergencias ? F.divergencias.length : '—') + '</div><div class="s">' + (F.divergencias ? 'escala × marcações' : F.pontoErro ? 'PontoCerto indisponível' : 'use "Comparar com o ponto"') + '</div></div></div>' +
    '<div class="grid2"><div class="tw"><table class="t"><thead><tr><th>Dia</th><th>Tipo</th><th>Previsto</th><th>Almoço</th><th class="r">Horas</th>' + (F.ponto ? '<th>Registrado</th><th>Divergência</th>' : '') + '</tr></thead><tbody>' +

    const setores = {}; $$('#g-body [data-s]').forEach(i => { setores[i.dataset.s] = +i.value; }); const limites = {}; $$('#g-body [data-l]').forEach(i => { limites[i.dataset.l] = +i.value; });
